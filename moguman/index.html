<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>모구맨</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#0c1018;
    font-family:'Malgun Gothic','맑은 고딕',sans-serif; user-select:none;
    touch-action:none; overscroll-behavior:none;
    -webkit-user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  #app { position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  #stage-wrap { position:relative; }
  canvas { display:block; image-rendering:pixelated; image-rendering:crisp-edges; background:#000; }

  .screen { position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; z-index:10; }
  .hidden { display:none !important; }

  /* ── HUD (캔버스 기준 고정) ── */
  #hud { position:absolute; inset:0; pointer-events:none; z-index:5; color:#fff;
    font-weight:800; text-shadow:0 2px 3px rgba(0,0,0,.7); }
  #hud-score-wrap { position:absolute; top:6px; left:10px; font-size:15px; }
  #hud-score-wrap .lab { font-size:10px; color:#9fc0e8; }
  #hud-hi-wrap { position:absolute; top:6px; right:10px; font-size:15px; text-align:right; }
  #hud-hi-wrap .lab { font-size:10px; color:#ffd83d; }
  #hud-stage { position:absolute; bottom:6px; left:50%; transform:translateX(-50%); font-size:13px; }
  #hud-lives { position:absolute; top:6px; left:50%; transform:translateX(-50%); font-size:14px; letter-spacing:2px; }
  #hud-toast { position:absolute; top:34%; left:50%; transform:translateX(-50%);
    font-size:22px; font-weight:900; opacity:0; transition:opacity .3s; white-space:nowrap; }

  /* ── 타이틀 ── */
  #title-screen { background:linear-gradient(#1a2440 0%, #2c3a60 60%, #141c30 100%); }
  #title-screen .logo { font-size:min(76px, 15vw); font-weight:900; color:#ffd83d; white-space:nowrap;
    text-shadow:0 5px 0 #8a5a10, 0 9px 18px rgba(0,0,0,.5); letter-spacing:min(8px, 1.6vw); }
  #title-screen .sub { margin-top:6px; font-size:18px; color:#bcd0f0; font-weight:700; }
  #title-icon { width:130px; height:auto; margin:20px 0 6px; animation:bob 1.5s ease-in-out infinite;
    filter:drop-shadow(0 8px 10px rgba(0,0,0,.4)); }
  @keyframes bob { 0%,100%{transform:translateY(0) rotate(-4deg)} 50%{transform:translateY(-12px) rotate(4deg)} }
  #title-hi { margin-top:4px; color:#ffd83d; font-size:15px; font-weight:800; min-height:20px; }
  #title-hint { margin-top:16px; color:rgba(255,255,255,.65); font-size:13px; padding:0 14px; text-align:center; }
  body.touch #title-hint { display:none; }

  .menu-buttons { display:flex; gap:14px; margin-top:22px; flex-wrap:wrap; justify-content:center; padding:0 10px; }
  .btn { pointer-events:auto; padding:12px 24px; font-size:17px; font-weight:800; color:#fff;
    background:#3a86d4; border:3px solid rgba(255,255,255,.8); border-radius:12px; cursor:pointer;
    box-shadow:0 4px 8px rgba(0,0,0,.4); font-family:inherit; }
  .btn.primary { background:#3aa84f; }
  .btn.warm { background:#c8385a; }

  /* ── 일시정지 / 게임오버 / 엔딩 ── */
  #pause-screen { background:rgba(0,0,0,.6); z-index:20; }
  #pause-screen .big, #over-screen .big, #ending-screen .big {
    font-size:min(46px, 11vw); font-weight:900; color:#fff; white-space:nowrap; }
  #over-screen { background:rgba(0,0,0,.85); z-index:20; }
  #over-screen .big { color:#ff5252; letter-spacing:6px; }
  #over-count { font-size:76px; font-weight:900; color:#fff; margin-top:8px; text-shadow:0 4px 10px rgba(0,0,0,.8); }
  #over-screen .hint { margin-top:10px; font-size:17px; color:#ffd83d; font-weight:700; padding:0 14px; text-align:center; }
  #ending-screen { background:linear-gradient(#2c1a40 0%, #503060 60%, #201430 100%); z-index:20; }
  #ending-screen .big { color:#ffd83d; }
  #ending-screen .msg { margin-top:14px; color:#f0e0ff; font-size:17px; line-height:1.8; text-align:center; padding:0 16px; }
  #ending-score { margin-top:10px; color:#fff; font-size:22px; font-weight:900; }

  /* ── 터치 가상 패드 ── */
  #vpad { position:fixed; inset:0; pointer-events:none; z-index:8; display:none; }
  body.touch #vpad.on { display:block; }
  .vbtn { position:absolute; pointer-events:auto; width:78px; height:78px; border-radius:50%;
    background:rgba(255,255,255,.15); border:2px solid rgba(255,255,255,.5);
    color:rgba(255,255,255,.92); font-size:26px; font-weight:800;
    display:flex; align-items:center; justify-content:center;
    touch-action:none; user-select:none; text-shadow:0 2px 3px rgba(0,0,0,.5); }
  .vbtn.pressed { background:rgba(255,255,255,.38); border-color:#ffd83d; }
  #vbtn-left  { left:calc(16px + env(safe-area-inset-left)); bottom:calc(22px + env(safe-area-inset-bottom)); }
  #vbtn-right { left:calc(110px + env(safe-area-inset-left)); bottom:calc(22px + env(safe-area-inset-bottom)); }
  #vbtn-jump  { right:calc(16px + env(safe-area-inset-right)); bottom:calc(96px + env(safe-area-inset-bottom)); }
  #vbtn-fire  { right:calc(96px + env(safe-area-inset-right)); bottom:calc(22px + env(safe-area-inset-bottom)); }
  #vbtn-pause { right:calc(12px + env(safe-area-inset-right)); top:calc(10px + env(safe-area-inset-top));
    width:46px; height:46px; font-size:18px; border-radius:12px; }
  .vlab { position:absolute; width:78px; text-align:center; color:rgba(255,255,255,.55);
    font-size:11px; font-weight:700; pointer-events:none; }
  #vlab-jump { right:calc(16px + env(safe-area-inset-right)); bottom:calc(176px + env(safe-area-inset-bottom)); }
  #vlab-fire { right:calc(96px + env(safe-area-inset-right)); bottom:calc(102px + env(safe-area-inset-bottom)); }
</style>
</head>
<body>
<div id="app">
  <div id="stage-wrap">
    <canvas id="game" width="320" height="240"></canvas>
    <div id="hud" class="hidden">
      <div id="hud-score-wrap"><span class="lab">SCORE</span><br><span id="hud-score">000000</span></div>
      <div id="hud-hi-wrap"><span class="lab">HI</span><br><span id="hud-hi">000000</span></div>
      <div id="hud-lives">❤️❤️❤️</div>
      <div id="hud-stage">STAGE 1</div>
      <div id="hud-toast"></div>
    </div>
  </div>

  <div id="title-screen" class="screen">
    <div class="logo">모 구 맨</div>
    <div class="sub">~ 털뭉치 대소동 ~</div>
    <img id="title-icon" alt="모구">
    <div id="title-hi"></div>
    <div class="menu-buttons">
      <button class="btn primary" id="btn-continue">이어하기</button>
      <button class="btn" id="btn-new">처음부터</button>
    </div>
    <div id="title-hint">←→ 이동 · ↑/Z 점프 · Space/X 털 발사<br>털로 감싼 적을 밀어서 굴려버리자!</div>
  </div>

  <div id="pause-screen" class="screen hidden">
    <div class="big">일시정지</div>
    <div class="menu-buttons">
      <button class="btn primary" id="btn-resume">계속</button>
      <button class="btn" id="btn-restage">재시작</button>
      <button class="btn" id="btn-title">타이틀로</button>
    </div>
  </div>

  <div id="over-screen" class="screen hidden">
    <div class="big">CONTINUE?</div>
    <div id="over-count">10</div>
    <div class="hint">Enter 또는 화면 터치 = 이어서 도전</div>
    <div class="menu-buttons"><button class="btn" id="btn-over-title">타이틀로</button></div>
  </div>

  <div id="ending-screen" class="screen hidden">
    <div class="big">🏆 올 클리어!!</div>
    <div class="msg">모구가 50층 꼭대기까지 청소 완료!<br>침입자들은 전부 털뭉치가 되었습니다 🧶</div>
    <div id="ending-score">SCORE 0</div>
    <div class="menu-buttons"><button class="btn primary" id="btn-end-title">타이틀로</button></div>
  </div>

  <div id="vpad">
    <div class="vbtn" id="vbtn-left">◀</div>
    <div class="vbtn" id="vbtn-right">▶</div>
    <div class="vbtn" id="vbtn-fire">🧶</div>
    <div class="vbtn" id="vbtn-jump">⬆</div>
    <div class="vbtn" id="vbtn-pause">⏸</div>
    <div class="vlab" id="vlab-jump">점프</div>
    <div class="vlab" id="vlab-fire">발사</div>
  </div>
</div>

<script>window.MGM = { ASSETS: { mogu: "../game/assets/mogu-icon.png" } };</script>
<script src="src/rng.js"></script>
<script src="src/levels.js"></script>
<script src="src/logic.js"></script>
<script src="src/render.js"></script>
<script src="src/audio.js"></script>
<script src="src/ui.js"></script>
<script src="src/main.js"></script>
</body>
</html>
