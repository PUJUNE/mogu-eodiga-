<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>모구 송편공장</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#2a1d16;
    font-family:'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo',sans-serif; user-select:none;
    touch-action:none; overscroll-behavior:none;
    -webkit-user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  #app { position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  canvas#game { display:block; border-radius:10px; box-shadow:0 6px 30px rgba(0,0,0,.45); }

  .screen { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    z-index:10; color:#fff8ea; text-align:center; overflow-y:auto; }
  .hidden { display:none !important; }

  /* ── 타이틀: 보름달 밤 ── */
  #title-screen { background:radial-gradient(circle at 50% 18%, #fff3c4 0, #ffe28a 7%, rgba(255,226,138,0) 8.5%),
      radial-gradient(ellipse at 50% 120%, #3c5a3a 0, #22321f 40%, #151d2b 75%); }
  #title-screen .logo { font-size:min(58px, 11vw); font-weight:900; letter-spacing:2px; margin-top:6vh;
    color:#fff; text-shadow:0 4px 0 #b3472f, 0 7px 14px rgba(0,0,0,.5); }
  #title-screen .logo b { color:#a8cf7a; }
  #title-screen .sub { margin-top:6px; font-size:16px; font-weight:800; color:#ffe7ae; }
  #title-row { display:flex; align-items:center; gap:14px; margin-top:10px; }
  #title-icon { width:112px; height:auto; filter:drop-shadow(0 4px 6px rgba(0,0,0,.4)); }
  #title-songs { font-size:30px; }
  #title-hi { margin-top:6px; font-size:14px; font-weight:800; color:#ffe7ae; min-height:19px; }

  .menu-buttons { display:flex; gap:9px; margin-top:10px; flex-wrap:wrap; justify-content:center; padding:0 10px; }
  .btn { pointer-events:auto; padding:10px 22px; font-size:16px; font-weight:900; color:#4a2a14;
    background:#fff3d6; border:none; border-radius:14px; cursor:pointer; font-family:inherit;
    box-shadow:0 4px 0 #b58a54; }
  .btn:active { transform:translateY(3px); box-shadow:0 1px 0 #b58a54; }
  .btn.primary { background:#e8553c; color:#fff; box-shadow:0 4px 0 #8f2c1c; }
  .btn.series { padding:7px 16px; font-size:13px; background:rgba(255,243,214,.2); color:#fff3d6; box-shadow:none; }
  .diff-btn { padding:7px 14px; font-size:14px; opacity:.6; }
  .diff-btn.selected { opacity:1; outline:3px solid #ffd35c; }
  .diff-btn.crazy.selected { outline-color:#ff6a4d; }
  #stage-list { display:grid; grid-template-columns:repeat(5, minmax(0, 118px)); gap:8px; margin-top:10px; padding:0 10px; }
  .stage-btn { pointer-events:auto; padding:8px 4px; border-radius:12px; border:none; cursor:pointer; font-family:inherit;
    background:rgba(255,243,214,.14); color:#fff3d6; font-weight:900; font-size:13px; line-height:1.35; }
  .stage-btn .no { font-size:11px; opacity:.7; }
  .stage-btn .st { color:#ffd35c; letter-spacing:1px; }
  .stage-btn.selected { background:#fff3d6; color:#4a2a14; }
  .stage-btn.selected .st { color:#e0a100; }
  .stage-btn.locked { opacity:.35; cursor:not-allowed; }
  #title-hint { margin-top:10px; font-size:12.5px; line-height:1.7; color:#f3e2c0; padding:0 14px 16px; }
  #title-hint b { color:#ffd35c; }

  /* ── 결과 · 일시정지 ── */
  #result-screen, #pause-screen { background:rgba(30,20,14,.78); z-index:20; }
  .big { font-size:min(44px, 9vw); font-weight:900; color:#fff; text-shadow:0 3px 0 #b3472f; }
  #result-stars { font-size:52px; letter-spacing:6px; margin:6px 0 2px; }
  #result-stars .off { filter:grayscale(1); opacity:.28; }
  #result-score { font-size:34px; font-weight:900; color:#ffd35c; }
  #result-stats { margin-top:6px; font-size:15px; line-height:1.8; color:#f3e2c0; padding:0 14px; }
  #result-msg { margin-top:4px; font-size:15px; font-weight:800; color:#a8e08a; min-height:20px; }

  /* ── 터치: 조이스틱 + 버튼 ── */
  #vpad { position:fixed; inset:0; pointer-events:none; z-index:8; display:none; }
  body.touch #vpad.on { display:block; }
  #vstick { position:absolute; pointer-events:auto; width:140px; height:140px; border-radius:50%;
    left:calc(16px + env(safe-area-inset-left)); bottom:calc(16px + env(safe-area-inset-bottom));
    background:rgba(255,243,214,.16); border:3px solid rgba(255,243,214,.45); touch-action:none; }
  #vstick-knob { position:absolute; left:50%; top:50%; width:58px; height:58px; margin:-29px 0 0 -29px;
    border-radius:50%; background:rgba(255,243,214,.55); border:3px solid rgba(255,255,255,.8); }
  .vbtn { position:absolute; pointer-events:auto; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-weight:900; color:#4a2a14; background:rgba(255,243,214,.78); border:3px solid rgba(255,255,255,.9);
    touch-action:none; user-select:none; font-size:16px; }
  .vbtn.pressed { background:#ffd35c; }
  #vb-grab { width:84px; height:84px; right:calc(20px + env(safe-area-inset-right)); bottom:calc(26px + env(safe-area-inset-bottom)); font-size:18px; }
  #vb-work { width:74px; height:74px; right:calc(114px + env(safe-area-inset-right)); bottom:calc(14px + env(safe-area-inset-bottom)); background:rgba(168,207,122,.85); }
  #vb-dash { width:60px; height:60px; right:calc(40px + env(safe-area-inset-right)); bottom:calc(122px + env(safe-area-inset-bottom)); font-size:14px; }
  #vb-pause { width:44px; height:44px; border-radius:12px; right:calc(10px + env(safe-area-inset-right)); top:calc(8px + env(safe-area-inset-top)); font-size:15px; }
  #rotate-hint { position:fixed; inset:0; z-index:50; background:#22321f; display:flex; flex-direction:column;
    align-items:center; justify-content:center; color:#fff3d6; font-size:20px; font-weight:900; gap:10px; }
</style>
</head>
<body>
<div id="app">
  <canvas id="game" width="960" height="624"></canvas>

  <div id="title-screen" class="screen">
    <div class="logo">모구 <b>송편</b>공장</div>
    <div class="sub">~ 추석 대목, 주문이 밀려 들어온다 ~</div>
    <div id="title-row"><span id="title-songs">🌕</span><img id="title-icon" alt="모구"><span id="title-songs2">🥟</span></div>
    <div id="title-hi"></div>
    <div id="stage-list"></div>
    <div class="menu-buttons">
      <button class="btn diff-btn" data-diff="easy">이지</button>
      <button class="btn diff-btn" data-diff="normal">노말</button>
      <button class="btn diff-btn" data-diff="hard">하드</button>
      <button class="btn diff-btn crazy" data-diff="crazy">크레이지</button>
    </div>
    <div class="menu-buttons">
      <button class="btn primary" id="btn-start">영업 시작 (Enter)</button>
      <button class="btn series" id="btn-series">🏠 모구 게임 시리즈</button>
    </div>
    <div id="title-hint">
      <b>반죽</b> 집기 → <b>도마</b>에서 빚기 → <b>소</b> 얹기 → 다시 빚어 반달 접기 → <b>솔잎 찜기</b> → <b>접시</b>에 담아 <b>출하</b><br>
      ←↑↓→ / WASD 이동 · Space·J 집기/놓기 · K·X 꾹 누르면 빚기 · Shift·L 대시 · Esc 일시정지<br>
      뒷문으로 들어오는 🥝 키위는 송편에 구멍을 내요 — 몸으로 부딪쳐 쫓아내요!
    </div>
  </div>

  <div id="result-screen" class="screen hidden">
    <div class="big" id="result-title">영업 종료!</div>
    <div id="result-stars"></div>
    <div id="result-score">0</div>
    <div id="result-stats"></div>
    <div id="result-msg"></div>
    <div class="menu-buttons">
      <button class="btn primary" id="btn-next">다음 가게 → (Enter)</button>
      <button class="btn" id="btn-retry">다시 (R)</button>
      <button class="btn" id="btn-res-title">타이틀로</button>
    </div>
  </div>

  <div id="pause-screen" class="screen hidden">
    <div class="big">잠깐 쉬는 중</div>
    <div class="menu-buttons">
      <button class="btn primary" id="btn-resume">계속</button>
      <button class="btn" id="btn-restart">처음부터</button>
      <button class="btn" id="btn-title">타이틀로</button>
    </div>
  </div>

  <div id="vpad">
    <div id="vstick"><div id="vstick-knob"></div></div>
    <div class="vbtn" id="vb-grab">집기</div>
    <div class="vbtn" id="vb-work">빚기</div>
    <div class="vbtn" id="vb-dash">대시</div>
    <div class="vbtn" id="vb-pause">⏸</div>
  </div>
  <div id="rotate-hint" class="hidden">📱↻<div>가로로 돌려서 빚어 주세요</div></div>
</div>

// rng.js — 시드 기반 결정적 난수 (시리즈 공통)
const M = window.MSP;

M.mulberry32 = function (seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
};

M.makeRng = function (seed) {
  const f = M.mulberry32(seed);
  return {
    next: f,
    range: (a, b) => a + f() * (b - a),
    int: (a, b) => Math.floor(a + f() * (b - a + 1)),
    pick: (arr) => arr[Math.floor(f() * arr.length)],
    chance: (p) => f() < p,
  };
};

}

// ── 난이도 (시리즈 공통 4단계) ──
//  time = 주문 제한시간 배율, gap = 주문 간격 배율, kiwi = 키위 출몰 빈도 배율, burn = 타기까지 배율
M.DIFFS = {
  easy:   { name: '이지',     time: 1.45, gap: 1.25, kiwi: 0.6, burn: 1.5, star: 1.1 },
  normal: { name: '노말',     time: 1.0,  gap: 1.0,  kiwi: 1.0, burn: 1.0, star: 1.0 },
  hard:   { name: '하드',     time: 0.8,  gap: 0.85, kiwi: 1.3, burn: 0.8, star: 0.95 },

};
M.diff = 'normal';
M.DIFF_ORDER = ['easy', 'normal', 'hard', 'crazy'];
M.nextDiff = function (d) {
  const i = M.DIFF_ORDER.indexOf(d);
  return i >= 0 && i < M.DIFF_ORDER.length - 1 ? M.DIFF_ORDER[i + 1] : null;
};

// ── 점수 ──
M.PTS_EACH = 20;                             // 송편 하나당
M.TIP_EACH = 8;                              // 남은 시간 비율 × 개수 × 이만큼 (콤보 배율 곱)
M.PENALTY_MISS = 10;                         // 주문 시간 초과
M.PENALTY_WRONG = 10;                        // 주문에 없는 접시를 냄
M.SHOO_BONUS = 5;                            // 키위 쫓아내기
M.COMBO_MAX = 4;

// 주문 손님 (영상 속 새들) — 주문표 아바타
M.CUSTOMERS = ['penguin', 'kakapo', 'pigeon', 'chick', 'ostrich'];

}
/* ── logic.js ── */
{
// logic.js — 주방 시뮬레이션 (DOM 없음 · node 테스트에서 그대로 돈다)
// 좌표는 주방 기준(HUD 제외): x 0..W, y 0..ROWS*TILE
const M = window.MSP;
const T = M.TILE;

const clone = (o) => JSON.parse(JSON.stringify(o));
const key = (s) => s.c + '/' + s.f;

function tileAt(st, c, r) {
  if (c < 0 || r < 0 || c >= M.COLS || r >= M.ROWS) return null;
  return st.grid[r][c];
}
const isWalk = (tile) => !!tile && (tile.kind === 'floor' || tile.kind === 'door');
const holdsItem = (tile) => tile && (tile.kind === 'counter' || tile.kind === 'board' || tile.kind === 'belt');

function create(seed, stageIdx, diff) {
  const S = M.STAGES[stageIdx];
  const D = M.DIFFS[diff];
  const rng = M.makeRng(seed);
  const grid = S.map.map((row, r) => row.split('').map((ch, c) => {
    const kind = M.TILE_KIND[ch] || 'floor';
    const t = { kind, ch, c, r, item: null, work: 0 };
    if (kind === 'steamer') t.steam = [];
    if (kind === 'belt') t.dir = M.BELT_DIR[ch];
    return t;
  }));
  let door = null;
  for (const row of grid) for (const t of row) if (t.kind === 'door') door = t;
  return {
    stage: stageIdx, diff, S, D, rng, grid, door,
    t: 0, timeLeft: S.time, phase: 'play', hurried: false,
    p: { x: (S.sx + 0.5) * T, y: (S.sy + 0.5) * T, fx: 0, fy: 1, held: null,
         dashT: 0, dashCd: 0, vx: 0, vy: 0, working: false, workTick: 0 },
    orders: [], nextOrderAt: 1.5, orderSeq: 0,
    kiwis: [], nextKiwiAt: S.kiwi ? 24 / D.kiwi : Infinity,
    score: 0, served: 0, songsServed: 0, missed: 0, wrong: 0, shooed: 0, pecked: 0, combo: 0, bestCombo: 0,
    events: [],
  };
}

// ── 주문 ──
function makeOrder(st) {
  const { rng, S, D } = st;
  const roll = rng.next();
  let n = roll < 0.55 ? 1 : roll < 0.9 ? 2 : 3;
  n = Math.min(n, S.maxItems);
  const items = [];
  for (let i = 0; i < n; i++) items.push({ c: rng.pick(S.doughs), f: rng.pick(S.fillings) });
  items.sort((a, b) => key(a) < key(b) ? -1 : 1);
  const max = (40 + 20 * n) * D.time;
  return { id: ++st.orderSeq, items, t: max, max, cust: rng.pick(M.CUSTOMERS) };
}

function sameSet(a, b) {
  if (a.length !== b.length) return false;
  const ka = a.map(key).sort(), kb = b.map(key).sort();
  return ka.every((k, i) => k === kb[i]);
}

function serve(st, plate) {
  const songs = plate.songs;
  const ok = songs.length > 0 && songs.every((s) => !s.hole);
  const ord = ok ? st.orders.find((o) => sameSet(o.items, songs)) : null;
  if (!ord) {
    st.score = Math.max(0, st.score - M.PENALTY_WRONG);
    st.wrong++; st.combo = 0;
    st.events.push({ type: 'wrong', hole: songs.some((s) => s.hole) });
    return;
  }
  st.orders.splice(st.orders.indexOf(ord), 1);
  st.combo = Math.min(M.COMBO_MAX, st.combo + 1);
  st.bestCombo = Math.max(st.bestCombo, st.combo);
  const n = songs.length;
  const tip = Math.round(M.TIP_EACH * n * (ord.t / ord.max) * st.combo);
  const pts = M.PTS_EACH * n + tip;
  st.score += pts;
  st.served++; st.songsServed += n;
  st.events.push({ type: 'serve', pts, tip, combo: st.combo, n });
  if (st.orders.length === 0) st.nextOrderAt = Math.min(st.nextOrderAt, st.t + 1.2);
}

// ── 이동 · 충돌 ──
function collide(st, p) {
  for (let pass = 0; pass < 2; pass++) {
    const c0 = Math.floor(p.x / T), r0 = Math.floor(p.y / T);
    for (let r = r0 - 1; r <= r0 + 1; r++) for (let c = c0 - 1; c <= c0 + 1; c++) {
      const tile = tileAt(st, c, r);
      if (tile && isWalk(tile)) continue;
      const x0 = c * T, y0 = r * T;
      const nx = Math.max(x0, Math.min(p.x, x0 + T)), ny = Math.max(y0, Math.min(p.y, y0 + T));
      const dx = p.x - nx, dy = p.y - ny, d = Math.hypot(dx, dy);
      if (d < M.PR) {
        if (d > 0.0001) { p.x += dx / d * (M.PR - d); p.y += dy / d * (M.PR - d); }
        else { p.y += M.PR; }
      }
    }
  }
  p.x = Math.max(M.PR, Math.min(M.W - M.PR, p.x));
  p.y = Math.max(M.PR, Math.min(M.ROWS * T - M.PR, p.y));
}

// 바라보는 칸 — 앞쪽 한 점이 든 칸, 없으면 가까운 축 방향으로 한 번 더
function facingTile(st) {
  const p = st.p;
  const probe = (fx, fy) => {
    const t = tileAt(st, Math.floor((p.x + fx * M.REACH) / T), Math.floor((p.y + fy * M.REACH) / T));
    return t && !isWalk(t) && t.kind !== 'wall' ? t : null;
  };
  let t = probe(p.fx, p.fy);
  if (t) return t;
  if (Math.abs(p.fx) >= Math.abs(p.fy)) t = probe(Math.sign(p.fx) || 1, 0);
  else t = probe(0, Math.sign(p.fy) || 1);
  if (t) return t;
  // 그래도 없으면 지금 선 칸의 상하좌우 설비 중 바라보는 방향에 가장 가까운 것 (등을 진 쪽은 제외)
  const c = Math.floor(p.x / T), r = Math.floor(p.y / T);
  let best = null, bd = 0.1;
  for (const [dc, dr] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
    const n = tileAt(st, c + dc, r + dr);
    if (!n || isWalk(n) || n.kind === 'wall') continue;
    const d = dc * p.fx + dr * p.fy;
    if (d > bd) { bd = d; best = n; }
  }
  return best;
}

// ── 집기 · 놓기 · 합치기 ──
function combine(a, b) {                     // a = 손, b = 칸 위. 합쳐지면 { hand, tile }
  if (a.t === 'filling' && b.t === 'skin' && !b.fill) return { hand: null, tile: { t: 'skin', c: b.c, fill: a.f } };
  if (a.t === 'skin' && !a.fill && b.t === 'filling') return { hand: null, tile: { t: 'skin', c: a.c, fill: b.f } };
  if (a.t === 'plate' && b.t === 'song' && a.songs.length < M.PLATE_CAP) {
    return { hand: { t: 'plate', songs: a.songs.concat([b]) }, tile: null };
  }
  if (a.t === 'song' && b.t === 'plate' && b.songs.length < M.PLATE_CAP) {
    return { hand: null, tile: { t: 'plate', songs: b.songs.concat([a]) } };
  }
  return null;
}

function interact(st) {
  const p = st.p, tile = facingTile(st);
  if (!tile) return;
  const held = p.held;
  const ev = (type, extra) => st.events.push(Object.assign({ type, c: tile.c, r: tile.r }, extra || {}));

  switch (tile.kind) {
    case 'crate':
      if (!held) { p.held = clone(M.CRATE[tile.ch]); ev('pick'); }
      else if (held.t === 'skin' && !held.fill && M.CRATE[tile.ch].t === 'filling') {
        held.fill = M.CRATE[tile.ch].f; ev('fill');                // 피를 들고 소 통에 대면 바로 소를 얹는다
      } else ev('bump');
      return;
    case 'plates':
      if (!held) { p.held = { t: 'plate', songs: [] }; ev('pick'); }
      else if (held.t === 'plate' && held.songs.length === 0) { p.held = null; ev('place'); }
      else if (held.t === 'song') { p.held = { t: 'plate', songs: [held] }; ev('pick'); }   // 접시 더미에 대면 새 접시에 얹어 든다
      else ev('plate-hint', { why: held.t === 'raw' ? 'not-cooked' : held.t === 'burnt' ? 'burnt' : held.t === 'plate' ? 'full-hands' : 'not-song' });
      return;
    case 'trash':
      if (!held) return;
      if (held.t === 'plate') { if (held.songs.length) { held.songs = []; ev('trash'); } }
      else { p.held = null; ev('trash'); }
      return;
    case 'serve':
      if (!held) return;
      // 접시째 내는 것이 기본이고, 익은 송편 한 개를 손에 들고 와도 한 접시로 쳐 준다
      if (held.t === 'plate' && held.songs.length) { serve(st, held); p.held = null; }
      else if (held.t === 'song') { serve(st, { t: 'plate', songs: [held] }); p.held = null; }
      else ev('serve-hint', { why: held.t === 'plate' ? 'empty-plate' : held.t === 'burnt' ? 'burnt' : 'not-cooked' });
      return;
    case 'steamer': {
      const s = tile.steam;
      if (!held) {
        const bi = s.findIndex((x) => x.burnt);
        const ci = s.findIndex((x) => !x.burnt && x.cook >= M.COOK_T);
        if (bi >= 0) { s.splice(bi, 1); p.held = { t: 'burnt' }; ev('pick'); }
        else if (ci >= 0) { const x = s.splice(ci, 1)[0]; p.held = { t: 'song', c: x.c, f: x.f, hole: false }; ev('pick'); }
        else ev('bump');
      } else if (held.t === 'raw') {
        if (s.length < M.STEAM_CAP && !s.some((x) => x.burnt)) {
          s.push({ c: held.c, f: held.f, cook: 0, burnt: false }); p.held = null; ev('steam-in');
        } else ev('bump');
      } else if (held.t === 'plate') {
        let moved = 0;
        for (let i = 0; i < s.length && held.songs.length < M.PLATE_CAP;) {
          const x = s[i];
          if (!x.burnt && x.cook >= M.COOK_T) { held.songs.push({ c: x.c, f: x.f, hole: false }); s.splice(i, 1); moved++; }
          else i++;
        }
        ev(moved ? 'pick' : 'bump');
      } else ev('bump');
      return;
    }
    default:
      if (!holdsItem(tile)) return;
      if (!held) {
        if (tile.item) { p.held = tile.item; tile.item = null; tile.work = 0; ev('pick'); }
        return;
      }
      if (tile.item) {
        const m = combine(held, tile.item);
        if (m) { p.held = m.hand; tile.item = m.tile; tile.work = 0; ev(m.tile && m.tile.t === 'skin' ? 'fill' : 'pick'); }
        else if ((held.t === 'plate') !== (tile.item.t === 'plate')) {     // 접시와 다른 것 — 왜 안 담기는지 알려 준다
          const other = held.t === 'plate' ? tile.item : held, plate = held.t === 'plate' ? held : tile.item;
          ev('plate-hint', { why: other.t === 'song' && plate.songs.length >= M.PLATE_CAP ? 'plate-full'
            : other.t === 'raw' ? 'not-cooked' : other.t === 'burnt' ? 'burnt' : 'not-song' });
        } else ev('bump');
      } else {
        tile.item = held; tile.item.bt = 0; tile.work = 0; p.held = null; ev('place');
      }
  }
}

// 도마 작업 — 반죽을 꾹꾹 눌러 피로, 소 넣은 피를 반달로 접는다
// 누른 순간(edge)에 빚을 게 없으면 이유를 알려 준다. 반죽·소 넣은 피를 든 채 빈 도마를 보면 올려놓고 바로 빚는다.
const kneadable = (it) => it && (it.t === 'dough' || (it.t === 'skin' && it.fill));
function work(st, dt, edge) {
  const tile = facingTile(st), p = st.p;
  p.working = false;
  const hint = (why) => { if (edge) st.events.push({ type: 'work-hint', why }); };
  if (!tile || tile.kind !== 'board') { hint(p.held && kneadable(p.held) ? 'face-board' : 'no-board'); return; }
  if (!tile.item && kneadable(p.held)) {
    tile.item = p.held; tile.work = 0; p.held = null;
    st.events.push({ type: 'place', c: tile.c, r: tile.r });
  }
  const it = tile.item;
  let need = 0;
  if (it && it.t === 'dough') need = M.KNEAD_T;
  else if (it && it.t === 'skin' && it.fill) need = M.FOLD_T;
  if (!need) { hint(!it ? 'empty' : it.t === 'skin' ? 'need-fill' : 'done'); return; }
  st.p.working = true;
  tile.work += dt;
  st.p.workTick -= dt;
  if (st.p.workTick <= 0) { st.p.workTick = 0.28; st.events.push({ type: 'knead', c: tile.c, r: tile.r }); }
  if (tile.work >= need) {
    tile.item = it.t === 'dough' ? { t: 'skin', c: it.c, fill: null } : { t: 'raw', c: it.c, f: it.fill };
    tile.work = 0;
    st.events.push({ type: it.t === 'dough' ? 'skin-done' : 'fold-done', c: tile.c, r: tile.r });
  }
}

// ── 키위 도둑 ──
function bfs(st, sc, sr, goalFn) {
  const prev = new Map(), q = [[sc, sr]], k = (c, r) => r * M.COLS + c;
  prev.set(k(sc, sr), null);
  while (q.length) {
    const [c, r] = q.shift();
    if (goalFn(c, r)) {
      const path = []; let cur = [c, r];
      while (cur) { path.unshift(cur); cur = prev.get(k(cur[0], cur[1])); }
      return path;
    }
    for (const [dc, dr] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nc = c + dc, nr = r + dr;
      if (!isWalk(tileAt(st, nc, nr)) || prev.has(k(nc, nr))) continue;
      prev.set(k(nc, nr), [c, r]); q.push([nc, nr]);
    }
  }
  return null;
}
M.bfs = bfs;

const peckable = (tile) => holdsItem(tile) && tile.item &&
  ((tile.item.t === 'song' && !tile.item.hole) || (tile.item.t === 'plate' && tile.item.songs.some((s) => !s.hole)));

function kiwiRetarget(st, k) {
  const kc = Math.floor(k.x / T), kr = Math.floor(k.y / T);
  const targets = [];
  for (const row of st.grid) for (const t of row) if (peckable(t)) targets.push(t);
  if (targets.length && k.life > 0) {
    const set = new Set(targets.map((t) => t.r * M.COLS + t.c));
    const path = bfs(st, kc, kr, (c, r) => [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dc, dr]) => set.has((r + dr) * M.COLS + c + dc)));
    if (path) {
      const [ec, er] = path[path.length - 1];
      k.tgt = targets.find((t) => Math.abs(t.c - ec) + Math.abs(t.r - er) === 1);
      k.path = path.slice(1); k.st = 'seek';
      return;
    }
  }
  if (k.life > 0) {                                        // 노릴 송편이 없으면 어슬렁
    const fl = [];
    for (const row of st.grid) for (const t of row) if (t.kind === 'floor') fl.push(t);
    const g = st.rng.pick(fl);
    k.path = (bfs(st, kc, kr, (c, r) => c === g.c && r === g.r) || []).slice(1);
    k.tgt = null; k.st = 'wander';
    return;
  }
  kiwiLeave(st, k, 'leave');
}

function kiwiLeave(st, k, why) {
  const d = st.door;
  k.path = (bfs(st, Math.floor(k.x / T), Math.floor(k.y / T), (c, r) => c === d.c && r === d.r) || []).slice(1);
  k.st = why; k.tgt = null;
}

function stepKiwis(st, dt) {
  const { D, S } = st;
  if (S.kiwi && st.t >= st.nextKiwiAt && st.kiwis.length < S.kiwi && st.timeLeft > 12) {
    const d = st.door;
    st.kiwis.push({ x: (d.c + 0.5) * T, y: (d.r + 0.5) * T, st: 'seek', path: [], tgt: null, pt: 0,
      life: 16 + st.rng.range(0, 6), dir: 1, id: st.t });
    kiwiRetarget(st, st.kiwis[st.kiwis.length - 1]);
    st.events.push({ type: 'kiwi-in' });
    st.nextKiwiAt = st.t + st.rng.range(22, 34) / D.kiwi;
  }
  const p = st.p;
  for (const k of st.kiwis) {
    k.life -= dt;
    const fleeing = k.st === 'flee' || k.st === 'leave';
    if (!fleeing && Math.hypot(k.x - p.x, k.y - p.y) < M.PR + 17) {

  }
  if (st.t >= st.nextOrderAt && st.orders.length < 4 && st.timeLeft > 10) {
    st.orders.push(makeOrder(st));
    st.events.push({ type: 'order' });
    const ramp = Math.max(0.7, 1 - st.t / st.S.time * 0.3);  // 뒤로 갈수록 조금 잦아진다

    st.timeLeft = 0; st.phase = 'end';
    st.events.push({ type: 'end' });
  }
  return st.events;
}

function starsOf(st) {
  const th = st.S.stars.map((s) => Math.round(s * st.D.star));

M.Logic = { create, step, facingTile, starsOf, thresholds, tileAt, isWalk, interact, sameSet };

        g.strokeStyle = '#5f8a3c'; g.lineWidth = 1;
        for (let i = 0; i < 12; i++) {
          const a = i / 12 * TAU; g.beginPath();
          g.moveTo(cx + Math.cos(a) * 5, cy + Math.sin(a) * 5); g.lineTo(cx + Math.cos(a + 0.3) * 18, cy + Math.sin(a + 0.3) * 18); g.stroke();
        }
        const pos = [[-8, 4], [8, 4], [0, -8]];
        const burnAt = M.COOK_T + M.BURN_T * st.D.burn;
        t.steam.forEach((s, i) => {
          const it = s.burnt ? { t: 'burnt' } : s.cook >= M.COOK_T ? { t: 'song', c: s.c, f: s.f } : { t: 'raw', c: s.c, f: s.f };
          this.item(g, it, cx + pos[i][0], cy + pos[i][1], 0.62, now);
        });
        const live = t.steam.filter((s) => !s.burnt);
        if (live.length) {
          const worst = Math.max(...live.map((s) => s.cook));
          if (Math.random() < 0.25) this.puff(cx + (Math.random() - 0.5) * 30, cy - 10, 'rgba(255,255,255,.55)', 1, 10, 1.0, 34);
          const frac = Math.min(1, Math.min(...live.map((s) => s.cook)) / M.COOK_T);
          g.beginPath(); g.arc(cx, cy, 27, -Math.PI / 2, -Math.PI / 2 + frac * TAU);
          g.lineWidth = 4; g.strokeStyle = frac >= 1 ? '#6fd36a' : '#ffd35c'; g.stroke();
          if (worst > burnAt - 4 && Math.floor(now * 6) % 2) {
            g.fillStyle = '#ff4a2e'; g.beginPath(); g.arc(cx + 20, cy - 22, 9, 0, TAU); g.fill();
            g.fillStyle = '#fff'; g.font = 'bold 13px sans-serif'; g.textAlign = 'center'; g.fillText('!', cx + 20, cy - 17);
          }
        }
        if (t.steam.some((s) => s.burnt) && Math.random() < 0.3) this.puff(cx, cy - 8, 'rgba(50,50,50,.55)', 1, 10, 1.2, 30);
        break;
      }
      case 'plates':
        for (let i = 0; i < 4; i++) {
          g.beginPath(); g.ellipse(cx, cy + 6 - i * 4, 19, 9, 0, 0, TAU); g.fillStyle = '#fff'; g.fill();
          g.strokeStyle = '#c9c2b4'; g.lineWidth = 1.5; g.stroke();
        }
        break;
      case 'serve':
        g.fillStyle = '#3a2a22'; g.fillRect(x + 6, y + 6, T - 12, T - 20);
        g.fillStyle = '#ffd35c'; g.font = 'bold 13px sans-serif'; g.textAlign = 'center';
        g.fillText('출하', cx, cy + 1);
        g.fillStyle = 'rgba(255,211,92,' + (0.45 + Math.sin(now * 5) * 0.35) + ')';
        g.beginPath(); g.moveTo(cx - 8, cy + 8); g.lineTo(cx + 8, cy + 8); g.lineTo(cx, cy + 15); g.fill();
        break;
      case 'trash':
        g.fillStyle = '#7d8a8f'; g.beginPath(); g.roundRect(cx - 14, cy - 12, 28, 30, 4); g.fill();
        g.fillStyle = '#5c686c'; g.fillRect(cx - 17, cy - 16, 34, 6);
        g.strokeStyle = 'rgba(0,0,0,.25)'; g.lineWidth = 2;
        for (const ox of [-6, 0, 6]) { g.beginPath(); g.moveTo(cx + ox, cy - 6); g.lineTo(cx + ox, cy + 13); g.stroke(); }
        break;
    }
    if (t.item) this.item(g, t.item, cx, cy, 1, now);
    if (t.kind === 'board' && t.work > 0 && t.item) {
      const need = t.item.t === 'dough' ? M.KNEAD_T : M.FOLD_T;
      g.fillStyle = 'rgba(0,0,0,.55)'; g.beginPath(); g.roundRect(x + 2, y - 10, T - 4, 12, 5); g.fill();
      g.fillStyle = '#6fd36a'; g.beginPath(); g.roundRect(x + 4, y - 8, (T - 8) * Math.min(1, t.work / need), 8, 4); g.fill();
    }
  },

  // ── 모구 ──
  mogu(g, st, now) {
    const p = st.p, x = p.x, y = p.y + M.HUD;
    const moving = Math.hypot(p.vx, p.vy) > 20;
    const bob = moving ? Math.abs(Math.sin(now * 14)) * 3 : p.working ? Math.abs(Math.sin(now * 18)) * 2.5 : 0;
    const flip = p.fx < -0.15;
    const back = p.fy < -0.6;
    g.beginPath(); g.ellipse(x, y + 16, 20, 8, 0, 0, TAU); g.fillStyle = 'rgba(0,0,0,.22)'; g.fill();

    const held = () => {
      if (!p.held) return;
      const hx = x + p.fx * 20, hy = y + 4 + p.fy * 10 - bob;
      this.item(g, p.held, hx, hy, 0.95, now);
    };
    if (back) held();
    // 발
    g.fillStyle = '#fff';
    const step = moving ? Math.sin(now * 14) * 4 : 0;
    for (const s of [-1, 1]) { g.beginPath(); g.ellipse(x + s * 9, y + 14 + s * step * 0.4, 6, 4, 0, 0, TAU); g.fill(); g.strokeStyle = '#ccc'; g.lineWidth = 1; g.stroke(); }
    // 몸 (흰 바탕 + 삼색 얼룩 + 앞치마)
    const by = y + 2 - bob;
    g.beginPath(); g.ellipse(x, by, 17, 15, 0, 0, TAU); g.fillStyle = '#fbfaf6'; g.fill();
    g.strokeStyle = '#d9d4c8'; g.lineWidth = 1.5; g.stroke();
    g.save(); g.beginPath(); g.ellipse(x, by, 17, 15, 0, 0, TAU); g.clip();
    g.fillStyle = '#3a3230'; g.beginPath(); g.ellipse(x + (flip ? -9 : 9), by - 4, 7, 5, 0.4, 0, TAU); g.fill();
    g.fillStyle = '#c99260'; g.beginPath(); g.ellipse(x + (flip ? 10 : -10), by + 6, 6, 5, 0, 0, TAU); g.fill();
    if (!back) {
      g.fillStyle = '#e8553c'; g.beginPath(); g.roundRect(x - 10, by - 4, 20, 20, 4); g.fill();
      g.fillStyle = '#ffd35c'; g.fillRect(x - 5, by + 4, 10, 6);
    } else {
      g.strokeStyle = '#e8553c'; g.lineWidth = 3; g.beginPath(); g.moveTo(x - 14, by - 6); g.lineTo(x + 14, by - 6); g.stroke();
    }
    g.restore();
    // 꼬리
    g.strokeStyle = '#3a3230'; g.lineWidth = 5; g.lineCap = 'round';
    const tw = Math.sin(now * 3) * 4;
    g.beginPath(); g.moveTo(x + (flip ? 14 : -14), by + 6); g.quadraticCurveTo(x + (flip ? 26 : -26), by, x + (flip ? 24 : -24) + tw, by - 12); g.stroke();
    g.lineCap = 'butt';
    // 앞발 (빚는 중이면 꾹꾹)
    const pawOff = p.working ? Math.sin(now * 18) * 4 : 0;
    g.fillStyle = '#fff';
    for (const s of [-1, 1]) { g.beginPath(); g.arc(x + s * 9 + p.fx * 12, by + 4 + p.fy * 6 + (s > 0 ? pawOff : -pawOff), 5, 0, TAU); g.fill(); g.strokeStyle = '#ccc'; g.stroke(); }
    // 머리 = 모구 사진
    const hw = 74, hh = Math.round(74 * 221 / 256), hx = x - hw / 2, hy = by - hh - 5;
    if (this.faceOk) {
      g.save();
      if (flip) { g.translate(x * 2, 0); g.scale(-1, 1); }
      if (back) g.globalAlpha = 0.92;
      g.drawImage(this.face, hx, hy, hw, hh);
      g.restore();
    } else {
      g.beginPath(); g.arc(x, hy + hh / 2, 20, 0, TAU); g.fillStyle = '#fbfaf6'; g.fill();
    }
    if (!back) held();
    if (p.dashT > 0) {
      g.strokeStyle = 'rgba(255,255,255,.7)'; g.lineWidth = 2;
      for (let i = 0; i < 3; i++) { g.beginPath(); g.moveTo(x - p.fx * (24 + i * 6) - p.fy * (i - 1) * 9, y - p.fy * 24 + p.fx * (i - 1) * 9); g.lineTo(x - p.fx * (38 + i * 6) - p.fy * (i - 1) * 9, y - p.fy * 38 + p.fx * (i - 1) * 9); g.stroke(); }
    }
  },

  // ── 키위 (날개는 장식) ──
  kiwi(g, k, now) {
    const x = k.x, y = k.y + M.HUD;
    const pecking = k.st === 'peck', fleeing = k.st === 'flee';
    const walk = k.path.length ? Math.sin(now * 16) * 3 : 0;
    g.beginPath(); g.ellipse(x, y + 16, 15, 6, 0, 0, TAU); g.fillStyle = 'rgba(0,0,0,.2)'; g.fill();
    g.strokeStyle = '#d9b77a'; g.lineWidth = 2.5;
    for (const s of [-1, 1]) { g.beginPath(); g.moveTo(x + s * 5, y + 6); g.lineTo(x + s * 5 + (s > 0 ? walk : -walk), y + 16); g.stroke(); }
    const tilt = pecking ? Math.max(0, Math.sin(now * 9)) * 0.45 : 0;
    g.save(); g.translate(x, y); g.scale(k.dir, 1); g.rotate(tilt);
    g.beginPath(); g.ellipse(0, -4, 15, 17, 0.1, 0, TAU); g.fillStyle = '#9b6a42'; g.fill();
    g.fillStyle = 'rgba(70,40,20,.35)';
    for (let i = 0; i < 9; i++) { g.beginPath(); g.arc(-8 + (i * 7) % 16, -14 + (i * 11) % 22, 1.6, 0, TAU); g.fill(); }
    g.fillStyle = '#1a120c'; g.beginPath(); g.arc(8, -11, 2.2, 0, TAU); g.fill();
    g.fillStyle = '#fff'; g.beginPath(); g.arc(8.6, -11.8, 0.8, 0, TAU); g.fill();
    g.strokeStyle = '#f0dcae'; g.lineWidth = 3; g.lineCap = 'round';
    g.beginPath(); g.moveTo(12, -8); g.quadraticCurveTo(22, -2, 27, 8); g.stroke();
    g.lineCap = 'butt';
    g.restore();
    if (fleeing) {
      g.fillStyle = '#9fd8ff';
      g.beginPath(); g.ellipse(x - k.dir * 14, y - 22, 3, 5, 0.3, 0, TAU); g.fill();
    }
    if (pecking) {
      g.fillStyle = 'rgba(0,0,0,.5)'; g.fillRect(x - 16, y - 34, 32, 5);
      g.fillStyle = '#ff7a5c'; g.fillRect(x - 15, y - 33, 30 * Math.min(1, k.pt / M.PECK_T), 3);
    }
  },

  // ── 새 손님 아바타 (주문표) ──
  bird(g, kind, x, y) {
    const C = { penguin: ['#2d3448', '#fff', '#f0a93c'], kakapo: ['#9bb25a', '#c9d98a', '#e8d9a0'],
      pigeon: ['#9aa7d8', '#c7cff0', '#6a5a52'], chick: ['#ffe07a', '#fff2b8', '#f08a3c'], ostrich: ['#9a9aa4', '#c9c9d0', '#f0b0a0'] }[kind];
    g.beginPath(); g.arc(x, y, 13, 0, TAU); g.fillStyle = C[0]; g.fill();
    g.beginPath(); g.ellipse(x, y + 3, 8, 7, 0, 0, TAU); g.fillStyle = C[1]; g.fill();
    g.fillStyle = '#111';
    g.beginPath(); g.arc(x - 4, y - 3, 1.6, 0, TAU); g.arc(x + 4, y - 3, 1.6, 0, TAU); g.fill();
    g.fillStyle = C[2]; g.beginPath(); g.moveTo(x - 3, y); g.lineTo(x + 3, y); g.lineTo(x, y + 4); g.fill();
    if (kind === 'chick') { g.fillStyle = '#e8553c'; g.beginPath(); g.arc(x, y - 13, 3.5, 0, TAU); g.arc(x + 3, y - 12, 3, 0, TAU); g.fill(); }
  },

  hud(g, st, now) {
    const grd = g.createLinearGradient(0, 0, 0, M.HUD);
    grd.addColorStop(0, '#4a3122'); grd.addColorStop(1, '#3a2619');
    g.fillStyle = grd; g.fillRect(0, 0, M.W, M.HUD);
    // 주문표
    st.orders.forEach((o, i) => {
      const x = 10 + i * 168, y = 8, w = 158, h = 68;
      const frac = Math.max(0, o.t / o.max);
      const urgent = frac < 0.25 && Math.floor(now * 4) % 2;
      g.fillStyle = urgent ? '#ffd9cc' : '#fff6e2'; g.beginPath(); g.roundRect(x, y, w, h, 8); g.fill();
      this.bird(g, o.cust, x + 20, y + 26);
      o.items.forEach((it, k) => this.item(g, Object.assign({ t: 'song' }, it), x + 58 + k * 36, y + 30, 0.95, now));
      g.fillStyle = '#d8ccb4'; g.fillRect(x + 8, y + h - 12, w - 16, 6);
      g.fillStyle = frac > 0.5 ? '#6fbf5a' : frac > 0.25 ? '#f0b83c' : '#e8553c';
      g.fillRect(x + 8, y + h - 12, (w - 16) * frac, 6);
    });
    // 시간 · 점수
    const tl = Math.ceil(st.timeLeft), mm = Math.floor(tl / 60), ss = String(tl % 60).padStart(2, '0');
    g.textAlign = 'right';
    g.fillStyle = st.timeLeft <= 30 && Math.floor(now * 3) % 2 ? '#ff7a5c' : '#fff3d6';
    g.font = 'bold 30px sans-serif'; g.fillText(`⏱ ${mm}:${ss}`, M.W - 14, 36);
    g.fillStyle = '#ffd35c'; g.font = 'bold 24px sans-serif'; g.fillText(`${st.score}점`, M.W - 14, 68);
    if (st.combo > 1) { g.fillStyle = '#a8e08a'; g.font = 'bold 15px sans-serif'; g.fillText(`콤보 x${st.combo}`, M.W - 110, 66); }
  },

  draw(st, now, dt) {
    const g = this.g;
    g.save();
    if (this.shake > 0) { this.shake -= dt; g.translate((Math.random() - 0.5) * 8, (Math.random() - 0.5) * 6); }
    g.fillStyle = '#e0bf88'; g.fillRect(0, M.HUD, M.W, M.H - M.HUD);
    for (const row of st.grid) for (const t of row) if (t.kind === 'floor' || t.kind === 'door') this.tile(g, st, t, now);
    // 바라보는 칸 강조
    const ft = st.phase === 'play' ? M.Logic.facingTile(st) : null;
    for (const row of st.grid) for (const t of row) if (t.kind !== 'floor' && t.kind !== 'door') this.tile(g, st, t, now);
    if (ft) {
      g.strokeStyle = 'rgba(255,240,120,' + (0.6 + Math.sin(now * 8) * 0.3) + ')'; g.lineWidth = 3;
      g.beginPath(); g.roundRect(ft.c * T + 2, M.HUD + ft.r * T + 2, T - 4, T - 4, 6); g.stroke();
    }
    // 캐릭터 (y 순서)
    const actors = st.kiwis.map((k) => ({ y: k.y, f: () => this.kiwi(g, k, now) }));
    actors.push({ y: st.p.y, f: () => this.mogu(g, st, now) });
    actors.sort((a, b) => a.y - b.y).forEach((a) => a.f());
    // 파티클 · 팝업
    for (const q of this.parts) {
      q.t += dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vy *= 0.96;
      const a = 1 - q.t / q.life;
      if (a <= 0) continue;
      g.globalAlpha = a; g.beginPath(); g.arc(q.x, q.y, q.r * (1 + q.t), 0, TAU); g.fillStyle = q.col; g.fill();
    }
    g.globalAlpha = 1;
    this.parts = this.parts.filter((q) => q.t < q.life);
    g.textAlign = 'center';
    for (const q of this.pops) {
      q.t += dt;
      const a = Math.min(1, 2 * (q.life - q.t));
      if (a <= 0) continue;
      g.globalAlpha = a; g.font = `900 ${q.size}px sans-serif`;
      g.lineWidth = 4; g.strokeStyle = 'rgba(40,20,10,.8)'; const rise = Math.min(q.t, 1.3) * 26;
      g.strokeText(q.text, q.x, q.y - rise);
      g.fillStyle = q.col; g.fillText(q.text, q.x, q.y - rise);
    }
    g.globalAlpha = 1;
    this.pops = this.pops.filter((q) => q.t < q.life);
    g.restore();
    this.hud(g, st, now);
  },
};

M.Render = R;

}
/* ── audio.js ── */
{
// audio.js — WebAudio 합성 효과음 + 가야금풍 배경 가락 (외부 파일 없음, 시리즈 공통 방식)
const M = window.MSP;

const A = {
  ctx: null, master: null, bgmTimer: null, bgmStep: 0, bgmFast: false, kneadAt: 0,

  init() {
    if (this.ctx) return;
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    this.ctx = new Ctx();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.4;
    this.master.connect(this.ctx.destination);
  },
  resume() { this.init(); if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },

  tone(freq, dur, type = 'square', vol = 0.2, slideTo = null, when = 0) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + when;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.02);
  },
  noise(dur, vol = 0.2, freq = 900, q = 1, when = 0) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + when;
    const len = Math.ceil(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const f = this.ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t0); src.stop(t0 + dur + 0.02);
  },
  pluck(freq, when = 0, vol = 0.07) {       // 가야금 뜯는 소리 흉내 — 짧은 삼각파 두 겹
    this.tone(freq, 0.5, 'triangle', vol, freq * 0.995, when);
    this.tone(freq * 2, 0.18, 'sine', vol * 0.4, null, when);
  },

  // ── 배경 가락: 5음(도 레 파 솔 라)으로 도는 느린 12박, 장구 소리를 흉내 낸 박자 ──
  bgmStart() {
    this.bgmStop();
    if (!this.ctx) return;
    const scale = [262, 294, 349, 392, 440, 523, 587];
    const tune = [0, 2, 3, 4, 3, 2, 3, -1, 4, 5, 4, 3, 2, 3, 2, 0, 1, 2, -1, 0, 2, 3, 2, -1];
    this.bgmStep = 0;
    this.bgmTimer = setInterval(() => {
      if (!this.ctx || this.ctx.state !== 'running') return;
      const n = tune[this.bgmStep % tune.length];
      if (n >= 0) this.pluck(scale[n], 0, 0.06);
      if (this.bgmStep % 6 === 0) this.tone(131, 0.25, 'sine', 0.08, 110);        // 장구 쿵
      if (this.bgmStep % 6 === 3) this.noise(0.06, 0.05, 2400, 2);                 // 덕
      this.bgmStep++;
    }, this.bgmFast ? 180 : 240);
  },
  bgmStop() { if (this.bgmTimer) clearInterval(this.bgmTimer); this.bgmTimer = null; },
  hurry() { this.bgmFast = true; if (this.bgmTimer) this.bgmStart(); [880, 880, 1175].forEach((f, i) => this.tone(f, 0.1, 'square', 0.12, null, i * 0.12)); },

  // ── 효과음 ──
  pick()   { this.tone(620, 0.06, 'square', 0.1, 820); },
  place()  { this.tone(300, 0.07, 'triangle', 0.16, 200); },
  bump()   { this.tone(160, 0.06, 'square', 0.06); },
  knead()  {
    if (!this.ctx) return;
    const now = this.ctx.currentTime; if (now - this.kneadAt < 0.2) return; this.kneadAt = now;
    this.tone(140, 0.08, 'sine', 0.2, 90); this.noise(0.05, 0.05, 500, 1);
  },
  done()   { this.tone(700, 0.08, 'triangle', 0.16, 1100); },
  fill()   { this.noise(0.08, 0.1, 3000, 1.5); this.tone(520, 0.05, 'triangle', 0.08); },
  steamIn(){ this.noise(0.35, 0.12, 5000, 0.8); },
  cooked() { this.tone(1320, 0.12, 'sine', 0.14); this.tone(1760, 0.18, 'sine', 0.12, null, 0.1); },
  burnt()  { this.tone(110, 0.4, 'sawtooth', 0.12, 80); this.noise(0.4, 0.1, 400, 0.7); },
  serve()  { [784, 988, 1175, 1568].forEach((f, i) => this.tone(f, 0.12, 'square', 0.12, null, i * 0.06)); },
  wrong()  { this.tone(180, 0.18, 'square', 0.14); this.tone(150, 0.22, 'square', 0.14, null, 0.15); },
  miss()   { this.tone(440, 0.2, 'triangle', 0.14, 220); },
  order()  { this.tone(1046, 0.1, 'sine', 0.1); this.tone(1318, 0.14, 'sine', 0.09, null, 0.08); },
  kiwiIn() { [2200, 2600, 2200].forEach((f, i) => this.tone(f, 0.05, 'sine', 0.08, f * 1.1, i * 0.09)); },
  peck()   { this.tone(1800, 0.03, 'square', 0.08); this.tone(1500, 0.03, 'square', 0.08, null, 0.07); },
  shoo()   { this.noise(0.18, 0.14, 1400, 0.8); this.tone(700, 0.25, 'sawtooth', 0.08, 420); },
  dash()   { this.noise(0.12, 0.08, 1800, 0.8); },
  trash()  { this.noise(0.15, 0.12, 700, 0.9); },
  end()    { this.bgmStop(); this.bgmFast = false; [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.2, 'triangle', 0.18, null, i * 0.13)); },
  star(i)  { this.tone(880 + i * 220, 0.25, 'square', 0.14, null, 0); },
  meow()   { this.tone(700, 0.28, 'sawtooth', 0.1, 420); },
};

M.audio = A;

}
/* ── ui.js ── */
{
// ui.js — 저장(스테이지·난이도별 최고 점수와 별) + 화면 전환
const M = window.MSP;
const $ = (id) => document.getElementById(id);

M.save = {
  KEY: 'mogusongpyeon-save-v1',
  data: { diff: 'normal', stage: 0, best: {}, plays: 0 },
  load() {
    try { const raw = localStorage.getItem(this.KEY); if (raw) this.data = Object.assign(this.data, JSON.parse(raw)); } catch (e) {}
    if (M.DIFFS[this.data.diff]) M.diff = this.data.diff;
    M.stage = Math.min(this.data.stage || 0, M.STAGES.length - 1);
    if (!this.unlocked(M.stage)) M.stage = 0;
    return this.data;
  },
  store() { try { localStorage.setItem(this.KEY, JSON.stringify(this.data)); } catch (e) {} },
  setDiff(d) { if (!M.DIFFS[d]) return; M.diff = d; this.data.diff = d; this.store(); },
  setStage(i) { if (!this.unlocked(i)) return; M.stage = i; this.data.stage = i; this.store(); },
  bestOf(i, d) { return this.data.best[d + ':' + i] || { score: 0, stars: 0 }; },
  starsAny(i) { return Math.max(0, ...M.DIFF_ORDER.map((d) => this.bestOf(i, d).stars)); },
  // 앞 가게에서 별 하나라도 받으면(난이도 무관) 다음 가게가 열린다
  unlocked(i) { return i === 0 || this.starsAny(i - 1) >= 1; },
  totalStars() { let n = 0; for (let i = 0; i < M.STAGES.length; i++) n += this.starsAny(i); return n; },
  record(i, d, score, stars) {
    const b = this.bestOf(i, d);
    const isBest = score > b.score;
    this.data.best[d + ':' + i] = { score: Math.max(b.score, score), stars: Math.max(b.stars, stars) };
    this.data.plays = (this.data.plays || 0) + 1;
    this.store();
    return isBest;
  },
};

M.ui = {
  screens: ['title-screen', 'pause-screen', 'result-screen'],

  init() {
    $('title-icon').src = M.ASSETS.mogu;
    document.querySelectorAll('.diff-btn').forEach((btn) => {
      btn.addEventListener('click', () => { M.save.setDiff(btn.dataset.diff); this.refreshTitle(); });
    });
    this.refreshTitle();
  },

  refreshTitle() {
    document.querySelectorAll('.diff-btn').forEach((btn) => btn.classList.toggle('selected', btn.dataset.diff === M.diff));
    const list = $('stage-list');
    list.innerHTML = '';
    M.STAGES.forEach((S, i) => {
      const b = document.createElement('button');
      const open = M.save.unlocked(i);
      const stars = M.save.bestOf(i, M.diff).stars;
      b.className = 'stage-btn' + (i === M.stage ? ' selected' : '') + (open ? '' : ' locked');
      b.dataset.stage = i;
      b.innerHTML = `<div class="no">${i + 1}호점</div><div>${open ? S.name : '🔒'}</div>` +
        `<div class="st">${'★'.repeat(stars)}${'☆'.repeat(3 - stars)}</div>`;
      b.onclick = () => { if (open) { M.save.setStage(i); this.refreshTitle(); } };
      list.appendChild(b);
    });
    const S = M.STAGES[M.stage];
    const b = M.save.bestOf(M.stage, M.diff);
    const th = M.Logic.thresholds(M.stage, M.diff);
    $('title-hi').innerHTML = `${M.stage + 1}호점 「${S.name}」 — ${S.sub} · ${Math.floor(S.time / 60)}분 ${S.time % 60 ? (S.time % 60) + '초' : ''}` +
      `<br>별 기준 ${th.join(' / ')}점` + (b.score ? ` · 최고 ${b.score}점` : '') + ` · 모은 별 ${M.save.totalStars()}/15`;
  },

  show(id) { for (const s of this.screens) $(s).classList.toggle('hidden', s !== id); },
  hideAll() { for (const s of this.screens) $(s).classList.add('hidden'); },

  showResult(st, isBest) {
    const stars = M.Logic.starsOf(st);
    const th = M.Logic.thresholds(st.stage, st.diff);
    $('result-title').textContent = stars ? '영업 종료! 수고했어요' : '영업 종료…';
    $('result-stars').innerHTML = [0, 1, 2].map((i) => `<span class="${i < stars ? '' : 'off'}">⭐</span>`).join('');
    $('result-score').textContent = `${st.score}점`;
    $('result-stats').innerHTML =
      `출하 ${st.served}접시 (송편 ${st.songsServed}개) · 놓친 주문 ${st.missed} · 잘못 낸 접시 ${st.wrong}<br>` +
      `최고 콤보 x${st.bestCombo}` + (st.S.kiwi ? ` · 쫓아낸 키위 ${st.shooed} · 구멍 난 송편 ${st.pecked}` : '') +
      `<br>별 기준 ${th.join(' / ')}점 · ${M.DIFFS[st.diff].name}`;
    let msg = isBest ? '🎉 이 가게 최고 기록!' : '';
    const last = st.stage === M.STAGES.length - 1;
    if (stars && last) msg += (msg ? ' · ' : '') + '🌕 추석 대목을 무사히 넘겼어요!';
    else if (stars && !last && M.save.unlocked(st.stage + 1)) msg += (msg ? ' · ' : '') + `${st.stage + 2}호점이 열렸어요`;
    if (!stars) msg = `별 하나까지 ${th[0] - st.score}점 — 찌는 동안 다음 반죽을 빚어 두면 빨라져요`;
    $('result-msg').textContent = msg;
    const canNext = !last && M.save.unlocked(st.stage + 1);
    $('btn-next').style.display = canNext ? '' : 'none';
    this.show('result-screen');
    return stars;
  },
};

}
/* ── main.js ── */
{
// main.js — 게임 루프 + 모드 전환 + 입력 (키보드 / 터치 조이스틱·버튼)
const M = window.MSP;
const $ = (id) => document.getElementById(id);

let mode = 'title';            // title | play | pause | result
let st = null;
let tipIdx = 0, tipAt = 0;
const held = { up: false, down: false, left: false, right: false, work: false };
const edge = { grab: false, dash: false, work: false };
const stick = { x: 0, y: 0 };

M.save.load();
M.ui.init();
M.Render.init($('game'));
M.ui.show('title-screen');
// 타이틀 뒤에 1호점 주방을 깔아 둔다
st = M.Logic.create(1, M.stage, M.diff);

function startRun() {
  st = M.Logic.create((Date.now() & 0x7fffffff) || 1, M.stage, M.diff);
  M.Render.reset();
  for (const k in held) held[k] = false;
  mode = 'play';
  M.ui.hideAll();
  tipIdx = 0; tipAt = 2.2;
  M.Render.pop(M.W / 2, M.HUD + 250, `${M.stage + 1}호점 「${st.S.name}」 영업 시작!`, '#fff3d6', 30, 2);
  M.audio.resume(); M.audio.meow(); M.audio.bgmFast = false; M.audio.bgmStart();
}
function toTitle() {
  mode = 'title';
  M.audio.bgmStop();
  M.ui.refreshTitle();
  st = M.Logic.create(1, M.stage, M.diff);
  M.ui.show('title-screen');
}
function pause() { if (mode !== 'play') return; mode = 'pause'; M.audio.bgmStop(); M.ui.show('pause-screen'); }
function resume() { mode = 'play'; M.ui.hideAll(); M.audio.bgmStart(); }
function goNext() {
  if (M.stage < M.STAGES.length - 1 && M.save.unlocked(M.stage + 1)) M.save.setStage(M.stage + 1);
  startRun();
}

function finish() {
  if (st.recorded) return;
  st.recorded = true;
  const stars = M.Logic.starsOf(st);
  const isBest = M.save.record(st.stage, st.diff, st.score, stars);
  setTimeout(() => {
    if (mode !== 'play') return;
    mode = 'result';
    const n = M.ui.showResult(st, isBest);
    for (let i = 0; i < n; i++) setTimeout(() => M.audio.star(i), 250 + i * 260);
  }, 1300);
}

function handleEvents(evs) {
  const A = M.audio;
  for (const e of evs) {
    M.Render.event(e, st);
    switch (e.type) {
      case 'pick': A.pick(); break;
      case 'place': A.place(); break;
      case 'bump': A.bump(); break;
      case 'knead': A.knead(); break;
      case 'skin-done': case 'fold-done': A.done(); break;
      case 'fill': A.fill(); break;
      case 'steam-in': A.steamIn(); break;
      case 'cooked': A.cooked(); break;
      case 'burnt': A.burnt(); break;
      case 'serve': A.serve(); break;
      case 'wrong': A.wrong(); break;
      case 'serve-hint': case 'plate-hint': A.bump(); break;
      case 'miss': A.miss(); break;
      case 'order': A.order(); break;
      case 'kiwi-in': A.kiwiIn(); break;
      case 'peck': A.peck(); break;
      case 'shoo': A.shoo(); break;
      case 'dash': A.dash(); break;
      case 'trash': A.trash(); break;
      case 'work-hint': A.bump(); break;
      case 'hurry': A.hurry(); M.Render.pop(M.W / 2, M.HUD + 250, '마감 30초 전!', '#ff9a6a', 30); break;
      case 'end': A.end(); M.Render.pop(M.W / 2, M.HUD + 250, '영업 종료!', '#fff3d6', 40); finish(); break;
    }
  }
}

// ── 키보드 ──
// 글자 키는 e.code(자판 위치)로 읽는다 — 한글 입력 상태면 e.key 가 'ㅏ'·'ㅌ' 로 들어와 K·X 가 안 먹는다
const keyOf = (e) => {
  if (/^Key[A-Z]$/.test(e.code)) return e.code.slice(3).toLowerCase();
  if (e.code === 'Space') return ' ';
  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') return 'Shift';
  if (e.code === 'ControlLeft' || e.code === 'ControlRight') return 'Control';
  return e.key;
};
const KEYMAP = {
  ArrowUp: 'up', w: 'up', ArrowDown: 'down', s: 'down',
  ArrowLeft: 'left', a: 'left', ArrowRight: 'right', d: 'right',
  k: 'work', x: 'work', Control: 'work',
};
window.addEventListener('keydown', (e) => {
  M.audio.resume();
  const k = keyOf(e);
  if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(k)) e.preventDefault();
  if (KEYMAP[k]) { if (KEYMAP[k] === 'work' && !held.work) edge.work = true; held[KEYMAP[k]] = true; }

  if (mode === 'title') {
    if (k === 'Enter' || k === ' ') startRun();
    const n = '1234'.indexOf(k);
    if (n >= 0) { M.save.setDiff(M.DIFF_ORDER[n]); M.ui.refreshTitle(); }
    if (k === 'ArrowRight' || k === 'ArrowLeft') {
      const i = M.stage + (k === 'ArrowRight' ? 1 : -1);
      if (i >= 0 && i < M.STAGES.length) { M.save.setStage(i); M.ui.refreshTitle(); }
    }
  } else if (mode === 'play') {
    if (e.repeat) return;
    if (k === ' ' || k === 'j' || k === 'J' || k === 'z' || k === 'Z') edge.grab = true;
    if (k === 'Shift' || k === 'l' || k === 'L' || k === 'c' || k === 'C') edge.dash = true;
    if (k === 'Escape' || k === 'p' || k === 'P') pause();
    if (k === 'r' || k === 'R') startRun();
  } else if (mode === 'pause') {
    if (k === 'Enter' || k === 'Escape' || k === ' ' || k === 'p' || k === 'P') resume();
    if (k === 'r' || k === 'R') startRun();
    if (k === 'm' || k === 'M') toTitle();
  } else if (mode === 'result') {
    if (k === 'Enter') { if ($('btn-next').style.display !== 'none') goNext(); else startRun(); }
    if (k === 'r' || k === 'R') startRun();
    if (k === 'Escape') toTitle();
  }
});
window.addEventListener('keyup', (e) => { const k = keyOf(e); if (KEYMAP[k]) held[KEYMAP[k]] = false; });
window.addEventListener('blur', () => { for (const k in held) held[k] = false; });

$('btn-start').onclick = () => startRun();
$('btn-series').onclick = () => {
  location.href = location.pathname.includes('/mogusongpyeon/') ? '../index.html' : 'index.html';
};
$('btn-resume').onclick = () => resume();
$('btn-restart').onclick = () => startRun();
$('btn-title').onclick = () => toTitle();
$('btn-retry').onclick = () => startRun();
$('btn-res-title').onclick = () => toTitle();
$('btn-next').onclick = () => goNext();

// ── 터치 ──
const isTouch = window.matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
const vpad = $('vpad');
if (isTouch) {
  document.body.classList.add('touch');
  $('title-hint').innerHTML = '<b>반죽</b> → <b>도마</b>에서 빚기 → <b>소</b> 얹기 → 다시 빚기 → <b>솔잎 찜기</b> → <b>접시</b> → <b>출하</b><br>' +
    '왼쪽 스틱 이동 · 집기 = 집기/놓기 · 빚기 = 꾹 누르고 있기 · 대시<br>🥝 키위는 몸으로 부딪쳐 쫓아내요!';
  const pad = $('vstick'), knob = $('vstick-knob');
  let padId = null;
  const setDir = (e) => {
    const r = pad.getBoundingClientRect();
    let dx = (e.clientX - (r.left + r.width / 2)) / (r.width / 2);
    let dy = (e.clientY - (r.top + r.height / 2)) / (r.height / 2);
    const m = Math.hypot(dx, dy);
    if (m > 1) { dx /= m; dy /= m; }
    stick.x = m < 0.18 ? 0 : dx; stick.y = m < 0.18 ? 0 : dy;
    knob.style.transform = `translate(${dx * 40}px, ${dy * 40}px)`;
  };
  const clearDir = () => { padId = null; stick.x = stick.y = 0; knob.style.transform = ''; };
  pad.addEventListener('pointerdown', (e) => { e.preventDefault(); M.audio.resume(); padId = e.pointerId; try { pad.setPointerCapture(e.pointerId); } catch (err) {} setDir(e); });
  pad.addEventListener('pointermove', (e) => { if (e.pointerId === padId) setDir(e); });
  pad.addEventListener('pointerup', clearDir);
  pad.addEventListener('pointercancel', clearDir);

  const bind = (id, on, off) => {
    const el = $(id);
    el.addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); M.audio.resume(); on(); el.classList.add('pressed'); });
    const up = () => { if (off) off(); el.classList.remove('pressed'); };
    el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up); el.addEventListener('pointerleave', up);
  };
  bind('vb-grab', () => { edge.grab = true; });
  bind('vb-work', () => { edge.work = true; held.work = true; }, () => { held.work = false; });
  bind('vb-dash', () => { edge.dash = true; });
  $('vb-pause').addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); pause(); });
  document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
  document.addEventListener('gesturestart', (e) => e.preventDefault());
  vpad.addEventListener('contextmenu', (e) => e.preventDefault());
}

// ── 디버그 훅 (테스트 자동화용) ──
M._dbg = () => ({
  mode, stage: st ? st.stage : M.stage, diff: st ? st.diff : M.diff, phase: st ? st.phase : null,
  t: st ? +st.t.toFixed(2) : 0, score: st ? st.score : 0, orders: st ? st.orders.length : 0,
  held: st && st.p.held ? st.p.held.t : null, px: st ? Math.round(st.p.x) : 0, py: st ? Math.round(st.p.y) : 0,
});
M._st = () => st;

// ── 메인 루프 ──
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  if (isTouch) {
    vpad.classList.toggle('on', mode === 'play');
    $('rotate-hint').classList.toggle('hidden', !(window.innerHeight > window.innerWidth));
  }
  if (st && mode === 'play') {
    const mx = (held.right ? 1 : 0) - (held.left ? 1 : 0) + stick.x;
    const my = (held.down ? 1 : 0) - (held.up ? 1 : 0) + stick.y;
    handleEvents(M.Logic.step(st, dt, { mx, my, grab: edge.grab, dash: edge.dash, work: held.work, workEdge: edge.work }));
    edge.grab = edge.dash = edge.work = false;
    // 1호점 안내 — 처음 몇 번은 공정을 순서대로 띄운다
    if (st.S.tips && tipIdx < st.S.tips.length && st.t >= tipAt) {
      M.Render.pop(M.W / 2, M.HUD + 200, st.S.tips[tipIdx], '#fff3d6', 22, 3.4);
      tipIdx++; tipAt = st.t + 3.2;
    }
  }
  if (st) M.Render.draw(st, now / 1000, dt);
}
requestAnimationFrame(frame);

}
</script>
