<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>모구 다이버</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#061c30;
    font-family:'Malgun Gothic','맑은 고딕',sans-serif; user-select:none;
    touch-action:none; overscroll-behavior:none;
    -webkit-user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  #app { position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  #stage-wrap { position:relative; }
  canvas { display:block; background:#000; }

  .screen { position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; z-index:10; }
  .hidden { display:none !important; }

  #hud { position:absolute; inset:0; pointer-events:none; z-index:5; }
  #hud-toast { position:absolute; top:30%; left:50%; transform:translateX(-50%);
    color:#fff; font-size:19px; font-weight:900; text-shadow:0 3px 6px rgba(0,0,0,.6);
    opacity:0; transition:opacity .3s; white-space:nowrap; }

  /* ── 타이틀 (깊은 바다 무드) ── */
  #title-screen { background:linear-gradient(#46c8e8 0%, #0e5a8a 45%, #041e36 100%); }
  #title-screen .logo { font-size:min(52px, 10vw); font-weight:900; color:#fff; white-space:nowrap;
    text-shadow:0 0 18px #4ac8f0, 0 5px 0 #0a3a5c, 0 9px 18px rgba(0,0,0,.5); letter-spacing:min(5px, 1.1vw); }
  #title-screen .sub { margin-top:6px; font-size:17px; color:#b0e0f4; font-weight:700; }
  #title-icon { width:105px; height:auto; margin:16px 0 4px; animation:bob 1.6s ease-in-out infinite;
    filter:drop-shadow(0 0 14px rgba(74,200,240,.7)) drop-shadow(0 8px 10px rgba(0,0,0,.4)); }
  @keyframes bob { 0%,100%{transform:translateY(0) rotate(-3deg)} 50%{transform:translateY(-14px) rotate(3deg)} }
  #title-hi { margin-top:4px; color:#ffd83d; font-size:14px; font-weight:800; min-height:19px;
    text-shadow:0 1px 3px rgba(0,0,0,.5); }
  #title-hint { margin-top:12px; color:rgba(255,255,255,.92); font-size:13px; text-align:center;
    padding:0 14px; text-shadow:0 1px 3px rgba(0,0,0,.5); line-height:1.7; }

  .menu-buttons { display:flex; gap:12px; margin-top:18px; flex-wrap:wrap; justify-content:center; padding:0 10px; }
  .btn { pointer-events:auto; padding:12px 24px; font-size:16px; font-weight:800; color:#fff;
    background:#1a6ac8; border:3px solid rgba(255,255,255,.8); border-radius:12px; cursor:pointer;
    box-shadow:0 4px 8px rgba(0,0,0,.4); font-family:inherit; }
  .btn.primary { background:#3aa84f; }
  .btn.series { padding:9px 18px; font-size:13px; background:#2e6da3; }

  /* ── 승리 / 일시정지 / 엔딩 ── */
  #win-screen { background:rgba(4,20,38,.88); z-index:20; }
  #win-screen .big { font-size:min(44px, 10vw); font-weight:900; color:#ffd83d; }
  #win-stars { font-size:44px; color:#ffd83d; letter-spacing:8px; margin:8px 0 2px; }
  #win-stats { color:#d8ecf8; font-size:17px; line-height:1.8; text-align:center; }
  #pause-screen { background:rgba(0,0,0,.6); z-index:20; }
  #pause-screen .big, #ending-screen .big {
    font-size:min(42px, 10vw); font-weight:900; color:#fff; white-space:nowrap; }
  #ending-screen { background:linear-gradient(#46c8e8 0%, #0e5a8a 50%, #041e36 100%); z-index:20; }
  #ending-screen .big { color:#4ac8f0; text-shadow:0 0 16px rgba(74,200,240,.8); }
  #ending-screen .msg { margin-top:14px; color:#d8ecf8; font-size:16px; line-height:1.8; text-align:center; padding:0 16px; }

  /* ── 터치 가상 패드 ── */
  #vpad { position:fixed; inset:0; pointer-events:none; z-index:8; display:none; }
  body.touch #vpad.on { display:block; }
  .vbtn { position:absolute; pointer-events:auto; width:64px; height:64px; border-radius:50%;
    background:rgba(255,255,255,.15); border:2px solid rgba(255,255,255,.5);
    color:rgba(255,255,255,.92); font-size:22px; font-weight:800;
    display:flex; align-items:center; justify-content:center;
    touch-action:none; user-select:none; text-shadow:0 2px 3px rgba(0,0,0,.5); }
  .vbtn.pressed { background:rgba(74,200,240,.4); border-color:#4ac8f0; }
  #vbtn-left  { left:calc(12px + env(safe-area-inset-left)); bottom:calc(52px + env(safe-area-inset-bottom)); }
  #vbtn-right { left:calc(148px + env(safe-area-inset-left)); bottom:calc(52px + env(safe-area-inset-bottom)); }
  #vbtn-up    { left:calc(80px + env(safe-area-inset-left)); bottom:calc(108px + env(safe-area-inset-bottom)); }
  #vbtn-down  { left:calc(80px + env(safe-area-inset-left)); bottom:calc(12px + env(safe-area-inset-bottom)); }
  #vbtn-dash  { right:calc(14px + env(safe-area-inset-right)); bottom:calc(96px + env(safe-area-inset-bottom)); }
  #vbtn-atk   { right:calc(88px + env(safe-area-inset-right)); bottom:calc(24px + env(safe-area-inset-bottom)); width:76px; height:76px; font-size:26px; }
  #vbtn-pause { right:calc(12px + env(safe-area-inset-right)); top:calc(10px + env(safe-area-inset-top));
    width:44px; height:44px; font-size:17px; border-radius:12px; }
</style>
</head>
<body>
<div id="app">
  <div id="stage-wrap">
    <canvas id="game" width="480" height="270"></canvas>
    <div id="hud" class="hidden"><div id="hud-toast"></div></div>
  </div>

  <div id="title-screen" class="screen">
    <div class="logo">모구 다이버</div>
    <div class="sub">~ 냥냥 잠수 사냥꾼 ~</div>
    <img id="title-icon" alt="모구">
    <div id="title-hi"></div>
    <div class="menu-buttons">
      <button class="btn primary" id="btn-continue">이어하기</button>
      <button class="btn" id="btn-new">처음부터</button>
    </div>
    <div class="menu-buttons"><button class="btn series" id="btn-series">🏠 모구 게임 시리즈</button></div>
    <div id="title-hint">←→↑↓ 헤엄 · Space/Z 발톱 · X 대시<br>발톱으로 잡고, 물고, 보트로! 산소가 다하기 전에 — 6스테이지 보스 사냥</div>
  </div>

  <div id="win-screen" class="screen hidden">
    <div class="big">🌊 스테이지 클리어!!</div>
    <div id="win-stars">★★★</div>
    <div id="win-stats"></div>
    <div class="menu-buttons">
      <button class="btn" id="btn-retry">다시 도전</button>
      <button class="btn" id="btn-win-title">타이틀로</button>
      <button class="btn primary" id="btn-next">다음 바다 →</button>
    </div>
  </div>

  <div id="pause-screen" class="screen hidden">
    <div class="big">일시정지</div>
    <div class="menu-buttons">
      <button class="btn primary" id="btn-resume">계속</button>
      <button class="btn" id="btn-restage">재시작</button>
      <button class="btn" id="btn-title">타이틀로</button>
    </div>
  </div>

  <div id="ending-screen" class="screen hidden">
    <div class="big">🌊 모든 바다를 정복!!</div>
    <div class="msg">심연의 크라켄까지 잡아낸 전설의 냥다이버.<br>오늘 저녁은 만선이다 — 🐟🐟🐟</div>
    <div class="menu-buttons"><button class="btn primary" id="btn-end-title">타이틀로</button></div>
  </div>

  <div id="vpad">
    <div class="vbtn" id="vbtn-left">◀</div>
    <div class="vbtn" id="vbtn-right">▶</div>
    <div class="vbtn" id="vbtn-up">▲</div>
    <div class="vbtn" id="vbtn-down">▼</div>
    <div class="vbtn" id="vbtn-atk">🐾</div>
    <div class="vbtn" id="vbtn-dash">💨</div>
    <div class="vbtn" id="vbtn-pause">⏸</div>
  </div>
</div>

// rng.js — 시드 기반 결정적 난수 (시리즈 공통 계열)
const M = window.MDV;

M.mulberry32 = function (seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
};

M.makeRng = function (seed) {
  const f = M.mulberry32(seed);
  return {
    next: f,
    range: (a, b) => a + f() * (b - a),
    int: (a, b) => Math.floor(a + f() * (b - a + 1)),
    pick: (arr) => arr[Math.floor(f() * arr.length)],
    chance: (p) => f() < p,
  };
};

}

  create(no) {
    const stage = M.makeStage(no);
    const st = {
      stage, no: stage.no, phase: 'play', t: 0, clearT: 0,
      rng: M.makeRng(stage.no * 4271 + 77),
      p: { x: M.BOAT_X, y: M.SURF + 8, vx: 0, vy: 0, face: 1, o2: O2MAX,

      delivered: 0, score: 0, deaths: 0, stars: 0,
      spawnT: 0, bossIntroT: -1, bossSpawned: false, o2warned: false,
    };
    for (let i = 0; i < 8 + stage.no; i++) this._spawnFish(st, true);
    for (let i = 0; i < stage.jellyN; i++) this._spawnJelly(st);

    const type = st.rng.pick(st.stage.pool);

      fleeT: 0, iv: 0, dead: false, deadT: 0, gone: false,
    });
  },

      type: 'jelly', hp: 1, dir: st.rng.chance(0.5) ? 1 : -1,
      x: st.rng.range(200, M.WORLD_W - 60),
      y: st.rng.range(M.SURF + 90, st.stage.depth - 60),
      vx: 0, vy: 0, wob: st.rng.range(0, 6.28), flipT: st.rng.range(2, 5),
      fleeT: 0, iv: 0, dead: false, deadT: 0, gone: false,
    });
  },

  _spawnBoss(st) {
    const B = st.stage.boss;
    st.boss = {
      x: M.WORLD_W / 2, y: st.stage.depth - 90, vx: 0, vy: 0, face: -1,
      hp: B.hp, maxHp: B.hp, w: B.w, spd: B.spd, dmg: B.dmg, base: B.base, kind: B.kind,
      state: 'wander', stT: 0, atkCd: 2.4, aimX: 0, aimY: 0, alt: false,
      dead: false, deadT: 0,
    };
    st.bossSpawned = true;
  },

  step(st, dt, input) {
    const ev = [];
    if (st.phase !== 'play') { st.clearT += dt; return ev; }
    st.t += dt;
    const p = st.p, S = st.stage, D = S.depth;

    // ── 플레이어 유영 ──
    p.clawCd -= dt; p.dashCd -= dt; p.clawT -= dt;
    if (p.iv > 0) p.iv -= dt;
    let ax = 0, ay = 0;
    if (input.left) { ax = -1; p.face = -1; }
    if (input.right) { ax = 1; p.face = 1; }
    if (input.up) ay = -1;
    if (input.down) ay = 1;
    const wmul = p.carry ? p.carry.weight : 1;
    p.vx += ax * ACC * wmul * dt;
    p.vy += ay * ACC * wmul * dt;
    if (input.dash && p.dashCd <= 0) {
      p.dashCd = 1.4;
      p.vx += p.face * 230 * wmul;
      p.vy += ay * 120 * wmul;
      p.o2 = Math.max(0, p.o2 - 3);
      ev.push({ type: 'dash', x: p.x, y: p.y });
    }
    const dr = Math.exp(-DRAG * dt);
    p.vx *= dr; p.vy *= dr;
    p.x = clamp(p.x + p.vx * dt, 12, M.WORLD_W - 12);
    p.y += p.vy * dt;
    if (p.y < M.SURF) { p.y = M.SURF; if (p.vy < 0) p.vy = 0; }
    if (p.y > D - 12) { p.y = D - 12; if (p.vy > 0) p.vy = 0; }

    // ── 산소 ──
    if (p.y <= M.SURF + 4) {
      const before = p.o2;
      p.o2 = Math.min(O2MAX, p.o2 + 45 * dt);
      if (before < O2MAX && p.o2 >= O2MAX) { ev.push({ type: 'o2full' }); st.o2warned = false; }
    } else {
      p.o2 -= (1.1 + 0.9 * (p.y / D)) * dt;
    }
    if (p.o2 <= 25 && p.o2 > 0 && !st.o2warned) { st.o2warned = true; ev.push({ type: 'o2low' }); }

    // ── 발톱 ──
    if (input.atk && p.clawCd <= 0) {
      p.clawCd = CLAW_CD; p.clawT = 0.16;
      ev.push({ type: 'swing', x: p.x, y: p.y, face: p.face });
      const inArc = (t, big) => {
        const dx = (t.x - p.x) * p.face, dy = t.y - p.y;
        return dx >= CLAW_X0 && dx <= CLAW_X1 + (big ? 12 : 0) && Math.abs(dy) <= CLAW_Y + (big ? 10 : 0);
      };
      for (const f of st.fish) {
        if (f.dead || f.iv > 0 || !inArc(f)) continue;
        f.hp--; f.iv = 0.3; f.fleeT = 1.0;
        f.vx = p.face * 130; f.dir = p.face;
        ev.push({ type: 'hit', x: f.x, y: f.y });
        if (f.hp <= 0) {
          const F = M.FISH[f.type];
          f.dead = true; f.deadT = 0; f.vx *= 0.4; f.vy = -6;
          if (F.nocorpse) { f.gone = true; ev.push({ type: 'dissolve', x: f.x, y: f.y }); }
          ev.push({ type: 'kill', name: F.name, x: f.x, y: f.y });
        }
      }
      const b = st.boss;
      if (b && !b.dead && inArc(b, true)) {
        b.hp--;
        ev.push({ type: 'bosshit', x: b.x, y: b.y });
        if (b.hp <= 0) { b.dead = true; b.deadT = 0; ev.push({ type: 'bossdown', name: S.boss.name }); }
      }
    }

    // ── 시체 물기 ──
    if (!p.carry) {
      for (const f of st.fish) {
        if (!f.dead || f.gone) continue;
        if (Math.abs(f.x - p.x) < GRAB_R && Math.abs(f.y - p.y) < GRAB_R) {
          const F = M.FISH[f.type];
          p.carry = { type: f.type, name: F.name, score: F.score, weight: F.weight || 0.95 };
          f.gone = true;
          ev.push({ type: 'grab', name: F.name });
          break;
        }
      }
    }

    // ── 보트 하역 ──
    if (p.carry && Math.abs(p.x - M.BOAT_X) < DEPOSIT_R && p.y <= M.SURF + 26) {
      st.delivered++;
      st.score += p.carry.score;
      ev.push({ type: 'deposit', name: p.carry.name, score: p.carry.score, n: st.delivered, need: S.quota });
      p.carry = null;
      if (st.delivered >= S.quota && !st.bossSpawned && st.bossIntroT < 0) {
        st.bossIntroT = 1.6;
        ev.push({ type: 'quota' });
      }
    }

    // ── 어군 ──
    for (const f of st.fish) {
      if (f.gone) continue;
      if (f.iv > 0) f.iv -= dt;
      const F = M.FISH[f.type];
      if (f.dead) {
        // 시체: 천천히 떠오름 — 물어 갈 수 있음
        f.deadT += dt;
        f.vx *= Math.exp(-2 * dt);
        f.vy += (-12 - f.vy) * Math.min(1, 3 * dt);
        f.x += f.vx * dt; f.y += f.vy * dt;
        if (f.y < M.SURF + 6) { f.y = M.SURF + 6; f.vy = 0; }
        if (f.deadT > 25) f.gone = true;
        continue;
      }
      f.flipT -= dt;
      if (f.flipT <= 0) { f.flipT = st.rng.range(1.5, 4); if (st.rng.chance(0.5)) f.dir *= -1; }
      if (f.fleeT > 0) f.fleeT -= dt;
      const dxp = p.x - f.x, dyp = p.y - f.y, dp = Math.hypot(dxp, dyp);
      if (F.hazard) {
        f.x += f.dir * F.spd * 0.5 * dt;
        f.y += Math.sin(st.t * 1.3 + f.wob) * 10 * dt;
      } else if (F.aggro && f.fleeT <= 0 && dp < 150) {
        const s = F.spd;
        f.dir = dxp >= 0 ? 1 : -1;
        f.x += Math.sign(dxp) * s * dt;
        f.y += Math.sign(dyp) * s * 0.8 * dt;
      } else {
        // 배회 + 도주 (플레이어 접근 시)
        if (!F.aggro && dp < 70 && f.fleeT <= 0.5) { f.fleeT = 0.8; f.dir = f.x >= p.x ? 1 : -1; }
        const s = F.spd * (f.fleeT > 0 ? 1.7 : 0.5);
        f.x += f.dir * s * dt;
        f.y += Math.sin(st.t * 2 + f.wob) * 12 * dt;
      }
      if (f.x < 8) { f.x = 8; f.dir = 1; }
      if (f.x > M.WORLD_W - 8) { f.x = M.WORLD_W - 8; f.dir = -1; }
      f.y = clamp(f.y, M.SURF + 16, D - 14);
      // 접촉 피해 (해파리·공격어)
      const cdmg = F.hazard ? F.dmg : (F.aggro ? F.dmg : 0);
      if (cdmg && p.iv <= 0 && dp < F.w * 0.6 + 9) {
        p.o2 = Math.max(0, p.o2 - cdmg);
        p.iv = 1.0;
        p.vx += Math.sign(p.x - f.x || 1) * 160;
        p.vy += Math.sign(p.y - f.y || -1) * 120;
        if (F.aggro) { f.fleeT = 1.2; f.dir = f.x >= p.x ? 1 : -1; }
        ev.push({ type: 'hurt', dmg: cdmg });
      }
    }
    st.fish = st.fish.filter((f) => !f.gone);

    // ── 어군 재보충 (보스 등장 전) ──
    if (!st.bossSpawned) {
      st.spawnT -= dt;
      if (st.spawnT <= 0) {
        st.spawnT = 1.2;
        const alive = st.fish.filter((f) => !f.dead && !M.FISH[f.type].hazard).length;
        if (alive < 8 + st.no) this._spawnFish(st, false);
        const jn = st.fish.filter((f) => !f.dead && M.FISH[f.type].hazard).length;
        if (jn < S.jellyN) this._spawnJelly(st);
      }
    }

    // ── 보스 등장 ──
    if (st.bossIntroT > 0) {
      st.bossIntroT -= dt;
      if (st.bossIntroT <= 0) {
        this._spawnBoss(st);
        ev.push({ type: 'bossintro', name: S.boss.name });
      }
    }

    // ── 보스 AI ──
    const b = st.boss;
    if (b && !b.dead) {
      b.stT += dt;
      const ph2 = b.hp < b.maxHp * 0.5;
      const sm = ph2 ? 1.25 : 1, cm = ph2 ? 0.6 : 1;
      const dx = p.x - b.x, dy = p.y - b.y, dp = Math.hypot(dx, dy);
      b.atkCd -= dt;
      if (b.state === 'wander') {
        b.face = dx >= 0 ? 1 : -1;
        const want = b.base === 'ink' ? (dp < 130 ? -1 : (dp > 210 ? 1 : 0)) : (dp > 90 ? 1 : 0);
        b.x += Math.sign(dx) * want * b.spd * 0.45 * sm * dt;
        b.y += (Math.sign(dy) * b.spd * 0.35 * sm + Math.sin(st.t * 1.6) * 14) * dt;
        if (b.atkCd <= 0) {
          b.state = 'tele'; b.stT = 0; b.aimX = p.x; b.aimY = p.y;
          ev.push({ type: 'bosstele', base: b.base });
        }
      } else if (b.state === 'tele') {
        const dur = b.base === 'zap' ? 0.7 : (b.base === 'spikes' ? 0.55 : 0.5);
        if (b.stT >= dur) {
          b.stT = 0;
          const doCharge = b.base === 'charge' || (b.base === 'kraken' && b.alt);
          if (doCharge) {
            b.state = 'dash';
            const d = Math.hypot(b.aimX - b.x, b.aimY - b.y) || 1;
            b.vx = (b.aimX - b.x) / d * b.spd * 3 * sm;
            b.vy = (b.aimY - b.y) / d * b.spd * 3 * sm;
            ev.push({ type: 'bossdash' });
          } else if (b.base === 'spikes' || b.base === 'kraken') {
            const n = ph2 ? 12 : 8;
            for (let i = 0; i < n; i++) {
              const a = (i / n) * Math.PI * 2;
              st.shots.push({ x: b.x, y: b.y, vx: Math.cos(a) * 130, vy: Math.sin(a) * 130, ttl: 2.4, dmg: Math.max(6, b.dmg - 3), kind: 'spike' });
            }
            ev.push({ type: 'spikes', x: b.x, y: b.y });
            b.state = 'wander'; b.atkCd = 2.4 * cm;
          } else if (b.base === 'zap') {
            const R = ph2 ? 92 : 72;
            if (p.iv <= 0 && dp < R) {
              p.o2 = Math.max(0, p.o2 - b.dmg);
              p.iv = 1.1;
              p.vx += Math.sign(p.x - b.x || 1) * 200;
              ev.push({ type: 'hurt', dmg: b.dmg });
            }
            ev.push({ type: 'zap', r: R, x: b.x, y: b.y });
            b.state = 'wander'; b.atkCd = 2.6 * cm;
          } else if (b.base === 'ink') {
            const d = Math.hypot(p.x - b.x, p.y - b.y) || 1;
            st.shots.push({ x: b.x, y: b.y, vx: (p.x - b.x) / d * 115, vy: (p.y - b.y) / d * 115, ttl: 3.2, dmg: Math.max(6, b.dmg - 2), kind: 'ink' });
            ev.push({ type: 'ink', x: b.x, y: b.y });
            b.state = 'wander'; b.atkCd = 2.0 * cm;
          }
          if (b.base === 'kraken') b.alt = !b.alt;
        }
      } else if (b.state === 'dash') {
        b.x += b.vx * dt; b.y += b.vy * dt;
        if (b.stT > 0.6) {
          b.state = 'wander'; b.vx = 0; b.vy = 0;
          b.atkCd = (b.base === 'kraken' ? 2.0 : 2.2) * cm;
        }
      }
      b.x = clamp(b.x, 16, M.WORLD_W - 16);
      b.y = clamp(b.y, M.SURF + 30, D - 16);
      // 보스 접촉
      if (p.iv <= 0 && dp < b.w * 0.5 + 10) {
        p.o2 = Math.max(0, p.o2 - b.dmg);
        p.iv = 1.1;
        p.vx += Math.sign(p.x - b.x || 1) * 200;
        p.vy += Math.sign(p.y - b.y || -1) * 150;
        ev.push({ type: 'hurt', dmg: b.dmg });
      }
    } else if (b && b.dead) {
      b.deadT += dt;
      b.y = Math.min(D - 20, b.y + 10 * dt);
      if (b.deadT > 1.3 && st.phase === 'play') {
        st.stars = st.deaths === 0 ? 3 : (st.deaths <= 1 ? 2 : 1);
        st.score += 3000;
        st.phase = 'clear'; st.clearT = 0;
        ev.push({ type: 'clear', stars: st.stars, no: st.no });
      }
    }

    // ── 투사체 (가시·먹물) ──
    for (const sh of st.shots) {
      sh.ttl -= dt;
      sh.x += sh.vx * dt; sh.y += sh.vy * dt;
      if (sh.y < M.SURF + 4 || sh.y > D - 6) sh.ttl = 0;
      if (sh.ttl > 0 && p.iv <= 0 && Math.hypot(p.x - sh.x, p.y - sh.y) < 11) {
        sh.ttl = 0;
        p.o2 = Math.max(0, p.o2 - sh.dmg);
        p.iv = 1.0;
        ev.push({ type: 'hurt', dmg: sh.dmg });
      }
    }
    st.shots = st.shots.filter((s) => s.ttl > 0);

    // ── 기절 (산소 고갈) — 물고 있던 물고기만 잃고 보트에서 재개 ──
    if (p.o2 <= 0) {
      st.deaths++;
      const lost = p.carry;
      p.carry = null;
      p.x = M.BOAT_X; p.y = M.SURF + 6; p.vx = 0; p.vy = 0;
      p.o2 = O2MAX; p.iv = 2.5;
      st.o2warned = false;
      ev.push({ type: 'faint', lost: lost ? lost.name : null });
    }

    return ev;
  },
};

}

{
// render.js — 캔버스 렌더: 물속 배경·어군·모구 다이버·보스·HUD
const M = window.MDV;

const lerp = (a, b, t) => a + (b - a) * t;
const hex = (c) => [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];
const mix = (c0, c1, t) => {
  const a = hex(c0), b = hex(c1);
  return `rgb(${Math.round(lerp(a[0], b[0], t))},${Math.round(lerp(a[1], b[1], t))},${Math.round(lerp(a[2], b[2], t))})`;
};

M.Render = {
  cv: null, ctx: null, camX: 0, camY: 0, fx: [], bub: [],

  init(cv) {
    this.cv = cv;
    this.ctx = cv.getContext('2d');
    this.fx = []; this.bub = [];
    for (let i = 0; i < 26; i++) {
      this.bub.push({ x: Math.random() * M.WORLD_W, y: Math.random() * 900, r: 0.8 + Math.random() * 1.8, s: 8 + Math.random() * 16 });
    }
    // CC0 에셋 (ansimuz "Underwater Diving Pack"): 원경 타일·암초 미드그라운드·해저 소품
    this.imgs = {};
    for (const k of ['uwdBg', 'uwdMid', 'uwdProps']) {
      if (!M.ASSETS[k]) continue;
      const im2 = new Image();
      im2.onload = () => {
        this.imgs[k] = im2;
        if (k === 'uwdMid') {
          // 상단 페이드 마스크 (이미지 직사각 경계가 수평선으로 잘려 보이는 것 방지)
          const topFade = (cv2) => {
            const c3 = cv2.getContext('2d');
            c3.globalCompositeOperation = 'destination-out';
            const g2 = c3.createLinearGradient(0, 0, 0, 90);
            g2.addColorStop(0, 'rgba(0,0,0,1)');
            g2.addColorStop(1, 'rgba(0,0,0,0)');
            c3.fillStyle = g2;
            c3.fillRect(0, 0, cv2.width, 90);
            c3.globalCompositeOperation = 'source-over';
          };
          // 원거리 실루엣 층 (형상만 남기고 짙은 남색 채움)
          const oc = document.createElement('canvas');
          oc.width = im2.width; oc.height = im2.height;
          const c2 = oc.getContext('2d');
          c2.drawImage(im2, 0, 0);
          c2.globalCompositeOperation = 'source-in';
          c2.fillStyle = '#081426';
          c2.fillRect(0, 0, oc.width, oc.height);
          topFade(oc);
          this.midSil = oc;
          // 근거리 실채색 층 (같은 페이드 적용본)
          const oc2 = document.createElement('canvas');
          oc2.width = im2.width; oc2.height = im2.height;
          oc2.getContext('2d').drawImage(im2, 0, 0);
          topFade(oc2);
          this.midFade = oc2;
        }

      im2.src = M.ASSETS[k];
    }

    window.addEventListener('resize', () => this.resize());
  },

  // 소품 시트 소스 좌표 (알파 바운딩 자동 측정값)
  PROPS: {
    log:       [49, 95, 85, 98],
    arch:      [177, 34, 198, 205],
    totem:     [432, 41, 92, 219],
    totemMoss: [596, 41, 120, 219],
    ruins:     [752, 70, 245, 186],
    coralSm:   [434, 260, 128, 123],
    seaweed:   [614, 260, 82, 124],
  },
  drawProp(name, X, Y, sc) {
    // Y = 소품 밑변(바닥 접점) 화면 좌표

    const [px, py, pw, ph] = this.PROPS[name];
    const c = this.ctx;
    c.imageSmoothingEnabled = false;
    c.drawImage(im2, px, py, pw, ph, X - pw * sc / 2, Y - ph * sc, pw * sc, ph * sc);
    c.imageSmoothingEnabled = true;
    return true;
  },

  resize() {
    const W = M.W, H = M.H;
    let s = Math.min(window.innerWidth / W, window.innerHeight / H);
    s = s >= 2 ? Math.floor(s) : Math.max(0.6, s * 0.97);

    this.cv.style.height = H * s + 'px';
    const res = Math.min(4, Math.max(1, s * (window.devicePixelRatio || 1)));
    this.cv.width = Math.round(W * res);
    this.cv.height = Math.round(H * res);
    this.ctx.setTransform(res, 0, 0, res, 0, 0);
    this.ctx.imageSmoothingQuality = 'high';
  },

  addSpark(x, y) { for (let i = 0; i < 5; i++) this.fx.push({ kind: 'spark', x, y, vx: (Math.random() - 0.5) * 90, vy: (Math.random() - 0.5) * 90, t: 0.28 }); },
  addPuff(x, y, color) { for (let i = 0; i < 7; i++) this.fx.push({ kind: 'puff', x, y, vx: (Math.random() - 0.5) * 50, vy: -20 - Math.random() * 30, t: 0.6, color }); },
  addFloat(x, y, text, color) { this.fx.push({ kind: 'float', x, y, vx: 0, vy: -26, t: 1.0, text, color }); },
  addRing(x, y, r, color) { this.fx.push({ kind: 'ring', x, y, r, t: 0.35, color }); },
  addBubbles(x, y, n) { for (let i = 0; i < n; i++) this.fx.push({ kind: 'bubble', x: x + (Math.random() - 0.5) * 10, y, vx: (Math.random() - 0.5) * 16, vy: -30 - Math.random() * 25, t: 0.9 }); },

  draw(st, t, dt) {
    const c = this.ctx, W = M.W, H = M.H;
    const S = st.stage, D = S.depth, p = st.p;
    // 카메라
    this.camX = Math.max(0, Math.min(M.WORLD_W - W, p.x - W / 2));
    this.camY = Math.max(-40, Math.min(D - H + 24, p.y - H * 0.45));
    const cx = this.camX, cy = this.camY;
    const sx = (x) => x - cx, sy = (y) => y - cy;

    // ── 하늘 + 물 ──
    const th = S.theme;
    if (cy < M.SURF) {
      c.fillStyle = '#cfe8fa';
      c.fillRect(0, 0, W, sy(M.SURF));
      c.fillStyle = '#ffe9a0';
      c.beginPath(); c.arc(sx(cx + W - 70), sy(cy) + 26, 16, 0, Math.PI * 2); c.fill();
    }
    const t0 = Math.max(0, cy) / D, t1 = Math.min(1, (cy + H) / D);
    const g = c.createLinearGradient(0, Math.max(0, sy(M.SURF)), 0, H);
    g.addColorStop(0, mix(th.w0, th.deep, t0));
    g.addColorStop(1, mix(th.w0, th.deep, t1));
    c.fillStyle = g;
    c.fillRect(0, Math.max(0, sy(M.SURF)), W, H);

    if (cy < M.SURF + 10) {
      c.strokeStyle = 'rgba(255,255,255,.75)'; c.lineWidth = 1.6;
      c.beginPath();
      for (let x = 0; x <= W; x += 8) c.lineTo(x, sy(M.SURF) + Math.sin((x + cx) * 0.06 + t * 2.2) * 1.6);
      c.stroke();
    }
    // 빛줄기 (얕은 곳 — 물결 따라 흔들림)
    if (cy < 190) {
      c.save();
      c.globalAlpha = Math.max(0, 0.2 - cy / 900);
      c.fillStyle = '#ffffff';
      for (let i = 0; i < 4; i++) {
        const swy = Math.sin(t * 0.4 + i * 1.7) * 10;
        const bx = ((i * 260 + 80 - cx * 0.6) % (W + 200)) - 100;
        c.beginPath();
        c.moveTo(bx, sy(M.SURF)); c.lineTo(bx + 34, sy(M.SURF));
        c.lineTo(bx + 90 + swy, H); c.lineTo(bx + 26 + swy, H);
        c.closePath(); c.fill();
      }
      c.restore();
    }

    // ── 원경 암초 층 (CC0 미드그라운드 — 실루엣 원거리 + 실채색 근거리) ──
    // 형상은 팩 아트, 깊이감은 기존 2겹 패럴랙스 문법 유지
    if (this.imgs && this.imgs.uwdMid) {
      c.imageSmoothingEnabled = false;
      if (cy < M.SURF + 30) {            // 아주 얕은 곳: 원경 타일 띠
        const bg = this.imgs.uwdBg;
        if (bg) {
          c.save(); c.globalAlpha = 0.3;
          const bw = bg.width, off = ((cx * 0.12) % bw + bw) % bw;
          for (let x = -off; x < W; x += bw) c.drawImage(bg, x, sy(M.SURF) + 6, bw, bg.height);
          c.restore();
        }
      }
      for (const L2 of [{ img: this.midSil, pf: 0.3, a: 0.5, sc: 0.72 },
                        { img: this.midFade || this.imgs.uwdMid, pf: 0.55, a: 0.85, sc: 0.6 }]) {
        if (!L2.img) continue;
        const iw = L2.img.width * L2.sc, ih = L2.img.height * L2.sc;
        const yb = sy(D + 8);
        if (yb - ih > H + 20 || yb < -20) continue;
        const off = ((cx * L2.pf) % iw + iw) % iw;
        c.save(); c.globalAlpha = L2.a;
        for (let x = -off; x < W + iw; x += iw) c.drawImage(L2.img, x, yb - ih, iw, ih);
        c.restore();
      }
      c.imageSmoothingEnabled = true;
    } else {
      // 이미지 미로드 폴백: 기존 실루엣 기둥
      for (const L2 of [{ pf: 0.3, a: 0.22 }, { pf: 0.55, a: 0.38 }]) {
        const gx = cx * L2.pf;
        c.fillStyle = `rgba(5,16,32,${L2.a})`;
        for (let i = -1; i < 8; i++) {
          const seg = Math.floor(gx / 150) + i;
          const h2 = (seg * 2654435761) >>> 7;
          const x = seg * 150 - gx + (h2 % 60);
          const wdt = 26 + (h2 % 36);
          const hgt = 80 + (h2 % 240);
          const yb = sy(D - 6);
          if (yb - hgt > H + 20 || yb < -20) continue;
          c.beginPath();
          c.moveTo(x - wdt / 2, yb);
          c.quadraticCurveTo(x - wdt / 2 + 5, yb - hgt, x + Math.sin(seg) * 5, yb - hgt - 10);
          c.quadraticCurveTo(x + wdt / 2 - 5, yb - hgt, x + wdt / 2, yb);
          c.closePath(); c.fill();
        }
      }
    }

    // ── 원경 물고기 떼 실루엣 (비상호작용) ──
    c.fillStyle = 'rgba(8,22,40,.4)';
    for (let s2 = 0; s2 < 3; s2++) {
      const dir = s2 % 2 ? 1 : -1;
      const wx = (((s2 * 430 + t * 16 * dir) % (M.WORLD_W + 240)) + M.WORLD_W + 240) % (M.WORLD_W + 240) - 120;
      const wy = M.SURF + 80 + ((s2 * 217) % Math.max(120, D - 220));
      const X0 = wx - cx * 0.5, Y0 = sy(wy);
      if (X0 < -80 || X0 > W + 80 || Y0 < -40 || Y0 > H + 40) continue;
      for (let k = 0; k < 9; k++) {
        const fx2 = X0 + (k % 3) * 13 + Math.floor(k / 3) * 11;
        const fy2 = Y0 + (k % 3) * 7 - Math.floor(k / 3) * 5 + Math.sin(t * 3 + k) * 2;
        c.beginPath();
        c.ellipse(fx2, fy2, 3.4, 1.6, 0, 0, Math.PI * 2);
        c.moveTo(fx2 - dir * 3, fy2);
        c.lineTo(fx2 - dir * 6, fy2 - 2); c.lineTo(fx2 - dir * 6, fy2 + 2);
        c.closePath(); c.fill();
      }
    }

    // ── 배경 장식 (시드 고정) ──
    const rng = M.makeRng(st.no * 991 + 5);
    for (let i = 0; i < 26; i++) {
      const dx0 = rng.range(20, M.WORLD_W - 20), dy0 = rng.range(M.SURF + 80, D - 26), kind = rng.int(0, 2), sc = rng.range(0.7, 1.5);
      const X = sx(dx0), Y = sy(dy0);
      if (X < -40 || X > W + 40 || Y < -40 || Y > H + 40) continue;
      c.save(); c.globalAlpha = 0.62;
      if (kind === 0) {           // 산호 덤불 (CC0 소품)
        if (!this.drawProp('coralSm', X, Y + 4, 0.22 * sc)) {
          c.fillStyle = 'rgba(20,40,60,.8)';
          c.beginPath(); c.ellipse(X, Y, 12 * sc, 7 * sc, 0, 0, Math.PI * 2); c.fill();
        }
      } else if (kind === 1) {    // 해초 (프로시저럴 — 물결 애니메이션 유지)
        c.strokeStyle = th.accent; c.lineWidth = 2 * sc;
        c.beginPath();
        for (let k = 0; k <= 4; k++) c.lineTo(X + Math.sin(t * 1.4 + i + k) * 3, Y - k * 7 * sc);
        c.stroke();
      } else {                    // 해초 다발 (CC0 소품)
        if (!this.drawProp('seaweed', X, Y + 4, 0.26 * sc)) {
          c.fillStyle = th.accent;
          c.fillRect(X - 3 * sc, Y - 8 * sc, 6 * sc, 8 * sc);
          c.fillRect(X - 8 * sc, Y - 4 * sc, 5 * sc, 4 * sc);
        }
      }
      c.restore();
    }

    // ── 바닥 ──
    if (sy(D) < H + 30) {
      c.fillStyle = th.sand;
      c.beginPath();
      c.moveTo(0, H);
      for (let x = 0; x <= W; x += 16) c.lineTo(x, sy(D - 10) + Math.sin((x + cx) * 0.05) * 4);
      c.lineTo(W, H);
      c.closePath(); c.fill();
      // 커스틱 (얕은 바다 — 일렁이는 빛 그물)
      if (st.no <= 3) {
        c.strokeStyle = 'rgba(255,255,255,.14)';
        c.lineWidth = 1.2;
        for (let i = 0; i < 7; i++) {
          const x = ((i * 90 - cx) % (W + 80) + W + 80) % (W + 80) - 40;
          const ph = t * 1.6 + i * 1.3;
          c.beginPath();
          c.ellipse(x + Math.sin(ph) * 8, sy(D - 8) + (i % 3), 16 + Math.sin(ph * 1.3) * 5, 3.4, 0, 0, Math.PI * 2);
          c.stroke();
        }
      }
    }

    // ── 해저 대형 소품 (CC0 — 고대 토템·유적·산호 아치, 스테이지 시드 고정) ──
    if (sy(D) < H + 260 && this.imgs && this.imgs.uwdProps) {
      const rng2 = M.makeRng(st.no * 77 + 3);
      const kinds = ['totemMoss', 'ruins', 'arch', 'totem', 'log'];
      for (let i = 0; i < 3; i++) {
        const wx = rng2.range(90, M.WORLD_W - 90);
        const name = kinds[(st.no + i * 2) % kinds.length];
        const sc = rng2.range(0.5, 0.75);
        const X = sx(wx), Y = sy(D + 4);
        if (X < -160 || X > W + 160) continue;
        c.save(); c.globalAlpha = 0.92;
        this.drawProp(name, X, Y, sc);
        c.restore();
      }
    }

    // ── 보트 (하역 지점) ──
    if (cy < M.SURF + 40) {
      const bx = sx(M.BOAT_X), by = sy(M.SURF);
      c.fillStyle = '#8a5a30';
      c.beginPath();
      c.moveTo(bx - 42, by - 4); c.lineTo(bx + 42, by - 4);
      c.lineTo(bx + 30, by + 12); c.lineTo(bx - 30, by + 12);
      c.closePath(); c.fill();
      c.fillStyle = '#b07a48'; c.fillRect(bx - 42, by - 8, 84, 5);
      c.fillStyle = '#d8b880'; c.fillRect(bx - 14, by - 20, 26, 13);      // 바구니
      c.strokeStyle = '#8a6a40'; c.lineWidth = 1.2; c.strokeRect(bx - 14, by - 20, 26, 13);
      c.fillStyle = '#ff5a5a';
      c.beginPath(); c.moveTo(bx - 36, by - 30); c.lineTo(bx - 22, by - 25); c.lineTo(bx - 36, by - 20); c.closePath(); c.fill();
      c.strokeStyle = '#6a4a28'; c.beginPath(); c.moveTo(bx - 36, by - 30); c.lineTo(bx - 36, by - 8); c.stroke();
      if (p.carry) {              // 하역 유도 화살표
        c.fillStyle = 'rgba(255,216,61,' + (0.5 + 0.4 * Math.sin(t * 5)) + ')';
        c.beginPath(); c.moveTo(bx, by + 20); c.lineTo(bx - 7, by + 30); c.lineTo(bx + 7, by + 30); c.closePath(); c.fill();
      }
    }

    // ── 배경 기포 ──
    c.fillStyle = 'rgba(255,255,255,.35)';
    for (const b of this.bub) {
      b.y -= b.s * dt;
      if (b.y < M.SURF) { b.y = D - 10; b.x = Math.random() * M.WORLD_W; }
      const X = sx(b.x), Y = sy(b.y);
      if (X < -8 || X > W + 8 || Y < -8 || Y > H + 8) continue;
      c.beginPath(); c.arc(X, Y, b.r, 0, Math.PI * 2); c.fill();
    }
    // ── 마린 스노우 (부유 입자) ──
    c.fillStyle = 'rgba(215,232,250,.28)';
    for (let i = 0; i < 26; i++) {
      const x = ((i * 191 - cx * 0.85) % (W + 20) + W + 20) % (W + 20) - 10;
      const y = ((i * 127 + t * 8 - cy * 0.85) % (H + 20) + H + 20) % (H + 20) - 10;
      c.fillRect(x + Math.sin(t * 0.9 + i) * 4, y, 1.4, 1.4);
    }

    // ── 어군 ──
    for (const f of st.fish) this.drawFish(c, st, f, sx(f.x), sy(f.y), t);

    // ── 보스 ──
    if (st.boss) this.drawBoss(c, st, st.boss, sx(st.boss.x), sy(st.boss.y), t);

    // ── 투사체 ──
    for (const sh of st.shots) {
      const X = sx(sh.x), Y = sy(sh.y);
      if (sh.kind === 'spike') {
        c.save(); c.translate(X, Y); c.rotate(Math.atan2(sh.vy, sh.vx));
        c.fillStyle = '#f0e8c0';
        c.beginPath(); c.moveTo(6, 0); c.lineTo(-4, -3); c.lineTo(-4, 3); c.closePath(); c.fill();
        c.restore();
      } else {
        c.fillStyle = st.stage.boss.shot || '#2a2038';
        c.beginPath(); c.arc(X, Y, 5, 0, Math.PI * 2); c.fill();
        c.fillStyle = 'rgba(42,32,56,.35)';
        c.beginPath(); c.arc(X - sh.vx * 0.04, Y - sh.vy * 0.04, 3.4, 0, Math.PI * 2); c.fill();
      }
    }

    // ── 플레이어 (모구 다이버) ──
    this.drawCat(c, st, sx(p.x), sy(p.y), t);

    // ── FX ──
    for (const f of this.fx) {
      f.t -= dt; f.x += (f.vx || 0) * dt; f.y += (f.vy || 0) * dt;
      const X = sx(f.x), Y = sy(f.y), a = Math.max(0, f.t / 0.4);
      if (f.kind === 'spark') {
        c.fillStyle = `rgba(255,240,180,${Math.min(1, a)})`;
        c.fillRect(X - 1.5, Y - 1.5, 3, 3);
      } else if (f.kind === 'puff') {
        c.fillStyle = f.color || 'rgba(200,220,255,.5)';
        c.globalAlpha = Math.min(1, f.t / 0.6);
        c.beginPath(); c.arc(X, Y, 3 + (0.6 - f.t) * 8, 0, Math.PI * 2); c.fill();
        c.globalAlpha = 1;
      } else if (f.kind === 'float') {
        c.font = 'bold 10px sans-serif'; c.textAlign = 'center';
        c.globalAlpha = Math.min(1, f.t);
        c.strokeStyle = 'rgba(0,0,0,.6)'; c.lineWidth = 2.5; c.strokeText(f.text, X, Y);
        c.fillStyle = f.color || '#ffd83d'; c.fillText(f.text, X, Y);
        c.globalAlpha = 1;
      } else if (f.kind === 'ring') {
        c.strokeStyle = f.color || 'rgba(255,255,255,.8)';
        c.globalAlpha = Math.min(1, f.t / 0.35);
        c.lineWidth = 2;
        c.beginPath(); c.arc(X, Y, f.r * (1 - f.t / 0.35 * 0.4 + 0.6), 0, Math.PI * 2); c.stroke();
        c.globalAlpha = 1;
      } else if (f.kind === 'bubble') {
        c.fillStyle = `rgba(220,240,255,${Math.min(1, f.t)})`;
        c.beginPath(); c.arc(X, Y, 1.6, 0, Math.PI * 2); c.fill();
      }
    }
    this.fx = this.fx.filter((f) => f.t > 0);

    // 심도 어둠 (깊을수록) + 심해 랜턴 글로우
    const dark = Math.max(0, Math.min(0.5, (p.y / D - 0.35) * 0.75)) * (st.no >= 4 ? 1.25 : 1);
    if (dark > 0.02) {
      if (st.no >= 4) {
        const lg = c.createRadialGradient(sx(p.x), sy(p.y), 4, sx(p.x), sy(p.y), 85);
        lg.addColorStop(0, `rgba(255,222,150,${0.16 * dark / 0.5})`);
        lg.addColorStop(1, 'rgba(255,222,150,0)');
        c.fillStyle = lg;
        c.fillRect(sx(p.x) - 90, sy(p.y) - 90, 180, 180);
      }
      const vg = c.createRadialGradient(sx(p.x), sy(p.y), 60, sx(p.x), sy(p.y), 240);
      vg.addColorStop(0, 'rgba(0,0,10,0)');
      vg.addColorStop(1, `rgba(0,0,12,${dark})`);
      c.fillStyle = vg; c.fillRect(0, 0, W, H);
    }

    this.drawHud(c, st, t);
  },

  // ── 물고기 ──
  drawFish(c, st, f, X, Y, t) {
    if (X < -40 || X > M.W + 40 || Y < -40 || Y > M.H + 40) return;
    const F = M.FISH[f.type];
    const w = F.w, dir = f.dead ? 1 : f.dir;
    c.save();
    c.translate(X, Y);
    if (f.dead) { c.rotate(Math.PI); c.globalAlpha = 0.85; }
    c.scale(dir, 1);
    if (F.kind === 'jelly') {
      c.globalAlpha = 0.75;
      c.fillStyle = F.body;
      c.beginPath(); c.arc(0, 0, w * 0.55, Math.PI, 0); c.fill();
      c.strokeStyle = F.belly; c.lineWidth = 1.4;
      for (let i = -2; i <= 2; i++) {
        c.beginPath();
        c.moveTo(i * 3, 1);
        c.quadraticCurveTo(i * 3 + Math.sin(t * 3 + i) * 3, 7, i * 3 + Math.sin(t * 3 + i + 1) * 4, 13);
        c.stroke();
      }
    } else if (F.kind === 'squid') {
      c.fillStyle = F.body;
      c.beginPath(); c.moveTo(w * 0.7, 0); c.lineTo(-w * 0.1, -w * 0.32); c.lineTo(-w * 0.1, w * 0.32); c.closePath(); c.fill();
      c.strokeStyle = F.belly; c.lineWidth = 1.6;
      for (let i = -1; i <= 1; i++) {
        c.beginPath(); c.moveTo(-w * 0.08, i * 3); c.lineTo(-w * 0.55 - Math.sin(t * 5 + i) * 2, i * 4); c.stroke();
      }
      c.fillStyle = '#222'; c.beginPath(); c.arc(w * 0.24, -2, 1.6, 0, Math.PI * 2); c.fill();
    } else if (F.kind === 'ray') {
      c.fillStyle = F.body;
      c.beginPath();
      c.moveTo(w * 0.55, 0); c.quadraticCurveTo(0, -w * 0.5, -w * 0.4, 0); c.quadraticCurveTo(0, w * 0.5, w * 0.55, 0);
      c.closePath(); c.fill();
      c.strokeStyle = F.body; c.lineWidth = 1.6;
      c.beginPath(); c.moveTo(-w * 0.38, 0); c.lineTo(-w * 0.8, Math.sin(t * 4) * 3); c.stroke();
      c.fillStyle = '#222'; c.beginPath(); c.arc(w * 0.3, -2, 1.5, 0, Math.PI * 2); c.fill();
    } else {
      // 일반 어형 (상어 포함)
      const sh = F.kind === 'shark';
      c.fillStyle = F.body;
      c.beginPath(); c.ellipse(0, 0, w * 0.55, w * 0.3, 0, 0, Math.PI * 2); c.fill();
      c.fillStyle = F.belly;
      c.beginPath(); c.ellipse(w * 0.06, w * 0.1, w * 0.42, w * 0.17, 0, 0, Math.PI * 2); c.fill();
      c.fillStyle = F.body;
      const tw = Math.sin(t * 8 + f.wob) * 0.15;
      c.beginPath();
      c.moveTo(-w * 0.45, 0);
      c.lineTo(-w * 0.85, -w * (0.3 + tw));
      c.lineTo(-w * 0.85, w * (0.3 - tw));
      c.closePath(); c.fill();
      if (sh) {
        c.beginPath(); c.moveTo(-w * 0.05, -w * 0.26); c.lineTo(w * 0.12, -w * 0.55); c.lineTo(w * 0.22, -w * 0.24); c.closePath(); c.fill();
        c.fillStyle = '#fff';
        for (let i = 0; i < 3; i++) { c.beginPath(); c.moveTo(w * 0.2 + i * 4, w * 0.12); c.lineTo(w * 0.23 + i * 4, w * 0.22); c.lineTo(w * 0.26 + i * 4, w * 0.12); c.closePath(); c.fill(); }
      }
      if (F.stripes) {
        c.fillStyle = 'rgba(255,255,255,.65)';
        c.fillRect(-w * 0.12, -w * 0.26, w * 0.1, w * 0.52);
        c.fillRect(w * 0.14, -w * 0.24, w * 0.09, w * 0.48);
      }
      if (F.glow) {
        c.fillStyle = `rgba(255,230,120,${0.5 + 0.4 * Math.sin(t * 4 + f.wob)})`;
        c.beginPath(); c.arc(w * 0.62, -w * 0.3, 2.2, 0, Math.PI * 2); c.fill();
      }
      c.fillStyle = '#222';
      c.beginPath(); c.arc(w * 0.32, -w * 0.08, sh ? 2 : 1.6, 0, Math.PI * 2); c.fill();
    }
    if (f.dead) {                 // X자 눈
      c.strokeStyle = '#222'; c.lineWidth = 1.2;
      const ex = w * 0.32, ey = -w * 0.08;
      c.beginPath(); c.moveTo(ex - 2.4, ey - 2.4); c.lineTo(ex + 2.4, ey + 2.4);
      c.moveTo(ex + 2.4, ey - 2.4); c.lineTo(ex - 2.4, ey + 2.4); c.stroke();
    }
    c.restore();
  },

  // ── 보스 ──
  drawBoss(c, st, b, X, Y, t) {
    const B = st.stage.boss, w = b.w;
    c.save();
    c.translate(X, Y);
    if (b.dead) { c.rotate(Math.PI); c.globalAlpha = 0.8; }
    const tele = b.state === 'tele';
    if (tele && Math.floor(t * 12) % 2 === 0) c.globalAlpha = 0.65;
    c.scale(b.face || 1, 1);
    if (b.kind === 'puffer') {
      const puff = tele ? 1.25 : 1;
      c.fillStyle = B.body;
      c.beginPath(); c.arc(0, 0, w * 0.42 * puff, 0, Math.PI * 2); c.fill();
      c.fillStyle = B.belly;
      c.beginPath(); c.arc(0, w * 0.1, w * 0.3 * puff, 0, Math.PI); c.fill();
      c.strokeStyle = '#a08840'; c.lineWidth = 2;
      for (let i = 0; i < 10; i++) {
        const a = (i / 10) * Math.PI * 2;
        const r0 = w * 0.42 * puff, r1 = r0 + (tele ? 8 : 4);
        c.beginPath(); c.moveTo(Math.cos(a) * r0, Math.sin(a) * r0); c.lineTo(Math.cos(a) * r1, Math.sin(a) * r1); c.stroke();
      }
      c.fillStyle = '#222'; c.beginPath(); c.arc(w * 0.18, -w * 0.12, 3, 0, Math.PI * 2); c.fill();
    } else if (b.kind === 'eel') {
      c.strokeStyle = B.body; c.lineWidth = w * 0.28; c.lineCap = 'round';
      c.beginPath();
      for (let k = 0; k <= 6; k++) c.lineTo(-k * w * 0.16, Math.sin(t * 5 - k * 0.9) * w * 0.16);
      c.stroke();
      c.strokeStyle = B.belly; c.lineWidth = w * 0.1;
      c.beginPath();
      for (let k = 0; k <= 6; k++) c.lineTo(-k * w * 0.16, Math.sin(t * 5 - k * 0.9) * w * 0.16 + w * 0.05);
      c.stroke();
      if (tele) {
        c.strokeStyle = `rgba(255,255,120,${0.5 + 0.5 * Math.sin(t * 20)})`;
        c.lineWidth = 2;
        for (let i = 0; i < 5; i++) {
          const a = t * 10 + i * 1.3;
          c.beginPath(); c.moveTo(Math.cos(a) * w * 0.3, Math.sin(a) * w * 0.3); c.lineTo(Math.cos(a) * w * 0.5, Math.sin(a) * w * 0.5); c.stroke();
        }
      }
      c.fillStyle = '#fff'; c.beginPath(); c.arc(w * 0.06, -w * 0.06, 3.4, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#222'; c.beginPath(); c.arc(w * 0.08, -w * 0.06, 1.8, 0, Math.PI * 2); c.fill();
    } else if (b.kind === 'angler') {
      c.fillStyle = B.body;
      c.beginPath(); c.ellipse(0, 0, w * 0.5, w * 0.34, 0, 0, Math.PI * 2); c.fill();
      c.fillStyle = B.belly;
      c.beginPath(); c.ellipse(0, w * 0.12, w * 0.4, w * 0.18, 0, 0, Math.PI * 2); c.fill();
      c.strokeStyle = B.body; c.lineWidth = 2.4;
      c.beginPath(); c.moveTo(w * 0.2, -w * 0.3); c.quadraticCurveTo(w * 0.45, -w * 0.62, w * 0.55, -w * 0.42); c.stroke();
      c.fillStyle = `rgba(255,230,120,${0.6 + 0.4 * Math.sin(t * 6)})`;
      c.beginPath(); c.arc(w * 0.55, -w * 0.42, 4, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#fff';
      for (let i = 0; i < 4; i++) { c.beginPath(); c.moveTo(w * 0.12 + i * 5, w * 0.16); c.lineTo(w * 0.15 + i * 5, w * 0.3); c.lineTo(w * 0.18 + i * 5, w * 0.16); c.closePath(); c.fill(); }
      c.fillStyle = '#ffd83d'; c.beginPath(); c.arc(w * 0.26, -w * 0.1, 2.6, 0, Math.PI * 2); c.fill();
    } else if (b.kind === 'squid') {
      c.fillStyle = B.body;
      c.beginPath(); c.moveTo(w * 0.62, 0); c.lineTo(-w * 0.05, -w * 0.34); c.lineTo(-w * 0.05, w * 0.34); c.closePath(); c.fill();
      c.strokeStyle = B.belly; c.lineWidth = 2.6;
      for (let i = -2; i <= 2; i++) {
        c.beginPath(); c.moveTo(-w * 0.02, i * 4); c.lineTo(-w * 0.55 - Math.sin(t * 4 + i) * 4, i * 6); c.stroke();
      }
      c.fillStyle = '#fff'; c.beginPath(); c.arc(w * 0.2, -3, 4, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#222'; c.beginPath(); c.arc(w * 0.22, -3, 2.2, 0, Math.PI * 2); c.fill();
    } else if (b.kind === 'shark') {
      c.fillStyle = B.body;
      c.beginPath(); c.ellipse(0, 0, w * 0.55, w * 0.26, 0, 0, Math.PI * 2); c.fill();
      c.fillStyle = B.belly;
      c.beginPath(); c.ellipse(w * 0.06, w * 0.09, w * 0.44, w * 0.14, 0, 0, Math.PI * 2); c.fill();
      c.fillStyle = B.body;
      c.beginPath(); c.moveTo(-w * 0.02, -w * 0.22); c.lineTo(w * 0.14, -w * 0.5); c.lineTo(w * 0.24, -w * 0.2); c.closePath(); c.fill();
      const tw = Math.sin(t * 7) * 0.12;
      c.beginPath(); c.moveTo(-w * 0.48, 0); c.lineTo(-w * 0.8, -w * (0.26 + tw)); c.lineTo(-w * 0.8, w * (0.26 - tw)); c.closePath(); c.fill();
      c.fillStyle = '#fff';
      for (let i = 0; i < 5; i++) { c.beginPath(); c.moveTo(w * 0.24 + i * 4.5, w * 0.1); c.lineTo(w * 0.27 + i * 4.5, w * 0.2); c.lineTo(w * 0.3 + i * 4.5, w * 0.1); c.closePath(); c.fill(); }
      c.fillStyle = '#222'; c.beginPath(); c.arc(w * 0.36, -w * 0.06, 2.4, 0, Math.PI * 2); c.fill();
    } else {
      // 크라켄
      c.fillStyle = B.body;
      c.beginPath(); c.arc(0, -w * 0.06, w * 0.4, Math.PI, 0); c.lineTo(w * 0.4, w * 0.14); c.lineTo(-w * 0.4, w * 0.14); c.closePath(); c.fill();
      c.strokeStyle = B.belly; c.lineWidth = 3;
      for (let i = -3; i <= 3; i++) {
        c.beginPath();
        c.moveTo(i * w * 0.1, w * 0.12);
        c.quadraticCurveTo(i * w * 0.14, w * 0.34, i * w * 0.12 + Math.sin(t * 3 + i) * 5, w * 0.5);
        c.stroke();

      c.fillStyle = `rgba(255,90,90,${0.7 + 0.3 * Math.sin(t * 5)})`;
      c.beginPath(); c.arc(-w * 0.13, -w * 0.1, 3.4, 0, Math.PI * 2); c.fill();

      c.beginPath(); c.arc(X, Y, (b.hp < b.maxHp * 0.5 ? 92 : 72), 0, Math.PI * 2); c.stroke();
    }
  },

  // ── 모구 다이버 ──
  drawCat(c, st, X, Y, t) {
    const p = st.p;
    if (p.iv > 0 && Math.floor(t * 14) % 2 === 0) return;   // 무적 깜빡임
    const spd = Math.hypot(p.vx, p.vy);
    const tilt = Math.max(-0.4, Math.min(0.4, p.vy * 0.004)) * p.face;
    c.save();
    c.translate(X, Y);
    c.rotate(tilt);
    c.scale(p.face, 1);
    // 꼬리
    c.strokeStyle = '#e8a23d'; c.lineWidth = 3.4; c.lineCap = 'round';
    c.beginPath();
    c.moveTo(-9, 2);
    c.quadraticCurveTo(-15, 2 + Math.sin(t * (4 + spd * 0.05)) * 4, -19, -2 + Math.sin(t * 5) * 4);
    c.stroke();
    // 몸통
    c.fillStyle = '#f4b64a';
    c.beginPath(); c.ellipse(0, 2, 10, 7.5, 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#fff3dc';
    c.beginPath(); c.ellipse(1, 5, 6.5, 4, 0, 0, Math.PI * 2); c.fill();
    // 산소통
    c.fillStyle = '#c8d8e8';

    c.strokeStyle = '#8aa0b8'; c.lineWidth = 1; c.strokeRect(-8, -8, 6, 11);
    // 뒷다리·앞다리 (물장구)
    c.strokeStyle = '#e8a23d'; c.lineWidth = 2.8;
    const kick = Math.sin(t * (6 + spd * 0.08)) * 3;
    c.beginPath(); c.moveTo(-5, 8); c.lineTo(-7, 12 + kick); c.stroke();
    c.beginPath(); c.moveTo(5, 8); c.lineTo(6, 12 - kick); c.stroke();
    // 머리
    c.fillStyle = '#f4b64a';
    c.beginPath(); c.arc(9, -4, 7.5, 0, Math.PI * 2); c.fill();
    // 귀
    c.beginPath(); c.moveTo(4, -9); c.lineTo(5.5, -15); c.lineTo(9, -10.5); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(11, -10.5); c.lineTo(14.5, -14.5); c.lineTo(15, -8.5); c.closePath(); c.fill();
    c.fillStyle = '#e88aa0';
    c.beginPath(); c.moveTo(5.4, -10.4); c.lineTo(6.1, -13.4); c.lineTo(8.2, -10.8); c.closePath(); c.fill();
    // 물안경
    c.fillStyle = 'rgba(140,220,255,.85)';
    c.beginPath(); c.ellipse(11, -5, 4.6, 3.6, 0, 0, Math.PI * 2); c.fill();
    c.strokeStyle = '#e05a3a'; c.lineWidth = 1.6;
    c.beginPath(); c.ellipse(11, -5, 4.6, 3.6, 0, 0, Math.PI * 2); c.stroke();
    c.beginPath(); c.moveTo(6.5, -6); c.lineTo(2, -7); c.stroke();
    c.fillStyle = '#222';
    c.beginPath(); c.arc(12, -5, 1.5, 0, Math.PI * 2); c.fill();
    // 입·수염
    c.strokeStyle = '#b07830'; c.lineWidth = 1;
    c.beginPath(); c.moveTo(14, -1); c.lineTo(17.5, -2); c.moveTo(14, 0); c.lineTo(17.5, 0.5); c.stroke();
    // 물고 있는 물고기
    if (p.carry) {
      const F = M.FISH[p.carry.type];
      c.save();
      c.translate(17, 1);
      c.rotate(0.3);
      c.scale(0.8, 0.8);
      c.fillStyle = F.body;
      c.beginPath(); c.ellipse(0, 0, F.w * 0.5, F.w * 0.28, 0, 0, Math.PI * 2); c.fill();
      c.beginPath(); c.moveTo(-F.w * 0.4, 0); c.lineTo(-F.w * 0.75, -F.w * 0.26); c.lineTo(-F.w * 0.75, F.w * 0.26); c.closePath(); c.fill();
      c.restore();
    }
    // 발톱 스윙
    if (p.clawT > 0) {
      c.strokeStyle = `rgba(255,255,255,${p.clawT / 0.16})`;
      c.lineWidth = 2.2; c.lineCap = 'round';
      for (let i = -1; i <= 1; i++) {
        c.beginPath();
        c.arc(14, -2 + i * 3.4, 13 + i * 2, -0.7, 0.7);
        c.stroke();
      }
    }
    c.restore();
  },

  // ── HUD ──
  drawHud(c, st, t) {
    const W = M.W, p = st.p, S = st.stage;
    // 산소 바
    const o2r = p.o2 / M.Logic.O2MAX;
    c.fillStyle = 'rgba(0,0,0,.45)';
    c.fillRect(10, 10, 130, 13);
    c.fillStyle = o2r < 0.25 ? (Math.floor(t * 6) % 2 ? '#ff5a5a' : '#ff9a5a') : '#4ac8f0';
    c.fillRect(11, 11, 128 * Math.max(0, o2r), 11);
    c.strokeStyle = 'rgba(255,255,255,.8)'; c.lineWidth = 1;
    c.strokeRect(10, 10, 130, 13);
    c.font = 'bold 9px sans-serif'; c.textAlign = 'left'; c.fillStyle = '#fff';
    c.fillText('O₂', 14, 20);
    // 물고 있는 것
    if (p.carry) {
      c.fillStyle = 'rgba(0,0,0,.4)';
      c.fillRect(10, 27, 90, 13);
      c.fillStyle = '#ffd83d';
      c.fillText('물고 있음: ' + p.carry.name, 14, 37);
    }
    // 할당량
    c.textAlign = 'right'; c.fillStyle = '#fff';
    c.font = 'bold 11px sans-serif';
    const bossUp = !!st.boss && !st.boss.dead;
    if (!bossUp) {
      c.strokeStyle = 'rgba(0,0,0,.6)'; c.lineWidth = 3;
      const qtext = `🐟 ${Math.min(st.delivered, S.quota)}/${S.quota}`;
      c.strokeText(qtext, W - 12, 21);
      c.fillText(qtext, W - 12, 21);
    } else {
      // 보스 바
      const b = st.boss;
      c.fillStyle = 'rgba(0,0,0,.5)';
      c.fillRect(W - 166, 10, 156, 12);
      c.fillStyle = b.hp < b.maxHp * 0.5 ? '#ff8a3d' : '#ff5a5a';
      c.fillRect(W - 165, 11, 154 * Math.max(0, b.hp / b.maxHp), 10);
      c.strokeStyle = 'rgba(255,255,255,.7)'; c.lineWidth = 1;
      c.strokeRect(W - 166, 10, 156, 12);
      c.font = 'bold 9px sans-serif'; c.fillStyle = '#fff';
      c.fillText('👑 ' + S.boss.name, W - 12, 32);
    }
    // 스테이지 라벨
    c.font = 'bold 11px sans-serif'; c.textAlign = 'center';
    c.strokeStyle = 'rgba(0,0,0,.6)'; c.lineWidth = 3;
    c.fillStyle = 'rgba(255,255,255,.92)';
    const label = `STAGE ${st.no} · ${S.theme.name}`;
    c.strokeText(label, W / 2, 18);
    c.fillText(label, W / 2, 18);
    // 수심계
    c.font = 'bold 9px sans-serif'; c.textAlign = 'right';
    c.fillStyle = 'rgba(255,255,255,.75)';
    c.fillText(`${Math.max(0, Math.round((p.y - M.SURF) / 6))}m`, W - 12, M.H - 10);
    // 점수
    c.textAlign = 'left';
    c.fillText(`SCORE ${st.score}`, 12, M.H - 10);
  },
};

}

{
// audio.js — WebAudio 합성 효과음 (외부 파일 없음, 시리즈 공통 방식)
const M = window.MDV;

const A = {
  ctx: null, master: null,

  init() {
    if (this.ctx) return;
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    this.ctx = new Ctx();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.4;
    this.master.connect(this.ctx.destination);
  },
  resume() { this.init(); if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },

  tone(freq, dur, type = 'square', vol = 0.22, slideTo = null, when = 0) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + when;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.02);
  },

  noise(dur, vol = 0.25, freq = 900, q = 1, when = 0) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + when;
    const len = Math.ceil(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const f = this.ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t0); src.stop(t0 + dur + 0.02);
  },

  // ── 효과음 ──
  swing()   { this.noise(0.08, 0.14, 2400, 1.2); this.tone(800, 0.05, 'sawtooth', 0.05, 1300); },
  hit()     { this.tone(180, 0.07, 'square', 0.2, 120); this.noise(0.05, 0.16, 1000, 1); },
  kill()    { this.tone(440, 0.09, 'square', 0.14, 660); this.tone(660, 0.1, 'square', 0.11, 880, 0.06); },
  grab()    { [700, 1050].forEach((f, i) => this.tone(f, 0.08, 'square', 0.14, null, i * 0.05)); },
  deposit() { [523, 659, 784].forEach((f, i) => this.tone(f, 0.11, 'square', 0.15, null, i * 0.07)); },
  quota()   { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.12, 'square', 0.16, null, i * 0.08)); },
  dash()    { this.noise(0.16, 0.14, 1200, 0.7); },
  hurt()    { this.tone(260, 0.14, 'sawtooth', 0.18, 110); },
  o2low()   { [880, 880].forEach((f, i) => this.tone(f, 0.12, 'square', 0.14, 700, i * 0.18)); },
  o2full()  { this.tone(660, 0.1, 'sine', 0.1, 990); },
  faint()   { [392, 330, 262, 196].forEach((f, i) => this.tone(f, 0.22, 'triangle', 0.18, null, i * 0.16)); },
  bossintro(){ [200, 200, 160].forEach((f, i) => this.tone(f, 0.22, 'sawtooth', 0.22, 130, i * 0.24)); },
  bosstele(){ this.tone(1100, 0.09, 'square', 0.08, 850); },
  spikes()  { this.noise(0.14, 0.2, 2600, 1.2); },
  zap()     { this.noise(0.22, 0.3, 2400, 0.5); this.tone(150, 0.26, 'sawtooth', 0.2, 55); },
  ink()     { this.noise(0.12, 0.14, 700, 0.8); },
  bosshit() { this.tone(150, 0.08, 'square', 0.22, 100); this.noise(0.07, 0.2, 800, 1); },
  bossdown(){ this.tone(120, 0.3, 'sawtooth', 0.24, 45); this.noise(0.3, 0.28, 500, 0.7); },
  clear(n)  { const seq = n >= 3 ? [523, 659, 784, 1047, 1319] : [523, 659, 784, 1047];
              seq.forEach((f, i) => this.tone(f, 0.16, 'square', 0.18, null, i * 0.1)); },
  meow()    { this.tone(700, 0.28, 'sawtooth', 0.1, 420); },
};

M.audio = A;

}
/* ── ui.js ── */
{
// ui.js — 저장 + 화면 전환
const M = window.MDV;
const $ = (id) => document.getElementById(id);

M.save = {
  KEY: 'mogudiver-save-v1',
  data: { best: 1, stars: {} },
  load() {
    try { const raw = localStorage.getItem(this.KEY); if (raw) this.data = Object.assign(this.data, JSON.parse(raw)); } catch (e) {}
    return this.data;
  },
  store() { try { localStorage.setItem(this.KEY, JSON.stringify(this.data)); } catch (e) {} },
  record(no, stars) {
    this.data.stars[no] = Math.max(this.data.stars[no] || 0, stars);
    if (no + 1 > this.data.best) this.data.best = Math.min(M.TOTAL, no + 1);
    this.store();
  },
};

M.ui = {
  screens: ['title-screen', 'pause-screen', 'win-screen', 'ending-screen'],
  toastTimer: null,

  init() {
    $('title-icon').src = M.ASSETS.mogu;
    this.refreshTitle();
  },

  refreshTitle() {
    const best = M.save.data.best;
    $('btn-continue').style.display = best > 1 ? '' : 'none';
    $('btn-continue').textContent = `이어하기 — STAGE ${best}`;
    const total = Object.values(M.save.data.stars).reduce((a, b) => a + b, 0);
    $('title-hi').textContent = total > 0 ? `★ 합계 ${total}` : '';
  },

  show(id) {
    for (const s of this.screens) $(s).classList.toggle('hidden', s !== id);
    $('hud').classList.toggle('hidden', id === 'title-screen' || id === 'ending-screen');
  },
  hideAll() {
    for (const s of this.screens) $(s).classList.add('hidden');
    $('hud').classList.remove('hidden');
  },

  toast(text, dur = 1.8) {
    const el = $('hud-toast');
    el.textContent = text;
    el.style.opacity = 1;
    clearTimeout(this.toastTimer);
    this.toastTimer = setTimeout(() => { el.style.opacity = 0; }, dur * 1000);
  },

  showWin(st) {
    $('win-stars').textContent = '★'.repeat(st.stars) + '☆'.repeat(3 - st.stars);
    $('win-stats').innerHTML = `${st.stage.boss.name} 격파! · 점수 ${st.score} · 하역 ${st.delivered}마리` +
      (st.deaths === 0 ? '<br><b style="color:#7de08a">노 기절!</b>' : `<br>기절 ${st.deaths}회`);
    $('btn-next').style.display = st.no < M.TOTAL ? '' : 'none';
    this.show('win-screen');
  },
};

}
/* ── main.js ── */
{
// main.js — 게임 루프 + 상태 머신 + 입력 (키보드·터치)
const M = window.MDV;
const $ = (id) => document.getElementById(id);

let mode = 'title';            // title | play | pause | win | ending
let st = null;
const held = { left: false, right: false, up: false, down: false };
let atkQueued = false, dashQueued = false;

M.save.load();
M.ui.init();
M.Render.init(document.getElementById('game'));
M.ui.show('title-screen');

function startStage(no) {
  st = M.Logic.create(no);
  M.Render.fx = [];
  mode = 'play';
  M.ui.hideAll();
  M.ui.toast(`STAGE ${st.no} — ${M.STORY[st.no]}`, 3.0);
  M.audio.resume(); M.audio.meow();
}

function toTitle() {
  mode = 'title';
  M.ui.refreshTitle();
  M.ui.show('title-screen');
}

function handleEvents(evs) {
  for (const e of evs) {
    switch (e.type) {
      case 'swing': M.audio.swing(); break;
      case 'hit': M.audio.hit(); M.Render.addSpark(e.x, e.y); break;
      case 'kill': M.audio.kill(); break;
      case 'dissolve': M.Render.addPuff(e.x, e.y, 'rgba(176,208,255,.5)'); break;
      case 'grab': M.audio.grab(); M.ui.toast(`🐟 ${e.name}을(를) 물었다! 보트로 가져가자`, 1.5); break;
      case 'deposit':
        M.audio.deposit();
        M.Render.addFloat(st.p.x, st.p.y - 16, `+${e.score}`, '#ffd83d');
        M.ui.toast(`🧺 ${e.name} 하역! (${Math.min(e.n, e.need)}/${e.need})`, 1.4);
        break;
      case 'quota': M.audio.quota(); M.ui.toast('할당량 달성! 깊은 곳에서 무언가 다가온다…', 2.4); break;
      case 'dash': M.audio.dash(); M.Render.addBubbles(e.x, e.y, 6); break;
      case 'hurt': M.audio.hurt(); break;
      case 'o2low': M.audio.o2low(); M.ui.toast('⚠ 산소 부족! 수면으로!', 1.6); break;
      case 'o2full': M.audio.o2full(); break;
      case 'faint':
        M.audio.faint();
        M.ui.toast(e.lost ? `😵 기절… ${e.lost}을(를) 놓쳤다` : '😵 기절… 보트로 돌아왔다', 2.2);
        break;
      case 'bossintro': M.audio.bossintro(); M.ui.toast(`👑 ${e.name} 등장!!`, 2.2); break;
      case 'bosstele': M.audio.bosstele(); break;
      case 'bossdash': M.audio.dash(); break;
      case 'spikes': M.audio.spikes(); break;
      case 'zap': M.audio.zap(); M.Render.addRing(e.x, e.y, e.r, 'rgba(180,180,255,.8)'); break;
      case 'ink': M.audio.ink(); break;
      case 'bosshit': M.audio.bosshit(); M.Render.addSpark(e.x, e.y); break;
      case 'bossdown': M.audio.bossdown(); M.ui.toast(`💥 ${e.name} 격파!!`, 2.0); break;
      case 'clear': {
        M.audio.clear(e.stars);
        M.save.record(st.no, e.stars);
        setTimeout(() => { if (mode === 'play') { mode = 'win'; M.ui.showWin(st); } }, 1400);
        break;
      }
    }
  }
}

// ── 키보드 ──
window.addEventListener('keydown', (e) => {
  M.audio.resume();
  const k = e.key;
  if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(k)) e.preventDefault();
  if (k === 'ArrowLeft') held.left = true;
  if (k === 'ArrowRight') held.right = true;
  if (k === 'ArrowUp') held.up = true;
  if (k === 'ArrowDown') held.down = true;
  if ((k === ' ' || k === 'z' || k === 'Z') && !e.repeat && mode === 'play') atkQueued = true;
  if ((k === 'x' || k === 'X') && !e.repeat && mode === 'play') dashQueued = true;

  if (mode === 'title') {
    if (k === 'Enter') startStage(M.save.data.best);
  } else if (mode === 'play') {
    if (k === 'Escape') { mode = 'pause'; M.ui.show('pause-screen'); }
  } else if (mode === 'pause') {
    if (k === 'Enter' || k === 'Escape') { mode = 'play'; M.ui.hideAll(); }
    if (k === 'm' || k === 'M') toTitle();
  } else if (mode === 'win') {
    if (k === 'Enter') { if (st.no < M.TOTAL) startStage(st.no + 1); else { mode = 'ending'; M.ui.show('ending-screen'); } }
  } else if (mode === 'ending') {
    if (k === 'Enter') toTitle();
  }
});
window.addEventListener('keyup', (e) => {
  if (e.key === 'ArrowLeft') held.left = false;
  if (e.key === 'ArrowRight') held.right = false;
  if (e.key === 'ArrowUp') held.up = false;
  if (e.key === 'ArrowDown') held.down = false;
});

$('btn-continue').onclick = () => startStage(M.save.data.best);
$('btn-new').onclick = () => startStage(1);
$('btn-series').onclick = () => {
  location.href = location.pathname.includes('/mogudiver/') ? '../index.html' : 'index.html';
};
$('btn-resume').onclick = () => { mode = 'play'; M.ui.hideAll(); };
$('btn-restage').onclick = () => startStage(st.no);
$('btn-title').onclick = () => toTitle();
$('btn-next').onclick = () => { if (st.no < M.TOTAL) startStage(st.no + 1); else { mode = 'ending'; M.ui.show('ending-screen'); } };
$('btn-retry').onclick = () => startStage(st.no);
$('btn-win-title').onclick = () => toTitle();
$('btn-end-title').onclick = () => toTitle();

// ── 터치 (가상 패드) ──
const isTouch = window.matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
const vpad = document.getElementById('vpad');
if (isTouch) {
  document.body.classList.add('touch');
  $('title-hint').textContent = '패드 이동 · 🐾 발톱 · 💨 대시 — 물고기를 물고 보트로!';
  const bindHold = (id, on, off) => {
    const el = document.getElementById(id);
    const setOn = (e) => { e.preventDefault(); M.audio.resume(); on(); el.classList.add('pressed'); };
    const setOff = () => { if (off) off(); el.classList.remove('pressed'); };
    el.addEventListener('pointerdown', setOn);
    el.addEventListener('pointerup', setOff);
    el.addEventListener('pointercancel', setOff);
    el.addEventListener('pointerleave', setOff);
  };
  bindHold('vbtn-left', () => { held.left = true; }, () => { held.left = false; });
  bindHold('vbtn-right', () => { held.right = true; }, () => { held.right = false; });
  bindHold('vbtn-up', () => { held.up = true; }, () => { held.up = false; });
  bindHold('vbtn-down', () => { held.down = true; }, () => { held.down = false; });
  bindHold('vbtn-atk', () => { if (mode === 'play') atkQueued = true; });
  bindHold('vbtn-dash', () => { if (mode === 'play') dashQueued = true; });
  document.getElementById('vbtn-pause').addEventListener('pointerdown', (e) => {
    e.preventDefault(); e.stopPropagation();
    if (mode === 'play') { mode = 'pause'; M.ui.show('pause-screen'); }
  });
  document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
  document.addEventListener('gesturestart', (e) => e.preventDefault());
  vpad.addEventListener('contextmenu', (e) => e.preventDefault());
}

// ── 디버그 훅 (테스트 자동화용) ──
M._dbg = () => ({
  mode, no: st ? st.no : 0, phase: st ? st.phase : null,
  p: st ? { x: +st.p.x.toFixed(1), y: +st.p.y.toFixed(1), o2: +st.p.o2.toFixed(1), carry: st.p.carry ? st.p.carry.type : null } : null,
  fish: st ? st.fish.filter((f) => !f.dead).length : 0,
  corpses: st ? st.fish.filter((f) => f.dead).length : 0,
  boss: st && st.boss ? { hp: st.boss.hp, dead: st.boss.dead, state: st.boss.state } : null,
  delivered: st ? st.delivered : 0, quota: st ? st.stage.quota : 0,
  score: st ? st.score : 0, deaths: st ? st.deaths : 0, stars: st ? st.stars : 0,
});
M._st = () => st;

// ── 메인 루프 ──
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  if (isTouch) vpad.classList.toggle('on', mode === 'play');

  if (mode === 'play' && st) {
    handleEvents(M.Logic.step(st, dt, {
      left: held.left, right: held.right, up: held.up, down: held.down,
      atk: atkQueued, dash: dashQueued,
    }));
  }
  atkQueued = false; dashQueued = false;
  if (st) M.Render.draw(st, now / 1000, dt);
}
requestAnimationFrame(frame);

}
</script>
</body>
