<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>슈퍼모구</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#0c1018;
    font-family:'Malgun Gothic','맑은 고딕',sans-serif; user-select:none;
    touch-action:none; overscroll-behavior:none;
    -webkit-user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  #app { position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  #stage-wrap { position:relative; }
  canvas { display:block; background:#000; }

  .screen { position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; z-index:10; }
  .hidden { display:none !important; }

  #hud { position:absolute; inset:0; pointer-events:none; z-index:5; }
  #hud-toast { position:absolute; top:30%; left:50%; transform:translateX(-50%);
    color:#fff; font-size:19px; font-weight:900; text-shadow:0 3px 6px rgba(0,0,0,.6);
    opacity:0; transition:opacity .3s; white-space:nowrap; }

  /* ── 타이틀 ── */
  #title-screen { background:linear-gradient(#63a4f0 0%, #b8ddf8 55%, #5db84a 56%, #3a8a2a 100%); }
  #title-screen .logo { font-size:min(58px, 12vw); font-weight:900; color:#fff; white-space:nowrap;
    text-shadow:0 5px 0 #b03020, 0 9px 18px rgba(0,0,0,.4); letter-spacing:min(7px, 1.4vw); }
  #title-screen .sub { margin-top:6px; font-size:17px; color:#1c4a28; font-weight:700;
    text-shadow:0 1px 2px rgba(255,255,255,.4); }
  #title-icon { width:105px; height:auto; margin:16px 0 4px; animation:bob 1.2s ease-in-out infinite;
    filter:drop-shadow(0 8px 10px rgba(0,0,0,.4)); }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-22px)} }
  #title-hi { margin-top:4px; color:#ffd83d; font-size:14px; font-weight:800; min-height:19px;
    text-shadow:0 1px 3px rgba(0,0,0,.5); }
  #title-hint { margin-top:12px; color:rgba(255,255,255,.95); font-size:13px; text-align:center;
    padding:0 14px; text-shadow:0 1px 3px rgba(0,0,0,.55); }

  .menu-buttons { display:flex; gap:12px; margin-top:18px; flex-wrap:wrap; justify-content:center; padding:0 10px; }
  .btn { pointer-events:auto; padding:12px 24px; font-size:16px; font-weight:800; color:#fff;
    background:#d84838; border:3px solid rgba(255,255,255,.8); border-radius:12px; cursor:pointer;
    box-shadow:0 4px 8px rgba(0,0,0,.4); font-family:inherit; }
  .btn.primary { background:#3aa84f; }
  .btn.series { padding:9px 18px; font-size:13px; background:#2e6da3; }

  /* ── 승리 / 일시정지 / 게임오버 / 엔딩 ── */
  #win-screen { background:rgba(8,30,16,.85); z-index:20; }
  #win-screen .big { font-size:min(44px, 10vw); font-weight:900; color:#ffd83d; }
  #win-stars { font-size:44px; color:#ffd83d; letter-spacing:8px; margin:8px 0 2px; }
  #win-stats { color:#dcf5e2; font-size:17px; line-height:1.8; text-align:center; }
  #pause-screen { background:rgba(0,0,0,.6); z-index:20; }
  #pause-screen .big, #over-screen .big, #ending-screen .big {
    font-size:min(42px, 10vw); font-weight:900; color:#fff; white-space:nowrap; }
  #over-screen { background:rgba(0,0,0,.85); z-index:20; }
  #over-screen .big { color:#ff5252; letter-spacing:5px; }
  #over-count { font-size:70px; font-weight:900; color:#fff; margin-top:8px; text-shadow:0 4px 10px rgba(0,0,0,.8); }
  #over-screen .hint { margin-top:10px; font-size:16px; color:#ffd83d; font-weight:700; padding:0 14px; text-align:center; }
  #ending-screen { background:linear-gradient(#1a0a14 0%, #40182a 45%, #63a4f0 100%); z-index:20; }
  #ending-screen .big { color:#ffd83d; }
  #ending-screen .msg { margin-top:14px; color:#f0e4ea; font-size:16px; line-height:1.8; text-align:center; padding:0 16px; }

  /* ── 터치 가상 패드 ── */
  #vpad { position:fixed; inset:0; pointer-events:none; z-index:8; display:none; }
  body.touch #vpad.on { display:block; }
  .vbtn { position:absolute; pointer-events:auto; width:66px; height:66px; border-radius:50%;
    background:rgba(255,255,255,.15); border:2px solid rgba(255,255,255,.5);
    color:rgba(255,255,255,.92); font-size:22px; font-weight:800;
    display:flex; align-items:center; justify-content:center;
    touch-action:none; user-select:none; text-shadow:0 2px 3px rgba(0,0,0,.5); }
  .vbtn.pressed { background:rgba(255,255,255,.38); border-color:#ffd83d; }
  #vbtn-left  { left:calc(14px + env(safe-area-inset-left)); bottom:calc(24px + env(safe-area-inset-bottom)); }
  #vbtn-right { left:calc(92px + env(safe-area-inset-left)); bottom:calc(24px + env(safe-area-inset-bottom)); }
  #vbtn-b     { right:calc(104px + env(safe-area-inset-right)); bottom:calc(24px + env(safe-area-inset-bottom)); }
  #vbtn-a     { right:calc(14px + env(safe-area-inset-right)); bottom:calc(44px + env(safe-area-inset-bottom)); width:84px; height:84px; font-size:28px; }
  #vbtn-pause { right:calc(12px + env(safe-area-inset-right)); top:calc(24px + env(safe-area-inset-top));
    width:44px; height:44px; font-size:17px; border-radius:12px; }
</style>
</head>
<body>
<div id="app">
  <div id="stage-wrap">
    <canvas id="game" width="480" height="270"></canvas>
    <div id="hud" class="hidden"><div id="hud-toast"></div></div>
  </div>

  <div id="title-screen" class="screen">
    <div class="logo">슈퍼모구</div>
    <div class="sub">~ 달리고 밟고 깃발까지! ~</div>
    <img id="title-icon" alt="모구">
    <div id="title-hi"></div>
    <div class="menu-buttons">
      <button class="btn primary" id="btn-continue">이어하기</button>
      <button class="btn" id="btn-new">처음부터</button>
    </div>
    <div class="menu-buttons"><button class="btn series" id="btn-series">🏠 모구 게임 시리즈</button></div>
    <div id="title-hint">←→ 달리기 · Space 점프(길게 = 높이) · Shift 대시/털뭉치 · ESC 일시정지<br>?블록을 치면 츄르·캣닢! 쥐와 새를 밟고 깃발까지 달려라! (8월드 32스테이지)</div>
  </div>

  <div id="win-screen" class="screen hidden">
    <div class="big">🚩 클리어!!</div>
    <div id="win-stars">★★★</div>
    <div id="win-stats"></div>
    <div class="menu-buttons">
      <button class="btn" id="btn-retry">다시 도전</button>
      <button class="btn" id="btn-win-title">타이틀로</button>
      <button class="btn primary" id="btn-next">다음 스테이지 →</button>
    </div>
  </div>

  <div id="pause-screen" class="screen hidden">
    <div class="big">일시정지</div>
    <div class="menu-buttons">
      <button class="btn primary" id="btn-resume">계속</button>
      <button class="btn" id="btn-restage">재시작</button>
      <button class="btn" id="btn-title">타이틀로</button>
    </div>
  </div>

  <div id="over-screen" class="screen hidden">
    <div class="big">CONTINUE?</div>
    <div id="over-count">10</div>
    <div class="hint">Enter 또는 화면 터치 = 재도전</div>
    <div class="menu-buttons"><button class="btn" id="btn-over-title">타이틀로</button></div>
  </div>

  <div id="ending-screen" class="screen hidden">
    <div class="big">👑 쥐마왕 격파!!</div>
    <div class="msg">8월드 32스테이지 완전 제패!<br>모구의 평화가 돌아왔다! 🐱🚩</div>
    <div class="menu-buttons"><button class="btn primary" id="btn-end-title">타이틀로</button></div>
  </div>

  <div id="vpad">
    <div class="vbtn" id="vbtn-left">◀</div>
    <div class="vbtn" id="vbtn-right">▶</div>
    <div class="vbtn" id="vbtn-b">Ⓑ</div>
    <div class="vbtn" id="vbtn-a">Ⓐ</div>
    <div class="vbtn" id="vbtn-pause">⏸</div>
  </div>
</div>

<script>window.SMG = { ASSETS: { mogu: "assets/mogu-super.png" } };</script>
<script src="src/rng.js"></script>
<script src="src/levels.js"></script>
<script src="src/logic.js"></script>
<script src="src/render.js"></script>
<script src="src/audio.js"></script>
<script src="src/ui.js"></script>
<script src="src/main.js"></script>
</body>
</html>
