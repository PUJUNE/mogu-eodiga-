<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>모구 똥피하기</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#0c1018;
    font-family:'Malgun Gothic','맑은 고딕',sans-serif; user-select:none;
    touch-action:none; overscroll-behavior:none;
    -webkit-user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  #app { position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  #stage-wrap { position:relative; touch-action:none; }
  canvas { display:block; background:#000; }

  .screen { position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; z-index:10; }
  .hidden { display:none !important; }

  #hud { position:absolute; inset:0; pointer-events:none; z-index:5; }
  #hud-toast { position:absolute; top:24%; left:50%; transform:translateX(-50%);
    color:#fff; font-size:18px; font-weight:900; text-shadow:0 3px 6px rgba(0,0,0,.75);
    opacity:0; transition:opacity .3s; white-space:nowrap; }

  /* ── 타이틀 ── */
  #title-screen { background:linear-gradient(#9fd8f5 0%, #e2f4fc 58%, #6aa84f 59%, #3f6b2c 100%); }
  #title-screen .logo { font-size:min(50px, 11vw); font-weight:900; color:#fff; white-space:nowrap;
    text-shadow:0 5px 0 #7a4a1e, 0 9px 18px rgba(0,0,0,.4); letter-spacing:min(5px, 1.2vw); }
  #title-screen .sub { margin-top:6px; font-size:16px; color:#6b4118; font-weight:800; }
  #title-icon { width:96px; height:auto; margin:12px 0 2px; animation:bob 1.5s ease-in-out infinite;
    filter:drop-shadow(0 8px 10px rgba(0,0,0,.4)); }
  #title-poops { font-size:26px; letter-spacing:14px; margin-top:2px; animation:drop 1.9s ease-in infinite; }
  @keyframes bob { 0%,100%{transform:translateY(0) rotate(-5deg)} 50%{transform:translateY(-14px) rotate(5deg)} }
  @keyframes drop { 0%{transform:translateY(-18px); opacity:.2} 70%{opacity:1} 100%{transform:translateY(10px); opacity:.15} }
  #title-hi { margin-top:8px; color:#5a3410; font-size:14px; font-weight:800; min-height:19px; text-align:center; }
  #title-hint { margin-top:12px; color:rgba(255,255,255,.95); font-size:13px; text-align:center; line-height:1.6;
    padding:0 14px; text-shadow:0 1px 3px rgba(0,0,0,.6); }

  .menu-buttons { display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; justify-content:center; padding:0 10px; }
  .btn { pointer-events:auto; padding:12px 24px; font-size:16px; font-weight:800; color:#fff;
    background:#8a5522; border:3px solid rgba(255,255,255,.8); border-radius:12px; cursor:pointer;
    box-shadow:0 4px 8px rgba(0,0,0,.4); font-family:inherit; }
  .btn.primary { background:#3aa84f; }
  .btn.series { padding:9px 18px; font-size:13px; background:#5e370f; }
  .diff-btn { padding:8px 13px; font-size:13px; background:#6b4118; border-color:rgba(255,255,255,.35); }
  .diff-btn.selected { background:#3aa84f; border-color:#ffd83d; outline:2px solid rgba(255,216,61,.5); }
  .diff-btn.crazy.selected { background:#c8385a; }

  /* ── 클리어 / 일시정지 / 게임오버 / 엔딩 ── */
  #win-screen { background:rgba(30,20,8,.88); z-index:20; }
  #win-screen .big { font-size:min(44px, 10vw); font-weight:900; color:#ffd83d; white-space:nowrap; }
  #win-screen .trophy { font-size:52px; margin-bottom:4px; }
  #win-stats { margin-top:10px; color:#f5e8d2; font-size:16px; line-height:1.8; text-align:center; }
  #pause-screen { background:rgba(0,0,0,.6); z-index:20; }
  #pause-screen .big, #over-screen .big, #ending-screen .big {
    font-size:min(40px, 9.5vw); font-weight:900; color:#fff; white-space:nowrap; }
  #over-screen { background:rgba(0,0,0,.85); z-index:20; }
  #over-screen .big { color:#ff5252; letter-spacing:4px; }
  #over-rank { margin-top:8px; font-size:19px; font-weight:900; color:#ffd83d; }
  #over-count { font-size:58px; font-weight:900; color:#fff; margin-top:2px; text-shadow:0 4px 10px rgba(0,0,0,.8); }
  #over-stats { margin-top:6px; font-size:15px; color:#e8dccc; line-height:1.7; text-align:center; padding:0 14px; }
  #over-screen .hint { margin-top:8px; font-size:13px; color:#ffd83d; font-weight:700; }
  #ending-screen { background:linear-gradient(#241c30 0%, #6b4118 62%, #140c08 100%); z-index:20; }
  #ending-screen .big { color:#ffd83d; }
  #ending-screen .msg { margin-top:14px; color:#f2e4d0; font-size:15px; line-height:1.8; text-align:center; padding:0 16px; }

  /* ── 터치 가상 패드 ── */
  #vpad { position:fixed; inset:0; pointer-events:none; z-index:8; display:none; }
  body.touch #vpad.on { display:block; }
  .vbtn { position:absolute; pointer-events:auto; width:82px; height:82px; border-radius:50%;
    background:rgba(255,255,255,.15); border:2px solid rgba(255,255,255,.5);
    color:rgba(255,255,255,.92); font-size:28px; font-weight:800;
    display:flex; align-items:center; justify-content:center;
    touch-action:none; user-select:none; text-shadow:0 2px 3px rgba(0,0,0,.5); }
  .vbtn.pressed { background:rgba(255,255,255,.38); border-color:#ffd83d; }
  #vbtn-left  { left:calc(16px + env(safe-area-inset-left)); bottom:calc(24px + env(safe-area-inset-bottom)); }
  #vbtn-right { right:calc(16px + env(safe-area-inset-right)); bottom:calc(24px + env(safe-area-inset-bottom)); }
  #vbtn-pause { right:calc(12px + env(safe-area-inset-right)); top:calc(10px + env(safe-area-inset-top));
    width:44px; height:44px; font-size:17px; border-radius:12px; }
</style>
</head>
<body>
<div id="app">
  <div id="stage-wrap">
    <canvas id="game" width="360" height="560"></canvas>
    <div id="hud" class="hidden"><div id="hud-toast"></div></div>
  </div>

  <div id="title-screen" class="screen">
    <div class="logo">모구 똥피하기</div>
    <div class="sub">~ 하늘에서 똥이 내려와 ~</div>
    <div id="title-poops">💩　💩　💩</div>
    <img id="title-icon" alt="모구">
    <div id="title-hi"></div>
    <div class="menu-buttons">
      <button class="btn diff-btn" data-diff="easy">이지</button>
      <button class="btn diff-btn" data-diff="normal">노말</button>
      <button class="btn diff-btn" data-diff="hard">하드</button>
      <button class="btn diff-btn crazy" data-diff="crazy">크레이지</button>
    </div>
    <div class="menu-buttons"><button class="btn primary" id="btn-start">시작하기 (Space)</button></div>
    <div class="menu-buttons"><button class="btn series" id="btn-series">🏠 모구 게임 시리즈</button></div>
    <div id="title-hint">←→ 이동 · Space 시작/일시정지 · R 재시작<br>5분(5:00)을 버티면 CLEAR! 한 번이라도 맞으면 끝</div>
  </div>

  <div id="win-screen" class="screen hidden">
    <div class="trophy">👑💩</div>
    <div class="big">CLEAR!!</div>
    <div id="win-stats"></div>
    <div class="menu-buttons">
      <button class="btn" id="btn-retry">다시 도전</button>
      <button class="btn" id="btn-win-title">타이틀로</button>
      <button class="btn primary" id="btn-next">다음 난이도 →</button>
    </div>
  </div>

  <div id="pause-screen" class="screen hidden">
    <div class="big">일시정지</div>
    <div class="menu-buttons">
      <button class="btn primary" id="btn-resume">계속</button>
      <button class="btn" id="btn-restart">재시작</button>
      <button class="btn" id="btn-title">타이틀로</button>
    </div>
  </div>

  <div id="over-screen" class="screen hidden">
    <div class="big">GAME OVER</div>
    <div id="over-rank"></div>
    <div id="over-count">0:00.0</div>
    <div id="over-stats"></div>
    <div class="hint">Enter 또는 Space = 재도전</div>
    <div class="menu-buttons">
      <button class="btn primary" id="btn-over-retry">다시 도전</button>
      <button class="btn" id="btn-over-title">타이틀로</button>
    </div>
  </div>

  <div id="ending-screen" class="screen hidden">
    <div class="big">👑 똥 마스터 모구</div>
    <div class="msg">크레이지 난이도 5분 완주!<br>하늘이 무너져도 모구는 피한다 💩🐱</div>
    <div class="menu-buttons"><button class="btn primary" id="btn-end-title">타이틀로</button></div>
  </div>

  <div id="vpad">
    <div class="vbtn" id="vbtn-left">◀</div>
    <div class="vbtn" id="vbtn-right">▶</div>
    <div class="vbtn" id="vbtn-pause">⏸</div>
  </div>
</div>

    int: (a, b) => Math.floor(a + f() * (b - a + 1)),
    pick: (arr) => arr[Math.floor(f() * arr.length)],
    chance: (p) => f() < p,
  };
};

{
// logic.js — 낙하 물리 + 회피 판정 (DOM 무의존 — node 테스트 가능)
// 원작 규칙: 모구는 좌우로만 움직이고, 똥에 한 번이라도 맞으면 그 자리에서 끝.

const WIND_AMP = 52;             // 똥 폭풍 웨이브의 좌우 바람 세기 (px/s)

M.Logic = {
  create(seed, diff) {
    const d = M.DIFFS[diff || M.diff] ? (diff || M.diff) : 'normal';
    const st = {
      diff: d,
      t: 0, phase: 'play', endT: 0,
      p: { x: M.W / 2, dir: 1, walk: 0 },
      poops: [],
      rng: M.makeRng((seed >>> 0) || 20240915),
      spawnAcc: 0, lastX: -999,
      waveNo: 1, wave: M.makeWave(1, d),
      themeIdx: 0,
      dodged: 0, spawned: 0,
      hitAt: null,
      nextId: 1,
    };

  },

  // 원 vs 모구 히트박스(사각) 충돌
  hitTest(px, poop) {
    const left = px - M.PW, right = px + M.PW;
    const top = M.GROUND - M.PH, bot = M.GROUND;

      wob: K.wob * rng.range(0.6, 1.2),

    let vx = 0;
    if (input && input.targetX != null) {
      const d = input.targetX - p.x;
      if (Math.abs(d) > 3) vx = Math.sign(d) * M.PSPD;
    } else if (input) {
      if (input.left) vx = -M.PSPD;
      if (input.right) vx = M.PSPD;
      if (input.left && input.right) vx = 0;

    // ── 5분 생존 = CLEAR (원작과 동일) ──

  _fall(st, dt, ev, live) {

      c.lineTo(W + 10, M.GROUND + 4); c.lineTo(-10, M.GROUND + 4);
      c.closePath();
    };
    c.fillStyle = th.ground; hills(); c.fill();
    c.fillStyle = 'rgba(0,0,0,.3)'; hills(); c.fill();

    // ── 바닥 ──
    c.fillStyle = th.ground;
    c.fillRect(0, M.GROUND, W, H - M.GROUND);
    c.fillStyle = 'rgba(255,255,255,.2)';
    c.fillRect(0, M.GROUND, W, 3);
    c.fillStyle = 'rgba(0,0,0,.16)';               // 잔디 결
    for (let x = 6; x < W; x += 17) c.fillRect(x, M.GROUND + 9 + ((x / 17) % 2) * 7, 7, 2);

    // 바닥에 남은 똥 자국
    this.splats = this.splats.filter((s) => s.t < 7);
    for (const s of this.splats) {
      s.t += dt;
      const a = Math.max(0, 1 - s.t / 7);
      c.globalAlpha = a * 0.8;
      c.fillStyle = '#4e2f11';
      c.beginPath(); c.ellipse(s.x, M.GROUND + 7, s.r * 1.25, s.r * 0.42, 0, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#6b4118';
      c.beginPath(); c.ellipse(s.x - s.r * 0.3, M.GROUND + 6, s.r * 0.45, s.r * 0.2, 0, 0, Math.PI * 2); c.fill();
      c.globalAlpha = 1;
    }

    // ── 모구 ──
    this.drawMogu(c, st, t);

    // ── 떨어지는 똥 ──
    for (const q of st.poops) this.drawPoop(c, q.x, q.y, q.r, q.rot);

    // ── 착지·피격 FX ──
    this.fx = this.fx.filter((f) => f.t < 0.4);
    for (const f of this.fx) {
      f.t += dt;
      const p = f.t / 0.4;
      c.globalAlpha = 1 - p;
      c.strokeStyle = '#c8964a'; c.lineWidth = 3;
      c.beginPath(); c.arc(f.x, f.y, f.r + p * 34, 0, Math.PI * 2); c.stroke();
      c.globalAlpha = 1;
    }

    // ── HUD ──
    this.drawHud(c, st, th);
  },
};

}
/* ── audio.js ── */
{
// audio.js — WebAudio 합성 효과음 (외부 파일 없음, 시리즈 공통 방식)
const M = window.MDD;

const A = {
  ctx: null, master: null, plopAt: 0,

  init() {
    if (this.ctx) return;
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    this.ctx = new Ctx();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.4;
    this.master.connect(this.ctx.destination);
  },
  resume() { this.init(); if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },

  tone(freq, dur, type = 'square', vol = 0.22, slideTo = null, when = 0) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + when;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.02);
  },

  noise(dur, vol = 0.25, freq = 900, q = 1, when = 0) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + when;
    const len = Math.ceil(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const f = this.ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t0); src.stop(t0 + dur + 0.02);
  },

  // ── 효과음 ──
  // 후반엔 초당 십수 개가 떨어지므로 착지음은 최소 간격을 두고 솎아 낸다
  plop(r) {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    if (now - this.plopAt < 0.07) return;
    this.plopAt = now;
    const f = r > 12 ? 130 : r > 8 ? 190 : 260;
    this.tone(f, 0.06, 'sine', 0.12, f * 0.55);
    this.noise(0.05, 0.09, 700, 1.4);
  },
  splat()  { this.noise(0.22, 0.34, 420, 0.9); this.tone(150, 0.22, 'square', 0.2, 60); },
  wave(n)  { this.tone(520 + n * 18, 0.1, 'square', 0.16, 780 + n * 18);
             this.tone(780 + n * 18, 0.12, 'square', 0.13, null, 0.09); },
  storm()  { this.noise(0.7, 0.24, 260, 0.6); this.tone(90, 0.6, 'sawtooth', 0.14, 55); },
  clear()  { [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => this.tone(f, 0.18, 'square', 0.18, null, i * 0.11)); },
  over()   { [392, 330, 262, 196].forEach((f, i) => this.tone(f, 0.26, 'triangle', 0.2, null, i * 0.2)); },
  best()   { [880, 1175, 1568].forEach((f, i) => this.tone(f, 0.14, 'square', 0.16, null, i * 0.1)); },
  meow()   { this.tone(700, 0.28, 'sawtooth', 0.1, 420); },
};

M.audio = A;

}
/* ── ui.js ── */
{
// ui.js — 저장(난이도별 최고 기록) + 화면 전환
const M = window.MDD;
const $ = (id) => document.getElementById(id);

const fmt = (sec) => {
  const s = Math.max(0, sec);
  return `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}.${String(Math.floor((s % 1) * 10))}`;
};
M.fmtTime = fmt;

M.save = {
  KEY: 'mogudong-save-v1',
  data: { diff: 'normal', best: {}, cleared: {}, plays: 0 },
  load() {
    try { const raw = localStorage.getItem(this.KEY); if (raw) this.data = Object.assign(this.data, JSON.parse(raw)); } catch (e) {}
    if (M.DIFFS[this.data.diff]) M.diff = this.data.diff;
    return this.data;
  },
  store() { try { localStorage.setItem(this.KEY, JSON.stringify(this.data)); } catch (e) {} },
  setDiff(d) {
    if (!M.DIFFS[d]) return;
    M.diff = d;
    this.data.diff = d;
    this.store();
  },
  bestOf(d) { return this.data.best[d] || { time: 0, dodged: 0 }; },
  // 최고 기록 갱신 여부를 돌려준다
  record(d, time, dodged, cleared) {
    const b = this.bestOf(d);
    const isBest = time > b.time + 0.05;
    this.data.best[d] = { time: Math.max(b.time, time), dodged: Math.max(b.dodged, dodged) };
    if (cleared) this.data.cleared[d] = true;
    this.data.plays = (this.data.plays || 0) + 1;
    this.store();
    return isBest;
  },
};

M.ui = {
  screens: ['title-screen', 'pause-screen', 'win-screen', 'over-screen', 'ending-screen'],
  toastTimer: null,

  init() {
    $('title-icon').src = M.ASSETS.mogu;
    document.querySelectorAll('.diff-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        M.save.setDiff(btn.dataset.diff);
        this.updateDiffBtns();
        this.refreshTitle();
      });
    });
    this.updateDiffBtns();
    this.refreshTitle();
  },

  updateDiffBtns() {
    document.querySelectorAll('.diff-btn').forEach((btn) => {
      btn.classList.toggle('selected', btn.dataset.diff === M.diff);
      const done = M.save.data.cleared[btn.dataset.diff];
      btn.textContent = M.DIFFS[btn.dataset.diff].name + (done ? ' 👑' : '');
    });
  },

  refreshTitle() {
    const b = M.save.bestOf(M.diff);
    $('title-hi').innerHTML = b.time > 0
      ? `${M.DIFFS[M.diff].name} 최고 기록 <b>${fmt(b.time)}</b> · 피한 똥 ${b.dodged}개`
      : '5분(5:00)을 버티면 CLEAR!';
  },

  show(id) {
    for (const s of this.screens) $(s).classList.toggle('hidden', s !== id);
    $('hud').classList.toggle('hidden', id === 'title-screen' || id === 'ending-screen');
  },
  hideAll() {
    for (const s of this.screens) $(s).classList.add('hidden');
    $('hud').classList.remove('hidden');
  },

  toast(text, dur = 1.8) {
    const el = $('hud-toast');
    el.textContent = text;
    el.style.opacity = 1;
    clearTimeout(this.toastTimer);
    this.toastTimer = setTimeout(() => { el.style.opacity = 0; }, dur * 1000);
  },

  showClear(st) {
    $('win-stats').innerHTML =
      `5분 완주! 피한 똥 <b>${st.dodged}</b>개<br>` +
      `난이도 ${M.DIFFS[st.diff].name} · 웨이브 ${M.WAVES} 돌파`;
    $('btn-next').style.display = M.nextDiff(st.diff) ? '' : 'none';
    if (M.nextDiff(st.diff)) $('btn-next').textContent = `${M.DIFFS[M.nextDiff(st.diff)].name}에 도전 →`;
    this.show('win-screen');
  },

  showOver(st, isBest) {
    const rank = M.rankOf(st.t);
    $('over-rank').textContent = `${rank.tag} ${rank.name}`;
    $('over-count').textContent = fmt(st.t);
    const b = M.save.bestOf(st.diff);
    $('over-stats').innerHTML =
      `피한 똥 <b>${st.dodged}</b>개 · 웨이브 ${st.waveNo} · ${M.DIFFS[st.diff].name}<br>` +
      (isBest ? '<b style="color:#7de08a">🎉 최고 기록 경신!</b>' : `최고 기록 ${fmt(b.time)}`);
    this.show('over-screen');
  },
};

}
/* ── main.js ── */
{
// main.js — 게임 루프 + 상태 머신 + 입력 (키보드 ←→ / 터치 드래그·가상패드)
const M = window.MDD;
const $ = (id) => document.getElementById(id);

let mode = 'title';            // title | play | pause | win | over | ending
let st = null;
let dragX = null;              // 터치 드래그 목표 x (논리 좌표)
const held = { left: false, right: false };

M.save.load();
M.ui.init();
M.Render.init($('game'));
M.ui.show('title-screen');

function startRun() {
  st = M.Logic.create((Date.now() & 0x7fffffff) || 1, M.diff);
  M.Render.reset();
  dragX = null;
  mode = 'play';
  M.ui.hideAll();
  M.ui.toast(`${M.DIFFS[M.diff].name} — 5분을 버텨라!`, 1.8);
  M.audio.resume(); M.audio.meow();
}

function toTitle() {
  mode = 'title';
  M.ui.updateDiffBtns();
  M.ui.refreshTitle();
  M.ui.show('title-screen');
}

function finish() {                                     // 결과 반영 (1회만)
  if (st.recorded) return;
  st.recorded = true;
  const cleared = st.phase === 'clear';
  st.isBest = M.save.record(st.diff, cleared ? M.CLEAR_TIME : st.t, st.dodged, cleared);
}

function handleEvents(evs) {
  for (const e of evs) {
    switch (e.type) {
      case 'land': M.audio.plop(e.r); M.Render.addSplat(e.x, e.r); break;
      case 'wave':
        M.audio.wave(e.no);
        if (e.wind) { M.audio.storm(); M.ui.toast('🌪 똥 폭풍!! 바람에 휩쓸린다', 2.0); }
        else M.ui.toast(`WAVE ${e.no} — 똥이 더 쏟아진다!`, 1.4);
        break;
      case 'theme': M.ui.toast(`☁ ${M.THEMES[e.idx].name}`, 1.2); break;
      case 'hit':
        M.audio.splat();
        M.Render.addBurst(e.x, e.y, e.r);
        break;
      case 'over': finish(); M.audio.over(); break;
      case 'clear':
        finish();
        M.audio.clear();
        setTimeout(() => {
          if (mode !== 'play') return;
          if (M.save.data.cleared.crazy && st.diff === 'crazy') { mode = 'ending'; M.ui.show('ending-screen'); }
          else { mode = 'win'; M.ui.showClear(st); }
        }, 1500);
        break;
    }
  }
}

// ── 키보드 (원작 조작: ←→ 이동, Space 시작·일시정지) ──
window.addEventListener('keydown', (e) => {
  M.audio.resume();
  const k = e.key;
  if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(k)) e.preventDefault();
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') { held.left = true; dragX = null; }
  if (k === 'ArrowRight' || k === 'd' || k === 'D') { held.right = true; dragX = null; }

  if (mode === 'title') {
    if (k === 'Enter' || k === ' ') startRun();
    if (k === '1') { M.save.setDiff('easy'); M.ui.updateDiffBtns(); M.ui.refreshTitle(); }
    if (k === '2') { M.save.setDiff('normal'); M.ui.updateDiffBtns(); M.ui.refreshTitle(); }
    if (k === '3') { M.save.setDiff('hard'); M.ui.updateDiffBtns(); M.ui.refreshTitle(); }
    if (k === '4') { M.save.setDiff('crazy'); M.ui.updateDiffBtns(); M.ui.refreshTitle(); }
  } else if (mode === 'play') {
    if (k === 'Escape' || k === ' ') { mode = 'pause'; M.ui.show('pause-screen'); }
    if (k === 'r' || k === 'R') startRun();
  } else if (mode === 'pause') {
    if (k === 'Enter' || k === 'Escape' || k === ' ') { mode = 'play'; M.ui.hideAll(); }
    if (k === 'r' || k === 'R') startRun();
    if (k === 'm' || k === 'M') toTitle();
  } else if (mode === 'over') {
    if (k === 'Enter' || k === ' ') startRun();
    if (k === 'Escape') toTitle();
  } else if (mode === 'win') {
    if (k === 'Enter') {
      const nx = M.nextDiff(st.diff);
      if (nx) { M.save.setDiff(nx); M.ui.updateDiffBtns(); startRun(); } else toTitle();
    }
  } else if (mode === 'ending') {
    if (k === 'Enter') toTitle();
  }
});
window.addEventListener('keyup', (e) => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') held.left = false;
  if (k === 'ArrowRight' || k === 'd' || k === 'D') held.right = false;
});

$('btn-start').onclick = () => startRun();
$('btn-series').onclick = () => {
  location.href = location.pathname.includes('/mogudong/') ? '../index.html' : 'index.html';
};
$('btn-resume').onclick = () => { mode = 'play'; M.ui.hideAll(); };
$('btn-restart').onclick = () => startRun();
$('btn-title').onclick = () => toTitle();
$('btn-retry').onclick = () => startRun();
$('btn-over-retry').onclick = () => startRun();
$('btn-over-title').onclick = () => toTitle();
$('btn-win-title').onclick = () => toTitle();
$('btn-end-title').onclick = () => toTitle();
$('btn-next').onclick = () => {
  const nx = M.nextDiff(st.diff);
  if (nx) { M.save.setDiff(nx); M.ui.updateDiffBtns(); }
  startRun();
};

// ── 포인터: 화면을 잡고 끌면 모구가 손가락(마우스)을 따라간다 ──
const wrap = $('stage-wrap');
function toLogicX(clientX) {
  const r = M.Render.cv.getBoundingClientRect();
  return Math.max(0, Math.min(M.W, ((clientX - r.left) / r.width) * M.W));
}
const onMove = (e) => { if (mode === 'play' && dragX !== null) dragX = toLogicX(e.clientX); };
wrap.addEventListener('pointerdown', (e) => {
  M.audio.resume();
  if (mode !== 'play') return;
  e.preventDefault();
  dragX = toLogicX(e.clientX);
});
wrap.addEventListener('pointermove', onMove);
window.addEventListener('pointerup', () => { dragX = null; });
window.addEventListener('pointercancel', () => { dragX = null; });

// ── 터치 (가상 패드) ──
const isTouch = window.matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
const vpad = $('vpad');
if (isTouch) {
  document.body.classList.add('touch');
  $('title-hint').innerHTML = '◀▶ 버튼 또는 화면을 끌어서 이동<br>5분(5:00)을 버티면 CLEAR! 한 번이라도 맞으면 끝';
  const bindHold = (id, on, off) => {
    const el = $(id);
    const setOn = (e) => { e.preventDefault(); M.audio.resume(); on(); el.classList.add('pressed'); };
    const setOff = () => { if (off) off(); el.classList.remove('pressed'); };
    el.addEventListener('pointerdown', setOn);
    el.addEventListener('pointerup', setOff);
    el.addEventListener('pointercancel', setOff);
    el.addEventListener('pointerleave', setOff);
  };
  bindHold('vbtn-left', () => { held.left = true; dragX = null; }, () => { held.left = false; });
  bindHold('vbtn-right', () => { held.right = true; dragX = null; }, () => { held.right = false; });
  $('vbtn-pause').addEventListener('pointerdown', (e) => {
    e.preventDefault(); e.stopPropagation();
    if (mode === 'play') { mode = 'pause'; M.ui.show('pause-screen'); }
  });
  document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
  document.addEventListener('gesturestart', (e) => e.preventDefault());
  vpad.addEventListener('contextmenu', (e) => e.preventDefault());
}

// ── 디버그 훅 (테스트 자동화용) ──
M._dbg = () => ({
  mode, diff: st ? st.diff : M.diff, phase: st ? st.phase : null,
  t: st ? +st.t.toFixed(2) : 0, wave: st ? st.waveNo : 0,
  dodged: st ? st.dodged : 0, poops: st ? st.poops.length : 0,
  px: st ? +st.p.x.toFixed(1) : 0,
});
M._st = () => st;

// ── 메인 루프 ──
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  if (isTouch) vpad.classList.toggle('on', mode === 'play');

  if (st && (mode === 'play' || mode === 'over' || mode === 'win' || mode === 'ending')) {
    handleEvents(M.Logic.step(st, dt, {
      left: held.left, right: held.right,
      targetX: mode === 'play' && dragX !== null && !held.left && !held.right ? dragX : null,
    }));
    if (mode === 'play' && M.Logic.deathDone(st)) {
      mode = 'over';
      M.ui.showOver(st, st.isBest);
      if (st.isBest) M.audio.best();
    }
  }
  if (st) M.Render.draw(st, now / 1000, dt);
}
requestAnimationFrame(frame);

}
</script>
