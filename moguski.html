<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>모구 스키점프</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000;
    font-family:'Malgun Gothic','맑은 고딕',sans-serif; user-select:none;
    touch-action:none; overscroll-behavior:none;
    -webkit-user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  #app { position:relative; width:100%; height:100%; }
  canvas { display:block; }

  .screen { position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; z-index:10; }
  .hidden { display:none !important; }

  /* ── 주행 HUD ── */
  #hud { position:absolute; inset:0; pointer-events:none; z-index:5; }
  #hud-stage { position:absolute; top:10px; left:50%; transform:translateX(-50%);
    color:#fff; font-size:15px; font-weight:800; text-shadow:0 2px 3px rgba(0,0,0,.6); white-space:nowrap; }
  #hud-target { position:absolute; top:30px; left:50%; transform:translateX(-50%);
    color:#d8e4f5; font-size:12px; font-weight:700; text-shadow:0 1px 2px rgba(0,0,0,.6); white-space:nowrap; }
  #hud-wind { position:absolute; top:12px; left:14px; font-size:13px; font-weight:800;
    text-shadow:0 1px 3px rgba(0,0,0,.7); }
  #hud-speed { position:absolute; top:32px; left:14px; color:rgba(255,255,255,.9); font-size:13px;
    font-weight:700; text-shadow:0 1px 3px rgba(0,0,0,.7); }
  #hud-dist { position:absolute; top:12%; left:50%; transform:translateX(-50%);
    color:#fff; font-size:min(44px, 9vw); font-weight:900; text-shadow:0 4px 8px rgba(0,0,0,.6); }
  #hud-toast { position:absolute; top:36%; left:50%; transform:translateX(-50%);
    color:#fff; font-size:min(26px, 6vw); font-weight:900; text-shadow:0 3px 6px rgba(0,0,0,.6);
    opacity:0; transition:opacity .3s; white-space:nowrap; }

  /* 릴리즈 타이밍 미터 (모구 머리 위에 JS로 앵커) */
  #meter-wrap { position:absolute; top:24%; left:50%; transform:translate(-50%, -110%); width:min(280px, 58vw);
    text-align:center; }
  #meter-label { color:#ffd83d; font-size:14px; font-weight:800; text-shadow:0 2px 3px rgba(0,0,0,.6); margin-bottom:5px; }
  #meter { position:relative; height:16px; background:rgba(0,0,0,.55); border-radius:8px;
    border:2px solid rgba(255,255,255,.6); overflow:hidden; }
  #meter-zone { position:absolute; right:0; top:0; bottom:0; width:24%; background:rgba(90,220,110,.75); }
  #meter-zone-core { position:absolute; right:0; top:0; bottom:0; width:8%; background:rgba(255,255,255,.45); }
  #meter-needle { position:absolute; top:-3px; bottom:-3px; width:4px; background:#fff; border-radius:2px; }

  /* 웅크리기(차지) 게이지 (모구 머리 위에 JS로 앵커) */
  #charge-wrap { position:absolute; top:24%; left:50%; transform:translate(-50%, -110%);
    width:min(190px, 42vw); text-align:center; }
  #charge-label { color:rgba(255,255,255,.85); font-size:12px; font-weight:700;
    text-shadow:0 1px 3px rgba(0,0,0,.7); margin-bottom:4px; }
  #charge { height:10px; background:rgba(0,0,0,.5); border-radius:5px; border:2px solid rgba(255,255,255,.5); overflow:hidden; }
  #charge-fill { height:100%; width:0%; background:linear-gradient(90deg,#5db8ff,#9fe06a); }

  #ready-overlay { position:absolute; inset:0; z-index:6; pointer-events:none;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-end; padding-bottom:16%; }
  #ready-overlay .go { font-size:min(26px, 6vw); font-weight:900; color:#ffd83d;
    text-shadow:0 3px 6px rgba(0,0,0,.6); animation:blink 1.1s step-end infinite; }
  @keyframes blink { 50%{opacity:.25} }
  #ready-hint { margin-top:8px; font-size:13px; color:rgba(255,255,255,.9);
    text-shadow:0 1px 3px rgba(0,0,0,.7); text-align:center; padding:0 14px; line-height:1.7; }

  /* ── 타이틀 ── */
  #title-screen { background:linear-gradient(#8ecdf0 0%, #d8f0fa 55%, #4f7be0 56%, #2c3a60 100%); }
  #title-screen .logo { font-size:min(60px, 12vw); font-weight:900; color:#fff; white-space:nowrap;
    text-shadow:0 5px 0 #2a5db0, 0 9px 18px rgba(0,0,0,.4); letter-spacing:min(5px, 1vw); }
  #title-screen .sub { margin-top:6px; font-size:17px; color:#1c3f78; font-weight:700; }
  #title-icon { width:90px; height:auto; margin:14px 0 4px; animation:fly 2.2s ease-in-out infinite;
    filter:drop-shadow(0 8px 10px rgba(0,0,0,.35)); }
  @keyframes fly { 0%,100%{transform:translateY(0) rotate(8deg)} 50%{transform:translateY(-16px) rotate(-6deg)} }
  #title-hint { margin-top:12px; color:rgba(255,255,255,.9); font-size:13px; text-shadow:0 1px 3px rgba(0,0,0,.5);
    text-align:center; padding:0 14px; }

  .menu-buttons { display:flex; gap:14px; margin-top:20px; flex-wrap:wrap; justify-content:center; padding:0 10px; }
  .btn { pointer-events:auto; padding:12px 26px; font-size:17px; font-weight:800; color:#fff;
    background:#3a86d4; border:3px solid rgba(255,255,255,.8); border-radius:12px; cursor:pointer;
    box-shadow:0 4px 8px rgba(0,0,0,.4); font-family:inherit; }
  .btn.primary { background:#3aa84f; }

  /* ── 힐 맵 ── */
  #map-screen { background:#16223a; justify-content:flex-start; }
  #map-head { width:100%; padding:12px 0 8px; text-align:center; color:#fff;
    font-size:22px; font-weight:800; background:rgba(0,0,0,.35); letter-spacing:3px; }
  #map-scroll { width:100%; flex:1; overflow-y:auto; touch-action:pan-y; }
  #map-track { max-width:560px; margin:0 auto; padding:10px 12px 30px; }
  .map-world { color:#9fc0e8; font-size:13px; font-weight:800; margin:14px 0 6px; }
  .map-grid { display:grid; grid-template-columns:repeat(5, 1fr); gap:8px; }
  .stage-cell { position:relative; padding:8px 2px 6px; border-radius:10px; border:2px solid rgba(255,255,255,.4);
    background:#2c4a74; color:#fff; font-family:inherit; cursor:pointer; text-align:center; }
  .stage-cell b { font-size:16px; }
  .stage-cell .stars { display:block; font-size:10px; color:#ffd83d; margin-top:2px; }
  .stage-cell .stars.dim { color:rgba(255,255,255,.5); }
  .stage-cell .crown { position:absolute; top:-7px; right:-4px; font-size:13px; }
  .stage-cell.cleared { background:#2c7444; }
  .stage-cell.locked { background:#3a4252; color:rgba(255,255,255,.4); cursor:default; }
  .map-foot { width:100%; display:flex; align-items:center; justify-content:center; gap:14px;
    flex-wrap:wrap; color:rgba(255,255,255,.6); font-size:12px;
    padding:8px 10px 10px; background:rgba(0,0,0,.35); box-sizing:border-box; }
  .btn-mini { padding:7px 14px; font-size:13px; font-weight:700; color:#fff;
    background:#2e6da3; border:2px solid rgba(255,255,255,.55); border-radius:9px; cursor:pointer;
    font-family:inherit; }
  .btn-mini:hover { background:#3a86d4; }

  /* ── 결과 / 일시정지 ── */
  #result-screen { background:rgba(8,20,40,.88); z-index:20; }
  #result-title { font-size:min(40px, 9vw); font-weight:900; color:#ffd83d; white-space:nowrap;
    text-shadow:0 4px 8px rgba(0,0,0,.6); }
  #result-dist { font-size:min(56px, 13vw); font-weight:900; color:#fff; margin:6px 0 2px;
    text-shadow:0 4px 10px rgba(0,0,0,.7); }
  #result-stars { font-size:34px; color:#ffd83d; letter-spacing:8px; min-height:44px; }
  #result-stats { color:#dce8f5; font-size:15px; line-height:1.9; text-align:center; padding:0 16px; }
  #pause-screen { background:rgba(0,0,0,.6); z-index:20; }
  #pause-screen .big { font-size:min(40px, 10vw); font-weight:900; color:#fff; }

  .vbtn { position:fixed; pointer-events:auto; display:none; align-items:center; justify-content:center;
    background:rgba(255,255,255,.15); border:2px solid rgba(255,255,255,.5); color:rgba(255,255,255,.92);
    touch-action:none; user-select:none; z-index:8; }
  #vbtn-pause { right:calc(12px + env(safe-area-inset-right)); top:calc(10px + env(safe-area-inset-top));
    width:46px; height:46px; font-size:18px; border-radius:12px; }
</style>
</head>
<body>
<div id="app">
  <div id="hud" class="hidden">
    <div id="hud-stage">STAGE 1</div>
    <div id="hud-target">목표 39.5m</div>
    <div id="hud-wind"></div>
    <div id="hud-speed"></div>
    <div id="hud-dist" class="hidden">0.0 m</div>
    <div id="meter-wrap" class="hidden">
      <div id="meter-label">지금이다… 손을 떼!</div>
      <div id="meter">
        <div id="meter-zone"></div>
        <div id="meter-zone-core"></div>
        <div id="meter-needle"></div>
      </div>
    </div>
    <div id="charge-wrap" class="hidden">
      <div id="charge-label">웅크리는 중…</div>
      <div id="charge"><div id="charge-fill"></div></div>
    </div>
    <div id="hud-toast"></div>
  </div>
  <div id="ready-overlay" class="hidden">
    <div class="go">꾹 눌러서 출발!</div>
    <div id="ready-hint">누르고 있는 동안 모구가 웅크려요<br>도약대 끝에서 손을 떼면 점프!</div>
  </div>

  <div id="title-screen" class="screen">
    <div class="logo">모구 스키점프</div>
    <div class="sub">~ 포대 타고 슝 ~</div>
    <img id="title-icon" alt="모구">
    <div class="menu-buttons"><button class="btn primary" id="btn-start">힐 맵으로</button></div>
    <div id="title-hint">Space를 꾹 눌러 활강 — 도약대 끝에서 떼면 점프!</div>
  </div>

  <div id="map-screen" class="screen hidden">
    <div id="map-head">힐 맵</div>
    <div id="map-scroll"><div id="map-track"></div></div>
    <div class="map-foot">
      <span>★1 이상이면 다음 힐 해금 · 👑 = 라이벌 힐</span>
      <button class="btn-mini" id="btn-series">🏠 모구 게임 시리즈</button>
    </div>
  </div>

  <div id="result-screen" class="screen hidden">
    <div id="result-title">CLEAR!</div>
    <div id="result-dist">0.0 m</div>
    <div id="result-stars"></div>
    <div id="result-stats"></div>
    <div class="menu-buttons">
      <button class="btn" id="btn-retry">다시 점프</button>
      <button class="btn" id="btn-map">힐 맵</button>
      <button class="btn primary" id="btn-next">다음 힐 →</button>
    </div>
  </div>

  <div id="pause-screen" class="screen hidden">
    <div class="big">일시정지</div>
    <div class="menu-buttons">
      <button class="btn primary" id="btn-resume">계속</button>
      <button class="btn" id="btn-prestart">다시 점프</button>
      <button class="btn" id="btn-pmap">힐 맵</button>
    </div>
  </div>

  <div class="vbtn" id="vbtn-pause">⏸</div>
</div>

import * as THREE from 'three';
/* ── rng.js ── */
{
// rng.js — 시드 기반 결정적 난수 (모구 어디가 rng.js와 동일 계열)
const M = window.MSJ;

M.mulberry32 = function (seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
};

M.makeRng = function (seed) {
  const f = M.mulberry32(seed);
  return {
    next: f,
    range: (a, b) => a + f() * (b - a),
    int: (a, b) => Math.floor(a + f() * (b - a + 1)),
    pick: (arr) => arr[Math.floor(f() * arr.length)],
    chance: (p) => f() < p,
  };
};

}
/* ── levels.js ── */
{
// levels.js — 시드 기반 힐(스테이지) 생성: 인런 프로파일 + 착지 언덕 + 바람
const M = window.MSJ;

M.WORLDS = {
  1: { name: '뒷동산',     sky0: '#8ecdf0', sky1: '#d8f0fa', ground: '#5da24a', track: '#8fd070', far: '#79b868', accent: '#ffd83d', night: false },
  2: { name: '가을 숲',    sky0: '#f0b870', sky1: '#fae0b8', ground: '#a06a34', track: '#d89858', far: '#c08048', accent: '#ff7d3c', night: false },

};

const RIVALS = { 10: '재빠른 생쥐', 20: '바람 까마귀', 30: '사막 청소기', 40: '그림자 점퍼', 50: '쥐마왕 킹' };

// 스테이지별 목표 거리(m) — 퍼펙트 봇 시뮬레이션 거리 × 0.84 로 역산해 구움
// (재생성 방법: test/tune.mjs — 물리 상수를 바꾸면 반드시 다시 구워야 함)

  81.5, 86, 87.5, 87, 93, 91.5, 94.5, 96, 97, 104.5, 110.5, 110, 107, 115, 117,

    if (hx <= K1 + EASE) {
      const u = (hx - K1) / EASE;
      return yK1 - 0.65 * EASE * (u - (u * u) / 2);
    }
    return yK1 - 0.65 * EASE * 0.5;
  };

  // 양력 계수: 큰 힐일수록 살짝 줄여 후반 비행거리 폭주 방지 (CL_CAL은 튜닝 스크립트용 후크)
  const cl = M.CL_CAL ? M.CL_CAL(K) : 0.0122 - K * 0.000035;

  return {
    no, world, theme, K, K1, EASE, vLip, a, L, wind,
    rival: RIVALS[no] || null,
    target: M.TARGETS[no - 1], cl,
    inrunAt, hillY, inrunPts: pts,
  };
};

}
/* ── logic.js ── */
{
// logic.js — 활강·도약·비행·착지 물리 (DOM 무의존 — node 헤드리스 테스트 가능)
// 조작: 버튼을 꾹 누르면 출발 + 웅크려 점프 준비(차지), 도약대 끝에서 손을 떼면 도약.
// 릴리즈 타이밍이 도약력과 활공 자세를 함께 정한다 (공중 추가 조작 없음).
const M = window.MSJ;

const G0 = 9.81;
const REL_WIN = 0.28;            // 릴리즈 타이밍 허용 오차 (초)
const LATE_WIN = 0.18;           // 립 통과 후 늦은 릴리즈 부분 인정 (초)
const CHARGE_T = 0.8;            // 완충까지 필요한 홀드 시간 (초)
const BASE_HOP = 2.6, JUMP_BONUS = 3.8;

M.Logic = {
  create(no) {
    const stage = M.makeStage(no);
    return {
      stage, no, phase: 'ready', t: 0, ft: 0,
      s: stage.L, v: 0,                     // 활강: 립까지 남은 거리·속도
      x: 0, y: 0, vx: 0, vy: 0,             // 비행 (x=전진거리, y=높이)
      holding: false, charge: 0, releaseAt: null,
      untilLip: 99, q: 0,
      dist: 0, crash: false, stars: 0, landT: 0,
    };
  },

  // 활공 자세 품질: 릴리즈 품질이 비행 전체의 자세를 정함
  poseQ(st) { return 0.35 + 0.65 * st.q; },

  _quality(st) {
    if (st.releaseAt === null) return 0;
    const cf = Math.min(1, st.charge / (CHARGE_T * 0.9));   // 충분히 웅크렸는가
    return Math.max(0, 1 - st.releaseAt / REL_WIN) * cf;
  },

  step(st, dt, input) {
    const ev = [];
    const stg = st.stage;
    st.t += dt;

    if (st.phase === 'ready') {
      if (input.btn) {
        st.phase = 'slide'; st.holding = true;
        ev.push({ type: 'start' });
      }

    } else if (st.phase === 'slide') {
      st.v += stg.a * dt;
      st.s -= st.v * dt;
      st.untilLip = st.s / Math.max(st.v, 0.1);
      if (st.holding) {
        if (input.btn) st.charge = Math.min(1, st.charge + dt / CHARGE_T);
        else { st.holding = false; st.releaseAt = st.untilLip; ev.push({ type: 'release' }); }
      }
      if (st.s <= 0) {
        // ── 도약 (릴리즈 품질 확정 — 아직 안 뗐으면 늦은 릴리즈 대기) ──
        st.q = this._quality(st);
        const th = 9.5 * Math.PI / 180;
        st.x = 0; st.y = 0;
        st.vx = st.v * Math.cos(th);
        st.vy = -st.v * Math.sin(th) + BASE_HOP + JUMP_BONUS * st.q;
        st.phase = 'flight'; st.ft = 0;
        ev.push({ type: 'takeoff', q: st.q, pending: st.holding });
      }

    } else if (st.phase === 'flight') {
      st.ft += dt;
      // 립 통과 직후의 늦은 릴리즈 (부분 인정)
      if (st.holding && !input.btn) {
        st.holding = false;
        if (st.ft < LATE_WIN) {
          st.q = Math.max(st.q, (0.65 - st.ft * 2.5) * Math.min(1, st.charge / (CHARGE_T * 0.9)));
          st.vy += JUMP_BONUS * st.q * 0.6;
          ev.push({ type: 'takeoff', q: st.q, late: true });
        }
      }
      // 활공 (자세 = 릴리즈 품질로 고정, 추가 조작 없음)
      const pq = this.poseQ(st);
      let lift = stg.cl * st.vx * st.vx * pq + 0.055 * stg.wind;
      lift = Math.min(lift, 9.4);
      st.vy += (-G0 + lift) * dt;
      st.vx -= 0.011 * (1.3 - pq) * st.vx * dt;
      st.x += st.vx * dt;
      st.y += st.vy * dt;
      // 착지
      if (st.y <= stg.hillY(st.x)) {
        st.crash = st.q < 0.15;                          // 타이밍을 놓치면 데굴데굴
        st.dist = Math.round(Math.sqrt(st.x * st.x + st.y * st.y) * 2) / 2;
        const T = stg.target;
        st.stars = st.dist >= T * 1.14 ? 3 : st.dist >= T * 1.07 ? 2 : st.dist >= T ? 1 : 0;
        if (st.crash && st.stars > 1) st.stars = 1;
        st.phase = 'landed'; st.landT = 0;
        ev.push({ type: 'land', dist: st.dist, stars: st.stars, crash: st.crash });
      }

    } else if (st.phase === 'landed') {
      st.landT += dt;
      st.x += Math.max(0, st.vx * Math.exp(-st.landT * 1.4)) * dt;
      st.y = stg.hillY(st.x);
    }
    return ev;
  },
};

}
/* ── render.js ── */
{
// render.js — three.js 복셀 3D 렌더 (모구 어디가 방식) + 뒤통수 추적 카메라
// 좌표: z = 전진(활강→비행 방향), y = 높이, x = 좌우. 립(도약대 끝) = 원점.

const M = window.MSJ;

const BOXG = new THREE.BoxGeometry(1, 1, 1);

M.Render = {
  renderer: null, scene: null, camera: null,
  moguGroup: null, moguSprite: null, sackMesh: null,
  stageGroup: null, surfaceY: null, targetZ: 0,

  init(container) {
    this.renderer = new THREE.WebGLRenderer({ antialias: true });
    this.renderer.setSize(window.innerWidth, window.innerHeight);
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2.5));
    container.insertBefore(this.renderer.domElement, container.firstChild);

    this.scene = new THREE.Scene();
    this.camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.1, 600);
    window.addEventListener('resize', () => {
      this.camera.aspect = window.innerWidth / window.innerHeight;
      this.camera.updateProjectionMatrix();
      this.renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 조명
    this.hemi = new THREE.HemisphereLight(0xffffff, 0x668855, 0.9);
    this.sun = new THREE.DirectionalLight(0xfff2c8, 1.0);
    this.sun.position.set(30, 60, -20);
    this.scene.add(this.hemi, this.sun);

    // ── 모구 (사진 빌보드 — 캔버스 경유 필수) + 포대 ──
    const g = new THREE.Group();
    this.sackMesh = new THREE.Mesh(BOXG, new THREE.MeshLambertMaterial({ color: 0xa8783c }));
    this.sackMesh.scale.set(1.6, 0.6, 2.0);
    this.sackMesh.position.y = 0.36;                 // 포대 윗면 y=0.66
    g.add(this.sackMesh);
    // 스프라이트는 바닥 앵커: 엉덩이(이미지 위에서 56% 지점)가 포대 윗면에 앉고
    // 꼬리는 포대 뒤(카메라 쪽) 면으로 늘어져 튀어나옴
    this.SPR_H = 1.7; this.SPR_BOT = -0.05; this.sprA = 0.41;
    this.moguMat = new THREE.SpriteMaterial({ color: 0xffffff });
    this.moguSprite = new THREE.Sprite(this.moguMat);
    this.moguSprite.position.set(0, this.SPR_BOT + this.SPR_H / 2, -1.02);
    this.moguSprite.scale.set(this.SPR_H * this.sprA, this.SPR_H, 1);
    g.add(this.moguSprite);
    const sh = new THREE.Mesh(new THREE.CircleGeometry(1.0, 14),
      new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.2, depthWrite: false }));
    sh.rotation.x = -Math.PI / 2; sh.position.y = 0.02;
    this.shadow = sh;
    g.add(sh);
    this.moguGroup = g;
    this.scene.add(g);

    const img = new Image();
    img.onload = () => {
      const cv = document.createElement('canvas');
      cv.width = img.naturalWidth; cv.height = img.naturalHeight;
      cv.getContext('2d').drawImage(img, 0, 0);
      const tex = new THREE.CanvasTexture(cv);
      tex.colorSpace = THREE.SRGBColorSpace;
      this.moguMat.map = tex;
      this.moguMat.needsUpdate = true;
      this.sprA = cv.width / cv.height;
      this.moguSprite.scale.set(this.SPR_H * this.sprA, this.SPR_H, 1);
    };
    img.src = M.ASSETS.mogu;
  },

  setStage(stage, best) {
    if (this.stageGroup) {
      this.scene.remove(this.stageGroup);
      this.stageGroup.traverse((o) => { if (o.isInstancedMesh) o.dispose(); });
    }
    const th = stage.theme;
    const grp = new THREE.Group();
    this.stageGroup = grp;

    // 분위기
    this.scene.background = new THREE.Color(th.sky0);
    this.scene.fog = new THREE.Fog(new THREE.Color(th.sky1), 50, 320);
    this.hemi.intensity = th.night ? 0.45 : 0.9;
    this.sun.intensity = th.night ? 0.4 : 1.0;

    // 지면 높이 함수: z<0 인런(x→y 역참조), z≥0 착지 언덕. 출발대 뒤는 평평한 플랫폼
    const pts = stage.inrunPts;                 // x 단조 감소 (0 → -음수)
    const topX = pts[pts.length - 1].x, topY = pts[pts.length - 1].y;
    const inY = (z) => {
      if (z >= 0) return 0;
      if (z <= topX) return topY;               // 출발 플랫폼
      let lo = 0, hi = pts.length - 1;
      while (lo < hi - 1) { const mid = (lo + hi) >> 1; if (pts[mid].x > z) lo = mid; else hi = mid; }
      const A = pts[lo], B = pts[hi];
      const f = (z - A.x) / (B.x - A.x || -1);
      return A.y + (B.y - A.y) * f;
    };
    this.surfaceY = (z) => (z < 0 ? inY(z) : stage.hillY(z));

    // 목표·최고 기록의 z 좌표 (거리 = sqrt(z²+y²) 역산)
    const solve = (d) => {
      let lo = 0, hi = stage.K1 + stage.EASE + 30;
      for (let i = 0; i < 20; i++) {
        const mid = (lo + hi) / 2;
        if (Math.sqrt(mid * mid + stage.hillY(mid) ** 2) < d) lo = mid; else hi = mid;
      }
      return (lo + hi) / 2;
    };
    this.targetZ = solve(stage.target);
    const bestZ = best > 0 ? solve(best) : null;

    // ── 지면 ──
    // 트랙(활강로): 0.25m 소형 슬래브가 프로파일을 연속으로 따라감 → 매끄러운 비탈
    // 둔치·지반: 1m 복셀 (마인크래프트 질감 유지)
    const zMin = Math.floor(topX) - 12;         // 출발 플랫폼 여유 (카메라 자리)
    const zMax = Math.ceil(stage.K1 + stage.EASE + 18);
    const HALF_W = 14;                          // 둔치 폭 (장식이 앉을 어깨 포함)
    const TRACK_HW = 3.5, S = 0.25;             // 트랙 반폭·소형 박스 크기
    const cTrack = new THREE.Color(th.track), cGround = new THREE.Color(th.ground);
    const cDirt = new THREE.Color(th.ground).multiplyScalar(0.55);
    const cAccent = new THREE.Color(th.accent), cLip = new THREE.Color(0xd83a3a);
    const cMark = new THREE.Color(th.night ? 0x9080c0 : 0xffffff);
    const hash = (a, b) => {
      let h = (Math.imul(a, 374761393) + Math.imul(b, 668265263)) | 0;
      h = Math.imul(h ^ (h >>> 13), 1274126177);
      return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
    };
    // 10m 간격 눈금·목표 라인의 z 좌표
    const markZ = [];
    const maxD = Math.hypot(zMax, stage.hillY(zMax));
    for (let d = 10; d < maxD; d += 10) markZ.push(solve(d));
    const tgtZ = this.targetZ;

    // 1) 트랙 소형 슬래브
    const strip = [];
    const cols = Math.round((TRACK_HW * 2) / S);
    for (let z = zMin; z < zMax; z += S) {
      const zc = z + S / 2;
      const sy = this.surfaceY(zc);
      for (let ci = 0; ci < cols; ci++) {
        const xc = -TRACK_HW + S / 2 + ci * S;
        let col;
        if (zc >= -1 && zc <= 0) col = Math.floor(Math.abs(xc) * 2) % 2 ? cLip : cMark;      // 도약대 끝 줄무늬
        else if (zc > 0 && Math.abs(zc - tgtZ) < 0.3) col = cAccent;                          // 목표 라인
        else if (zc > 0 && markZ.some((m) => Math.abs(zc - m) < 0.15)) col = cMark;           // 10m 눈금
        else col = cTrack.clone().multiplyScalar(0.94 + hash(Math.floor(zc), Math.floor(xc * 2)) * 0.12);
        strip.push({ x: xc, y: sy - 0.25, z: zc, col });
      }
    }
    const imS = new THREE.InstancedMesh(BOXG, new THREE.MeshLambertMaterial(), strip.length);
    {
      const mtx = new THREE.Matrix4();
      strip.forEach((c, i) => {
        mtx.makeScale(S, 0.5, S);
        mtx.setPosition(c.x, c.y, c.z);
        imS.setMatrixAt(i, mtx);
        imS.setColorAt(i, c.col);
      });
      imS.instanceMatrix.needsUpdate = true;
      if (imS.instanceColor) imS.instanceColor.needsUpdate = true;
      grp.add(imS);
    }

    // 2) 둔치(1m 복셀) + 트랙 밑 지반
    const cells = [];
    for (let z = zMin; z <= zMax; z++) {
      const ys = Math.floor(this.surfaceY(z + 0.5));
      for (let wx = -HALF_W; wx <= HALF_W; wx++) {
        const isSide = Math.abs(wx) > TRACK_HW;
        const dep = isSide ? 4 : 3;
        for (let d = isSide ? 0 : 1; d < dep; d++) {
          let col;
          if (d > 0) col = cDirt.clone().multiplyScalar(0.85 + hash(z * 3 + d, wx) * 0.3);
          else col = cGround.clone().multiplyScalar(0.9 + hash(z, wx) * 0.2);
          cells.push({ x: wx, y: ys - d, z, col });
        }
      }
    }
    const im = new THREE.InstancedMesh(BOXG, new THREE.MeshLambertMaterial(), cells.length);
    {
      const mtx = new THREE.Matrix4();
      cells.forEach((c, i) => {
        mtx.identity();
        mtx.setPosition(c.x, c.y - 0.5, c.z + 0.5);
        im.setMatrixAt(i, mtx);
        im.setColorAt(i, c.col);
      });
      im.instanceMatrix.needsUpdate = true;
      if (im.instanceColor) im.instanceColor.needsUpdate = true;
      grp.add(im);
    }

    // ── 계곡 바닥 + 인런 뒤 능선 (수평선이 하늘로 비지 않게) ──
    const outY = stage.hillY(stage.K1 + stage.EASE + 20);
    const valley = new THREE.Mesh(BOXG, new THREE.MeshLambertMaterial({ color: cGround.clone().multiplyScalar(0.8) }));
    valley.scale.set(600, 2, 500);
    valley.position.set(0, outY - 1.2, zMax + 180);
    const valley2 = valley.clone();
    valley2.position.set(0, outY - 1.2, (zMin + zMax) / 2);
    valley2.scale.set(600, 2, zMax - zMin + 100);
    grp.add(valley, valley2);

    // ── 깃발 (목표 / 최고 기록) ──
    const flag = (z, color, h) => {
      const fg = new THREE.Group();
      const pole = new THREE.Mesh(BOXG, new THREE.MeshLambertMaterial({ color: 0xd8d8d8 }));
      pole.scale.set(0.18, h, 0.18); pole.position.y = h / 2;
      const cloth = new THREE.Mesh(BOXG, new THREE.MeshLambertMaterial({ color }));
      cloth.scale.set(0.12, 0.8, 1.4); cloth.position.set(0, h - 0.5, 0.8);
      fg.add(pole, cloth);
      fg.position.set(TRACK_HW + 5.7, this.surfaceY(z), z);
      const fg2 = fg.clone();
      fg2.position.x = -TRACK_HW - 5.7;
      grp.add(fg, fg2);
    };
    flag(this.targetZ, new THREE.Color(th.accent), 3.4);
    if (bestZ) flag(bestZ, new THREE.Color(0xffffff), 2.2);

    // ── 둔치·하늘 장식 (테마별 — 인스턴스드 복셀, 활강로·비행로 좌우를 채움) ──
    const solids = [], glows = [];
    const put = (arr, x, y, z, sx, sy, sz, col, rot = 0) =>
      arr.push({ x, y, z, sx, sy, sz, col: col instanceof THREE.Color ? col : new THREE.Color(col), rot });
    const W = stage.world;

    // 소품 (r: 0~1 변주값)
    const mkTree = (x, y, z, r, leafC) => {
      const h = 1.6 + r * 1.4;
      put(solids, x, y + h / 2, z, 0.55, h, 0.55, 0x7a4f2b, r * 6);
      put(solids, x, y + h + 0.85, z, 1.7 + r, 1.8 + r, 1.7 + r, leafC, r * 6);
    };
    const mkFir = (x, y, z, r) => {
      const h = 1.1 + r * 0.7;
      put(solids, x, y + h / 2, z, 0.5, h, 0.5, 0x5a3f24, r * 6);
      put(solids, x, y + h + 0.9, z, 2.1 + r * 0.6, 1.7, 2.1 + r * 0.6, 0x2f5d3a, r * 6);
      put(solids, x, y + h + 2.2, z, 1.3 + r * 0.4, 1.1, 1.3 + r * 0.4, 0x38684a, r * 6);
      put(solids, x, y + h + 3.0, z, 0.8, 0.5, 0.8, 0xf2f8ff, r * 6);   // 눈 모자
    };
    const mkCactus = (x, y, z, r) => {
      const h = 1.8 + r * 1.8;
      put(solids, x, y + h / 2, z, 0.75, h, 0.75, 0x4e9c3c, r * 6);
      if (r > 0.45) {
        put(solids, x + 0.7, y + h * 0.55, z, 0.7, 0.45, 0.45, 0x459036);
        put(solids, x + 0.95, y + h * 0.72, z, 0.4, 0.8, 0.45, 0x459036);
      }
    };
    const mkRock = (x, y, z, r, col) => {
      put(solids, x, y + 0.35 + r * 0.25, z, 1.0 + r, 0.7 + r * 0.6, 0.9 + r * 0.8, col, r * 6);
      if (r > 0.55) put(solids, x + 0.6, y + 0.25, z + 0.4, 0.6, 0.5, 0.55, col);
    };
    const mkBush = (x, y, z, r, col) =>
      put(solids, x, y + 0.4 + r * 0.2, z, 1.1 + r * 0.7, 0.8 + r * 0.4, 1.1 + r * 0.7, col, r * 6);
    const mkFlower = (x, y, z, r) => {
      put(solids, x, y + 0.25, z, 0.12, 0.5, 0.12, 0x3e8b3e);
      put(solids, x, y + 0.58, z, 0.34, 0.26, 0.34, [0xff6fa0, 0xffd83d, 0xffffff, 0xff8a5c][Math.floor(r * 4) % 4]);
    };
    const mkMushroom = (x, y, z, r, capC, glow) => {
      put(solids, x, y + 0.3, z, 0.28, 0.6, 0.28, 0xe8dcc8);
      put(glow ? glows : solids, x, y + 0.72, z, 0.8 + r * 0.3, 0.35, 0.8 + r * 0.3, capC);
    };
    const mkSnowman = (x, y, z, r) => {
      put(solids, x, y + 0.5, z, 1.0, 1.0, 1.0, 0xf4f8ff, r * 6);
      put(solids, x, y + 1.3, z, 0.7, 0.7, 0.7, 0xf4f8ff, r * 6);
      put(solids, x, y + 1.32, z + 0.36, 0.14, 0.14, 0.3, 0xff8a3c, r * 6);  // 당근 코
    };
    const mkTorch = (x, y, z, r) => {
      put(solids, x, y + 0.8, z, 0.28, 1.6, 0.28, 0x6a4a2a);
      put(glows, x, y + 1.8, z, 0.5, 0.5, 0.5, 0xffc84a);
    };
    const mkCrystal = (x, y, z, r) => {
      const h = 1.2 + r * 1.6;
      put(glows, x, y + h / 2, z, 0.5, h, 0.5, r > 0.5 ? 0xc07aff : 0x7ab8ff, 0.5 + r * 5);
      if (r > 0.4) put(glows, x + 0.5, y + h * 0.3, z + 0.3, 0.3, h * 0.5, 0.3, 0x9a8aff, r * 5);
    };

    const deco = (x, y, z, r, k) => {
      if (W === 1) {
        if (k < 0.48) mkTree(x, y, z, r, r > 0.6 ? 0x54b04a : 0x3e9b3e);
        else if (k < 0.68) mkBush(x, y, z, r, 0x4a9c44);
        else if (k < 0.82) mkRock(x, y, z, r, 0x9a9a92);
        else mkFlower(x, y, z, r);
      } else if (W === 2) {
        if (k < 0.55) mkTree(x, y, z, r, [0xd88a2c, 0xc8552a, 0xe6b83c][Math.floor(r * 3) % 3]);
        else if (k < 0.72) mkMushroom(x, y, z, r, 0xd83a3a, false);
        else if (k < 0.87) mkBush(x, y, z, r, 0xb06a2c);
        else mkRock(x, y, z, r, 0x8a7a66);
      } else if (W === 3) {
        if (k < 0.5) mkCactus(x, y, z, r);
        else if (k < 0.76) mkRock(x, y, z, r, 0xc0a070);
        else mkBush(x, y, z, r, 0xa08048);
      } else if (W === 4) {
        if (k < 0.5) mkFir(x, y, z, r);
        else if (k < 0.68) mkSnowman(x, y, z, r);
        else if (k < 0.88) mkRock(x, y, z, r, 0xbcd8ee);
        else mkTree(x, y, z, r, 0x2f5d3a);
      } else {
        if (k < 0.38) mkCrystal(x, y, z, r);
        else if (k < 0.62) mkTorch(x, y, z, r);
        else if (k < 0.84) mkTree(x, y, z, r, 0x6a4a9a);
        else mkMushroom(x, y, z, r, 0xff8ad8, true);
      }
    };
    // 굵은 소품 두 줄 + 잔풀 스캐터
    const bandLo = TRACK_HW + 1.6, bandHi = HALF_W - 0.8;
    for (let z = zMin + 2; z < zMax - 2; z += 2.5) {
      const zi = Math.round(z * 4);
      for (const side of [1, -1]) {
        const r1 = hash(zi, side * 7);
        if (r1 < 0.24) continue;
        const x = side * (bandLo + r1 * (bandHi - bandLo));
        deco(x, this.surfaceY(z), z, hash(zi + 1, side * 11), hash(zi + 2, side * 13));
      }
      for (const side of [1, -1]) {                   // 잔장식 (꽃·낙엽·조약돌·눈덩이)
        const r2 = hash(zi + 5, side * 17);
        if (r2 < 0.3) continue;
        const sx = side * (TRACK_HW + 0.7 + r2 * (HALF_W - TRACK_HW - 1.4));
        const sy = this.surfaceY(z + 1.2), sz = z + 1.2;
        if (W === 1) mkFlower(sx, sy, sz, r2);
        else if (W === 2) put(solids, sx, sy + 0.06, sz, 0.5, 0.1, 0.5, r2 > 0.6 ? 0xc8552a : 0xe6b83c, r2 * 6);
        else if (W === 3) put(solids, sx, sy + 0.15, sz, 0.4, 0.3, 0.4, 0xb89468, r2 * 6);
        else if (W === 4) put(solids, sx, sy + 0.18, sz, 0.5, 0.36, 0.5, 0xffffff, r2 * 6);
        else if (r2 > 0.62) put(glows, sx, sy + 0.14, sz, 0.26, 0.26, 0.26, 0xb08aff);
      }
    }

    // 구름 — 비행 고도 좌우에 떠서 활공 풍경을 채움 (밤 월드는 보랏빛)
    const cCloud = new THREE.Color(th.night ? 0x584a86 : 0xffffff);
    for (let z = zMin; z < zMax + 50; z += 9) {
      const zi = Math.round(z);
      const r = hash(zi, 991);
      if (r < 0.42) continue;
      const x = (hash(zi, 992) > 0.5 ? 1 : -1) * (9 + hash(zi, 993) * 30);
      const y = this.surfaceY(Math.min(z, zMax)) + 9 + hash(zi, 994) * 20;
      const s = 2.6 + r * 4;
      put(solids, x, y, z, s, 0.9 + r * 0.5, s * 0.55, cCloud);
      put(solids, x + s * 0.45, y + 0.55, z + 0.8, s * 0.6, 0.7, s * 0.4, cCloud);
    }

    // 밤하늘 — 별·달 (월드 5)
    if (th.night) {
      for (let i = 0; i < 150; i++) {
        const r = hash(i, 551), r2 = hash(i, 552), r3 = hash(i, 553);
        const z = zMin - 30 + (zMax - zMin + 150) * r;
        const y = this.surfaceY(Math.max(zMin, Math.min(z, zMax))) + 16 + r3 * 55;
        const s = 0.22 + r3 * 0.4;
        put(glows, (r2 - 0.5) * 170, y, z, s, s, s, r2 > 0.82 ? 0xffe9a8 : 0xffffff);
      }
      put(glows, -48, 62, zMax * 0.6, 7, 7, 2.2, 0xfff2c0);   // 달
    }

    // 좌우 원경 능선 (계곡 벽 실루엣)
    const cFar = new THREE.Color(th.far);
    for (let i = 0; i < 10; i++) {
      const r = hash(i, 771), side = i % 2 ? 1 : -1;
      const zc = zMin + (zMax - zMin) * (i + 0.5) / 10;
      const hgt = 13 + r * 22;
      put(solids, side * (34 + r * 26), this.surfaceY(zc) - 6 + hgt / 2, zc,
        18 + r * 20, hgt, 26 + r * 26, cFar.clone().multiplyScalar(0.85 + r * 0.3), r);
    }

    const addInst = (list, mat) => {
      if (!list.length) return;
      const m = new THREE.InstancedMesh(BOXG, mat, list.length);
      const mtx = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler();
      const vp = new THREE.Vector3(), vs = new THREE.Vector3();
      list.forEach((c, i) => {
        e.set(0, c.rot || 0, 0); q.setFromEuler(e);
        vp.set(c.x, c.y, c.z); vs.set(c.sx, c.sy, c.sz);
        mtx.compose(vp, q, vs);
        m.setMatrixAt(i, mtx);
        m.setColorAt(i, c.col);
      });
      m.instanceMatrix.needsUpdate = true;
      if (m.instanceColor) m.instanceColor.needsUpdate = true;
      grp.add(m);
    };
    addInst(solids, new THREE.MeshLambertMaterial());
    addInst(glows, new THREE.MeshBasicMaterial());

    this.scene.add(grp);
    // 카메라 초기화 (인런 꼭대기 뒤)
    const top = stage.inrunAt(stage.L);
    this.camera.position.set(0, top.y + 3, top.x - 8);
  },

  draw(st, t, dt) {
    const stg = st.stage;
    let mz, my, pitch = 0;
    if (st.phase === 'ready' || st.phase === 'slide') {
      const p = stg.inrunAt(Math.max(0, st.s));
      mz = p.x; my = p.y; pitch = p.th;
    } else {
      mz = st.x; my = st.y;
      pitch = st.phase === 'flight' ? Math.max(-0.3, Math.min(0.5, -Math.atan2(st.vy, st.vx) * 0.55)) : 0;
    }
    const g = this.moguGroup;
    const bob = st.phase === 'slide' ? Math.sin(t * 18) * 0.04 * Math.min(1, st.v / 8) : 0;
    g.position.set(0, my + bob, mz);
    g.rotation.x = st.phase === 'landed' && st.crash ? (st.landT * 9) % (Math.PI * 2) : pitch;
    // 웅크리기(차지) — 엉덩이(바닥 앵커)는 포대에 붙인 채 몸만 낮아짐
    const crouch = st.phase === 'slide' && st.holding ? st.charge : 0;
    const sh = this.SPR_H * (1 - crouch * 0.22);
    this.moguSprite.scale.y = sh;
    this.moguSprite.position.y = this.SPR_BOT + sh / 2;
    this.shadow.visible = st.phase !== 'flight' || (st.y - stg.hillY(st.x)) < 4;

    // ── 뒤통수 추적 카메라 ──
    const spd = st.phase === 'flight' ? Math.hypot(st.vx, st.vy) : st.v;
    const back = 7.0 + spd * 0.10, up = 3.1 + spd * 0.03;
    const damp = dt ? 1 - Math.exp(-dt * 4.5) : 0.08;
    const tx = 0, tz = mz - back;
    // 카메라가 산비탈에 파묻히지 않게 지형 위로 클램프 (뒤쪽은 항상 오르막)
    let tyy = my + up;
    if (this.surfaceY) tyy = Math.max(tyy, this.surfaceY(tz) + 2.4, this.surfaceY(tz + back * 0.5) + 2.0);
    this.camera.position.x += (tx - this.camera.position.x) * damp;
    this.camera.position.y += (tyy - this.camera.position.y) * damp;
    this.camera.position.z += (tz - this.camera.position.z) * damp;
    this.camera.lookAt(0, my + 0.6, mz + 14);
    const fovT = 62 + Math.min(16, spd * 0.35);
    this.camera.fov += (fovT - this.camera.fov) * damp;
    this.camera.updateProjectionMatrix();

    // 모구 머리 위 지점의 화면 좌표 (타이밍 바·차지 게이지 앵커)
    const hv = new THREE.Vector3(0, my + 2.3, mz).project(this.camera);
    this.headScreen = {
      x: (hv.x * 0.5 + 0.5) * window.innerWidth,
      y: (0.5 - hv.y * 0.5) * window.innerHeight,
    };

    this.renderer.render(this.scene, this.camera);
  },
};

}
/* ── audio.js ── */
{
// audio.js — WebAudio 합성 효과음 (외부 파일 없음, 모구 어디가와 같은 방식)
const M = window.MSJ;

const A = {
  ctx: null, master: null,

  init() {
    if (this.ctx) return;
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    this.ctx = new Ctx();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.4;
    this.master.connect(this.ctx.destination);
  },
  resume() { this.init(); if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },

  tone(freq, dur, type = 'square', vol = 0.22, slideTo = null, when = 0) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + when;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.02);
  },

  noise(dur, vol = 0.25, freq = 900, q = 1, when = 0) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + when;
    const len = Math.ceil(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const f = this.ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t0); src.stop(t0 + dur + 0.02);
  },

  // ── 효과음 ──
  tapNoise() { this.noise(0.06, 0.18, 2000, 1.4); },
  start()    { this.noise(0.4, 0.18, 500, 0.8); this.tone(220, 0.2, 'triangle', 0.1, 320); },
  takeoff(q) { this.noise(0.22, 0.26, 1400, 1); this.tone(300 + q * 260, 0.22, 'triangle', 0.2, 620 + q * 300); },
  perfect()  { [880, 1320].forEach((f, i) => this.tone(f, 0.09, 'square', 0.16, null, i * 0.06)); },
  telemark() { [660, 990, 1320].forEach((f, i) => this.tone(f, 0.08, 'square', 0.15, null, i * 0.05)); },
  land()     { this.noise(0.16, 0.3, 700, 0.9); this.tone(140, 0.12, 'square', 0.18, 90); },
  crash()    { this.noise(0.35, 0.32, 500, 0.7); this.tone(200, 0.3, 'sawtooth', 0.2, 60); },
  clear(n)   { const seq = n >= 3 ? [523, 659, 784, 1047, 1319] : n >= 1 ? [523, 659, 784] : [392, 330];
               seq.forEach((f, i) => this.tone(f, 0.16, 'square', 0.18, null, i * 0.1)); },
  fail()     { [392, 330, 262].forEach((f, i) => this.tone(f, 0.22, 'triangle', 0.18, null, i * 0.18)); },
  meow()     { this.tone(700, 0.28, 'sawtooth', 0.1, 420); },
};

M.audio = A;

}
/* ── ui.js ── */
{
// ui.js — 저장 + 힐 맵 + 화면 전환
const M = window.MSJ;
const $ = (id) => document.getElementById(id);

M.save = {
  KEY: 'moguski-save-v1',
  data: { stars: {}, best: {} },
  load() {
    try { const raw = localStorage.getItem(this.KEY); if (raw) this.data = Object.assign(this.data, JSON.parse(raw)); } catch (e) {}
    return this.data;
  },
  store() { try { localStorage.setItem(this.KEY, JSON.stringify(this.data)); } catch (e) {} },
  unlocked() {
    let max = 1;
    for (let s = 1; s <= 50; s++) if (this.data.stars[s] > 0) max = Math.max(max, Math.min(50, s + 1));
    return max;
  },
  record(no, stars, dist) {
    this.data.stars[no] = Math.max(this.data.stars[no] || 0, stars);
    if (dist > (this.data.best[no] || 0)) { this.data.best[no] = dist; this.store(); return true; }
    this.store();
    return false;
  },
};

M.ui = {
  screens: ['title-screen', 'map-screen', 'result-screen', 'pause-screen'],
  onStageClick: null,
  toastTimer: null,

  init() {
    $('title-icon').src = M.ASSETS.mogu;
  },

  show(id) {
    for (const s of this.screens) $(s).classList.toggle('hidden', s !== id);
  },
  hideAll() { for (const s of this.screens) $(s).classList.add('hidden'); },

  buildMap() {
    const track = $('map-track');
    track.innerHTML = '';
    const unlocked = M.save.unlocked();
    for (let w = 1; w <= 5; w++) {
      const head = document.createElement('div');
      head.className = 'map-world';
      head.textContent = `WORLD ${w} · ${M.WORLDS[w].name}`;
      track.appendChild(head);
      const grid = document.createElement('div');
      grid.className = 'map-grid';
      for (let i = 1; i <= 10; i++) {
        const no = (w - 1) * 10 + i;
        const cell = document.createElement('button');
        cell.className = 'stage-cell';
        const stars = M.save.data.stars[no] || 0;
        if (stars > 0) cell.classList.add('cleared');
        if (no > unlocked) { cell.classList.add('locked'); cell.textContent = '🔒'; }
        else {
          cell.innerHTML = `<b>${no}</b>` +
            (no % 10 === 0 ? '<span class="crown">👑</span>' : '') +
            (stars > 0 ? `<span class="stars">${'★'.repeat(stars)}${'☆'.repeat(3 - stars)}</span>`
                       : `<span class="stars dim">${M.TARGETS[no - 1]}m</span>`);
          cell.addEventListener('click', () => this.onStageClick && this.onStageClick(no));
        }
        grid.appendChild(cell);
      }
      track.appendChild(grid);
    }
  },

  hudRun(st) {
    const stg = st.stage;
    $('hud-stage').textContent = `STAGE ${st.no} · ${stg.theme.name}${stg.rival ? ' · 👑 ' + stg.rival : ''}`;
    $('hud-target').textContent = `목표 ${stg.target}m · 최고 ${(M.save.data.best[st.no] || 0).toFixed(1)}m`;
  },

  toast(text, dur = 1.8) {
    const el = $('hud-toast');
    el.textContent = text;
    el.style.opacity = 1;
    clearTimeout(this.toastTimer);
    this.toastTimer = setTimeout(() => { el.style.opacity = 0; }, dur * 1000);
  },

  showResult(st, isBest) {
    const T = st.stage.target;
    $('result-dist').textContent = st.dist.toFixed(1) + ' m';
    $('result-stars').textContent = st.stars > 0 ? '★'.repeat(st.stars) + '☆'.repeat(3 - st.stars) : '';
    $('result-title').textContent = st.stars > 0 ? (st.stars === 3 ? '완벽한 비행!!' : 'CLEAR!') : '아쉽다...';
    $('result-title').style.color = st.stars > 0 ? '#ffd83d' : '#ff8a8a';
    const qLabel = st.q >= 0.9 ? '퍼펙트!' : st.q >= 0.6 ? '좋음' : st.q > 0.15 ? '아쉬움' : '미스';
    let html = `릴리즈 타이밍 <b>${qLabel}</b> · 목표 ${T}m`;
    if (st.crash) html += ' · <b style="color:#ff8a8a">데굴데굴 착지 🙀</b>';
    if (isBest) html += '<br><b style="color:#7de08a">신기록!</b>';
    $('result-stats').innerHTML = html;
    $('btn-next').style.display = st.stars > 0 && st.no < 50 ? '' : 'none';
    this.show('result-screen');
  },
};

}
/* ── main.js ── */
{
// main.js — 게임 루프 + 상태 머신 + 입력 (꾹 누르고 → 도약대 끝에서 떼기)
const M = window.MSJ;
const $ = (id) => document.getElementById(id);

let mode = 'title';            // title | map | run | pause | result
let st = null;
const input = { btn: false };

M.save.load();
M.ui.init();
M.Render.init(document.getElementById('app'));
M.ui.show('title-screen');

function goMap() {
  mode = 'map';
  M.ui.buildMap();
  M.ui.show('map-screen');
  $('hud').classList.add('hidden');
  $('ready-overlay').classList.add('hidden');
}

function startStage(no) {
  st = M.Logic.create(no);
  mode = 'run';
  M.ui.hideAll();
  $('hud').classList.remove('hidden');
  $('hud-dist').classList.add('hidden');
  $('ready-overlay').classList.remove('hidden');
  M.ui.hudRun(st);
  M.Render.setStage(st.stage, M.save.data.best[no] || 0);
  const stg = st.stage;
  $('hud-wind').textContent = stg.wind === 0 ? '' :
    `${stg.wind > 0 ? '◀ 맞바람' : '▶ 뒷바람'} ${Math.abs(stg.wind).toFixed(1)}m/s ${stg.wind > 0 ? '(유리)' : '(불리)'}`;
  $('hud-wind').style.color = stg.wind > 0 ? '#7de08a' : '#ff8a8a';
  M.audio.resume(); M.audio.meow();
}

M.ui.onStageClick = (no) => startStage(no);

function finishRun() {
  const isBest = M.save.record(st.no, st.stars, st.dist);
  mode = 'result';
  M.ui.showResult(st, isBest);
  if (st.stars > 0) M.audio.clear(st.stars); else M.audio.fail();
}

function handleEvents(evs) {
  for (const e of evs) {
    switch (e.type) {
      case 'start': M.audio.start(); $('ready-overlay').classList.add('hidden'); break;
      case 'release': M.audio.tapNoise(); break;
      case 'takeoff':
        if (e.pending) break;                       // 아직 홀드 중 (늦은 릴리즈 대기)
        M.audio.takeoff(e.q);
        if (e.q >= 0.9) { M.audio.perfect(); M.ui.toast('퍼펙트 릴리즈!!', 1.4); }
        else if (e.q >= 0.6) M.ui.toast('좋은 도약!', 1.2);
        else if (e.q > 0.15) M.ui.toast('조금 어긋났다…', 1.2);
        else M.ui.toast('타이밍 미스…', 1.2);
        break;
      case 'land': if (e.crash) M.audio.crash(); else M.audio.land(); break;
    }
  }
}

// ── 키보드 (Space/Z/↑ = 버튼 홀드) ──
window.addEventListener('keydown', (e) => {
  M.audio.resume();
  const k = e.key;
  if ([' ', 'ArrowUp'].includes(k)) e.preventDefault();
  if (k === ' ' || k === 'z' || k === 'Z' || k === 'ArrowUp') input.btn = true;

  if (mode === 'title') {
    if (k === 'Enter') goMap();
  } else if (mode === 'map') {
    if (k === 'Enter') startStage(Math.min(M.save.unlocked(), 50));
    if (k === 'Escape') { mode = 'title'; M.ui.show('title-screen'); }
  } else if (mode === 'run') {
    if (k === 'Escape') { mode = 'pause'; M.ui.show('pause-screen'); }
    if (k === 'r' || k === 'R') startStage(st.no);
  } else if (mode === 'pause') {
    if (k === 'Enter' || k === 'Escape') { mode = 'run'; M.ui.hideAll(); }
    if (k === 'r' || k === 'R') startStage(st.no);
    if (k === 'm' || k === 'M') goMap();
  } else if (mode === 'result') {
    if (k === 'Enter') { if (st.stars > 0 && st.no < 50) startStage(st.no + 1); else startStage(st.no); }
    if (k === 'm' || k === 'M') goMap();
  }
});
window.addEventListener('keyup', (e) => {
  if (e.key === ' ' || e.key === 'z' || e.key === 'Z' || e.key === 'ArrowUp') input.btn = false;
});

$('btn-start').onclick = () => goMap();
$('btn-series').onclick = () => {
  // 개발 페이지(/moguski/)와 빌드본(루트) 양쪽에서 런처로 이동
  location.href = location.pathname.includes('/moguski/') ? '../index.html' : 'index.html';
};
$('btn-retry').onclick = () => startStage(st.no);
$('btn-map').onclick = () => goMap();
$('btn-next').onclick = () => startStage(st.no + 1);
$('btn-resume').onclick = () => { mode = 'run'; M.ui.hideAll(); };
$('btn-prestart').onclick = () => startStage(st.no);
$('btn-pmap').onclick = () => goMap();

// ── 터치: 화면 전체가 버튼 (누르고 있기 → 떼기) ──
const isTouch = window.matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
if (isTouch) {
  document.body.classList.add('touch');
  $('ready-hint').innerHTML = '화면을 꾹 누르면 모구가 웅크려요<br>도약대 끝에서 손을 떼면 점프!';
  $('title-hint').textContent = '화면을 꾹 눌러 활강 — 도약대 끝에서 떼면 점프!';
  document.addEventListener('touchmove', (e) => {
    if (!e.target.closest('#map-scroll')) e.preventDefault();
  }, { passive: false });
  document.addEventListener('gesturestart', (e) => e.preventDefault());
}
const app = document.getElementById('app');
app.addEventListener('pointerdown', (e) => {
  if (e.target.closest('.btn, .vbtn, .stage-cell')) return;
  M.audio.resume();
  if (mode === 'run') { e.preventDefault(); input.btn = true; }
});
app.addEventListener('pointerup', () => { input.btn = false; });
app.addEventListener('pointercancel', () => { input.btn = false; });
$('vbtn-pause').addEventListener('pointerdown', (e) => {
  e.preventDefault(); e.stopPropagation();
  if (mode === 'run') { mode = 'pause'; M.ui.show('pause-screen'); }
});

// ── 디버그 훅 (테스트 자동화용) ──
M._dbg = () => ({
  mode, no: st ? st.no : 0, phase: st ? st.phase : null,
  dist: st ? st.dist : 0, stars: st ? st.stars : 0,
  untilLip: st ? +st.untilLip.toFixed(3) : 99,
  charge: st ? +st.charge.toFixed(2) : 0, q: st ? +st.q.toFixed(2) : 0,
  holding: st ? st.holding : false,
  x: st ? +st.x.toFixed(1) : 0, y: st ? +st.y.toFixed(1) : 0, v: st ? +st.v.toFixed(1) : 0,
});
M._st = () => st;

// ── HUD 갱신 ──
function updateHud() {
  const slide = st.phase === 'slide';
  // 타이밍 바·차지 게이지를 모구 머리 위에 앵커
  const hp = M.Render.headScreen;
  if (hp) {
    $('meter-wrap').style.left = hp.x + 'px';
    $('meter-wrap').style.top = hp.y + 'px';
    $('charge-wrap').style.left = hp.x + 'px';
    $('charge-wrap').style.top = hp.y + 'px';
  }
  $('meter-wrap').classList.toggle('hidden', !(slide && st.untilLip < 1.15 && st.holding));
  if (slide && st.untilLip < 1.15) {
    $('meter-needle').style.left = `calc(${((1 - Math.min(1, st.untilLip / 1.15)) * 100).toFixed(1)}% - 2px)`;
  }
  $('charge-wrap').classList.toggle('hidden', !(slide && st.holding && st.untilLip >= 1.15));
  if (slide) $('charge-fill').style.width = (st.charge * 100).toFixed(0) + '%';
  $('hud-speed').textContent = slide ? `${(st.v * 3.6).toFixed(0)} km/h` : '';
  const flying = st.phase === 'flight' || st.phase === 'landed';
  $('hud-dist').classList.toggle('hidden', !flying);
  if (flying) {
    const d = st.phase === 'landed' ? st.dist : Math.round(Math.hypot(st.x, st.y) * 2) / 2;
    $('hud-dist').textContent = d.toFixed(1) + ' m';
  }
}

// ── 메인 루프 ──
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  $('vbtn-pause').style.display = isTouch && mode === 'run' ? 'flex' : 'none';

  if (mode === 'run' && st) {
    handleEvents(M.Logic.step(st, dt, input));
    updateHud();
    if (st.phase === 'landed' && st.landT > 1.6) finishRun();
  }
  if (st) M.Render.draw(st, now / 1000, dt);
}
requestAnimationFrame(frame);

}
</script>
</body>
</html>
