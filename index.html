<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>모구 어디가</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000;
    font-family:'Malgun Gothic','맑은 고딕',sans-serif; user-select:none; }
  #app { position:relative; width:100%; height:100%; }
  canvas { display:block; }

  .screen { position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; z-index:10; }
  .hidden { display:none !important; }

  /* ── 타이틀 ─────────────────────────── */
  #title-screen { background:linear-gradient(#7ec8f0 0%, #b8e4f7 55%, #4f9be0 56%, #3d7be8 100%); }
  #title-screen .logo { font-size:84px; font-weight:900; color:#fff;
    text-shadow:0 5px 0 #2a5db0, 0 9px 18px rgba(0,0,0,.35); letter-spacing:6px; }
  #title-screen .sub { margin-top:6px; font-size:20px; color:#1c3f78; font-weight:700; }
  #title-icon { width:170px; height:auto; margin:26px 0 8px; animation:bob 1.6s ease-in-out infinite;
    filter:drop-shadow(0 8px 10px rgba(0,0,0,.3)); }
  @keyframes bob { 0%,100%{transform:translateY(0) rotate(-3deg)} 50%{transform:translateY(-14px) rotate(3deg)} }
  .press { margin-top:34px; font-size:22px; color:#fff; font-weight:700;
    animation:blink 1.2s step-end infinite; text-shadow:0 2px 4px rgba(0,0,0,.4); }
  @keyframes blink { 50%{opacity:.15} }

  /* ── 월드 맵 ────────────────────────── */
  #map-screen { background:#1b2838; justify-content:flex-start; }
  #map-head { width:100%; padding:14px 0 10px; text-align:center; color:#fff;
    font-size:26px; font-weight:800; background:rgba(0,0,0,.35); z-index:2; letter-spacing:3px; }
  #map-scroll { position:relative; width:100%; flex:1; overflow-y:auto; scroll-behavior:smooth; }
  #map-track { position:relative; width:100%; }
  .world-band { position:absolute; left:0; width:100%; }
  .world-label { position:absolute; left:18px; top:10px; color:rgba(255,255,255,.85);
    font-size:17px; font-weight:800; text-shadow:0 1px 3px rgba(0,0,0,.5); }
  .stage-node { position:absolute; width:64px; height:64px; margin:-32px; border-radius:50%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-size:20px; font-weight:800; color:#fff; cursor:pointer;
    border:4px solid rgba(255,255,255,.85); box-shadow:0 4px 8px rgba(0,0,0,.45);
    background:#3a86d4; transition:transform .12s; }
  .stage-node .stars { font-size:11px; line-height:1; margin-top:1px; color:#ffd83d; letter-spacing:1px; }
  .stage-node.locked { background:#56606e; color:rgba(255,255,255,.55); cursor:default; border-color:rgba(255,255,255,.3); }
  .stage-node.cleared { background:#3aa84f; }
  .stage-node.selected { transform:scale(1.28); border-color:#ffd83d; z-index:3;
    box-shadow:0 0 0 6px rgba(255,216,61,.35), 0 6px 12px rgba(0,0,0,.5); }
  .map-hint { width:100%; display:flex; align-items:center; justify-content:center; gap:18px;
    color:rgba(255,255,255,.75); font-size:15px;
    padding:8px 0 10px; background:rgba(0,0,0,.35); z-index:2; }
  .btn-mini { padding:7px 14px; font-size:14px; font-weight:700; color:#fff;
    background:#2e6da3; border:2px solid rgba(255,255,255,.55); border-radius:9px; cursor:pointer;
    font-family:inherit; }
  .btn-mini:hover { background:#3a86d4; }
  #save-msg { color:#ffd83d; font-weight:700; min-width:0; }

  /* ── HUD ───────────────────────────── */
  #hud { position:absolute; inset:0; pointer-events:none; z-index:5; }
  #hud-hearts { position:absolute; top:14px; left:18px; font-size:30px; letter-spacing:4px;
    text-shadow:0 2px 3px rgba(0,0,0,.5); }
  #hud-stage { position:absolute; top:16px; left:50%; transform:translateX(-50%);
    color:#fff; font-size:19px; font-weight:800; text-shadow:0 2px 3px rgba(0,0,0,.6); }
  #hud-progress { position:absolute; top:46px; left:50%; transform:translateX(-50%);
    width:min(420px,60vw); height:12px; background:rgba(0,0,0,.45); border-radius:7px;
    border:2px solid rgba(255,255,255,.7); }
  #hud-progress-fill { height:100%; width:0%; background:linear-gradient(90deg,#5db8ff,#9fe06a); border-radius:5px; }
  #hud-progress-icon { position:absolute; top:-12px; font-size:21px; transform:translateX(-50%); transition:left .2s linear; }
  #hud-home { position:absolute; right:-13px; top:-13px; font-size:22px; }
  #hud-items { position:absolute; top:14px; right:18px; color:#fff; font-size:21px; font-weight:800;
    text-shadow:0 2px 3px rgba(0,0,0,.6); text-align:right; }
  #hud-speed { position:absolute; bottom:18px; left:50%; transform:translateX(-50%);
    color:rgba(255,255,255,.9); font-size:15px; font-weight:700; text-shadow:0 1px 3px rgba(0,0,0,.7); }
  #hud-toast { position:absolute; top:30%; left:50%; transform:translateX(-50%);
    color:#fff; font-size:30px; font-weight:900; text-shadow:0 3px 6px rgba(0,0,0,.6);
    opacity:0; transition:opacity .3s; white-space:nowrap; }

  /* ── 컨티뉴 ─────────────────────────── */
  #continue-screen { background:rgba(0,0,0,.82); z-index:20; }
  #continue-screen .big { font-size:64px; font-weight:900; color:#ff5252;
    text-shadow:0 0 24px rgba(255,82,82,.6); letter-spacing:8px; }
  #coin-slot { margin:28px 0 6px; width:90px; height:130px; border-radius:12px;
    background:linear-gradient(#caa53d,#8f6f1d); border:4px solid #5e470f;
    display:flex; align-items:center; justify-content:center; position:relative;
    box-shadow:0 8px 16px rgba(0,0,0,.6); }
  #coin-slot .slit { width:10px; height:64px; background:#241a05; border-radius:5px;
    box-shadow:inset 0 0 6px #000; }
  #coin { position:absolute; top:-66px; left:50%; width:46px; height:46px; margin-left:-23px;
    border-radius:50%; background:radial-gradient(circle at 35% 32%, #ffe98a, #e0a921 70%, #9c7110);
    border:3px solid #7a5a0d; display:flex; align-items:center; justify-content:center;
    color:#7a5a0d; font-weight:900; font-size:22px; opacity:0; }
  #coin.drop { animation:coindrop .55s ease-in forwards; }
  @keyframes coindrop { 0%{opacity:1; top:-66px; transform:rotate(0)} 70%{opacity:1}
    100%{opacity:0; top:34px; transform:rotate(160deg) scaleX(.2)} }
  #continue-count { font-size:88px; font-weight:900; color:#fff; margin-top:10px;
    text-shadow:0 4px 10px rgba(0,0,0,.8); }
  #continue-screen .hint { margin-top:14px; font-size:19px; color:#ffd83d; font-weight:700; }
  #continue-screen .hint2 { margin-top:6px; font-size:14px; color:rgba(255,255,255,.65); }

  /* ── 결과 ──────────────────────────── */
  #result-screen { background:rgba(8,20,40,.88); z-index:20; }
  #result-title { font-size:52px; font-weight:900; color:#fff; text-shadow:0 4px 8px rgba(0,0,0,.6); }
  #result-stars { font-size:64px; margin:14px 0 4px; letter-spacing:10px; }
  #result-stats { color:#dce8f5; font-size:19px; line-height:1.9; text-align:center; margin-top:8px; }
  .result-buttons { display:flex; gap:16px; margin-top:30px; }
  .btn { pointer-events:auto; padding:13px 26px; font-size:18px; font-weight:800; color:#fff;
    background:#3a86d4; border:3px solid rgba(255,255,255,.8); border-radius:12px; cursor:pointer;
    box-shadow:0 4px 8px rgba(0,0,0,.4); font-family:inherit; }
  .btn.primary { background:#3aa84f; }
  .btn.selected { outline:5px solid #ffd83d; transform:scale(1.06); }

  /* ── 일시정지 ───────────────────────── */
  #pause-screen { background:rgba(0,0,0,.6); z-index:20; }
  #pause-screen .big { font-size:46px; font-weight:900; color:#fff; margin-bottom:26px; }

  #fade { position:absolute; inset:0; background:#000; opacity:0; pointer-events:none;
    transition:opacity .45s; z-index:30; }
</style>
</head>
<body>
<div id="app">
  <div id="fade"></div>

  <div id="hud" class="hidden">
    <div id="hud-hearts">❤️❤️❤️</div>
    <div id="hud-stage">STAGE 1</div>
    <div id="hud-progress">
      <div id="hud-progress-fill"></div>
      <div id="hud-progress-icon">🧺</div>
      <div id="hud-home">🏠</div>
    </div>
    <div id="hud-items">🐟 0&nbsp;&nbsp;🍡 0/0</div>
    <div id="hud-speed"></div>
    <div id="hud-toast"></div>
  </div>

  <div id="title-screen" class="screen">
    <div class="logo">모구 어디가</div>
    <div class="sub">~ 바구니 타고 집까지 ~</div>
    <img id="title-icon" alt="모구">
    <div class="press" id="title-press">Enter 를 눌러 시작</div>
  </div>

  <div id="map-screen" class="screen hidden">
    <div id="map-head">월 드 맵</div>
    <div id="map-scroll"><div id="map-track"></div></div>
    <div class="map-hint">
      <span>방향키 이동 · Enter 출발 · 클릭 가능</span>
      <button class="btn-mini" id="btn-save-export">💾 세이브 내보내기</button>
      <button class="btn-mini" id="btn-save-import">📂 세이브 불러오기</button>
      <input type="file" id="save-file-input" accept=".json,application/json" style="display:none">
      <span id="save-msg"></span>
    </div>
  </div>

  <div id="continue-screen" class="screen hidden">
    <div class="big">CONTINUE?</div>
    <div id="coin-slot"><div class="slit"></div><div id="coin">C</div></div>
    <div id="continue-count">10</div>
    <div class="hint">방향키 또는 Enter = 코인 투입 (무제한)</div>
    <div class="hint2">ESC = 포기하고 월드 맵으로 · 컨티뉴 사용 시 이 판 별점은 ★1</div>
  </div>

  <div id="result-screen" class="screen hidden">
    <div id="result-title">CLEAR!</div>
    <div id="result-stars">★★★</div>
    <div id="result-stats"></div>
    <div class="result-buttons">
      <button class="btn" id="btn-retry">다시 하기</button>
      <button class="btn" id="btn-map">맵으로</button>
      <button class="btn primary" id="btn-next">다음 스테이지 →</button>
    </div>
  </div>

  <div id="pause-screen" class="screen hidden">
    <div class="big">일시정지</div>
    <div class="result-buttons">
      <button class="btn primary" id="btn-resume">계속 (Enter)</button>
      <button class="btn" id="btn-prestart">재시작 (R)</button>
      <button class="btn" id="btn-pmap">맵으로 (M)</button>
    </div>
  </div>
</div>

// rng.js — 시드 기반 결정적 난수 + 1D 값 노이즈
const G = window.MOGU;

G.mulberry32 = function (seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
};

G.makeRng = function (seed) {
  const f = G.mulberry32(seed);
  return {
    next: f,
    range: (a, b) => a + f() * (b - a),
    int: (a, b) => Math.floor(a + f() * (b - a + 1)),
    pick: (arr) => arr[Math.floor(f() * arr.length)],
    chance: (p) => f() < p,
  };
};

// 정수 격자 해시 (좌표 기반 결정적 난수 — 청크 재생성에도 항상 동일)
G.hash2 = function (x, y, seed) {
  let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(seed, 2246822519)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
};

// 부드러운 1D 값 노이즈 (코사인 보간)
G.noise1d = function (t, seed) {
  const i = Math.floor(t), f = t - i;
  const a = G.hash2(i, 0, seed), b = G.hash2(i + 1, 0, seed);
  const u = (1 - Math.cos(f * Math.PI)) * 0.5;
  return a * (1 - u) + b * u; // 0..1
};

    const d = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; last = (last + 0.04 * w) / 1.04; d[i] = last * 2.5; }
    const src = this.ctx.createBufferSource(); src.buffer = buf; src.loop = true;
    const f = this.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 700;
    const g = this.ctx.createGain(); g.gain.value = 0.12;
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start();
    this.waterSrc = src; this.waterGain = g;
  },
  setWaterLevel(v) { if (this.waterGain) this.waterGain.gain.value = 0.06 + v * 0.16; },
  stopWater() { if (this.waterSrc) { try { this.waterSrc.stop(); } catch (e) {} this.waterSrc = null; this.waterGain = null; } },
};

G.audio = A;

}

{

       sun: 0xc8d8ff, ambient: 0.3, night: true },

// 월드별 장애물 풀 (누적 해금 + 테마 고유)
const OBSTACLE_SETS = {
  1: ['rock', 'lily', 'log'],
  2: ['rock', 'lily', 'log', 'movelog', 'pillar'],
  3: ['rock', 'log', 'movelog', 'pillar', 'cactuswall', 'sandbar'],
  4: ['rock', 'movelog', 'pillar', 'icefloe', 'crevasse'],
  5: ['rock', 'lily', 'log', 'movelog', 'pillar', 'icefloe', 'cactuswall'],
};

function lerp(a, b, t) { return a + (b - a) * t; }

G.paramsFor = function (stage) {
  const world = Math.min(5, Math.ceil(stage / 10));      // 1~5
  const wi = (stage - 1) % 10;                            // 월드 내 0~9
  const t = (stage - 1) / 49;                             // 전체 진행도 0~1
  const isWorldStart = wi === 0 && stage > 1;
  const isBoss = wi === 9;

  let speed = lerp(6, 13, t);
  if (isWorldStart) speed -= 0.8;                         // 새 기믹 학습 구간
  if (isBoss) speed += 0.5;

  const widthMax = Math.max(8, lerp(16, 10, t));
  const widthMin = Math.max(6, lerp(13, 6, t));

  const density = lerp(4, 16, t);                         // 개/100블록
  let interval = Math.max(speed * 0.95, 100 / density);   // 패턴 간 거리(블록)
  if (isBoss) interval *= 0.85;

  const targetTime = lerp(60, 120, t);
  const length = Math.round(targetTime * speed);

  return {
    stage, world, theme: G.THEMES[world],
    speed, widthMin, widthMax, interval,
    targetTime, length,
    curveAmp: lerp(3, 11, t) * (isBoss ? 1.2 : 1),
    curvePeriod: lerp(150, 90, t),
    obstacles: OBSTACLE_SETS[world],
    latReach: 7,                                          // 좌우 이동 속도(블록/s)
    rapids: world === 3 || world === 5,
    blizzard: world === 4,
    ice: world === 4,
    waterfalls: world === 5 ? (wi >= 2 ? 1 + Math.floor(wi / 4) : 0) : 0,
    chicken: [7, 23, 44].includes(stage),
    isBoss,
  };
};

}
/* ── stagegen.js ── */
{
// stagegen.js — 시드 기반 스테이지 절차 생성 (통과 가능 경로 보장)
const G = window.MOGU;

G.makeStage = function (stageNo) {
  const P = G.paramsFor(stageNo);
  const seed = stageNo * 7919 + 13;
  const rng = G.makeRng(seed);

  // ── 강 형태 (해석적 함수: 어디서든 동일 값) ──
  const a1 = P.curveAmp, p1 = P.curvePeriod, ph1 = rng.range(0, Math.PI * 2);
  const a2 = P.curveAmp * 0.4, p2 = P.curvePeriod * 0.37, ph2 = rng.range(0, Math.PI * 2);
  const wSeed = seed + 101;

  const cx = (z) => a1 * Math.sin((Math.PI * 2 * z) / p1 + ph1) + a2 * Math.sin((Math.PI * 2 * z) / p2 + ph2);
  const halfW = (z) => {
    const n = G.noise1d(z * 0.018, wSeed);
    return (P.widthMin + (P.widthMax - P.widthMin) * n) / 2;
  };

  const L = P.length;
  const obstacles = [], items = [], decos = [], zones = [], gates = [];

  // ── 특수 구간 (급류 / 눈보라) ──
  const zoneCount = P.rapids || P.blizzard ? 1 + Math.floor(((stageNo - 1) % 10) / 3) : 0;
  for (let i = 0; i < zoneCount; i++) {
    const zlen = rng.range(40, 70);
    const z0 = (L * (i + 1)) / (zoneCount + 1) + rng.range(-30, 30);
    zones.push({ type: P.rapids ? 'rapid' : 'blizzard', z0: Math.max(70, z0), z1: Math.min(L - 50, z0 + zlen) });
  }

  // ── 폭포 게이트 (W5) ──
  for (let i = 0; i < P.waterfalls; i++) {
    const z = (L * (i + 1)) / (P.waterfalls + 1) + rng.range(-20, 20);
    const gapHalf = Math.max(1.3, 1.8 - ((stageNo - 1) / 49) * 0.5);
    const hw = halfW(z);
    gates.push({ z, gapOff: rng.range(-(hw - gapHalf - 1), hw - gapHalf - 1), gapHalf });
  }

  // ── 장애물 배치: 통로(gap) 경로를 추적하며 항상 통과폭 보장 ──
  const GAP_HALF = 1.4;          // 보장 통로 반폭 (바구니 판정 0.6 + 여유)
  let gapX = 0;
  let z = 55;                    // 출발 직후 안전 구간
  let lastZ = z;

  const place = (type, oz, off, extra) => {
    obstacles.push(Object.assign({ type, z: oz, off }, extra || {}));
  };

  const gapSamples = [{ z: 0, x: 0 }];

  while (z < L - 40) {
    const hw = halfW(z);
    const dz = z - lastZ;
    const reach = P.latReach * (dz / P.speed) * 0.65;
    gapX = Math.max(-(hw - GAP_HALF - 0.6), Math.min(hw - GAP_HALF - 0.6, gapX + rng.range(-reach, reach)));
    gapSamples.push({ z, x: gapX });

    const nearGate = gates.some((g) => Math.abs(g.z - z) < 14);
    if (!nearGate) {
      const type = rng.pick(P.obstacles);
      const lo = gapX - GAP_HALF, hi = gapX + GAP_HALF;   // 비워둘 통로
      const leftRoom = lo - (-hw), rightRoom = hw - hi;

      if (type === 'rock' || type === 'icefloe') {
        const big = type === 'icefloe';
        const extF = big ? 1.15 : 0.95;          // 충돌 판정 배율 (player.js와 일치)
        const n = rng.int(1, big ? 2 : 3);
        for (let k = 0; k < n; k++) {
          const side = rng.chance(leftRoom / (leftRoom + rightRoom + 0.001)) ? -1 : 1;
          const room = side < 0 ? leftRoom : rightRoom;
          // 장애물 충돌 반경이 빈 공간 안에 들어가도록 크기 클램프
          let r = big ? rng.range(1.4, 2.0) : rng.range(0.9, 1.4);
          const maxExt = room / 2 - 0.55;
          if (maxExt < 0.7) continue;
          r = Math.min(r, maxExt / extF);
          const ext = r * extF;
          const cLo = side < 0 ? -hw + ext + 0.35 : hi + ext + 0.25;
          const cHi = side < 0 ? lo - ext - 0.25 : hw - ext - 0.35;
          if (cHi <= cLo) continue;
          place(type, z + rng.range(-2, 2) * (k > 0 ? 1 : 0), rng.range(cLo, cHi), { r });
        }
      } else if (type === 'lily') {
        for (let k = 0; k < rng.int(2, 4); k++) {
          const c = rng.range(-hw + 1, hw - 1);
          if (Math.abs(c - gapX) < GAP_HALF + 0.6) continue;
          place('lily', z + rng.range(-3, 3), c, { r: 1.1 });
        }
      } else if (type === 'log' || type === 'crevasse') {
        // 통로만 남기고 가로막는 벽 (crevasse는 얼음벽 비주얼)
        if (leftRoom > 1.6) place(type === 'log' ? 'logwall' : 'icewall', z, (lo - hw) / 2, { half: leftRoom / 2 - 0.2 });
        if (rightRoom > 1.6) place(type === 'log' ? 'logwall' : 'icewall', z, (hi + hw) / 2, { half: rightRoom / 2 - 0.2 });
      } else if (type === 'movelog') {
        const len = hw * 2 * rng.range(0.32, 0.45);
        const amp = Math.max(0, hw - len / 2 - 1.5);
        place('movelog', z, 0, { len, amp, period: rng.range(2.2, 3.6), phase: rng.range(0, Math.PI * 2) });
      } else if (type === 'pillar') {
        for (let k = 0; k < rng.int(2, 3); k++) {
          const c = rng.range(-hw + 1.2, hw - 1.2);
          if (Math.abs(c - gapX) < GAP_HALF + 1.0) continue;
          place('pillar', z, c, { r: 0.8 });
        }
      } else if (type === 'cactuswall') {
        const side = leftRoom > rightRoom ? -1 : 1;
        const room = side < 0 ? leftRoom : rightRoom;
        if (room > 2.4) {
          const half = Math.min(room / 2 - 0.3, hw * 0.45);
          place('cactuswall', z, side < 0 ? -hw + half : hw - half, { half, side });
        }
      } else if (type === 'sandbar') {
        const side = leftRoom > rightRoom ? -1 : 1;
        const room = side < 0 ? leftRoom : rightRoom;
        if (room > 2.6) place('sandbar', z, side < 0 ? lo - room / 2 : hi + room / 2, { r: Math.min(2.2, room / 2 - 0.2) });
      }
    }

    lastZ = z;
    z += P.interval * rng.range(0.8, 1.25);
  }
  gapSamples.push({ z: L, x: 0 });
  obstacles.sort((a, b) => a.z - b.z);

  // ── 아이템: 통로 경로를 따라 배치 (아이템 라인 = 추천 주행선) ──
  let gi = 0, itemId = 0;
  for (let iz = 60; iz < L - 35; iz += 6.5) {
    while (gi < gapSamples.length - 2 && gapSamples[gi + 1].z < iz) gi++;
    const A = gapSamples[gi], B = gapSamples[gi + 1];
    const t = Math.min(1, Math.max(0, (iz - A.z) / Math.max(1, B.z - A.z)));
    const off = A.x + (B.x - A.x) * t + rng.range(-0.5, 0.5);
    if (rng.chance(0.62)) {
      const kind = rng.chance(0.12) ? 'fish' : 'chur';
      items.push({ id: itemId++, z: iz, off, kind });
    }
  }

  // ── 둔치 장식 (나무·집·선인장·횃불 등) ──
  for (let dz2 = 20; dz2 < L; dz2 += 7) {
    for (const side of [-1, 1]) {
      const h = G.hash2(Math.round(dz2), side, seed + 7);
      if (h < 0.42) {
        const type = P.theme.deco[Math.floor(G.hash2(Math.round(dz2), side * 3, seed + 9) * P.theme.deco.length)];
        decos.push({ type, z: dz2, side, dist: 2.5 + G.hash2(Math.round(dz2), side * 5, seed + 11) * 13 });
      }
    }
  }
  // W5: 강둑 횃불 추가 (조명 느낌)
  if (P.theme.night) for (let tz = 30; tz < L; tz += 18) {
    decos.push({ type: 'torch', z: tz, side: tz % 36 < 18 ? -1 : 1, dist: 0.8 });
  }

  // ── 닭 이스터에그 ──
  let chicken = null;
  if (P.chicken) {
    const czRaw = L * 0.3;
    let coff = 0;
    for (let k = 0; k < gapSamples.length - 1; k++)
      if (gapSamples[k].z <= czRaw && gapSamples[k + 1].z > czRaw) {
        const A = gapSamples[k], B = gapSamples[k + 1];
        coff = A.x + ((B.x - A.x) * (czRaw - A.z)) / Math.max(1, B.z - A.z);
      }
    chicken = { z: czRaw, off: coff, joined: false };
  }

  return { no: stageNo, params: P, seed, cx, halfW, length: L, finishZ: L - 6,
           obstacles, items, decos, zones, gates, chicken };
};

}
/* ── world.js ── */
{
// world.js — 복셀 월드 렌더링 (청크 스트리밍 + 인스턴싱)

const G = window.MOGU;

const CHUNK = 24;          // 청크 z 길이
const BAND = 16;           // 강둑에서 블록으로 채우는 폭

// 공유 지오메트리/머티리얼 캐시
const BOX = new THREE.BoxGeometry(1, 1, 1);
const geoCache = {};
function cyl(r, h, n = 10) {
  const k = `c${r}_${h}_${n}`;
  if (!geoCache[k]) geoCache[k] = new THREE.CylinderGeometry(r, r, h, n);
  return geoCache[k];
}
const matCache = {};
function lambert(color, opts) {
  const k = `${color}_${JSON.stringify(opts || {})}`;
  if (!matCache[k]) matCache[k] = new THREE.MeshLambertMaterial(Object.assign({ color }, opts || {}));
  return matCache[k];
}

function makeWaterTexture(hex) {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d');
  const col = new THREE.Color(hex);
  g.fillStyle = `rgb(${col.r * 255 | 0},${col.g * 255 | 0},${col.b * 255 | 0})`;
  g.fillRect(0, 0, 128, 128);
  const rng = G.makeRng(42);
  for (let i = 0; i < 90; i++) {
    const l = 0.12 + rng.next() * 0.18;
    g.fillStyle = `rgba(255,255,255,${l * 0.35})`;
    const x = rng.next() * 128, y = rng.next() * 128, w = 6 + rng.next() * 22;
    g.fillRect(x, y, w, 2);
  }
  for (let i = 0; i < 40; i++) {
    g.fillStyle = 'rgba(0,0,30,0.10)';
    g.fillRect(rng.next() * 128, rng.next() * 128, 4 + rng.next() * 10, 2);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.magFilter = THREE.NearestFilter;
  return t;
}

G.WorldRenderer = class {
  constructor(scene, stage) {
    this.scene = scene;
    this.stage = stage;
    this.theme = stage.params.theme;
    this.root = new THREE.Group();
    scene.add(this.root);
    this.chunks = new Map();
    this.collected = new Set();
    this.flowTime = 0;

    const T = this.theme;
    scene.background = new THREE.Color(T.sky);
    scene.fog = new THREE.Fog(T.fog, 18, T.fogFar);

    this.hemi = new THREE.HemisphereLight(T.sky, T.farGround, T.night ? 0.5 : 1.0);
    this.dir = new THREE.DirectionalLight(T.sun, T.night ? 0.35 : 0.95);
    this.dir.position.set(30, 60, -25);
    this.amb = new THREE.AmbientLight(0xffffff, T.ambient * 0.5);
    this.root.add(this.hemi, this.dir, this.amb);

    // 물 (카메라 추적 대형 평면 + 스크롤 텍스처)
    this.waterTex = makeWaterTexture(T.water);
    this.waterTex.repeat.set(64, 64);
    this.water = new THREE.Mesh(
      new THREE.PlaneGeometry(360, 360),
      new THREE.MeshBasicMaterial({ map: this.waterTex, transparent: true, opacity: T.waterOpacity,
        color: 0xffffff, depthWrite: false })
    );
    this.water.rotation.x = -Math.PI / 2;
    this.water.position.y = 0;
    this.root.add(this.water);
    // 물 아래 어두운 바닥 (깊이감)
    this.waterBed = new THREE.Mesh(new THREE.PlaneGeometry(360, 360),
      new THREE.MeshBasicMaterial({ color: new THREE.Color(T.water).multiplyScalar(0.45) }));
    this.waterBed.rotation.x = -Math.PI / 2;
    this.waterBed.position.y = -0.8;
    this.root.add(this.waterBed);

    // 구름
    this.clouds = [];
    if (!T.night) {
      const cm = lambert(0xffffff, { transparent: true, opacity: 0.92 });
      const crng = G.makeRng(stage.seed + 5);
      for (let i = 0; i < 9; i++) {
        const cl = new THREE.Group();
        for (let b = 0; b < 3; b++) {
          const m = new THREE.Mesh(BOX, cm);
          m.scale.set(5 + crng.next() * 7, 1.6, 3 + crng.next() * 4);
          m.position.set(crng.range(-4, 4), crng.range(-0.4, 0.4), crng.range(-2.5, 2.5));
          cl.add(m);
        }
        cl.position.set(crng.range(-70, 70), 26 + crng.next() * 12, crng.range(0, 160));
        cl.userData.speed = 0.4 + crng.next() * 0.5;
        this.clouds.push(cl);
        this.root.add(cl);
      }
    }
    // 달 + 별 (밤)
    if (T.night) {
      const moon = new THREE.Mesh(BOX, new THREE.MeshBasicMaterial({ color: 0xf4f0d8 }));
      moon.scale.set(6, 6, 1);
      this.moon = moon;
      this.root.add(moon);
      const sg = new THREE.BufferGeometry();
      const sp = [];
      const srng = G.makeRng(7);
      for (let i = 0; i < 300; i++) sp.push(srng.range(-160, 160), srng.range(30, 120), srng.range(-60, 200));
      sg.setAttribute('position', new THREE.Float32BufferAttribute(sp, 3));
      this.stars = new THREE.Points(sg, new THREE.PointsMaterial({ color: 0xcdd8ff, size: 0.7, fog: false }));
      this.root.add(this.stars);
    }

    // 입자 (눈 / 반딧불)
    this.particles = null;
    if (stage.params.blizzard || T.night) {
      const n = T.night ? 220 : 700;
      const pg = new THREE.BufferGeometry();
      const arr = new Float32Array(n * 3);
      const prng = G.makeRng(stage.seed + 21);
      this.pData = [];
      for (let i = 0; i < n; i++) {
        arr[i * 3] = prng.range(-40, 40); arr[i * 3 + 1] = prng.range(0.5, 24); arr[i * 3 + 2] = prng.range(-20, 90);
        this.pData.push({ vx: prng.range(-0.6, 0.6), vy: T.night ? prng.range(-0.25, 0.25) : -prng.range(4, 8), ph: prng.range(0, 6.28) });
      }
      pg.setAttribute('position', new THREE.BufferAttribute(arr, 3));
      this.particles = new THREE.Points(pg, new THREE.PointsMaterial({
        color: T.night ? 0xffe27a : 0xffffff, size: T.night ? 0.32 : 0.22,
        transparent: true, opacity: T.night ? 0.95 : 0.85,
        blending: T.night ? THREE.AdditiveBlending : THREE.NormalBlending, depthWrite: false }));
      this.root.add(this.particles);
    }
  }

  // ── 지형 높이 ──
  bankHeight(d, x, z) {
    const T = this.theme, P = this.stage.params, s = this.stage.seed;
    if (P.world === 3) { // 캐니언: 강에서 멀수록 급상승
      const n = G.hash2(x, z, s + 31);
      return 1 + Math.min(8, Math.max(0, Math.floor((d - 1.5) * 0.95 + n * 2)));
    }
    if (d < 2.5) return 1;
    const n = G.noise1d(x * 0.13 + z * 0.07, s + 33);
    const hill = n < 0.55 ? 0 : n < 0.82 ? 1 : 2;
    return 1 + (P.world === 4 ? Math.min(hill + (G.hash2(x, z, s + 35) > 0.8 ? 1 : 0), 3) : hill);
  }

  // ── 청크 생성 ──
  buildChunk(ci) {
    const st = this.stage, T = this.theme, s = st.seed;
    const z0 = ci * CHUNK, z1 = z0 + CHUNK;
    const group = new THREE.Group();
    const anims = [];

    // 1) 지형 블록 수집
    const inst = []; // {x,y,z,color}
    const topCols = new THREE.Color(), c = new THREE.Color();
    let minL = Infinity, maxR = -Infinity;
    for (let z = z0; z < z1; z++) {
      const cxz = st.cx(z + 0.5), hw = st.halfW(z + 0.5);
      const xL = Math.floor(cxz - hw - BAND), xR = Math.ceil(cxz + hw + BAND);
      minL = Math.min(minL, cxz - hw - BAND); maxR = Math.max(maxR, cxz + hw + BAND);
      for (let x = xL; x <= xR; x++) {
        const d = Math.abs(x + 0.5 - cxz) - hw;
        if (d <= 0.2) continue; // 강
        const h = this.bankHeight(d, x, z);
        const topHex = T.grassTop[Math.floor(G.hash2(x, z, s + 1) * T.grassTop.length)];
        for (let y = 0; y < h; y++) {
          const isTop = y === h - 1;
          inst.push({ x: x + 0.5, y: y + 0.5, z: z + 0.5, color: isTop ? topHex : T.dirt, dim: isTop ? 1 : 0.92 });
          if (h <= 2 && y === 0 && h === 1) break;
        }
        if (z === z0 || z === z1 - 1) continue;
      }
    }
    if (inst.length) {
      const im = new THREE.InstancedMesh(BOX, new THREE.MeshLambertMaterial({ color: 0xffffff }), inst.length);
      const m4 = new THREE.Matrix4();
      for (let i = 0; i < inst.length; i++) {
        m4.makeTranslation(inst[i].x, inst[i].y, inst[i].z);
        im.setMatrixAt(i, m4);
        c.setHex(inst[i].color).multiplyScalar(inst[i].dim);
        im.setColorAt(i, c);
      }
      im.instanceMatrix.needsUpdate = true;
      group.add(im);
    }

    // 2) 측면 원경 바닥 (블록 밴드 바깥)
    const sideMat = lambert(T.farGround);
    for (const side of [-1, 1]) {
      const inner = side < 0 ? minL : maxR;
      const sp = new THREE.Mesh(BOX, sideMat);
      const w = 130;
      sp.scale.set(w, 0.9, CHUNK);
      sp.position.set(inner + side * (w / 2 - 2), 0.52, z0 + CHUNK / 2);
      group.add(sp);
    }

    // 3) 장식
    for (const d of st.decos) {
      if (d.z < z0 || d.z >= z1) continue;
      const cxz = st.cx(d.z), hw = st.halfW(d.z);
      const x = cxz + d.side * (hw + d.dist);
      const gy = this.bankHeight(d.dist, Math.floor(x), Math.floor(d.z));
      this.addDeco(group, d.type, x, gy, d.z, anims);
    }

    // 4) 장애물
    for (const o of st.obstacles) {
      if (o.z < z0 || o.z >= z1) continue;
      this.addObstacle(group, o, anims);
    }

    // 5) 아이템
    for (const it of st.items) {
      if (it.z < z0 || it.z >= z1 || this.collected.has(it.id)) continue;
      const mesh = this.makeItem(it);
      group.add(mesh);
      it._mesh = mesh;
      anims.push((t) => {
        if (this.collected.has(it.id)) { mesh.visible = false; return; }
        mesh.position.y = 0.62 + Math.sin(t * 3 + it.id) * 0.13;
        mesh.rotation.y = t * 1.8 + it.id;
      });
    }

    // 6) 폭포 게이트
    for (const g of st.gates) {
      if (g.z < z0 || g.z >= z1) continue;
      this.addGate(group, g, anims);
    }

    // 7) 닭 이스터에그
    if (st.chicken && st.chicken.z >= z0 && st.chicken.z < z1 && !st.chicken.joined) {
      const ch = this.makeChicken();
      const pad = new THREE.Mesh(cyl(1.2, 0.14, 12), lambert(0x2e8b3a));
      pad.position.set(st.cx(st.chicken.z) + st.chicken.off, 0.07, st.chicken.z);
      ch.position.set(pad.position.x, 0.15, st.chicken.z);
      group.add(pad, ch);
      st.chicken._mesh = ch; st.chicken._pad = pad;
      anims.push((t) => {
        if (st.chicken.joined) { ch.visible = false; return; }
        ch.position.y = 0.15 + Math.abs(Math.sin(t * 4)) * 0.12;
        ch.rotation.y = Math.sin(t * 1.2) * 0.6;
      });
    }

    // 8) 결승 선착장
    if (st.finishZ >= z0 && st.finishZ < z1) this.addFinish(group, anims);

    const chunk = { group, anims };
    this.root.add(group);
    this.chunks.set(ci, chunk);
  }

  addDeco(group, type, x, gy, z, anims) {
    const T = this.theme;
    const leafHex = () => T.leaf[Math.floor(G.hash2(Math.floor(x * 3), Math.floor(z * 3), 77) * T.leaf.length)];
    if (type === 'tree' || type === 'spruce') {
      const trunk = new THREE.Mesh(BOX, lambert(T.trunk));
      const th = type === 'spruce' ? 3.4 : 2.6;
      trunk.scale.set(0.8, th, 0.8); trunk.position.set(x, gy + th / 2, z);
      group.add(trunk);
      if (type === 'spruce') {
        for (let i = 0; i < 3; i++) {
          const lf = new THREE.Mesh(BOX, lambert(leafHex()));
          const w = 3.2 - i * 0.9;
          lf.scale.set(w, 1.0, w); lf.position.set(x, gy + 2.0 + i * 1.0, z);
          group.add(lf);
        }
      } else {
        const lf = new THREE.Mesh(BOX, lambert(leafHex()));
        lf.scale.set(3.0, 2.4, 3.0); lf.position.set(x, gy + th + 0.9, z);
        group.add(lf);
      }
    } else if (type === 'house') {
      const wall = new THREE.Mesh(BOX, lambert(0xb08850));
      wall.scale.set(4.4, 2.6, 3.8); wall.position.set(x, gy + 1.3, z);
      const roof1 = new THREE.Mesh(BOX, lambert(0x77787c));
      roof1.scale.set(5.2, 0.8, 4.6); roof1.position.set(x, gy + 3.0, z);
      const roof2 = new THREE.Mesh(BOX, lambert(0x77787c));
      roof2.scale.set(3.4, 0.8, 3.0); roof2.position.set(x, gy + 3.8, z);
      const door = new THREE.Mesh(BOX, lambert(0x5e3d1e));
      door.scale.set(0.9, 1.6, 0.2); door.position.set(x, gy + 0.8, z + 1.95);
      group.add(wall, roof1, roof2, door);
    } else if (type === 'cactus') {
      const h = 1.6 + G.hash2(Math.floor(x), Math.floor(z), 3) * 1.6;
      const b = new THREE.Mesh(BOX, lambert(0x4e9c3c));
      b.scale.set(0.9, h, 0.9); b.position.set(x, gy + h / 2, z);
      group.add(b);
    } else if (type === 'deadbush') {
      const b = new THREE.Mesh(BOX, lambert(0x9a6b3a));
      b.scale.set(0.7, 0.7, 0.7); b.position.set(x, gy + 0.35, z);
      group.add(b);
    } else if (type === 'rockpile' || type === 'icerock') {
      const b = new THREE.Mesh(BOX, lambert(type === 'icerock' ? 0xcfe8f5 : 0x8a8f94));
      const s2 = 1 + G.hash2(Math.floor(x), Math.floor(z), 4) * 1.4;
      b.scale.set(s2, s2 * 0.8, s2); b.position.set(x, gy + s2 * 0.4, z);
      group.add(b);
    } else if (type === 'snowpile') {
      const b = new THREE.Mesh(BOX, lambert(0xffffff));
      b.scale.set(1.6, 0.6, 1.6); b.position.set(x, gy + 0.3, z);
      group.add(b);
    } else if (type === 'flower') {
      const colors = [0xe85a5a, 0xf0d04a, 0xd96fd9, 0xff9a3d];
      const b = new THREE.Mesh(BOX, lambert(colors[Math.floor(G.hash2(Math.floor(x), Math.floor(z), 5) * 4)]));
      b.scale.set(0.32, 0.5, 0.32); b.position.set(x, gy + 0.25, z);
      group.add(b);
    } else if (type === 'mushroom') {
      const stem = new THREE.Mesh(BOX, lambert(0xe8dcc8));
      stem.scale.set(0.3, 0.6, 0.3); stem.position.set(x, gy + 0.3, z);
      const cap = new THREE.Mesh(BOX, lambert(0xc84a3a, { emissive: 0x331008 }));
      cap.scale.set(0.8, 0.35, 0.8); cap.position.set(x, gy + 0.75, z);
      group.add(stem, cap);
    } else if (type === 'torch') {
      const pole = new THREE.Mesh(BOX, lambert(0x6b4a2a));
      pole.scale.set(0.22, 1.5, 0.22); pole.position.set(x, gy + 0.75, z);
      const fire = new THREE.Mesh(BOX, new THREE.MeshBasicMaterial({ color: 0xffb347 }));
      fire.scale.set(0.4, 0.45, 0.4); fire.position.set(x, gy + 1.65, z);
      group.add(pole, fire);
      anims.push((t) => { const f = 0.85 + Math.sin(t * 11 + x) * 0.18; fire.scale.set(0.4 * f, 0.45 * f, 0.4 * f); });
    }
  }

  addObstacle(group, o, anims) {
    const st = this.stage;
    const baseX = () => st.cx(o.z) + o.off;
    if (o.type === 'rock') {
      const m = new THREE.Mesh(BOX, lambert(0x8a8f94));
      m.scale.set(o.r * 1.7, o.r * 1.5, o.r * 1.5);
      m.position.set(baseX(), o.r * 0.45, o.z);
      m.rotation.y = o.z;
      const m2 = new THREE.Mesh(BOX, lambert(0x767b80));
      m2.scale.set(o.r, o.r, o.r);
      m2.position.set(baseX() + o.r * 0.3, o.r * 0.9, o.z + 0.2);
      group.add(m, m2);
    } else if (o.type === 'icefloe') {
      const m = new THREE.Mesh(BOX, lambert(0xd8eef8, { transparent: true, opacity: 0.95 }));
      m.scale.set(o.r * 2.3, 0.55, o.r * 1.9);
      m.position.set(baseX(), 0.12, o.z);
      m.rotation.y = o.z * 0.7;
      group.add(m);
    } else if (o.type === 'lily') {
      const pad = new THREE.Mesh(cyl(o.r, 0.13, 12), lambert(0x2e8b3a));
      pad.position.set(baseX(), 0.06, o.z);
      group.add(pad);
      if (G.hash2(Math.floor(o.z), 1, 9) > 0.6) {
        const fl = new THREE.Mesh(BOX, lambert(0xf0a8c8));
        fl.scale.set(0.4, 0.35, 0.4); fl.position.set(baseX(), 0.3, o.z);
        group.add(fl);
      }
    } else if (o.type === 'logwall') {
      const m = new THREE.Mesh(cyl(0.55, o.half * 2, 9), lambert(0x6e4a26));
      m.rotation.z = Math.PI / 2;
      m.position.set(baseX(), 0.3, o.z);
      group.add(m);
    } else if (o.type === 'icewall') {
      const m = new THREE.Mesh(BOX, lambert(0xbfe3f5, { transparent: true, opacity: 0.85 }));
      m.scale.set(o.half * 2, 1.8, 1.0);
      m.position.set(baseX(), 0.9, o.z);
      group.add(m);
    } else if (o.type === 'movelog') {
      const m = new THREE.Mesh(cyl(0.55, o.len, 9), lambert(0x5e3d1e));
      m.rotation.z = Math.PI / 2;
      m.position.set(baseX(), 0.3, o.z);
      group.add(m);
      anims.push((t) => {
        o._x = st.cx(o.z) + o.off + o.amp * Math.sin((Math.PI * 2 * t) / o.period + o.phase);
        m.position.x = o._x;
        m.rotation.x = t * 0.8;
      });
    } else if (o.type === 'pillar') {
      const m = new THREE.Mesh(BOX, lambert(0x9a9a9a));
      m.scale.set(1.5, 3.4, 1.5);
      m.position.set(baseX(), 1.4, o.z);
      const top = new THREE.Mesh(BOX, lambert(0x7f8a7f));
      top.scale.set(1.9, 0.5, 1.9); top.position.set(baseX(), 3.2, o.z);
      group.add(m, top);
    } else if (o.type === 'cactuswall') {
      const n = Math.max(2, Math.round((o.half * 2) / 1.1));
      for (let i = 0; i < n; i++) {
        const cx2 = baseX() - o.half + 0.55 + i * 1.1;
        const h = 1.4 + G.hash2(i, Math.floor(o.z), 6) * 1.2;
        const b = new THREE.Mesh(BOX, lambert(0x4e9c3c));
        b.scale.set(0.9, h, 0.9); b.position.set(cx2, h / 2 - 0.1, o.z);
        group.add(b);
      }
    } else if (o.type === 'sandbar') {
      const m = new THREE.Mesh(BOX, lambert(0xe7d6a3));
      m.scale.set(o.r * 2.1, 0.4, o.r * 1.7);
      m.position.set(baseX(), 0.02, o.z);
      m.rotation.y = o.z * 0.5;
      group.add(m);
    }
  }

  addGate(group, g, anims) {
    const st = this.stage;
    const cxz = st.cx(g.z), hw = st.halfW(g.z);
    const frameMat = lambert(0x6f7a85);
    for (const gx of [g.gapOff - g.gapHalf - 0.6, g.gapOff + g.gapHalf + 0.6]) {
      const p = new THREE.Mesh(BOX, frameMat);
      p.scale.set(1.2, 5, 1.2); p.position.set(cxz + gx, 2.5, g.z);
      group.add(p);
    }
    const lintel = new THREE.Mesh(BOX, frameMat);
    lintel.scale.set(hw * 2 + 2, 1.1, 1.4); lintel.position.set(cxz, 5.2, g.z);
    group.add(lintel);
    // 물 커튼 (통로 제외)
    const curtMat = new THREE.MeshLambertMaterial({ color: 0x9fd0f5, transparent: true, opacity: 0.65 });
    const segs = [[-hw, g.gapOff - g.gapHalf], [g.gapOff + g.gapHalf, hw]];
    const curts = [];
    for (const [x0, x1] of segs) {
      if (x1 - x0 < 0.4) continue;
      const cm = new THREE.Mesh(BOX, curtMat);
      cm.scale.set(x1 - x0, 4.6, 0.5);
      cm.position.set(cxz + (x0 + x1) / 2, 2.4, g.z);
      group.add(cm); curts.push(cm);
    }
    anims.push((t) => { curtMat.opacity = 0.55 + Math.sin(t * 9) * 0.12; });
  }

  addFinish(group, anims) {
    const st = this.stage, z = st.finishZ, cxz = st.cx(z), hw = st.halfW(z);
    const isHome = st.no === 50;
    // 선착장 (오른쪽 둔치에서 강 안으로)
    const plankMat = lambert(0xb08850);
    for (let i = 0; i < 4; i++) {
      const p = new THREE.Mesh(BOX, plankMat);
      p.scale.set(2.4, 0.3, 1.2);
      p.position.set(cxz + hw - i * 0.1, 0.45, z - 1.5 + i * 1.25);
      group.add(p);
    }
    // 결승 깃발 2개 (강 양쪽)
    for (const side of [-1, 1]) {
      const pole = new THREE.Mesh(BOX, lambert(0x6b4a2a));
      pole.scale.set(0.3, 4.4, 0.3);
      pole.position.set(cxz + side * (hw + 0.8), 2.2, z);
      const flag = new THREE.Mesh(BOX, lambert(side < 0 ? 0xe84a4a : 0x4a90e8));
      flag.scale.set(1.6, 1.0, 0.15);
      flag.position.set(cxz + side * (hw + 0.8) + side * -0.95, 3.8, z);
      group.add(pole, flag);
      anims.push((t) => { flag.rotation.y = Math.sin(t * 3 + side) * 0.25; });
    }
    // 집 (스테이지 50은 크게, 그 외는 작은 오두막)
    const hx = cxz + hw + (isHome ? 7 : 5), hz = z + (isHome ? 4 : 2);
    const sc = isHome ? 1.8 : 1.0;
    const wall = new THREE.Mesh(BOX, lambert(0xc8a060));
    wall.scale.set(4.6 * sc, 2.8 * sc, 4.0 * sc); wall.position.set(hx, 1 + 1.4 * sc, hz);
    const roof1 = new THREE.Mesh(BOX, lambert(0x8a4a3a));
    roof1.scale.set(5.6 * sc, 0.9 * sc, 5.0 * sc); roof1.position.set(hx, 1 + 3.1 * sc, hz);
    const roof2 = new THREE.Mesh(BOX, lambert(0x8a4a3a));
    roof2.scale.set(3.6 * sc, 0.9 * sc, 3.2 * sc); roof2.position.set(hx, 1 + 4.0 * sc, hz);
    const door = new THREE.Mesh(BOX, lambert(0x5e3d1e));
    door.scale.set(1.0 * sc, 1.7 * sc, 0.2); door.position.set(hx - 2.31 * sc, 1 + 0.85 * sc, hz);
    door.rotation.y = Math.PI / 2;
    const win = new THREE.Mesh(BOX, new THREE.MeshBasicMaterial({ color: 0xffe9a0 }));
    win.scale.set(0.15, 0.9 * sc, 0.9 * sc); win.position.set(hx - 2.31 * sc, 1 + 1.9 * sc, hz + 1.2 * sc);
    group.add(wall, roof1, roof2, door, win);
    if (isHome) {
      const sign = new THREE.Mesh(BOX, lambert(0xffd83d));
      sign.scale.set(2.6, 1.2, 0.2); sign.position.set(hx - 3.4, 4.4, hz - 2);
      group.add(sign);
    }
  }

  makeItem(it) {
    const g2 = new THREE.Group();
    if (it.kind === 'chur') {
      const body = new THREE.Mesh(cyl(0.16, 0.78, 8), lambert(0xf5e2c8));
      const cap = new THREE.Mesh(cyl(0.17, 0.2, 8), lambert(0xe84a4a));
      cap.position.y = 0.45;
      body.add(cap);
      body.rotation.z = 0.7;
      g2.add(body);
    } else {
      const body = new THREE.Mesh(BOX, lambert(0x58a8e8));
      body.scale.set(0.85, 0.5, 0.3);
      const tail = new THREE.Mesh(BOX, lambert(0x4a90c8));
      tail.scale.set(0.35, 0.4, 0.22); tail.position.x = -0.55;
      const eye = new THREE.Mesh(BOX, lambert(0x10243a));
      eye.scale.set(0.1, 0.1, 0.34); eye.position.set(0.26, 0.08, 0);
      g2.add(body, tail, eye);
    }
    g2.position.set(this.stage.cx(it.z) + it.off, 0.62, it.z);
    return g2;
  }

  makeChicken() {
    const ch = new THREE.Group();
    const body = new THREE.Mesh(BOX, lambert(0xf8f8f2));
    body.scale.set(0.75, 0.65, 0.95); body.position.y = 0.55;
    const head = new THREE.Mesh(BOX, lambert(0xf8f8f2));
    head.scale.set(0.45, 0.55, 0.45); head.position.set(0, 1.05, 0.42);
    const beak = new THREE.Mesh(BOX, lambert(0xf0b429));
    beak.scale.set(0.22, 0.16, 0.25); beak.position.set(0, 1.0, 0.74);
    const comb = new THREE.Mesh(BOX, lambert(0xe03e3e));
    comb.scale.set(0.16, 0.22, 0.3); comb.position.set(0, 1.38, 0.42);
    const wing1 = new THREE.Mesh(BOX, lambert(0xeeeee6));
    wing1.scale.set(0.12, 0.4, 0.6); wing1.position.set(0.43, 0.6, 0);
    const wing2 = wing1.clone(); wing2.position.x = -0.43;
    ch.add(body, head, beak, comb, wing1, wing2);
    return ch;
  }

  // ── 매 프레임 ──
  ensure(pz) {
    const ahead = this.theme.fogFar + 28;
    const c0 = Math.floor((pz - 26) / CHUNK), c1 = Math.floor((pz + ahead) / CHUNK);
    for (let ci = c0; ci <= c1; ci++) {
      if (ci < 0 || ci * CHUNK > this.stage.length + CHUNK) continue;
      if (!this.chunks.has(ci)) this.buildChunk(ci);
    }
    for (const [ci, ch] of this.chunks) {
      if (ci < c0 - 1 || ci > c1 + 1) {
        this.root.remove(ch.group);
        ch.group.traverse((m) => { if (m.isInstancedMesh) m.dispose(); });
        this.chunks.delete(ci);
      }
    }
  }

  update(t, dt, pz, px, blizzard) {
    this.ensure(pz);
    this.flowTime += dt;
    // 물: 평면은 카메라 추적, 텍스처는 월드 고정 + 하류 흐름
    this.water.position.set(px, 0, pz + 120);
    this.waterBed.position.set(px, -0.8, pz + 120);
    const rep = 360 / 64;
    this.waterTex.offset.y = ((pz + 120) / (360 / 64) - this.flowTime * 0.5) % 1;
    this.waterTex.offset.x = (px / (360 / 64)) % 1;

    for (const cl of this.clouds) {
      cl.position.x += cl.userData.speed * dt;
      if (cl.position.x > 90) cl.position.x = -90;
      const rz = cl.position.z;
      if (rz < pz - 40) cl.position.z += 220;
    }
    if (this.moon) this.moon.position.set(px - 40, 55, pz + 110);
    if (this.stars) this.stars.position.z = pz - 60;

    if (this.particles) {
      const pos = this.particles.geometry.attributes.position;
      const night = this.theme.night;
      for (let i = 0; i < this.pData.length; i++) {
        const d = this.pData[i];
        let x = pos.getX(i), y = pos.getY(i), z2 = pos.getZ(i);
        if (night) {
          x += Math.sin(t * 0.7 + d.ph) * dt * 1.2;
          y += d.vy * dt + Math.sin(t * 1.3 + d.ph * 2) * dt * 0.4;
          if (y < 0.4) y = 0.4; if (y > 7) y = 7;
        } else {
          x += d.vx * dt; y += d.vy * dt * (blizzard ? 1.8 : 1);
          if (y < 0) { y = 22; x = px + (G.hash2(i, Math.floor(t * 10), 1) - 0.5) * 80; z2 = pz + G.hash2(i, 3, 2) * 90 - 15; }
        }
        if (z2 < pz - 20) z2 += 105;
        pos.setXYZ(i, x, y, z2);
      }
      pos.needsUpdate = true;
      if (!night) this.particles.material.opacity = blizzard ? 1.0 : 0.75;
    }
    // 눈보라: 안개 강화
    if (this.stage.params.blizzard) {
      const base = this.theme.fogFar;
      this.scene.fog.far += ((blizzard ? base * 0.42 : base) - this.scene.fog.far) * Math.min(1, dt * 2);
    }

    for (const ch of this.chunks.values()) for (const fn of ch.anims) fn(t, dt);
  }

  setCollected(id) { this.collected.add(id); }

  dispose() {
    for (const ch of this.chunks.values()) {
      this.root.remove(ch.group);
      ch.group.traverse((m) => { if (m.isInstancedMesh) m.dispose(); });
    }
    this.chunks.clear();
    this.scene.remove(this.root);
    this.waterTex.dispose();
  }
};

}
/* ── player.js ── */
{
// player.js — 바구니 + 모구 빌보드 + 입력 + 물리/충돌

const G = window.MOGU;

G.Player = class {
  constructor(scene, stage, moguTexture) {
    this.stage = stage;
    this.P = stage.params;
    this.scene = scene;

    this.z = 4;
    this.x = stage.cx(4);
    this.vx = 0;
    this.hearts = 3;
    this.invul = 0;
    this.stuck = 0;
    this.hitCount = 0;
    this.itemCount = 0;
    this.fishCount = 0;
    this.speedMode = 0;        // -1 감속 / 0 보통 / 1 가속
    this.obIdx = 0;
    this.itIdx = 0;
    this.gateIdx = 0;
    this.time = 0;
    this.flash = 0;

    // ── 바구니 (복셀 위빙 느낌) ──
    const g2 = new THREE.Group();
    const woven1 = new THREE.MeshLambertMaterial({ color: 0xb0824a });
    const woven2 = new THREE.MeshLambertMaterial({ color: 0x8f6534 });
    const BOXG = new THREE.BoxGeometry(1, 1, 1);
    const bottom = new THREE.Mesh(BOXG, woven2);
    bottom.scale.set(1.7, 0.25, 2.0); bottom.position.y = 0.12;
    g2.add(bottom);
    // 테두리 4면 (가로줄 2단, 교차 색)
    for (let lv = 0; lv < 2; lv++) {
      const mat = lv === 0 ? woven1 : woven2;
      const y = 0.35 + lv * 0.26;
      const front = new THREE.Mesh(BOXG, mat);
      front.scale.set(1.7, 0.28, 0.22); front.position.set(0, y, 1.0);
      const back = front.clone(); back.position.z = -1.0;
      const left = new THREE.Mesh(BOXG, mat);
      left.scale.set(0.22, 0.28, 2.2); left.position.set(-0.85, y, 0);
      const right = left.clone(); right.position.x = 0.85;
      g2.add(front, back, left, right);
    }
    // 노 (오른쪽에 걸쳐진)
    const paddle = new THREE.Group();
    const shaft = new THREE.Mesh(BOXG, new THREE.MeshLambertMaterial({ color: 0xc8a060 }));
    shaft.scale.set(0.12, 2.4, 0.12); shaft.position.y = -0.5;
    const blade = new THREE.Mesh(BOXG, new THREE.MeshLambertMaterial({ color: 0xb88a48 }));
    blade.scale.set(0.08, 0.7, 0.42); blade.position.y = -1.75;
    paddle.add(shaft, blade);
    paddle.position.set(0.95, 0.85, 0.3);
    paddle.rotation.z = -0.9;
    this.paddle = paddle;
    g2.add(paddle);

    // ── 모구 빌보드 ──
    const aspect = moguTexture.image ? moguTexture.image.width / moguTexture.image.height : 1.19;
    const h = 1.55, w = h * aspect;
    this.moguMat = new THREE.SpriteMaterial({ map: moguTexture, color: 0xffffff });
    const sprite = new THREE.Sprite(this.moguMat);
    sprite.scale.set(w, h, 1);
    sprite.position.set(0, 1.0, -0.15);
    this.mogu = sprite;
    g2.add(sprite);

    // ── 닭 (이스터에그 합류 후 표시) ──
    this.chickenMesh = null;

    // 그림자
    const sh = new THREE.Mesh(new THREE.CircleGeometry(1.15, 16),
      new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.22, depthWrite: false }));
    sh.rotation.x = -Math.PI / 2; sh.position.y = 0.015;
    g2.add(sh);

    this.group = g2;
    scene.add(g2);
  }

  attachChicken(makeChicken) {
    if (this.chickenMesh) return;
    const ch = makeChicken();
    ch.scale.set(0.55, 0.55, 0.55);
    ch.position.set(0.55, 0.3, 0.45);
    this.chickenMesh = ch;
    this.group.add(ch);
  }

  // 현재 구간 특수 존
  zoneAt(z) {
    for (const zn of this.stage.zones) if (z >= zn.z0 && z <= zn.z1) return zn.type;
    return null;
  }

  currentSpeed() {
    const zone = this.zoneAt(this.z);
    let mult = this.speedMode === 1 ? 1.5 : this.speedMode === -1 ? 0.6 : 1.0;
    if (zone === 'rapid') mult = Math.max(1.5, mult === 1.5 ? 1.7 : 1.25);
    if (this.stuck > 0) mult = 0.06;
    return this.P.speed * mult;
  }

  update(t, dt, keys) {
    this.time = t;
    const ev = [];
    const st = this.stage, P = this.P;

    if (this.invul > 0) this.invul -= dt;
    if (this.stuck > 0) this.stuck -= dt;

    // ── 전진 ──
    this.speedMode = keys.up ? 1 : keys.down ? -1 : 0;
    const spd = this.currentSpeed();
    const oldCx = st.cx(this.z);
    this.z += spd * dt;
    // 강 굴곡이 바구니를 미는 힘 (커브 보정 55% — 나머지는 직접 조향)
    this.x += (st.cx(this.z) - oldCx) * 0.55;

    // ── 좌우 ──
    // 카메라가 +Z를 바라보므로 화면 오른쪽 = 월드 -X
    const dir = (keys.left ? 1 : 0) + (keys.right ? -1 : 0);
    const target = dir * P.latReach;
    const resp = P.ice ? 2.3 : 11;          // 빙판: 미끄러짐
    this.vx += (target - this.vx) * Math.min(1, dt * resp);
    this.x += this.vx * dt;

    // 강둑 클램프
    const hw = st.halfW(this.z), cx = st.cx(this.z);
    const maxOff = hw - 0.85;
    const off = this.x - cx;
    if (off > maxOff) { this.x = cx + maxOff; this.vx = Math.min(0, this.vx); }
    if (off < -maxOff) { this.x = cx - maxOff; this.vx = Math.max(0, this.vx); }

    // ── 장애물 충돌 ──
    while (this.obIdx < st.obstacles.length && st.obstacles[this.obIdx].z < this.z - 4) this.obIdx++;
    for (let i = this.obIdx; i < st.obstacles.length; i++) {
      const o = st.obstacles[i];
      if (o.z > this.z + 4) break;
      const dz = Math.abs(o.z - this.z);
      let ox = st.cx(o.z) + o.off, hl = 0, hz = 0, kind = 'hurt';
      switch (o.type) {
        case 'rock':    hl = o.r * 0.95; hz = o.r * 0.85; break;
        case 'icefloe': hl = o.r * 1.15; hz = o.r * 0.95; break;
        case 'pillar':  hl = 0.8; hz = 0.8; break;
        case 'logwall': hl = o.half; hz = 0.55; break;
        case 'icewall': hl = o.half; hz = 0.6; break;
        case 'cactuswall': hl = o.half; hz = 0.5; break;
        case 'movelog':
          ox = st.cx(o.z) + o.off + o.amp * Math.sin((Math.PI * 2 * t) / o.period + o.phase);
          hl = o.len / 2; hz = 0.55; break;
        case 'lily':    hl = o.r * 0.8; hz = o.r * 0.8; kind = 'slow'; break;
        case 'sandbar': hl = o.r; hz = o.r * 0.8; kind = 'stuck'; break;
        default: continue;
      }
      if (dz < hz + 0.9 && Math.abs(this.x - ox) < hl + 0.55) {
        if (kind === 'hurt') {
          if (this.invul <= 0) {
            this.hearts--; this.hitCount++; this.invul = 1.5;
            this.vx = (this.x < ox ? -1 : 1) * 5;
            ev.push({ type: 'hit', hearts: this.hearts });
          }
        } else if (kind === 'slow') {
          if (!o._done) { o._done = true; this.stuck = Math.max(this.stuck, 0.45); ev.push({ type: 'slow' }); }
        } else if (kind === 'stuck') {
          if (!o._done) { o._done = true; this.stuck = 1.0; ev.push({ type: 'stuck' }); }
        }
      }
    }

    // ── 폭포 게이트 ──
    while (this.gateIdx < st.gates.length && st.gates[this.gateIdx].z < this.z - 3) this.gateIdx++;
    const gate = st.gates[this.gateIdx];
    if (gate && !gate._done && this.z >= gate.z - 0.4) {
      gate._done = true;
      const gx = st.cx(gate.z) + gate.gapOff;
      if (Math.abs(this.x - gx) > gate.gapHalf + 0.3) {
        if (this.invul <= 0) {
          this.hearts--; this.hitCount++; this.invul = 1.5;
          ev.push({ type: 'hit', hearts: this.hearts, gate: true });
        }
      } else {
        ev.push({ type: 'gateboost' });
      }
    }

    // ── 아이템 ──
    while (this.itIdx < st.items.length && st.items[this.itIdx].z < this.z - 3) this.itIdx++;
    for (let i = this.itIdx; i < st.items.length; i++) {
      const it = st.items[i];
      if (it.z > this.z + 3) break;
      if (it._got) continue;
      if (Math.abs(it.z - this.z) < 1.1 && Math.abs(st.cx(it.z) + it.off - this.x) < 1.15) {
        it._got = true;
        this.itemCount++;
        if (it.kind === 'fish') this.fishCount++;
        ev.push({ type: 'pickup', kind: it.kind, id: it.id });
      }
    }

    // ── 닭 합류 ──
    const chk = st.chicken;
    if (chk && !chk.joined && Math.abs(chk.z - this.z) < 1.6 && Math.abs(st.cx(chk.z) + chk.off - this.x) < 2.2) {
      chk.joined = true;
      ev.push({ type: 'chicken' });
    }

    // ── 비주얼 ──
    const bobY = 0.18 + Math.sin(t * 2.3) * 0.05 + Math.sin(t * 4.1) * 0.02;
    this.group.position.set(this.x, bobY, this.z);
    this.group.rotation.z = -this.vx * 0.035 + Math.sin(t * 2.0) * 0.03;
    this.group.rotation.x = Math.sin(t * 1.7) * 0.025 + (this.speedMode === 1 ? -0.05 : 0);
    this.paddle.rotation.x = Math.sin(t * 3.2) * 0.3;
    this.paddle.rotation.z = -0.9 - this.vx * 0.06;
    if (this.chickenMesh) this.chickenMesh.position.y = 0.3 + Math.abs(Math.sin(t * 5)) * 0.07;

    // 피격 점멸
    if (this.invul > 0) {
      this.moguMat.color.setHex(Math.floor(t * 12) % 2 ? 0xff7070 : 0xffffff);
      this.group.visible = Math.floor(t * 14) % 3 !== 2;
    } else {
      this.moguMat.color.setHex(0xffffff);
      this.group.visible = true;
    }

    // ── 결승 ──
    if (this.z >= st.finishZ) ev.push({ type: 'finish' });
    return ev;
  }

  reviveAtCurrent() {
    this.hearts = 3;
    this.invul = 3.0;
    this.stuck = 0;
    this.vx = 0;
    // 죽은 지점 바로 뒤 통로 중앙 부근으로 살짝 보정
    const cx = this.stage.cx(this.z), hw = this.stage.halfW(this.z);
    const off = this.x - cx;
    this.x = cx + Math.max(-(hw - 1.2), Math.min(hw - 1.2, off));
  }

  dispose() { this.scene.remove(this.group); }
};

}
/* ── ui.js ── */
{
// ui.js — HUD / 타이틀 / 월드 맵 / 컨티뉴 / 결과 / 저장
const G = window.MOGU;

const $ = (id) => document.getElementById(id);

// ── 저장 ──
G.save = {
  KEY: 'mogu-eodiga-save-v1',
  data: { stars: {}, bestTime: {} },
  load() {
    try { const raw = localStorage.getItem(this.KEY); if (raw) this.data = JSON.parse(raw); } catch (e) {}
    return this.data;
  },
  store() { try { localStorage.setItem(this.KEY, JSON.stringify(this.data)); } catch (e) {} },
  unlocked() {
    let max = 1;
    for (let s = 1; s <= 50; s++) if (this.data.stars[s] > 0) max = Math.max(max, Math.min(50, s + 1));
    return max;
  },
  record(stage, stars, time) {
    this.data.stars[stage] = Math.max(this.data.stars[stage] || 0, stars);
    const bt = this.data.bestTime[stage];
    if (!bt || time < bt) this.data.bestTime[stage] = time;
    this.store();
  },
  // 외부 세이브와 병합: 스테이지별 높은 별점·빠른 기록 유지
  merge(ext) {
    let gained = 0;
    for (let s = 1; s <= 50; s++) {
      const a = this.data.stars[s] || 0, b = (ext.stars && ext.stars[s]) || 0;
      if (b > a) { this.data.stars[s] = b; gained++; }
      const bt = (ext.bestTime && ext.bestTime[s]) || null;
      if (bt && (!this.data.bestTime[s] || bt < this.data.bestTime[s])) this.data.bestTime[s] = bt;
    }
    this.store();
    return gained;
  },
};

// ── UI ──
G.ui = {
  screens: ['title-screen', 'map-screen', 'continue-screen', 'result-screen', 'pause-screen'],
  onStageClick: null,
  toastTimer: null,

  init() {
    $('title-icon').src = G.ASSETS.icon;

    // ── 세이브 내보내기 / 불러오기 ──
    const msg = (t) => {
      $('save-msg').textContent = t;
      clearTimeout(this._saveMsgTimer);
      this._saveMsgTimer = setTimeout(() => { $('save-msg').textContent = ''; }, 4000);
    };
    $('btn-save-export').addEventListener('click', () => {
      const cleared = Object.values(G.save.data.stars).filter((v) => v > 0).length;
      const blob = new Blob([JSON.stringify(G.save.data, null, 1)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      const d = new Date();
      const ymd = `${String(d.getFullYear()).slice(2)}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
      a.download = `모구어디가_세이브_${ymd}.json`;
      a.click();
      URL.revokeObjectURL(a.href);
      msg(`내보냄 (클리어 ${cleared}개) — 받은 파일을 드라이브 폴더에 두세요`);
    });
    $('btn-save-import').addEventListener('click', () => $('save-file-input').click());
    $('save-file-input').addEventListener('change', (e) => {
      const f = e.target.files[0];
      e.target.value = '';
      if (!f) return;
      const rd = new FileReader();
      rd.onload = () => {
        try {
          const ext = JSON.parse(rd.result);
          if (!ext || typeof ext.stars !== 'object') throw new Error('format');
          const gained = G.save.merge(ext);
          this.buildMap(G.save.unlocked());
          this.selectMapNode(G.save.unlocked());
          msg(gained > 0 ? `불러옴 — 스테이지 ${gained}개 진행이 갱신됨` : '불러옴 — 이미 최신 진행입니다');
        } catch (err) {
          msg('세이브 파일이 아닙니다');
        }
      };
      rd.readAsText(f);
    });
  },

  show(id) {
    for (const s of this.screens) $(s).classList.toggle('hidden', s !== id);
    $('hud').classList.toggle('hidden', id !== null && id !== 'continue-screen' && id !== 'pause-screen');
  },
  hideAll() {
    for (const s of this.screens) $(s).classList.add('hidden');
    $('hud').classList.remove('hidden');
  },
  fade(on) { $('fade').style.opacity = on ? 1 : 0; },

  // ── HUD ──
  hud(hearts, stageNo, progress, churGot, churTotal, fish, speedLabel) {
    $('hud-hearts').textContent = '❤️'.repeat(Math.max(0, hearts)) + '🖤'.repeat(Math.max(0, 3 - hearts));
    $('hud-stage').textContent = `STAGE ${stageNo}`;
    const pct = Math.min(100, Math.max(0, progress * 100));
    $('hud-progress-fill').style.width = pct + '%';
    $('hud-progress-icon').style.left = pct + '%';
    $('hud-items').innerHTML = `🐟 ${fish}&nbsp;&nbsp;🍡 ${churGot}/${churTotal}`;
    $('hud-speed').textContent = speedLabel;
  },

  toast(text, dur = 1.8) {
    const el = $('hud-toast');
    el.textContent = text;
    el.style.opacity = 1;
    clearTimeout(this.toastTimer);
    this.toastTimer = setTimeout(() => { el.style.opacity = 0; }, dur * 1000);
  },

  // ── 월드 맵 ──
  buildMap(selected) {
    const track = $('map-track');
    track.innerHTML = '';
    const GAP = 92, PAD = 60;
    track.style.height = PAD * 2 + GAP * 50 + 'px';
    const unlocked = G.save.unlocked();

    // 월드 배경 밴드
    for (let w = 1; w <= 5; w++) {
      const band = document.createElement('div');
      band.className = 'world-band';
      const T = G.THEMES[w];
      const c = '#' + T.sky.toString(16).padStart(6, '0');
      band.style.top = PAD + (w - 1) * 10 * GAP - GAP / 2 + 'px';
      band.style.height = 10 * GAP + 'px';
      band.style.background = `linear-gradient(rgba(0,0,0,.15), rgba(0,0,0,.3)), ${c}`;
      const lab = document.createElement('div');
      lab.className = 'world-label';
      lab.textContent = `WORLD ${w} · ${T.name}`;
      band.appendChild(lab);
      track.appendChild(band);
    }

    this.nodeEls = [];
    for (let s = 1; s <= 50; s++) {
      const node = document.createElement('div');
      node.className = 'stage-node';
      const stars = G.save.data.stars[s] || 0;
      if (stars > 0) node.classList.add('cleared');
      if (s > unlocked) node.classList.add('locked');
      if (s === selected) node.classList.add('selected');
      node.style.top = PAD + (s - 1) * GAP + 'px';
      node.style.left = `calc(50% + ${Math.sin(s * 0.55) * 26}%)`;
      node.innerHTML = s > unlocked
        ? '🔒'
        : `<div>${s}</div>` + (stars > 0 ? `<div class="stars">${'★'.repeat(stars)}${'☆'.repeat(3 - stars)}</div>` : '');
      if (s <= unlocked) node.addEventListener('click', () => this.onStageClick && this.onStageClick(s));
      track.appendChild(node);
      this.nodeEls.push(node);
    }
  },

  selectMapNode(s) {
    if (!this.nodeEls) return;
    this.nodeEls.forEach((n, i) => n.classList.toggle('selected', i === s - 1));
    const el = this.nodeEls[s - 1];
    if (el) {
      const sc = $('map-scroll');
      sc.scrollTo({ top: el.offsetTop - sc.clientHeight / 2, behavior: 'smooth' });
    }
  },

  // ── 컨티뉴 ──
  setCountdown(n) { $('continue-count').textContent = n; },
  coinDrop() {
    const c = $('coin');
    c.classList.remove('drop');
    void c.offsetWidth;        // 애니메이션 재시작
    c.classList.add('drop');
  },

  // ── 결과 ──
  showResult(o) {
    $('result-title').textContent = o.cleared ? (o.stage === 50 ? '🏠 집 도착!!' : 'CLEAR!') : 'GAME OVER';
    $('result-title').style.color = o.cleared ? '#ffd83d' : '#ff6b6b';
    $('result-stars').textContent = o.cleared ? '★'.repeat(o.stars) + '☆'.repeat(3 - o.stars) : '';
    $('result-stars').style.color = '#ffd83d';
    let html = '';
    if (o.cleared) {
      html += `소요 시간 <b>${o.time.toFixed(1)}초</b><br>`;
      html += `수집 🍡 <b>${o.churGot}/${o.churTotal}</b> (${Math.round(o.itemPct * 100)}%) · 🐟 <b>${o.fish}</b><br>`;
      html += o.continues > 0 ? `컨티뉴 <b>${o.continues}회</b> 사용 (별점 ★1 제한)` : '노컨티뉴 클리어!';
      if (o.stage === 50) html += '<br><br>모구가 무사히 집에 도착했습니다 🎉';
    } else {
      html = '월드 맵으로 돌아갑니다';
    }
    $('result-stats').innerHTML = html;
    $('btn-next').style.display = o.cleared && o.stage < 50 ? '' : 'none';
    this.show('result-screen');
  },

  highlightButtons(ids, sel) {
    ids.forEach((id, i) => $(id).classList.toggle('selected', i === sel));
  },
};

}

{

let boost = 0;
const keys = { left: false, right: false, up: false, down: false };

// ── 텍스처 (이미지 → 캔버스 경유: HTMLImage 직접 업로드가 일부 환경에서 실패) ──
let moguTex = null;
{
  const img = new Image();
  img.onload = () => {
    const cv = document.createElement('canvas');
    cv.width = img.naturalWidth; cv.height = img.naturalHeight;
    cv.getContext('2d').drawImage(img, 0, 0);
    const t = new THREE.CanvasTexture(cv);
    t.colorSpace = THREE.SRGBColorSpace;
    moguTex = t;
    if (player) {                       // 텍스처보다 스테이지가 먼저 시작된 경우 갱신
      player.moguMat.map = t;
      player.moguMat.needsUpdate = true;
      const a = cv.width / cv.height, h = 1.55;
      player.mogu.scale.set(h * a, h, 1);
    }
  };
  img.src = G.ASSETS.mogu;
}

G.save.load();
G.ui.init();
G.ui.show('title-screen');

// ── 화면 전환 ──
function transition(fn) {
  G.ui.fade(true);
  setTimeout(() => { fn(); G.ui.fade(false); }, 470);
}

function goMap() {
  state = 'map';
  mapSel = Math.min(G.save.unlocked(), Math.max(1, stageNo));
  G.ui.show('map-screen');
  G.ui.buildMap(mapSel);
  setTimeout(() => G.ui.selectMapNode(mapSel), 30);
  G.audio.stopWater();
}

function startStage(n) {
  if (world) { world.dispose(); world = null; }
  if (player) { player.dispose(); player = null; }
  stageNo = n;
  stage = G.makeStage(n);
  world = new G.WorldRenderer(scene, stage);
  player = new G.Player(scene, stage, moguTex || new THREE.Texture());
  elapsed = 0; continuesUsed = 0; boost = 0;
  churTotal = stage.items.filter((i) => i.kind === 'chur').length;
  itemTotal = stage.items.length;
  state = 'play';
  G.ui.hideAll();
  G.ui.toast(`WORLD ${stage.params.world} · ${stage.params.theme.name}`, 2.2);
  G.audio.resume(); G.audio.startWater(); G.audio.meow();
  // 카메라 초기 위치
  camera.position.set(stage.cx(0), 6.4, -8);
}

function dieAndOfferContinue() {
  state = 'continue';
  countdown = 10; countdownAcc = 0; reviveDelay = 0;
  G.ui.setCountdown(10);
  G.ui.show('continue-screen');
  G.audio.gameover();
}

function useCoin() {
  if (reviveDelay > 0) return;
  reviveDelay = 0.7;
  continuesUsed++;
  G.ui.coinDrop();
  G.audio.coin();
}

function giveUp() {
  transition(() => goMap());
}

function clearStage() {
  state = 'result';
  const pct = itemTotal > 0 ? player.itemCount / itemTotal : 1;
  let stars = 1;
  if (continuesUsed === 0 && player.hitCount === 0) stars = pct >= 0.8 ? 3 : 2;
  G.save.record(stageNo, stars, elapsed);
  resultSel = stageNo < 50 ? 2 : 1;
  G.ui.showResult({
    cleared: true, stage: stageNo, stars, time: elapsed,
    churGot: player.itemCount - player.fishCount, churTotal,
    itemPct: pct, fish: player.fishCount, continues: continuesUsed,
  });
  highlightResult();
  G.audio.fanfare();
  setTimeout(() => G.audio.meow(), 800);
  G.audio.setWaterLevel(0);
}

// ── 결과/일시정지 버튼 ──
const RESULT_BTNS = ['btn-retry', 'btn-map', 'btn-next'];
const PAUSE_BTNS = ['btn-resume', 'btn-prestart', 'btn-pmap'];
function visibleResultBtns() {
  return RESULT_BTNS.filter((id) => document.getElementById(id).style.display !== 'none');
}
function highlightResult() {
  const vis = visibleResultBtns();
  resultSel = Math.min(resultSel, vis.length - 1);
  G.ui.highlightButtons(vis, resultSel);
}
function activateResult() {
  const id = visibleResultBtns()[resultSel];
  if (id === 'btn-retry') transition(() => startStage(stageNo));
  else if (id === 'btn-map') transition(() => goMap());
  else if (id === 'btn-next') transition(() => startStage(stageNo + 1));
}
document.getElementById('btn-retry').onclick = () => { resultSel = visibleResultBtns().indexOf('btn-retry'); activateResult(); };
document.getElementById('btn-map').onclick = () => { resultSel = visibleResultBtns().indexOf('btn-map'); activateResult(); };
document.getElementById('btn-next').onclick = () => { resultSel = visibleResultBtns().indexOf('btn-next'); activateResult(); };
document.getElementById('btn-resume').onclick = () => resumePlay();
document.getElementById('btn-prestart').onclick = () => transition(() => startStage(stageNo));
document.getElementById('btn-pmap').onclick = () => transition(() => goMap());

function resumePlay() { state = 'play'; G.ui.hideAll(); }

G.ui.onStageClick = (s) => { if (state === 'map') transition(() => startStage(s)); };

// ── 입력 ──
window.addEventListener('keydown', (e) => {
  G.audio.resume();
  const k = e.key;
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(k)) e.preventDefault();

  if (k === 'ArrowLeft') keys.left = true;
  if (k === 'ArrowRight') keys.right = true;
  if (k === 'ArrowUp') keys.up = true;
  if (k === 'ArrowDown') keys.down = true;

  if (state === 'title') {
    if (k === 'Enter' || k === ' ') transition(() => goMap());
  } else if (state === 'map') {
    const unlocked = G.save.unlocked();
    if (k === 'ArrowDown' || k === 'ArrowRight') { mapSel = Math.min(unlocked, mapSel + 1); G.ui.selectMapNode(mapSel); }
    if (k === 'ArrowUp' || k === 'ArrowLeft') { mapSel = Math.max(1, mapSel - 1); G.ui.selectMapNode(mapSel); }
    if (k === 'Enter' || k === ' ') transition(() => startStage(mapSel));
  } else if (state === 'play') {
    if (k === 'Escape') { state = 'pause'; pauseSel = 0; G.ui.show('pause-screen'); G.ui.highlightButtons(PAUSE_BTNS, 0); }
    if (k === 'r' || k === 'R') transition(() => startStage(stageNo));
  } else if (state === 'pause') {
    if (k === 'Enter' || k === 'Escape') resumePlay();
    if (k === 'r' || k === 'R') transition(() => startStage(stageNo));
    if (k === 'm' || k === 'M') transition(() => goMap());
    if (k === 'ArrowLeft') { pauseSel = Math.max(0, pauseSel - 1); G.ui.highlightButtons(PAUSE_BTNS, pauseSel); }
    if (k === 'ArrowRight') { pauseSel = Math.min(2, pauseSel + 1); G.ui.highlightButtons(PAUSE_BTNS, pauseSel); }
  } else if (state === 'continue') {
    if (k === 'Escape') giveUp();
    else if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Enter', ' '].includes(k)) useCoin();
  } else if (state === 'result') {
    const vis = visibleResultBtns();
    if (k === 'ArrowLeft') { resultSel = Math.max(0, resultSel - 1); highlightResult(); }
    if (k === 'ArrowRight') { resultSel = Math.min(vis.length - 1, resultSel + 1); highlightResult(); }
    if (k === 'Enter' || k === ' ') activateResult();
  }
});
window.addEventListener('keyup', (e) => {
  if (e.key === 'ArrowLeft') keys.left = false;
  if (e.key === 'ArrowRight') keys.right = false;
  if (e.key === 'ArrowUp') keys.up = false;
  if (e.key === 'ArrowDown') keys.down = false;
});

// 디버그 (테스트 자동화용)
G.THREE = THREE;
G._scene = scene; G._camera = camera; G._renderer = renderer;
G._player = () => player;
G._die = () => dieAndOfferContinue();
G._dbg = () => ({
  state, stageNo,
  hasTex: !!moguTex, texSize: moguTex && moguTex.image ? [moguTex.image.width, moguTex.image.height] : null,
  player: player ? { x: player.x.toFixed(1), z: player.z.toFixed(1), hearts: player.hearts,
    moguVisible: player.mogu.visible, moguScale: [player.mogu.scale.x.toFixed(2), player.mogu.scale.y.toFixed(2)],
    moguHasMap: !!player.moguMat.map, moguMapImg: !!(player.moguMat.map && player.moguMat.map.image) } : null,
});

// ── 메인 루프 ──
const clock = new THREE.Clock();
let gameTime = 0;

function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, clock.getDelta());

  if (state === 'play' && player && world) {
    gameTime += dt;
    elapsed += dt;
    if (boost > 0) boost -= dt;

    const ev = player.update(gameTime, dt, keys);
    for (const e of ev) {
      if (e.type === 'hit') {
        G.audio.hit();
        if (e.hearts <= 0) dieAndOfferContinue();
      } else if (e.type === 'pickup') {
        world.setCollected(e.id);
        if (e.kind === 'fish') G.audio.fish(); else G.audio.pickup();
      } else if (e.type === 'slow') { G.audio.stuck(); }
      else if (e.type === 'stuck') { G.audio.stuck(); G.ui.toast('모래톱에 걸렸다!', 1.2); }
      else if (e.type === 'gateboost') { boost = 1.2; G.audio.whoosh(); G.ui.toast('폭포 통과!', 1.2); }
      else if (e.type === 'chicken') {
        player.attachChicken(() => world.makeChicken());
        G.audio.cluck();
        G.ui.toast('🐔 닭이 바구니에 올라탔다!', 2.2);
      } else if (e.type === 'finish') {
        clearStage();
      }
    }

    const zone = player.zoneAt(player.z);
    world.update(gameTime, dt, player.z, player.x, zone === 'blizzard');

    // HUD
    const speedLabel = zone === 'rapid' ? '🌊 급류!' : zone === 'blizzard' ? '❄ 눈보라'
      : keys.up ? '▲▲ 가속' : keys.down ? '▽ 감속' : '';
    G.ui.hud(player.hearts, stageNo, player.z / stage.finishZ,
      player.itemCount - player.fishCount, churTotal, player.fishCount, speedLabel);
    G.audio.setWaterLevel(Math.min(1, player.currentSpeed() / 16) + (zone === 'rapid' ? 0.3 : 0));

    // 카메라
    const cz = player.z;
    const tx = player.x * 0.72 + stage.cx(cz) * 0.28;
    const damp = 1 - Math.exp(-dt * 5);
    camera.position.x += (tx - camera.position.x) * damp;
    camera.position.y += (6.4 - camera.position.y) * damp;
    camera.position.z = cz - 8.6;
    const lx = stage.cx(cz + 13) * 0.8 + player.x * 0.2;
    camera.lookAt(lx, 0.6, cz + 13);
    camera.rotateZ(-player.vx * 0.011);
    const fovT = 60 + (zone === 'rapid' || boost > 0 || keys.up ? 6 : 0);
    camera.fov += (fovT - camera.fov) * damp;
    camera.updateProjectionMatrix();
  } else if (state === 'continue') {
    // 컨티뉴 카운트다운
    if (reviveDelay > 0) {
      reviveDelay -= dt;
      if (reviveDelay <= 0) {
        player.reviveAtCurrent();
        state = 'play';
        G.ui.hideAll();
        G.ui.toast('GO!', 1.0);
      }
    } else {
      countdownAcc += dt;
      if (countdownAcc >= 1) {
        countdownAcc -= 1;
        countdown--;
        if (countdown <= 0) { giveUp(); }
        else { G.ui.setCountdown(countdown); G.audio.beep(countdown <= 3); }
      }
    }
    if (world && player) world.update(gameTime, dt * 0.15, player.z, player.x, false);
  } else if ((state === 'result' || state === 'pause') && world && player) {
    // 배경 살짝 살아있게
    world.update(gameTime, dt * 0.25, player.z, player.x, false);
  }

  renderer.render(scene, camera);
}
frame();

}
</script>
