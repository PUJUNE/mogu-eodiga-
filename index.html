<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>모구 게임 시리즈</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  html, body { margin:0; padding:0; min-height:100%; background:linear-gradient(#1a2440 0%, #2c3a60 55%, #141c30 100%);
    font-family:'Malgun Gothic','맑은 고딕',sans-serif; color:#fff;
    -webkit-tap-highlight-color:transparent; }
  #wrap { min-height:100vh; display:flex; flex-direction:column; align-items:center;
    justify-content:center; padding:34px 16px; box-sizing:border-box; }
  .logo { font-size:min(58px, 11vw); font-weight:900; color:#ffd83d; white-space:nowrap;
    text-shadow:0 4px 0 #8a5a10, 0 8px 16px rgba(0,0,0,.5); letter-spacing:min(6px, 1.2vw); }
  .sub { margin-top:8px; font-size:16px; color:#bcd0f0; font-weight:700; }
  #mogu-face { width:110px; height:auto; margin:22px 0 8px; animation:bob 1.6s ease-in-out infinite;
    filter:drop-shadow(0 8px 10px rgba(0,0,0,.4)); }
  @keyframes bob { 0%,100%{transform:translateY(0) rotate(-4deg)} 50%{transform:translateY(-12px) rotate(4deg)} }

  #cards { display:flex; gap:22px; margin-top:26px; flex-wrap:wrap; justify-content:center; }
  .card { display:block; width:270px; text-decoration:none; color:#fff;
    background:rgba(255,255,255,.07); border:3px solid rgba(255,255,255,.35); border-radius:18px;
    padding:20px 20px 18px; text-align:center; transition:transform .12s, border-color .12s, background .12s;
    box-shadow:0 8px 18px rgba(0,0,0,.35); }
  .card:hover, .card:active { transform:translateY(-4px) scale(1.02); border-color:#ffd83d; background:rgba(255,255,255,.12); }
  .card .art { font-size:52px; line-height:1.2; margin-bottom:6px; }
  .card h2 { margin:4px 0 8px; font-size:24px; font-weight:900; }
  .card p { margin:0; font-size:14px; color:#c8d6ee; line-height:1.65; min-height:66px; }
  .card .play { display:inline-block; margin-top:14px; padding:9px 26px; font-size:15px; font-weight:800;
    background:#3aa84f; border-radius:10px; border:2px solid rgba(255,255,255,.7); }
  .card.moguman .play { background:#c8385a; }
  .foot { margin-top:30px; font-size:12px; color:rgba(255,255,255,.45); }
</style>
</head>
<body>
<div id="wrap">
  <div class="logo">모구 게임 시리즈</div>
  <div class="sub">MOGU GAME SERIES</div>
  <img id="mogu-face" src="game/assets/mogu-icon.png" alt="모구">
  <div id="cards">
    <a class="card" href="eodiga.html" id="card-eodiga">
      <div class="art">🧺🌊</div>
      <h2>모구 어디가</h2>
      <p>바구니 타고 강 따라 집까지!<br>50스테이지 3D 리버 러너<br>난이도 4종 · 모바일 터치 지원</p>
      <span class="play">▶ PLAY</span>
    </a>
    <a class="card moguman" href="moguman.html" id="card-moguman">
      <div class="art">🧶🐭</div>
      <h2>모구맨</h2>
      <p>고양이 털을 쏴서 적을 털뭉치로!<br>굴려서 쓸어버리는 50층 액션<br>10층마다 보스 · 모바일 터치 지원</p>
      <span class="play">▶ PLAY</span>
    </a>
  </div>
  <div class="foot">🐱 mogu game series · made with June & 아타리</div>
</div>
</body>
</html>
