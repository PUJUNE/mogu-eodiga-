<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>슈퍼모구</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#0c1018;
    font-family:'Malgun Gothic','맑은 고딕',sans-serif; user-select:none;
    touch-action:none; overscroll-behavior:none;
    -webkit-user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  #app { position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  #stage-wrap { position:relative; }
  canvas { display:block; background:#000; }

  .screen { position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; z-index:10; }
  .hidden { display:none !important; }

  #hud { position:absolute; inset:0; pointer-events:none; z-index:5; }
  #hud-toast { position:absolute; top:30%; left:50%; transform:translateX(-50%);
    color:#fff; font-size:19px; font-weight:900; text-shadow:0 3px 6px rgba(0,0,0,.6);
    opacity:0; transition:opacity .3s; white-space:nowrap; }

  /* ── 타이틀 ── */
  #title-screen { background:linear-gradient(#63a4f0 0%, #b8ddf8 55%, #5db84a 56%, #3a8a2a 100%); }
  #title-screen .logo { font-size:min(58px, 12vw); font-weight:900; color:#fff; white-space:nowrap;
    text-shadow:0 5px 0 #b03020, 0 9px 18px rgba(0,0,0,.4); letter-spacing:min(7px, 1.4vw); }
  #title-screen .sub { margin-top:6px; font-size:17px; color:#1c4a28; font-weight:700;
    text-shadow:0 1px 2px rgba(255,255,255,.4); }
  #title-icon { width:105px; height:auto; margin:16px 0 4px; animation:bob 1.2s ease-in-out infinite;
    filter:drop-shadow(0 8px 10px rgba(0,0,0,.4)); }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-22px)} }
  #title-hi { margin-top:4px; color:#ffd83d; font-size:14px; font-weight:800; min-height:19px;
    text-shadow:0 1px 3px rgba(0,0,0,.5); }
  #title-hint { margin-top:12px; color:rgba(255,255,255,.95); font-size:13px; text-align:center;
    padding:0 14px; text-shadow:0 1px 3px rgba(0,0,0,.55); }

  .menu-buttons { display:flex; gap:12px; margin-top:18px; flex-wrap:wrap; justify-content:center; padding:0 10px; }
  .btn { pointer-events:auto; padding:12px 24px; font-size:16px; font-weight:800; color:#fff;
    background:#d84838; border:3px solid rgba(255,255,255,.8); border-radius:12px; cursor:pointer;
    box-shadow:0 4px 8px rgba(0,0,0,.4); font-family:inherit; }
  .btn.primary { background:#3aa84f; }
  .btn.series { padding:9px 18px; font-size:13px; background:#2e6da3; }

  /* ── 승리 / 일시정지 / 게임오버 / 엔딩 ── */
  #win-screen { background:rgba(8,30,16,.85); z-index:20; }
  #win-screen .big { font-size:min(44px, 10vw); font-weight:900; color:#ffd83d; }
  #win-stars { font-size:44px; color:#ffd83d; letter-spacing:8px; margin:8px 0 2px; }
  #win-stats { color:#dcf5e2; font-size:17px; line-height:1.8; text-align:center; }
  #pause-screen { background:rgba(0,0,0,.6); z-index:20; }
  #pause-screen .big, #over-screen .big, #ending-screen .big {
    font-size:min(42px, 10vw); font-weight:900; color:#fff; white-space:nowrap; }
  #over-screen { background:rgba(0,0,0,.85); z-index:20; }
  #over-screen .big { color:#ff5252; letter-spacing:5px; }
  #over-count { font-size:70px; font-weight:900; color:#fff; margin-top:8px; text-shadow:0 4px 10px rgba(0,0,0,.8); }
  #over-screen .hint { margin-top:10px; font-size:16px; color:#ffd83d; font-weight:700; padding:0 14px; text-align:center; }
  #ending-screen { background:linear-gradient(#1a0a14 0%, #40182a 45%, #63a4f0 100%); z-index:20; }
  #ending-screen .big { color:#ffd83d; }
  #ending-screen .msg { margin-top:14px; color:#f0e4ea; font-size:16px; line-height:1.8; text-align:center; padding:0 16px; }

  /* ── 터치 가상 패드 ── */
  #vpad { position:fixed; inset:0; pointer-events:none; z-index:8; display:none; }
  body.touch #vpad.on { display:block; }
  .vbtn { position:absolute; pointer-events:auto; width:66px; height:66px; border-radius:50%;
    background:rgba(255,255,255,.15); border:2px solid rgba(255,255,255,.5);
    color:rgba(255,255,255,.92); font-size:22px; font-weight:800;
    display:flex; align-items:center; justify-content:center;
    touch-action:none; user-select:none; text-shadow:0 2px 3px rgba(0,0,0,.5); }
  .vbtn.pressed { background:rgba(255,255,255,.38); border-color:#ffd83d; }
  #vbtn-left  { left:calc(14px + env(safe-area-inset-left)); bottom:calc(24px + env(safe-area-inset-bottom)); }
  #vbtn-right { left:calc(92px + env(safe-area-inset-left)); bottom:calc(24px + env(safe-area-inset-bottom)); }
  #vbtn-b     { right:calc(104px + env(safe-area-inset-right)); bottom:calc(24px + env(safe-area-inset-bottom)); }
  #vbtn-a     { right:calc(14px + env(safe-area-inset-right)); bottom:calc(44px + env(safe-area-inset-bottom)); width:84px; height:84px; font-size:28px; }
  #vbtn-pause { right:calc(12px + env(safe-area-inset-right)); top:calc(24px + env(safe-area-inset-top));
    width:44px; height:44px; font-size:17px; border-radius:12px; }
</style>
</head>
<body>
<div id="app">
  <div id="stage-wrap">
    <canvas id="game" width="480" height="270"></canvas>
    <div id="hud" class="hidden"><div id="hud-toast"></div></div>
  </div>

  <div id="title-screen" class="screen">
    <div class="logo">슈퍼모구</div>
    <div class="sub">~ 달리고 밟고 깃발까지! ~</div>
    <img id="title-icon" alt="모구">
    <div id="title-hi"></div>
    <div class="menu-buttons">
      <button class="btn primary" id="btn-continue">이어하기</button>
      <button class="btn" id="btn-new">처음부터</button>
    </div>
    <div class="menu-buttons"><button class="btn series" id="btn-series">🏠 모구 게임 시리즈</button></div>
    <div id="title-hint">←→ 달리기 · Space 점프(길게 = 높이) · Shift 대시/털뭉치 · ESC 일시정지<br>?블록을 치면 츄르·캣닢! 쥐와 새를 밟고 깃발까지 달려라! (8월드 32스테이지)</div>
  </div>

  <div id="win-screen" class="screen hidden">
    <div class="big">🚩 클리어!!</div>
    <div id="win-stars">★★★</div>
    <div id="win-stats"></div>
    <div class="menu-buttons">
      <button class="btn" id="btn-retry">다시 도전</button>
      <button class="btn" id="btn-win-title">타이틀로</button>
      <button class="btn primary" id="btn-next">다음 스테이지 →</button>
    </div>
  </div>

  <div id="pause-screen" class="screen hidden">
    <div class="big">일시정지</div>
    <div class="menu-buttons">
      <button class="btn primary" id="btn-resume">계속</button>
      <button class="btn" id="btn-restage">재시작</button>
      <button class="btn" id="btn-title">타이틀로</button>
    </div>
  </div>

  <div id="over-screen" class="screen hidden">
    <div class="big">CONTINUE?</div>
    <div id="over-count">10</div>
    <div class="hint">Enter 또는 화면 터치 = 재도전</div>
    <div class="menu-buttons"><button class="btn" id="btn-over-title">타이틀로</button></div>
  </div>

  <div id="ending-screen" class="screen hidden">
    <div class="big">👑 쥐마왕 격파!!</div>
    <div class="msg">8월드 32스테이지 완전 제패!<br>모구의 평화가 돌아왔다! 🐱🚩</div>
    <div class="menu-buttons"><button class="btn primary" id="btn-end-title">타이틀로</button></div>
  </div>

  <div id="vpad">
    <div class="vbtn" id="vbtn-left">◀</div>
    <div class="vbtn" id="vbtn-right">▶</div>
    <div class="vbtn" id="vbtn-b">Ⓑ</div>
    <div class="vbtn" id="vbtn-a">Ⓐ</div>
    <div class="vbtn" id="vbtn-pause">⏸</div>
  </div>
</div>

<script>
/* ── rng.js ── */
{
// rng.js — 시드 기반 결정적 난수 (모구 어디가 rng.js와 동일 계열)
const M = window.SMG;

M.mulberry32 = function (seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
};

M.makeRng = function (seed) {
  const f = M.mulberry32(seed);
  return {
    next: f,
    range: (a, b) => a + f() * (b - a),
    int: (a, b) => Math.floor(a + f() * (b - a + 1)),
    pick: (arr) => arr[Math.floor(f() * arr.length)],
    chance: (p) => f() < p,
  };
};

}
/* ── levels.js ── */
{
// levels.js — 타일 스테이지 생성 (8월드 × 4, 시드 결정적)
const M = window.SMG;

M.W = 480; M.H = 270;
M.TILE = 16;
M.ROWS = 17;                     // 세로 17타일 (272px, 마지막 줄 지면 아래)

// 타일 코드
M.T = { AIR: 0, GND: 1, BRICK: 2, Q: 3, USED: 4, PIPE: 5, PIPE_T: 6, BLOCK: 7, LAVA: 8, FLAG: 9, CASTLE: 10 };

M.WORLDS = {
  1: { name: '초원',     sky0: '#63a4f0', sky1: '#b8ddf8', gnd: '#8a5a30', top: '#5db84a', deco: '#3a8a2a' },
  2: { name: '사막',     sky0: '#f0c878', sky1: '#fae8b8', gnd: '#c09858', top: '#e0c084', deco: '#8a6a3a' },
  3: { name: '숲',       sky0: '#2a6a4a', sky1: '#6aa87a', gnd: '#6a4a28', top: '#4a9a3a', deco: '#1e4a2e' },
  4: { name: '바다 절벽', sky0: '#4a8ac8', sky1: '#a8d4ee', gnd: '#7a7068', top: '#9aa27a', deco: '#3a6a9a' },
  5: { name: '설원',     sky0: '#a8c8e8', sky1: '#e8f2fa', gnd: '#8ea6b4', top: '#f0f6fa', deco: '#6a8aa4' },
  6: { name: '동굴',     sky0: '#1a1428', sky1: '#3a3050', gnd: '#5a5068', top: '#7a7088', deco: '#2a2438' },
  7: { name: '하늘',     sky0: '#7ab8f4', sky1: '#d8eefc', gnd: '#e8e4d8', top: '#f8f4ea', deco: '#ffffff' },
  8: { name: '마왕성',   sky0: '#1a0a14', sky1: '#40182a', gnd: '#584858', top: '#6a5a6a', deco: '#8a2030' },
};

M.stageNo = (world, sub) => (world - 1) * 4 + sub;
M.worldOf = (no) => ({ world: Math.floor((no - 1) / 4) + 1, sub: ((no - 1) % 4) + 1 });

M.makeStage = function (no) {
  const s = Math.max(1, Math.min(32, no));
  const { world, sub } = M.worldOf(s);
  const castle = sub === 4;
  const rng = M.makeRng(s * 7919 + 4507);
  const t = (s - 1) / 31;
  const T = M.T;

  const len = castle ? 130 : Math.round(150 + t * 70 + sub * 8);   // 가로 타일 수
  const R = M.ROWS;
  const g = new Array(len);                       // g[x][y]
  for (let x = 0; x < len; x++) g[x] = new Array(R).fill(T.AIR);
  const gndY = R - 2;                             // 기본 지면 y (15)

  const enemies = [];
  const fill = (x, yTop) => { for (let y = yTop; y < R; y++) g[x][y] = T.GND; };

  if (!castle) {
    // ── 필드: 세그먼트 연쇄 ──
    let x = 0;
    while (x < 14) { fill(x, gndY); x++; }        // 시작 안전지대
    const endSafe = len - 14;
    let lastGap = false;
    while (x < endSafe) {
      const r = rng.next();
      if (r < 0.16 && x > 20 && !lastGap) {
        // 갭 (점프 상한 4타일)
        const w = rng.int(2, Math.min(4, 2 + Math.floor(t * 3)));
        x += w;
        lastGap = true;
        continue;
      } else if (r < 0.3) {
        // 토관
        const flat = rng.int(3, 5);
        for (let i = 0; i < flat; i++) { fill(x, gndY); x++; }
        const ph = rng.int(2, 3);
        fill(x, gndY); fill(x + 1, gndY);
        for (let y = gndY - ph; y < gndY; y++) { g[x][y] = T.PIPE; g[x + 1][y] = T.PIPE; }
        g[x][gndY - ph] = T.PIPE_T; g[x + 1][gndY - ph] = T.PIPE_T;
        x += 2;
      } else if (r < 0.48) {
        // 벽돌·?블록 열 (공중 4타일 위)
        const w = rng.int(3, 6);
        const y = gndY - 4;
        for (let i = 0; i < w; i++) {
          fill(x, gndY);
          g[x][y] = rng.chance(0.38) ? T.Q : T.BRICK;
          if (rng.chance(0.5) && i > 0) enemies.push({ type: rng.chance(0.7) ? 'rat' : 'hedge', tx: x, ty: gndY - 1 });
          x++;
        }
      } else if (r < 0.6) {
        // 언덕 (계단 오르내림)
        const h = rng.int(2, 4);
        for (let i = 0; i < h; i++) { fill(x, gndY - 1 - i); x++; }
        const top = rng.int(2, 4);
        for (let i = 0; i < top; i++) { fill(x, gndY - h); x++; }
        for (let i = h - 1; i >= 0; i--) { fill(x, gndY - 1 - i); x++; }
      } else {
        // 평지 + 적
        const w = rng.int(4, 9);
        for (let i = 0; i < w; i++) {
          fill(x, gndY);
          if (i === 2 && rng.chance(0.34 + t * 0.3)) {
            enemies.push({ type: rng.chance(0.6) ? 'rat' : rng.chance(0.5) ? 'bird' : 'hedge', tx: x, ty: gndY - 1 });
          }
          x++;
        }
      }
      lastGap = false;
      if (x >= endSafe) break;
    }
    // 골인 계단 + 깃발 + 성
    for (let i = 0; i < 8 && x < len; i++) {
      for (let k = 0; k <= i; k++) g[x][gndY - 1 - k] = T.BLOCK;
      fill(x, gndY); x++;
    }
    while (x < len) { fill(x, gndY); x++; }
    g[len - 8][gndY - 9] = T.FLAG;                // 깃발 폴 상단 마커
    for (let y = gndY - 8; y < gndY; y++) g[len - 8][y] = T.FLAG;
    for (let cx = len - 5; cx < len - 1; cx++) {
      for (let y = gndY - 4; y < gndY; y++) g[cx][y] = T.CASTLE;
    }
  } else {
    // ── 성: 천장 + 용암 갭 + 보스방 ──
    const LAVA_LAND = 3;                          // 용암 뒤 착지 지면(타일). 다음 용암과 붙는 것을 막는다
    for (let x = 0; x < len; x++) {
      g[x][2] = T.BLOCK;                          // 천장
      if (x < 12 || x >= len - 26) { fill(x, gndY); continue; }
      // 용암 갭 or 지면
      if (rng.chance(0.22) && x > 16) {
        const w = rng.int(2, 4);                  // 점프 상한 4타일
        for (let i = 0; i < w && x < len - 26; i++) {
          g[x][2] = T.BLOCK;                      // 용암 위에도 천장을 이어 준다
          g[x][R - 1] = T.LAVA; g[x][gndY] = T.LAVA;
          x++;
        }
        // 착지 지면 확보 — 없으면 다음 굴림이 붙어 한 구간(최대 10타일)이 되어 넘을 수 없다
        for (let i = 0; i < LAVA_LAND && x < len - 26; i++) {
          g[x][2] = T.BLOCK;
          fill(x, gndY);                          // 착지 지대는 적·블록 없이 비워 둔다
          x++;
        }
        x--;
      } else {
        fill(x, gndY);
        // 착지 지대를 비워 둔 만큼(용암 구간당 3칸) 일반 지면의 배치 확률을 올려 밀도를 맞춘다
        if (rng.chance(0.21)) enemies.push({ type: 'hedge', tx: x, ty: gndY - 1 });
        if (rng.chance(0.13)) g[x][gndY - 4] = rng.chance(0.5) ? T.Q : T.BRICK;
      }
    }
    // 보스방 (평탄)

          c.fillStyle = '#8a6a4a';
          c.fillRect(x, y, TL, TL);
          c.strokeStyle = 'rgba(0,0,0,.4)';
          c.strokeRect(x + 0.5, y + 0.5, TL - 1, TL - 1);
        } else if (v === T.PIPE || v === T.PIPE_T) {
          c.fillStyle = '#2a9a3a';
          const isL = tx === 0 || st.stage.g[tx - 1][ty] !== v;
          c.fillRect(x - (v === T.PIPE_T && isL ? 2 : 0), y, TL + (v === T.PIPE_T ? 2 : 0), TL);
          c.fillStyle = 'rgba(255,255,255,.3)';
          c.fillRect(x + 2, y, 3, TL);
          c.fillStyle = 'rgba(0,0,0,.25)';
          c.fillRect(x + TL - 3, y, 3, TL);
          if (v === T.PIPE_T) {
            c.strokeStyle = 'rgba(0,0,0,.45)'; c.lineWidth = 1.4;
            c.strokeRect(x - (isL ? 2 : 0) + 0.5, y + 0.5, TL + 2 - 1, TL - 1);
          }
        } else if (v === T.BLOCK || v === T.CASTLE) {
          c.fillStyle = v === T.CASTLE ? '#8a8290' : this.shade(th.gnd, 1.15);
          c.fillRect(x, y, TL, TL);
          c.strokeStyle = 'rgba(0,0,0,.3)'; c.lineWidth = 1;
          c.strokeRect(x + 0.5, y + 0.5, TL - 1, TL - 1);
          c.fillStyle = 'rgba(255,255,255,.16)';
          c.fillRect(x + 1, y + 1, TL - 2, 3);
        } else if (v === T.LAVA) {
          c.fillStyle = '#e04a20';
          c.fillRect(x, y, TL, TL);
          c.fillStyle = '#ffb03a';
          const w1 = Math.sin(t * 4 + tx * 1.7) * 2;
          c.fillRect(x, y, TL, 3 + w1);
        } else if (v === T.FLAG) {
          // 폴 (기둥 열 전체에서 한 번만 — 상단 마커에서 그림)
          if (ty === 0 || st.stage.g[tx][ty - 1] !== T.FLAG) {
            const poleH = (st.stage.gndY - ty) * TL;
            c.fillStyle = '#c8ccd4';
            c.fillRect(x + 7, y, 3, poleH);
            c.fillStyle = '#e8e4dc';
            c.beginPath(); c.arc(x + 8.5, y - 2, 4, 0, Math.PI * 2); c.fill();
            // 깃발 (클리어 시 아래로)
            const fy = st.phase === 'clear' ? y + Math.min(poleH - 20, st.endT * 60) : y + 2;
            c.fillStyle = '#e83838';
            c.beginPath();
            c.moveTo(x + 7, fy);
            c.lineTo(x - 8, fy + 6);
            c.lineTo(x + 7, fy + 12);
            c.closePath(); c.fill();
          }
        }
      }
    }

    // 코인 팝
    for (const cp of st.pops) {
      const p2 = cp.t / 0.5;
      const y = cp.y - 14 - p2 * 30 + p2 * p2 * 22;
      c.fillStyle = '#ffd83d';
      c.beginPath();
      c.ellipse(cp.x - cam, y, 5 * Math.abs(Math.cos(cp.t * 14)), 7, 0, 0, Math.PI * 2);
      c.fill();
      c.strokeStyle = '#b8860b'; c.lineWidth = 1;
      c.stroke();
    }

    // 벽돌 파편 FX
    this.fx = this.fx.filter((f) => f.t < 0.6);
    for (const f of this.fx) {
      f.t += dt; f.vy += 500 * dt;
      f.x += f.vx * dt; f.y += f.vy * dt;
      c.globalAlpha = 1 - f.t / 0.6;
      c.fillStyle = '#b8683a';
      c.fillRect(f.x - cam - 3, f.y - 3, 6, 6);
      c.globalAlpha = 1;
    }

    // ── 아이템 ──
    for (const it of st.items) {
      const x = it.x - cam, y = it.y;
      if (it.kind === 'chur') {
        c.save();
        c.translate(x + 6, y + 6); c.rotate(-0.5);
        c.strokeStyle = 'rgba(20,16,28,.8)'; c.lineWidth = 8; c.lineCap = 'round';
        c.beginPath(); c.moveTo(-5, 0); c.lineTo(5, 0); c.stroke();
        c.strokeStyle = '#f0e0c8'; c.lineWidth = 5.5;
        c.beginPath(); c.moveTo(-5, 0); c.lineTo(5, 0); c.stroke();
        c.strokeStyle = '#e08830';
        c.beginPath(); c.moveTo(-5, 0); c.lineTo(-1, 0); c.stroke();
        c.restore();
      } else if (it.kind === 'catnip') {
        c.fillStyle = '#4aba4a';
        c.strokeStyle = 'rgba(20,16,28,.8)'; c.lineWidth = 1.2;
        for (const a of [-0.7, 0, 0.7]) {
          c.save();
          c.translate(x + 6, y + 8); c.rotate(a);
          c.beginPath(); c.ellipse(0, -5, 3, 6.5, 0, 0, Math.PI * 2); c.fill(); c.stroke();
          c.restore();
        }
        c.strokeStyle = '#2a7a2a'; c.lineWidth = 1.6;
        c.beginPath(); c.moveTo(x + 6, y + 8); c.lineTo(x + 6, y + 12); c.stroke();
      } else {
        // 반짝 방울 (무적)
        const pulse = 1 + Math.sin(t * 8) * 0.15;
        c.fillStyle = `hsl(${(t * 260) % 360}, 90%, 70%)`;
        c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 1.6;
        c.beginPath(); c.arc(x + 6, y + 6, 6.5 * pulse, 0, Math.PI * 2); c.fill(); c.stroke();
        c.fillStyle = 'rgba(255,255,255,.8)';
        c.beginPath(); c.arc(x + 4, y + 4, 2, 0, Math.PI * 2); c.fill();
      }
    }

    // ── 털뭉치 ──
    c.fillStyle = '#d8ccb8';
    c.strokeStyle = 'rgba(20,16,28,.7)'; c.lineWidth = 1.2;
    for (const sh of st.shots) {
      c.beginPath(); c.arc(sh.x - cam + 3.5, sh.y + 3.5, 4.5, 0, Math.PI * 2); c.fill(); c.stroke();
      c.strokeStyle = 'rgba(120,100,80,.5)';
      c.beginPath(); c.arc(sh.x - cam + 3.5, sh.y + 3.5, 2.2, t * 10, t * 10 + 2); c.stroke();
      c.strokeStyle = 'rgba(20,16,28,.7)';
    }

    // ── 악당 ──
    for (const e of st.enemies) {
      if (!e.alive) continue;
      const x = e.x - cam;
      if (x < -30 || x > W + 30) continue;
      this.drawEnemy(st, e, x, t);
    }

    // ── 보스 ──
    if (st.boss && st.boss.alive) this.drawBoss(st, st.boss, st.boss.x - cam, t);

    // ── 모구 ──
    this.drawMogu(st, t, cam);

    this.drawHud(st, t);
  },

  drawEnemy(st, e, x, t) {
    const c = this.ctx;
    const squish = e.squashT > 0;
    c.save();
    c.translate(x + e.w / 2, e.y + e.h);
    if (e.type === 'bird') {
      c.fillStyle = '#5a8ac8';
      c.strokeStyle = 'rgba(20,16,28,.85)'; c.lineWidth = 1.4;
      c.beginPath(); c.ellipse(0, -5.5, 7, 5.5, 0, 0, Math.PI * 2); c.fill(); c.stroke();
      const flap = Math.sin(t * 12 + e.phase) * 0.8;
      c.fillStyle = '#7aaae0';
      c.beginPath();
      c.moveTo(-2, -7); c.quadraticCurveTo(-9, -10 - flap * 6, -13, -6 - flap * 8);
      c.quadraticCurveTo(-8, -4, -2, -4); c.fill(); c.stroke();
      c.fillStyle = '#f0a030';
      c.beginPath(); c.moveTo(6, -6); c.lineTo(11, -5); c.lineTo(6, -3.5); c.fill();
      c.fillStyle = '#1a1620';
      c.fillRect(2.5, -8, 2, 2);
    } else if (e.type === 'hedge') {
      if (e.shell) {
        c.fillStyle = '#8a6a4a';
        c.strokeStyle = 'rgba(20,16,28,.85)'; c.lineWidth = 1.4;
        c.beginPath(); c.arc(0, -6, 6.5, 0, Math.PI * 2); c.fill(); c.stroke();
        c.strokeStyle = '#5a4028'; c.lineWidth = 1.2;
        for (let i = 0; i < 8; i++) {
          const a = (i / 8) * Math.PI * 2 + (e.sliding ? t * 12 : 0);
          c.beginPath();
          c.moveTo(Math.cos(a) * 6, -6 + Math.sin(a) * 6);
          c.lineTo(Math.cos(a) * 9, -6 + Math.sin(a) * 9);
          c.stroke();
        }
      } else {
        c.fillStyle = '#a87a50';
        c.strokeStyle = 'rgba(20,16,28,.85)'; c.lineWidth = 1.4;
        c.beginPath(); c.ellipse(0, -6.5, 7, 6.5, 0, 0, Math.PI * 2); c.fill(); c.stroke();
        c.strokeStyle = '#5a4028'; c.lineWidth = 1.2;
        for (let i = 0; i < 5; i++) {
          const a = -0.4 - i * 0.5;
          c.beginPath();
          c.moveTo(Math.cos(a) * 6, -6.5 + Math.sin(a) * 6);
          c.lineTo(Math.cos(a) * 9.5, -6.5 + Math.sin(a) * 9.5);
          c.stroke();
        }
        c.fillStyle = '#e8c8a0';
        c.beginPath(); c.ellipse(Math.sign(e.vx) * 4, -4, 3.5, 3, 0, 0, Math.PI * 2); c.fill();
        c.fillStyle = '#1a1620';
        c.fillRect(Math.sign(e.vx) * 5, -6, 1.6, 1.6);
      }
    } else {
      // 쥐
      const sc = squish ? 0.4 : 1;
      const wob = squish ? 0 : Math.sin(t * 9 + e.phase) * 0.08;
      c.rotate(wob);
      c.fillStyle = '#9aa2ad';
      c.strokeStyle = 'rgba(20,16,28,.85)'; c.lineWidth = 1.4;
      c.beginPath(); c.ellipse(0, -6.5 * sc, 7, 6.5 * sc, 0, 0, Math.PI * 2); c.fill(); c.stroke();
      if (!squish) {
        c.fillStyle = '#c8ccd4';
        c.beginPath(); c.arc(-3, -12, 3, 0, Math.PI * 2); c.fill(); c.stroke();
        c.beginPath(); c.arc(3, -12, 3, 0, Math.PI * 2); c.fill(); c.stroke();
        c.strokeStyle = '#8a929d'; c.lineWidth = 1.6;
        c.beginPath();
        c.moveTo(-Math.sign(e.vx) * 6, -4);
        c.quadraticCurveTo(-Math.sign(e.vx) * 12, -6, -Math.sign(e.vx) * 13, -2);
        c.stroke();
        c.fillStyle = '#1a1620';
        c.fillRect(Math.sign(e.vx) * 2 - 1, -9, 2, 2);
        c.beginPath(); c.arc(Math.sign(e.vx) * 6.5, -6, 1.4, 0, Math.PI * 2); c.fill();
      } else {
        c.fillStyle = '#1a1620';
        c.font = 'bold 6px sans-serif'; c.textAlign = 'center';
        c.fillText('××', 0, -4);
      }
    }
    c.restore();
  },

  drawBoss(st, bo, x, t) {
    const c = this.ctx;
    c.save();
    c.translate(x + bo.w / 2, bo.y + bo.h);
    if (bo.iv > 0 && Math.floor(t * 14) % 2) c.globalAlpha = 0.5;
    c.fillStyle = '#6a4a8a';
    c.strokeStyle = 'rgba(20,16,28,.9)'; c.lineWidth = 2;
    c.beginPath(); c.ellipse(0, -14, 14, 14, 0, 0, Math.PI * 2); c.fill(); c.stroke();
    c.fillStyle = '#9a78b8';
    c.beginPath(); c.arc(-7, -27, 5.5, 0, Math.PI * 2); c.fill(); c.stroke();
    c.beginPath(); c.arc(7, -27, 5.5, 0, Math.PI * 2); c.fill(); c.stroke();
    c.fillStyle = '#1a1620';
    c.fillRect(-5, -19, 3, 3); c.fillRect(2, -19, 3, 3);
    c.beginPath(); c.arc(0, -13, 2, 0, Math.PI * 2); c.fill();
    c.strokeStyle = 'rgba(230,230,240,.7)'; c.lineWidth = 1;
    for (const wy of [-14, -12]) {
      c.beginPath(); c.moveTo(4, wy); c.lineTo(13, wy - 1); c.stroke();
      c.beginPath(); c.moveTo(-4, wy); c.lineTo(-13, wy - 1); c.stroke();
    }
    // 왕관
    c.fillStyle = '#ffd83d';
    c.beginPath();
    c.moveTo(-8, -30); c.lineTo(-5, -38); c.lineTo(-1, -31); c.lineTo(3, -39); c.lineTo(7, -30);
    c.closePath(); c.fill(); c.stroke();
    c.restore();
    // HP
    c.fillStyle = 'rgba(0,0,0,.5)';
    c.fillRect(x - 2, bo.y - 18, 30, 4);
    c.fillStyle = '#ff5a5a';
    c.fillRect(x - 1, bo.y - 17, 28 * (bo.hp / 3), 2);
  },

  drawMogu(st, t, cam) {
    const c = this.ctx;
    const p = st.p;
    const x = p.x - cam;
    c.save();
    c.translate(x + p.w / 2, p.y + p.h);
    if (p.face < 0) c.scale(-1, 1);
    if (p.inv > 0 && Math.floor(t * 16) % 2) c.globalAlpha = 0.45;
    if (p.star > 0) {
      c.shadowColor = `hsl(${(t * 400) % 360}, 95%, 60%)`;
      c.shadowBlur = 10;
    }
    if (p.dead) c.rotate(Math.PI);
    const big = p.size > 0;
    // 모구 사진이 캐릭터 전체 — 파워업 시 사진 자체가 커짐 (발은 지면 고정)
    if (this.mogu) {
      const a = this.mogu.width / this.mogu.height;
      const hh = big ? 27 : 18;
      c.drawImage(this.mogu, -hh * a / 2, -hh, hh * a, hh);   // 원본이 오른쪽을 봄 → 그대로
      if (p.size === 2) {
        // 캣닢 상태 표시: 머리 위 작은 잎
        c.fillStyle = '#4aba4a';
        c.strokeStyle = 'rgba(20,16,28,.8)'; c.lineWidth = 1;
        for (const ang of [-0.55, 0.15]) {
          c.save();
          c.translate(4, -hh + 2); c.rotate(ang);
          c.beginPath(); c.ellipse(0, -3.5, 2, 4.2, 0, 0, Math.PI * 2); c.fill(); c.stroke();
          c.restore();
        }
      }
    }
    c.restore();
  },

  drawHud(st, t) {
    const c = this.ctx;
    c.fillStyle = 'rgba(10,16,32,.55)';
    c.fillRect(0, 0, W, 18);
    c.font = 'bold 9.5px sans-serif'; c.textAlign = 'left';
    c.fillStyle = '#fff';
    c.fillText(`SCORE ${String(st.score).padStart(6, '0')}`, 8, 12.5);
    c.fillStyle = '#ffd83d';
    c.fillText(`● × ${st.coins}/${st.stage.coinTotal}`, 118, 12.5);
    c.textAlign = 'center';
    c.fillStyle = '#c8d6ee';
    c.fillText(`WORLD ${st.stage.world}-${st.stage.sub} · ${st.stage.theme.name}`, W / 2 + 20, 12.5);
    c.textAlign = 'right';
    const tc = st.time < 40 ? (Math.floor(t * 4) % 2 ? '#ff6a6a' : '#ffd0d0') : '#fff';
    c.fillStyle = tc;
    c.fillText(`TIME ${Math.ceil(st.time)}`, W - 10, 12.5);
    // 파워 상태 (TIME 왼쪽, 중앙 텍스트와 겹침 방지)
    const label = st.p.star > 0 ? '★무적' : ['꼬마', '슈퍼', '캣닢'][st.p.size];
    c.textAlign = 'right';
    c.fillStyle = st.p.star > 0 ? `hsl(${(t * 300) % 360},90%,70%)` : '#9fe06a';
    c.fillText(label, W - 78, 12.5);
  },
};

}

{
// audio.js — WebAudio 합성 효과음 (외부 파일 없음, 모구 어디가와 같은 방식)
const M = window.SMG;

const A = {
  ctx: null, master: null,

  init() {
    if (this.ctx) return;
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    this.ctx = new Ctx();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.4;
    this.master.connect(this.ctx.destination);
  },
  resume() { this.init(); if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },

  tone(freq, dur, type = 'square', vol = 0.22, slideTo = null, when = 0) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + when;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.02);
  },

  noise(dur, vol = 0.25, freq = 900, q = 1, when = 0) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + when;
    const len = Math.ceil(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const f = this.ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t0); src.stop(t0 + dur + 0.02);
  },

  // ── 효과음 ──
  jump()    { this.tone(260, 0.16, 'square', 0.15, 620); },
  stomp()   { this.tone(340, 0.08, 'square', 0.16, 120); },
  coin()    { [988, 1319].forEach((f, i) => this.tone(f, 0.09, 'square', 0.15, null, i * 0.06)); },
  bump()    { this.tone(120, 0.07, 'square', 0.14, 90); },
  brk()     { this.noise(0.14, 0.2, 900, 0.8); },
  sprout()  { [523, 587, 659, 784].forEach((f, i) => this.tone(f, 0.07, 'square', 0.13, null, i * 0.05)); },
  grow()    { [392, 523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.08, 'square', 0.15, null, i * 0.05)); },
  shrink()  { [784, 659, 523, 392].forEach((f, i) => this.tone(f, 0.08, 'square', 0.14, null, i * 0.05)); },
  shoot()   { this.tone(700, 0.07, 'square', 0.12, 1100); },
  kick()    { this.noise(0.08, 0.18, 2000, 1.2); },
  starman() { [659, 784, 988, 1319].forEach((f, i) => this.tone(f, 0.1, 'square', 0.14, null, i * 0.07)); },
  die()     { [523, 392, 262, 196, 131].forEach((f, i) => this.tone(f, 0.18, 'triangle', 0.2, null, i * 0.12)); },
  clear(n)  { const seq = n >= 3 ? [523, 659, 784, 1047, 1319, 1568] : [523, 659, 784, 1047];
              seq.forEach((f, i) => this.tone(f, 0.14, 'square', 0.17, null, i * 0.09)); },
  bosshit() { this.tone(200, 0.16, 'sawtooth', 0.2, 80); },
  meow()    { this.tone(700, 0.28, 'sawtooth', 0.1, 420); },
};

M.audio = A;

}

{
// ui.js — 저장 + 화면 전환
const M = window.SMG;
const $ = (id) => document.getElementById(id);

M.save = {
  KEY: 'supermogu-save-v1',
  data: { best: 1, stars: {} },
  load() {
    try { const raw = localStorage.getItem(this.KEY); if (raw) this.data = Object.assign(this.data, JSON.parse(raw)); } catch (e) {}
    return this.data;
  },
  store() { try { localStorage.setItem(this.KEY, JSON.stringify(this.data)); } catch (e) {} },
  record(no, stars) {
    this.data.stars[no] = Math.max(this.data.stars[no] || 0, stars);
    if (no + 1 > this.data.best) this.data.best = Math.min(32, no + 1);
    this.store();
  },
};

M.ui = {
  screens: ['title-screen', 'pause-screen', 'win-screen', 'over-screen', 'ending-screen'],
  toastTimer: null,

  init() {
    $('title-icon').src = M.ASSETS.mogu;
    this.refreshTitle();
  },

  refreshTitle() {
    const best = M.save.data.best;
    $('btn-continue').style.display = best > 1 ? '' : 'none';
    $('btn-continue').textContent = `이어하기 — STAGE ${best}`;
    const total = Object.values(M.save.data.stars).reduce((a, b) => a + b, 0);
    $('title-hi').textContent = total > 0 ? `★ 합계 ${total}` : '';
  },

  show(id) {
    for (const s of this.screens) $(s).classList.toggle('hidden', s !== id);
    $('hud').classList.toggle('hidden', id === 'title-screen' || id === 'ending-screen');
  },
  hideAll() {
    for (const s of this.screens) $(s).classList.add('hidden');
    $('hud').classList.remove('hidden');
  },

  toast(text, dur = 1.8) {
    const el = $('hud-toast');
    el.textContent = text;
    el.style.opacity = 1;
    clearTimeout(this.toastTimer);
    this.toastTimer = setTimeout(() => { el.style.opacity = 0; }, dur * 1000);
  },

  showWin(st) {
    $('win-stars').textContent = '★'.repeat(st.stars) + '☆'.repeat(3 - st.stars);
    $('win-stats').innerHTML = `WORLD ${st.stage.world}-${st.stage.sub} 클리어! · ● ${st.coins}/${st.stage.coinTotal} · 점수 ${st.score}` +
      (st.stars === 3 ? '<br><b style="color:#7de08a">코인 달성 + 노피격!!</b>' : '');
    $('btn-next').style.display = st.no < 32 ? '' : 'none';
    this.show('win-screen');
  },

  setCountdown(n) { $('over-count').textContent = n; },
};

}

{
// main.js — 게임 루프 + 상태 머신 + 입력 (키보드·터치, 가변 점프 홀드)
const M = window.SMG;
const $ = (id) => document.getElementById(id);

let mode = 'title';            // title | play | pause | win | over | ending
let st = null;
const held = { left: false, right: false, dash: false, jump: false };
let jumpQueued = false;
let overCount = 10, overAcc = 0;

M.save.load();
M.ui.init();
M.Render.init(document.getElementById('game'));
M.ui.show('title-screen');

function startStage(no) {
  st = M.Logic.create(no);
  M.Render.fx = [];
  M.Render.camX = 0;
  mode = 'play';
  M.ui.hideAll();
  const { world, sub } = M.worldOf(no);
  M.ui.toast(`WORLD ${world}-${sub} · ${st.stage.theme.name}${st.stage.castle ? ' 🏰' : ''} 출발!`, 2.0);
  M.audio.resume(); M.audio.meow();
}

function toTitle() {
  mode = 'title';
  M.ui.refreshTitle();
  M.ui.show('title-screen');
}

function handleEvents(evs) {
  for (const e of evs) {
    switch (e.type) {
      case 'jump': M.audio.jump(); break;
      case 'stomp': M.audio.stomp(); break;
      case 'coin': M.audio.coin(); break;
      case 'bump': M.audio.bump(); break;
      case 'break': M.audio.brk(); M.Render.addBreak(e.tx, e.ty); break;
      case 'sprout': M.audio.sprout(); break;
      case 'grow': M.audio.grow(); M.ui.toast(st.p.size === 2 ? '🌿 캣닢! Shift로 털뭉치 발사!' : '🍢 츄르! 슈퍼 모구!', 1.6); break;
      case 'shrink': M.audio.shrink(); break;
      case 'shoot': M.audio.shoot(); break;
      case 'kick': M.audio.kick(); break;
      case 'shellhit': M.audio.kick(); break;
      case 'kill': M.audio.stomp(); break;
      case 'starman': M.audio.starman(); M.ui.toast('✨ 8초 무적!!', 1.4); break;
      case 'bossintro': M.audio.meow(); M.ui.toast('👑 쥐마왕 등장!! 3번 밟아라!', 2.2); break;
      case 'bosshit': M.audio.bosshit(); if (e.hp > 0) M.ui.toast(`👑 쥐마왕 HP ${e.hp}`, 1.0); break;
      case 'die': M.audio.die(); break;
      case 'clear':
        M.audio.clear(e.stars);
        M.save.record(st.no, e.stars);
        break;
    }
  }
}

// ── 키보드 ──
window.addEventListener('keydown', (e) => {
  M.audio.resume();
  const k = e.key;
  if ([' ', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(k)) e.preventDefault();
  if (k === 'ArrowLeft') held.left = true;
  if (k === 'ArrowRight') held.right = true;
  if (k === 'Shift' || k === 'x' || k === 'X') held.dash = true;
  if ((k === ' ' || k === 'z' || k === 'Z') && !e.repeat) {
    held.jump = true;
    if (mode === 'play') jumpQueued = true;
  }

  if (mode === 'title') {
    if (k === 'Enter') startStage(M.save.data.best);
  } else if (mode === 'play') {
    if (k === 'Escape') { mode = 'pause'; M.ui.show('pause-screen'); }
    if (k === 'r' || k === 'R') startStage(st.no);
  } else if (mode === 'pause') {
    if (k === 'Enter' || k === 'Escape') { mode = 'play'; M.ui.hideAll(); }
    if (k === 'r' || k === 'R') startStage(st.no);
    if (k === 'm' || k === 'M') toTitle();
  } else if (mode === 'win') {
    if (k === 'Enter') { if (st.no < 32) startStage(st.no + 1); else { mode = 'ending'; M.ui.show('ending-screen'); } }
  } else if (mode === 'over') {
    if (k === 'Enter') startStage(st.no);
    if (k === 'Escape') toTitle();
  } else if (mode === 'ending') {
    if (k === 'Enter') toTitle();
  }
});
window.addEventListener('keyup', (e) => {
  const k = e.key;
  if (k === 'ArrowLeft') held.left = false;
  if (k === 'ArrowRight') held.right = false;
  if (k === 'Shift' || k === 'x' || k === 'X') held.dash = false;
  if (k === ' ' || k === 'z' || k === 'Z') held.jump = false;
});

$('btn-continue').onclick = () => startStage(M.save.data.best);
$('btn-new').onclick = () => startStage(1);
$('btn-series').onclick = () => {
  location.href = location.pathname.includes('/supermogu/') ? '../index.html' : 'index.html';
};
$('btn-resume').onclick = () => { mode = 'play'; M.ui.hideAll(); };
$('btn-restage').onclick = () => startStage(st.no);
$('btn-title').onclick = () => toTitle();
$('btn-next').onclick = () => { if (st.no < 32) startStage(st.no + 1); else { mode = 'ending'; M.ui.show('ending-screen'); } };
$('btn-retry').onclick = () => startStage(st.no);
$('btn-win-title').onclick = () => toTitle();
$('btn-end-title').onclick = () => toTitle();
$('btn-over-title').onclick = () => { if (mode === 'over') toTitle(); };

// ── 터치 ──
const isTouch = window.matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
const vpad = document.getElementById('vpad');
if (isTouch) {
  document.body.classList.add('touch');
  $('title-hint').textContent = '◀▶ 달리기 · Ⓐ 점프(길게 = 높이) · Ⓑ 대시/털뭉치 · 쥐·새를 밟고 깃발까지!';
  const bindHold = (id, on, off) => {
    const el = document.getElementById(id);
    const setOn = (e) => { e.preventDefault(); M.audio.resume(); on(); el.classList.add('pressed'); };
    const setOff = () => { if (off) off(); el.classList.remove('pressed'); };
    el.addEventListener('pointerdown', setOn);
    el.addEventListener('pointerup', setOff);
    el.addEventListener('pointercancel', setOff);
    el.addEventListener('pointerleave', setOff);
  };
  bindHold('vbtn-left', () => { held.left = true; }, () => { held.left = false; });
  bindHold('vbtn-right', () => { held.right = true; }, () => { held.right = false; });
  bindHold('vbtn-a', () => { held.jump = true; if (mode === 'play') jumpQueued = true; }, () => { held.jump = false; });
  bindHold('vbtn-b', () => { held.dash = true; }, () => { held.dash = false; });
  document.getElementById('vbtn-pause').addEventListener('pointerdown', (e) => {
    e.preventDefault(); e.stopPropagation();
    if (mode === 'play') { mode = 'pause'; M.ui.show('pause-screen'); }
  });
  $('over-screen').addEventListener('pointerdown', (e) => {
    if (e.target.closest('#btn-over-title')) return;
    M.audio.resume();
    if (mode === 'over') startStage(st.no);
  });
  document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
  document.addEventListener('gesturestart', (e) => e.preventDefault());
  vpad.addEventListener('contextmenu', (e) => e.preventDefault());
}

// ── 디버그 훅 (테스트 자동화용) ──
M._dbg = () => ({
  mode, no: st ? st.no : 0, phase: st ? st.phase : null,
  x: st ? +st.p.x.toFixed(1) : 0, y: st ? +st.p.y.toFixed(1) : 0,
  vx: st ? +st.p.vx.toFixed(1) : 0, vy: st ? +st.p.vy.toFixed(1) : 0,
  onG: st ? st.p.onG : false, size: st ? st.p.size : 0,
  coins: st ? st.coins : 0, score: st ? st.score : 0,
  time: st ? +st.time.toFixed(1) : 0, stars: st ? st.stars || 0 : 0,
});
M._st = () => st;

// ── 메인 루프 ──
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  if (isTouch) vpad.classList.toggle('on', mode === 'play');

  if (mode === 'play' && st) {
    handleEvents(M.Logic.step(st, dt, {
      left: held.left, right: held.right, dash: held.dash,
      jump: jumpQueued, jumpHold: held.jump, fire: held.dash,
    }));
    jumpQueued = false;
    // 클리어·게임오버 화면 전환 (깃발 하강·낙하 연출 후)
    if (st.phase === 'clear' && st.endT > 1.5) {
      mode = 'win'; M.ui.showWin(st);
    } else if (st.phase === 'over' && st.endT > 1.6) {
      mode = 'over'; overCount = 10; overAcc = 0;
      M.ui.setCountdown(10);
      M.ui.show('over-screen');
    }
  } else if (mode === 'over') {
    jumpQueued = false;
    overAcc += dt;
    if (overAcc >= 1) {
      overAcc = 0; overCount--;
      M.ui.setCountdown(Math.max(0, overCount));
      if (overCount <= 0) toTitle();
    }
  } else {
    jumpQueued = false;
  }
  if (st && mode !== 'title' && mode !== 'ending') M.Render.draw(st, now / 1000, dt);
}
requestAnimationFrame(frame);

}
</script>
</body>
