<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>벽돌깨서 모구 구하기</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#160e24;
    font-family:'Malgun Gothic','맑은 고딕',sans-serif; user-select:none;
    touch-action:none; overscroll-behavior:none;
    -webkit-user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  #app { position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  #stage-wrap { position:relative; }
  canvas { display:block; background:#000; touch-action:none; }

  .screen { position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; z-index:10; }
  .hidden { display:none !important; }

  #hud { position:absolute; inset:0; pointer-events:none; z-index:5; }
  #hud-toast { position:absolute; top:30%; left:50%; transform:translateX(-50%);
    color:#fff; font-size:19px; font-weight:900; text-shadow:0 3px 6px rgba(0,0,0,.6);
    opacity:0; transition:opacity .3s; white-space:nowrap; }
  #tbtn-pause { position:fixed; right:calc(12px + env(safe-area-inset-right)); top:calc(10px + env(safe-area-inset-top));
    width:44px; height:44px; font-size:17px; border-radius:12px; z-index:8; display:none;
    background:rgba(255,255,255,.15); border:2px solid rgba(255,255,255,.5);
    color:rgba(255,255,255,.92); align-items:center; justify-content:center; pointer-events:auto; }
  body.touch #tbtn-pause.on { display:flex; }

  /* ── 터치 조종간 + 발사 버튼 ── */
  #vstick { position:fixed; left:calc(20px + env(safe-area-inset-left)); bottom:calc(24px + env(safe-area-inset-bottom));
    width:120px; height:120px; border-radius:50%; z-index:8; display:none;
    background:rgba(255,255,255,.12); border:2px solid rgba(255,255,255,.45);
    touch-action:none; pointer-events:auto; }
  body.touch #vstick.on { display:block; }
  #vstick-knob { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:52px; height:52px; border-radius:50%; pointer-events:none;
    background:rgba(255,138,176,.55); border:2px solid rgba(255,255,255,.8);
    box-shadow:0 3px 8px rgba(0,0,0,.4); }
  #vbtn-launch { position:fixed; right:calc(24px + env(safe-area-inset-right)); bottom:calc(40px + env(safe-area-inset-bottom));
    width:76px; height:76px; border-radius:50%; z-index:8; display:none;
    background:rgba(255,255,255,.15); border:2px solid rgba(255,255,255,.5);
    color:rgba(255,255,255,.92); font-size:26px; font-weight:800;
    align-items:center; justify-content:center;
    touch-action:none; pointer-events:auto; user-select:none; text-shadow:0 2px 3px rgba(0,0,0,.5); }
  body.touch #vbtn-launch.on { display:flex; }
  #vbtn-launch.pressed { background:rgba(255,138,176,.4); border-color:#ff8ab0; }

  /* ── 타이틀 (벽돌 성 무드) ── */
  #title-screen { background:linear-gradient(#3a1a4a 0%, #6a2a5a 55%, #241030 100%); }
  #title-screen .logo { font-size:min(44px, 8.6vw); font-weight:900; color:#fff; white-space:nowrap;
    text-shadow:0 0 18px #ff8ab0, 0 5px 0 #5c2438, 0 9px 18px rgba(0,0,0,.5); letter-spacing:min(3px, 0.8vw); }
  #title-screen .sub { margin-top:6px; font-size:17px; color:#ffc8dc; font-weight:700; }
  #title-icon { width:105px; height:auto; margin:16px 0 4px; animation:bob 1.5s ease-in-out infinite;
    filter:drop-shadow(0 0 14px rgba(255,138,176,.7)) drop-shadow(0 8px 10px rgba(0,0,0,.4)); }
  @keyframes bob { 0%,100%{transform:translateY(0) rotate(-3deg)} 50%{transform:translateY(-14px) rotate(3deg)} }
  #title-hi { margin-top:4px; color:#ffd83d; font-size:14px; font-weight:800; min-height:19px;
    text-shadow:0 1px 3px rgba(0,0,0,.5); }
  #title-hint { margin-top:12px; color:rgba(255,255,255,.92); font-size:13px; text-align:center;
    padding:0 14px; text-shadow:0 1px 3px rgba(0,0,0,.5); line-height:1.7; }

  .menu-buttons { display:flex; gap:12px; margin-top:18px; flex-wrap:wrap; justify-content:center; padding:0 10px; }
  .btn { pointer-events:auto; padding:12px 24px; font-size:16px; font-weight:800; color:#fff;
    background:#c84878; border:3px solid rgba(255,255,255,.8); border-radius:12px; cursor:pointer;
    box-shadow:0 4px 8px rgba(0,0,0,.4); font-family:inherit; }
  .btn.primary { background:#3aa84f; }
  .btn.series { padding:9px 18px; font-size:13px; background:#2e6da3; }

  /* ── 승리 / 일시정지 / 게임오버 / 엔딩 ── */
  #win-screen { background:rgba(26,10,26,.88); z-index:20; }
  #win-screen .big { font-size:min(44px, 10vw); font-weight:900; color:#ffd83d; }
  #win-stars { font-size:44px; color:#ffd83d; letter-spacing:8px; margin:8px 0 2px; }
  #win-stats { color:#f4dcec; font-size:17px; line-height:1.8; text-align:center; }
  #pause-screen { background:rgba(0,0,0,.6); z-index:20; }
  #pause-screen .big, #over-screen .big, #ending-screen .big {
    font-size:min(42px, 10vw); font-weight:900; color:#fff; white-space:nowrap; }
  #over-screen { background:rgba(0,0,0,.85); z-index:20; }
  #over-screen .big { color:#ff5252; letter-spacing:5px; }
  #over-screen .hint { margin-top:10px; font-size:16px; color:#ffd83d; font-weight:700; padding:0 14px; text-align:center; }
  #ending-screen { background:linear-gradient(#3a1a4a 0%, #6a2a5a 50%, #241030 100%); z-index:20; }
  #ending-screen .big { color:#ff8ab0; text-shadow:0 0 16px rgba(255,138,176,.8); }
  #ending-screen .msg { margin-top:14px; color:#f4dcec; font-size:16px; line-height:1.8; text-align:center; padding:0 16px; }
</style>
</head>
<body>
<div id="app">
  <div id="stage-wrap">
    <canvas id="game" width="480" height="270"></canvas>
    <div id="hud" class="hidden"><div id="hud-toast"></div></div>
  </div>

  <div id="title-screen" class="screen">
    <div class="logo">벽돌깨서 모구 구하기</div>
    <div class="sub">~ 갇힌 모구를 전부 집으로! ~</div>
    <img id="title-icon" alt="모구">
    <div id="title-hi"></div>
    <div class="menu-buttons">
      <button class="btn primary" id="btn-continue">이어하기</button>
      <button class="btn" id="btn-new">처음부터</button>
    </div>
    <div class="menu-buttons"><button class="btn series" id="btn-series">🏠 모구 게임 시리즈</button></div>
    <div id="title-hint">←→ 또는 마우스로 바 이동 · Space/클릭 발사<br>모구 얼굴 벽돌을 깨면 모구 낙하 — 바로 받으면 바가 넓어진다! 24스테이지</div>
  </div>

  <div id="win-screen" class="screen hidden">
    <div class="big">🧱 스테이지 클리어!!</div>
    <div id="win-stars">★★★</div>
    <div id="win-stats"></div>
    <div class="menu-buttons">
      <button class="btn" id="btn-retry">다시 도전</button>
      <button class="btn" id="btn-win-title">타이틀로</button>
      <button class="btn primary" id="btn-next">다음 스테이지 →</button>
    </div>
  </div>

  <div id="pause-screen" class="screen hidden">
    <div class="big">일시정지</div>
    <div class="menu-buttons">
      <button class="btn primary" id="btn-resume">계속</button>
      <button class="btn" id="btn-restage">재시작</button>
      <button class="btn" id="btn-title">타이틀로</button>
    </div>
  </div>

  <div id="over-screen" class="screen hidden">
    <div class="big">GAME OVER</div>
    <div class="hint">Enter 또는 다시 도전 — 이 스테이지 처음부터</div>
    <div class="menu-buttons">
      <button class="btn primary" id="btn-over-retry">다시 도전</button>
      <button class="btn" id="btn-over-title">타이틀로</button>
    </div>
  </div>

  <div id="ending-screen" class="screen hidden">
    <div class="big">🎉 모든 모구 구출!!</div>
    <div class="msg">벽돌 성이 모두 무너지고, 모구들은 집으로 돌아갔다.<br>가장 넓은 바, 가장 따뜻한 귀환 — 🐱🧱💛</div>
    <div class="menu-buttons"><button class="btn primary" id="btn-end-title">타이틀로</button></div>
  </div>

  <div id="tbtn-pause">⏸</div>
  <div id="vstick"><div id="vstick-knob"></div></div>
  <div id="vbtn-launch">🚀</div>
</div>

<script>window.MBK = { ASSETS: { mogu: "../game/assets/mogu-icon.png" } };</script>
<script src="src/rng.js"></script>
<script src="src/levels.js"></script>
<script src="src/logic.js"></script>
<script src="src/render.js"></script>
<script src="src/audio.js"></script>
<script src="src/ui.js"></script>
<script src="src/main.js"></script>
</body>
</html>
