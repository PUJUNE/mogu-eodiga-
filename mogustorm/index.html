<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>모구 폭풍의 언덕</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#0c1018;
    font-family:'Malgun Gothic','맑은 고딕',sans-serif; user-select:none;
    touch-action:manipulation; overscroll-behavior:none;
    -webkit-user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  #app { position:relative; width:100%; height:100%; overflow:hidden; }
  .hidden { display:none !important; }

  /* ══ 무대: 배경 ══ */
  #vn-stage { position:absolute; inset:0; cursor:pointer; }
  #vn-bg { position:absolute; inset:0; transition:background 1.2s; }
  #vn-bg.bg-liverpool  { background:linear-gradient(#5a6a7a 0%, #8a97a4 45%, #46525e 70%, #232a32 100%); }
  #vn-bg.bg-hall       { background:linear-gradient(#3e2c1c 0%, #6a4a2e 55%, #8a6238 75%, #241708 100%); }
  #vn-bg.bg-kitchen    { background:linear-gradient(#33261a 0%, #57432c 60%, #1e1610 100%); }
  #vn-bg.bg-barn       { background:linear-gradient(#2a2014 0%, #4c3a20 65%, #171008 100%); }
  #vn-bg.bg-heights_ext{ background:linear-gradient(#4c5a66 0%, #6e7c86 40%, #4a5a48 72%, #222c22 100%); }
  #vn-bg.bg-moor       { background:linear-gradient(#7ea6c8 0%, #a8c2d2 40%, #7c9060 62%, #6a5a7c 82%, #38304a 100%); }
  #vn-bg.bg-moor_night { background:linear-gradient(#0a1226 0%, #1c2a4c 55%, #22304a 75%, #0c1018 100%); }
  #vn-bg.bg-moor_sunset{ background:linear-gradient(#5c3a6e 0%, #c86a4a 45%, #e8a05a 60%, #6a4a5c 80%, #2c2030 100%); }
  #vn-bg.bg-penistone  { background:linear-gradient(#2c3450 0%, #55608a 50%, #5c5468 70%, #262030 100%); }
  #vn-bg.bg-grange     { background:linear-gradient(#5c5442 0%, #a89a76 40%, #c8b890 60%, #4e4432 100%); }
  #vn-bg.bg-night      { background:linear-gradient(#0a0e20 0%, #1a2240 60%, #101426 100%); }
  #vn-bg.bg-sea        { background:linear-gradient(#78b0c8 0%, #a8d0dc 45%, #4880a0 62%, #2c5670 100%); }
  #vn-bg.bg-tavern     { background:linear-gradient(#2a1a14 0%, #4c2a1e 50%, #1e3a28 78%, #120c08 100%); }
  /* 야외 배경 지면 실루엣 */
  #vn-bg::after { content:""; position:absolute; left:-10%; right:-10%; bottom:-14%; height:34%;
    border-radius:50% 50% 0 0 / 90% 70% 0 0; background:rgba(8,10,14,.55); filter:blur(2px); opacity:0; transition:opacity 1.2s; }
  #vn-bg.bg-moor::after, #vn-bg.bg-moor_night::after, #vn-bg.bg-moor_sunset::after,
  #vn-bg.bg-heights_ext::after, #vn-bg.bg-penistone::after, #vn-bg.bg-liverpool::after { opacity:1; }
  /* 비네트 */
  #vn-stage::after { content:""; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(ellipse at 50% 42%, transparent 55%, rgba(4,6,10,.55) 100%); }

  /* ══ 날씨 레이어 ══ */
  #vn-weather { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  #vn-weather::before, #vn-weather::after { content:""; position:absolute; inset:-20%; opacity:0; transition:opacity .8s; }
  #vn-weather.w-rain::before, #vn-weather.w-storm::before {
    opacity:.3; background:repeating-linear-gradient(105deg, transparent 0 7px, rgba(210,225,245,.55) 7px 8px, transparent 8px 14px);
    animation:rainfall .5s linear infinite; }
  @keyframes rainfall { from{transform:translateY(-40px)} to{transform:translateY(40px)} }
  #vn-weather.w-storm::after { background:#eaf2ff; animation:flash 5.2s ease-out infinite; }
  @keyframes flash { 0%,88%,94%,100%{opacity:0} 90%{opacity:.55} 92%{opacity:.12} 93%{opacity:.4} }
  #vn-weather.w-snow::before { opacity:.8;
    background-image:radial-gradient(3px 3px at 20% 15%, #fff 45%, transparent 55%),
      radial-gradient(2px 2px at 60% 40%, #fff 45%, transparent 55%),
      radial-gradient(2.5px 2.5px at 85% 20%, #fff 45%, transparent 55%),
      radial-gradient(2px 2px at 35% 70%, #fff 45%, transparent 55%),
      radial-gradient(2.5px 2.5px at 72% 82%, #fff 45%, transparent 55%);
    background-size:340px 340px; animation:snowfall 7s linear infinite; }
  @keyframes snowfall { from{background-position:0 -340px} to{background-position:24px 340px} }
  #vn-weather.w-stars::before { opacity:.9;
    background-image:radial-gradient(1.6px 1.6px at 12% 18%, #fff 50%, transparent 60%),
      radial-gradient(1.2px 1.2px at 42% 8%, #fff 50%, transparent 60%),
      radial-gradient(1.8px 1.8px at 68% 24%, #ffeebb 50%, transparent 60%),
      radial-gradient(1.2px 1.2px at 85% 12%, #fff 50%, transparent 60%),
      radial-gradient(1.4px 1.4px at 28% 32%, #cfe0ff 50%, transparent 60%),
      radial-gradient(1.2px 1.2px at 55% 38%, #fff 50%, transparent 60%);
    background-size:100% 100%; animation:twinkle 3.4s ease-in-out infinite; }
  @keyframes twinkle { 0%,100%{opacity:.9} 50%{opacity:.5} }
  #vn-weather.w-cloud::before { opacity:.28;
    background:repeating-linear-gradient(180deg, transparent 0 90px, rgba(230,238,248,.25) 90px 130px, transparent 130px 240px);
    filter:blur(14px); animation:clouddrift 26s linear infinite; }
  @keyframes clouddrift { from{transform:translateX(-8%)} to{transform:translateX(8%)} }

  /* ══ 초상 ══ */
  #vn-chars { position:absolute; left:0; right:0; bottom:212px; display:flex; gap:26px;
    align-items:flex-end; justify-content:center; pointer-events:none; }
  .portrait { display:flex; flex-direction:column; align-items:center; gap:5px;
    transition:transform .25s, filter .25s, opacity .25s; }
  .portrait .p-emoji { display:flex; align-items:center; justify-content:center;
    width:104px; height:104px; font-size:60px; border-radius:50%;
    background:radial-gradient(circle at 38% 30%, rgba(255,255,255,.28), rgba(20,26,40,.72));
    border:3px solid rgba(255,255,255,.4); box-shadow:0 8px 20px rgba(0,0,0,.5); }
  .portrait img { width:104px; height:104px; object-fit:cover; border-radius:50%;
    border:3px solid rgba(255,216,61,.75); box-shadow:0 8px 20px rgba(0,0,0,.5); background:#20242e; }
  .portrait .p-name { font-size:13px; font-weight:800; text-shadow:0 2px 4px rgba(0,0,0,.8); }
  .portrait.speaking { transform:translateY(-10px) scale(1.09); filter:brightness(1.05); }
  .portrait.dimmed { filter:brightness(.45) saturate(.6); opacity:.8; }
  #vn-chars.choices-open .portrait { filter:brightness(.25) saturate(.4); opacity:.35; transform:none; }

  /* ══ 텍스트박스 ══ */
  #vn-ui { position:absolute; inset:0; pointer-events:none; }
  #vn-textwrap { position:absolute; left:50%; bottom:calc(14px + env(safe-area-inset-bottom)); transform:translateX(-50%);
    width:min(760px, 94vw); pointer-events:none; }
  #vn-name { display:inline-block; margin:0 0 -12px 18px; position:relative; z-index:2;
    padding:5px 16px; font-size:15px; font-weight:900; color:#ffd83d;
    background:rgba(14,18,30,.95); border:2px solid rgba(255,255,255,.35); border-radius:10px;
    box-shadow:0 3px 8px rgba(0,0,0,.5); }
  #vn-box { position:relative; min-height:112px; padding:20px 22px 16px; box-sizing:border-box;
    background:rgba(10,14,24,.86); border:2px solid rgba(255,255,255,.28); border-radius:16px;
    box-shadow:0 10px 26px rgba(0,0,0,.5); }
  #vn-text { font-size:17px; line-height:1.75; color:#f2f5fa; min-height:60px; white-space:pre-wrap; }
  #vn-text.narration { font-style:italic; color:#c4d2e6; }
  #vn-hint { position:absolute; right:16px; bottom:8px; font-size:14px; color:#ffd83d;
    animation:hintblink 1s ease-in-out infinite; display:none; }
  @keyframes hintblink { 0%,100%{opacity:1; transform:translateY(0)} 50%{opacity:.35; transform:translateY(3px)} }

  /* ══ 선택지 ══ */
  #vn-choices { position:absolute; left:50%; bottom:200px; transform:translateX(-50%);
    display:flex; flex-direction:column; gap:12px; width:min(600px, 90vw); pointer-events:auto; }
  .choice-btn { padding:14px 20px; font-size:16px; font-weight:800; color:#fff; font-family:inherit;
    text-align:left; cursor:pointer; background:rgba(22,30,48,.92);
    border:2px solid rgba(255,216,61,.55); border-radius:14px;
    box-shadow:0 6px 16px rgba(0,0,0,.5); transition:transform .12s, background .12s, border-color .12s; }
  .choice-btn:hover, .choice-btn:active { transform:translateX(6px) scale(1.02);
    background:rgba(60,48,20,.95); border-color:#ffd83d; }

  /* ══ HUD ══ */
  #vn-hud { position:absolute; top:calc(10px + env(safe-area-inset-top)); left:12px; right:12px;
    display:flex; justify-content:space-between; pointer-events:none; }
  .hud-chips { display:flex; gap:8px; }
  .chip { padding:6px 13px; font-size:14px; font-weight:900; color:#fff; border-radius:14px;
    background:rgba(10,14,24,.72); border:2px solid rgba(255,255,255,.3); text-shadow:0 1px 3px rgba(0,0,0,.6); }
  #stat-love { color:#ff9db8; } #stat-grudge { color:#ffb070; }
  #btn-mute { pointer-events:auto; cursor:pointer; font-family:inherit; }

  /* ══ 공통 스크린 ══ */
  .screen { position:absolute; inset:0; z-index:20; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:20px; box-sizing:border-box; }
  .menu-buttons { display:flex; gap:12px; margin-top:20px; flex-wrap:wrap; justify-content:center; }
  .btn { padding:12px 26px; font-size:16px; font-weight:800; color:#fff; font-family:inherit;
    background:#4a5a8a; border:3px solid rgba(255,255,255,.8); border-radius:12px; cursor:pointer;
    box-shadow:0 4px 10px rgba(0,0,0,.45); text-decoration:none; display:inline-block; }
  .btn.primary { background:#3aa84f; }
  .btn.series { padding:9px 18px; font-size:13px; background:#2e6da3; }

  /* ══ 타이틀 ══ */
  #title-screen { background:linear-gradient(#1a2030 0%, #34405c 45%, #3c3450 70%, #131722 100%); }
  #title-screen::before { content:""; position:absolute; inset:-20%; pointer-events:none; opacity:.22;
    background:repeating-linear-gradient(105deg, transparent 0 7px, rgba(210,225,245,.5) 7px 8px, transparent 8px 15px);
    animation:rainfall .55s linear infinite; }
  #title-screen .logo { position:relative; font-size:min(50px, 9.4vw); font-weight:900; color:#e8ecff; white-space:nowrap;
    text-shadow:0 0 22px rgba(140,170,255,.65), 0 5px 0 #26304a, 0 10px 20px rgba(0,0,0,.6);
    letter-spacing:min(5px, 1vw); }
  #title-screen .sub { position:relative; margin-top:8px; font-size:15px; color:#aebbdc; font-weight:700; }
  #title-icon { position:relative; width:104px; height:104px; object-fit:cover; border-radius:50%;
    margin:18px 0 4px; border:4px solid rgba(255,216,61,.8);
    animation:bob 1.7s ease-in-out infinite; box-shadow:0 0 24px rgba(140,170,255,.5), 0 10px 14px rgba(0,0,0,.45); }
  @keyframes bob { 0%,100%{transform:translateY(0) rotate(-3deg)} 50%{transform:translateY(-12px) rotate(3deg)} }
  #title-progress { position:relative; margin-top:8px; color:#ffd83d; font-size:14px; font-weight:800;
    text-shadow:0 1px 3px rgba(0,0,0,.6); }
  #title-hint { position:relative; margin-top:14px; color:rgba(255,255,255,.9); font-size:13px; line-height:1.8;
    text-shadow:0 1px 3px rgba(0,0,0,.5); padding:0 12px; }

  /* ══ 엔딩 카드 ══ */
  #ending-screen { background:rgba(8,10,18,.93); }
  #end-tone { font-size:19px; font-weight:800; color:#c8d4ea; }
  #end-no { margin-top:14px; font-size:15px; font-weight:900; color:#ffd83d; letter-spacing:2px; }
  #end-title { margin-top:8px; font-size:min(42px, 9vw); font-weight:900; color:#fff;
    text-shadow:0 0 20px rgba(140,170,255,.55), 0 5px 12px rgba(0,0,0,.6); }
  #end-axis { margin-top:10px; font-size:16px; font-weight:800; color:#9fd8b0; }
  #end-desc { margin-top:6px; font-size:15px; color:#c8d2e4; }
  #end-spectrum { position:relative; width:min(440px, 82vw); height:14px; margin-top:22px; border-radius:8px;
    background:linear-gradient(90deg, #ffd83d 0%, #8fd88f 30%, #7ba0c8 55%, #6a6088 78%, #2c3448 100%);
    border:2px solid rgba(255,255,255,.45); }
  #end-marker { position:absolute; top:-9px; margin-left:-9px; font-size:20px; filter:drop-shadow(0 2px 3px rgba(0,0,0,.7)); }
  .spec-labels { display:flex; justify-content:space-between; width:min(440px, 82vw); margin-top:6px;
    font-size:12px; color:#8ea0be; font-weight:700; }
  #end-count { margin-top:16px; font-size:14px; color:#aebbdc; font-weight:700; }

  /* ══ 엔딩 갤러리 ══ */
  #gallery-screen { background:linear-gradient(#141a28 0%, #222c44 55%, #10141e 100%); justify-content:flex-start;
    padding-top:calc(26px + env(safe-area-inset-top)); }
  #gallery-screen h2 { margin:0; font-size:min(30px, 7vw); font-weight:900; color:#e8ecff;
    text-shadow:0 0 14px rgba(140,170,255,.5); }
  #gallery-count { margin-top:6px; font-size:14px; color:#ffd83d; font-weight:800; }
  #gallery-list { margin-top:16px; width:min(680px, 94vw); flex:1; overflow-y:auto; text-align:left;
    display:flex; flex-direction:column; gap:7px; padding-bottom:10px; -webkit-overflow-scrolling:touch; }
  .g-row { display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:12px;
    background:rgba(255,255,255,.05); border:2px solid rgba(255,255,255,.14); color:#7e8aa4; font-size:14px; }
  .g-row.got { background:rgba(255,216,61,.08); border-color:rgba(255,216,61,.4); color:#f0f4fc; }
  .g-tone { font-size:20px; flex-shrink:0; }
  .g-body { flex:1; font-weight:700; line-height:1.5; }
  .g-axis { font-size:12px; color:#9fd8b0; font-weight:800; flex-shrink:0; }

  @media (max-width: 560px) {
    #vn-chars { bottom:196px; gap:12px; }
    .portrait .p-emoji, .portrait img { width:78px; height:78px; }
    .portrait .p-emoji { font-size:44px; }
    #vn-text { font-size:15px; }
    #vn-choices { bottom:186px; }
    .choice-btn { font-size:14px; padding:12px 16px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="vn-stage">
    <div id="vn-bg"></div>
    <div id="vn-weather"></div>
    <div id="vn-chars"></div>
    <div id="vn-ui" class="hidden">
      <div id="vn-hud">
        <div class="hud-chips">
          <span class="chip" id="stat-love">♥ 0</span>
          <span class="chip" id="stat-grudge">🔥 0</span>
        </div>
        <div class="hud-chips">
          <button class="chip" id="btn-mute">🔊</button>
        </div>
      </div>
      <div id="vn-choices"></div>
      <div id="vn-textwrap">
        <div id="vn-name"></div>
        <div id="vn-box">
          <div id="vn-text"></div>
          <div id="vn-hint">▼</div>
        </div>
      </div>
    </div>
  </div>

  <div id="title-screen" class="screen">
    <div class="logo">모구 폭풍의 언덕</div>
    <div class="sub">~ 워더링 하이츠의 냥이 · 멀티엔딩 비주얼 노벨 ~</div>
    <img id="title-icon" alt="모구">
    <div id="title-progress"></div>
    <div class="menu-buttons">
      <button class="btn primary" id="btn-continue">이어하기</button>
      <button class="btn" id="btn-new">처음부터</button>
      <button class="btn" id="btn-gallery">🏆 엔딩 갤러리</button>
    </div>
    <div class="menu-buttons"><a class="btn series" id="btn-home" href="index.html">🏠 모구 게임 시리즈</a></div>
    <div id="title-hint">에밀리 브론테 『폭풍의 언덕』 원작 — 리버풀 부두에서 온 고양이 모구의 이야기<br>
      클릭 / Enter / Space = 진행 · 선택이 운명을 가른다 · 엔딩 18종 (행복 ☀️ ↔ ⛈️ 절망)</div>
  </div>

  <div id="gallery-screen" class="screen hidden">
    <h2>🏆 엔딩 갤러리</h2>
    <div id="gallery-count"></div>
    <div id="gallery-list"></div>
    <div class="menu-buttons"><button class="btn" id="btn-gallery-back">← 타이틀로</button></div>
  </div>

  <div id="ending-screen" class="screen hidden">
    <div id="end-tone"></div>
    <div id="end-no"></div>
    <div id="end-title"></div>
    <div id="end-axis"></div>
    <div id="end-desc"></div>
    <div id="end-spectrum"><span id="end-marker">🐱</span></div>
    <div class="spec-labels"><span>☀️ 행복</span><span>⛈️ 절망</span></div>
    <div id="end-count"></div>
    <div class="menu-buttons">
      <button class="btn primary" id="btn-end-title">타이틀로</button>
      <button class="btn" id="btn-end-gallery">🏆 엔딩 갤러리</button>
    </div>
  </div>
</div>

<script>window.MWH = { ASSETS: { mogu: "../game/assets/mogu-icon.png" } };</script>
<script src="src/story.js"></script>
<script src="src/engine.js"></script>
<script src="src/audio.js"></script>
<script src="src/render.js"></script>
<script src="src/ui.js"></script>
<script src="src/main.js"></script>
</body>
</html>
