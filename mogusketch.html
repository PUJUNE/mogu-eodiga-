<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>모구 스케치 파이터</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#eceae2;
    font-family:'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo',sans-serif; user-select:none;
    touch-action:none; overscroll-behavior:none;
    -webkit-user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  #app { position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  canvas#game { display:block; background:#fbfbf7; box-shadow:0 2px 14px rgba(0,0,0,.12); }

  .screen { position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; z-index:10; }
  .hidden { display:none !important; }

  /* 손그림 테두리 — 네 모서리 반경을 비대칭으로 */
  .sketch-box { border:2.5px solid #222; border-radius:255px 18px 225px 16px / 16px 225px 18px 255px; }

  /* ── 타이틀 (종이 한 장) ── */
  #title-screen { background:#fbfbf7;
    background-image:linear-gradient(transparent 46.5%, rgba(232,160,160,.35) 46.5%, rgba(232,160,160,.35) 46.8%, transparent 46.8%),
      linear-gradient(90deg, transparent 33%, rgba(232,160,160,.3) 33%, rgba(232,160,160,.3) 33.2%, transparent 33.2%); }
  #title-screen .logo { font-size:min(62px, 11vw); font-weight:900; white-space:nowrap; color:transparent;
    -webkit-text-stroke:2.2px #18181c; letter-spacing:min(4px, 1vw); transform:rotate(-2deg); }
  #title-screen .logo b { -webkit-text-stroke-color:#d6282e; }
  #title-screen .sub { margin-top:4px; font-size:16px; color:#5a5a60; font-weight:800; }
  #title-preview { width:min(420px, 78vw); height:auto; aspect-ratio:420/220; margin:10px 0 2px; }
  #title-hi { margin-top:4px; color:#5a5a60; font-size:14px; font-weight:800; min-height:19px; text-align:center; }
  #title-hint { margin-top:10px; color:#5a5a60; font-size:13px; text-align:center; line-height:1.6; padding:0 14px; }

  .menu-buttons { display:flex; gap:10px; margin-top:12px; flex-wrap:wrap; justify-content:center; padding:0 10px; }
  .btn { pointer-events:auto; padding:10px 22px; font-size:16px; font-weight:800; color:#18181c;
    background:#fbfbf7; border:2.5px solid #222; border-radius:255px 18px 225px 16px / 16px 225px 18px 255px;
    cursor:pointer; font-family:inherit; box-shadow:3px 3px 0 rgba(0,0,0,.18); }
  .btn:active { transform:translate(2px,2px); box-shadow:1px 1px 0 rgba(0,0,0,.18); }
  .btn.primary { border-color:#d6282e; color:#d6282e; }
  .btn.series { padding:8px 16px; font-size:13px; }
  .diff-btn { padding:7px 13px; font-size:14px; border-color:rgba(0,0,0,.35); color:#5a5a60; }
  .diff-btn.selected { border-color:#18181c; color:#18181c; box-shadow:3px 3px 0 rgba(214,40,46,.5); }
  .diff-btn.crazy.selected { border-color:#d6282e; color:#d6282e; }

  /* ── 결과 화면: 종이 위 도장 ── */
  #win-screen, #over-screen, #pause-screen { background:rgba(251,251,247,.86); z-index:20; }
  .stamp { width:108px; height:108px; border:5px solid #d6282e; border-radius:50%; color:#d6282e;
    font-size:58px; font-weight:900; display:flex; align-items:center; justify-content:center;
    transform:rotate(-14deg); box-shadow:inset 0 0 0 3px rgba(214,40,46,.35); opacity:.9; }

  .result-stats { margin-top:8px; color:#3a3a40; font-size:15px; line-height:1.8; text-align:center; padding:0 14px; }
  #pause-screen .big { font-size:min(44px, 9vw); font-weight:900; color:transparent; -webkit-text-stroke:1.8px #18181c; }
  #ending-screen { justify-content:flex-end; padding-bottom:9vh; z-index:20; pointer-events:none; }

  /* ── 터치: 8방향 패드 + 버튼 ── */

  #vdpad { position:absolute; pointer-events:auto; width:136px; height:136px; border-radius:50%;
    left:calc(18px + env(safe-area-inset-left)); bottom:calc(18px + env(safe-area-inset-bottom));

    display:grid; grid-template-columns:repeat(3, 66px); gap:8px; pointer-events:none; }
  .vbtn { pointer-events:auto; width:66px; height:66px; border-radius:50%;
    background:rgba(251,251,247,.55); border:2.5px solid rgba(24,24,28,.75);
    color:#18181c; font-size:17px; font-weight:900; display:flex; align-items:center; justify-content:center;
    touch-action:none; user-select:none; }

  #vb-pause { position:absolute; pointer-events:auto; right:calc(12px + env(safe-area-inset-right)); top:calc(10px + env(safe-area-inset-top));

  #rotate-hint { position:fixed; inset:0; z-index:50; background:#fbfbf7; display:flex; flex-direction:column;
    align-items:center; justify-content:center; color:#18181c; font-size:20px; font-weight:900; text-align:center; gap:10px; }
</style>
</head>

      ↓↘→+Z 냥파동 · →↓↘+X 고양이 발톱 연무 · 뒤로 누르면 가드(앉아서 뒤 = 하단 가드)</div>

<script>window.MSK = {};</script>
<script>
/* ── rng.js ── */
{
// rng.js — 시드 기반 결정적 난수 (모구 어디가 rng.js와 동일 계열 (모구 똥피하기에서 복사))
const M = window.MSK;

M.mulberry32 = function (seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
};

M.makeRng = function (seed) {
  const f = M.mulberry32(seed);
  return {
    next: f,
    range: (a, b) => a + f() * (b - a),
    int: (a, b) => Math.floor(a + f() * (b - a + 1)),
    pick: (arr) => arr[Math.floor(f() * arr.length)],
    chance: (p) => f() < p,
  };
};

}
/* ── data.js ── */
{

  idleAnim(st, dt) { for (const f of st.p) f.stT += dt; },

  kill(f, killer) {
    f.dead = true; f.mv = null;
    if (f.state !== 'airhit') {
      f.state = 'airhit';
      f.vy = 560;
      f.vx = (Math.sign(f.x - killer.x) || -killer.face) * 200;
    }
  },

  // ── 입력 해석 ──
  control(st, f, o, inp, dt, ev) {
    f.inp = inp;
    const t = st.t;
    const press = (k) => !!inp[k] && !f.prev[k];

    // 방향 기록 (커맨드용)
    const d = dirToken(f, inp);
    if (d !== f.lastDir) { f.hist.push({ d, t }); f.lastDir = d; if (f.hist.length > 16) f.hist.shift(); }

    const pressed = {
      lp: press('lp'), hp: press('hp'), grab: press('grab'),
      sp1: press('sp1'), sp2: press('sp2'), sp3: press('sp3'), su: press('su'),
    };
    f.prev = Object.assign({}, inp);

    if (f.dead || f.state === 'win') return;

    const grounded = f.y <= 0 && f.vy <= 0;
    const canAct = ACTIONABLE[f.state] && grounded && !f.mv;
    const canAir = f.state === 'jump' && !f.mv && !f.airUsed;

    // 입력 선행 — 행동 불가 중에 누른 약·강은 0.12초 안에 풀리면 바로 나간다 (링크 콤보용)
    if (!canAct && !canAir && (pressed.lp || pressed.hp) && f.state !== 'down' && f.state !== 'airhit') {
      f.buf = { btn: pressed.hp ? 'hp' : 'lp', t, crouch: !!inp.down };
    }
    if (canAct && f.buf) {
      const b = f.buf; f.buf = null;
      if (t - b.t <= 0.12) { this.startMove(st, f, o, (inp.down || b.crouch ? 'c' : '') + b.btn, ev); return; }
    }

    // 약+강 동시 입력 대기 해소
    if (f.pend) {
      f.pend.t += dt;
      const other = f.pend.btn === 'lp' ? pressed.hp : pressed.lp;
      if (other && canAct) { f.pend = null; this.startMove(st, f, o, 'grab', ev); return; }
      if (f.pend.t >= M.GRAB_WINDOW) {
        const btn = f.pend.btn; const crouch = f.pend.crouch; f.pend = null;
        if (canAct) { this.startMove(st, f, o, crouch ? 'c' + btn : btn, ev); return; }
      }
    }

    if (canAct || canAir) {
      // 초필살
      if (pressed.su && f.gauge >= M.GAUGE_MAX && canAct) { this.startSpecial(st, f, o, 'sup', ev); return; }
      // 명시 필살 (터치 버튼 / AI)
      if (canAct) {
        if (pressed.sp3 && f.def.sp3) { this.startSpecial(st, f, o, 'sp3', ev); return; }
        if (pressed.sp2 && f.def.sp2) { this.startSpecial(st, f, o, 'sp2', ev); return; }
        if (pressed.sp1 && f.def.sp1) { this.startSpecial(st, f, o, 'sp1', ev); return; }
        if (pressed.grab) { this.startMove(st, f, o, 'grab', ev); return; }
        // 커맨드 필살
        if (pressed.hp && f.def.sp2 && matchCmd(f, t, CMD_CLAW)) { this.startSpecial(st, f, o, 'sp2', ev); return; }
        if (pressed.lp && f.def.sp1 && matchCmd(f, t, CMD_FIREBALL)) { this.startSpecial(st, f, o, 'sp1', ev); return; }
        if (pressed.lp && pressed.hp) { this.startMove(st, f, o, 'grab', ev); return; }
        if (pressed.lp || pressed.hp) {
          f.pend = { btn: pressed.lp ? 'lp' : 'hp', t: 0, crouch: !!inp.down };
          return;
        }
      } else if (canAir && (pressed.lp || pressed.hp)) {
        f.airUsed = true;
        this.startMove(st, f, o, pressed.hp ? 'jhp' : 'jlp', ev);
        return;
      }
    }

    // 이동
    if (canAct) {
      const fwd = f.face === 1 ? inp.right : inp.left;
      const back = f.face === 1 ? inp.left : inp.right;
      if (inp.down) { f.state = 'crouch'; f.vx = 0; }
      else if (inp.up) {
        f.state = 'jump'; f.stT = 0; f.airUsed = false;
        f.vy = M.JUMP_V;
        f.vx = (fwd ? 1 : back ? -1 : 0) * f.face * M.JUMP_VX;
        ev.push({ type: 'jump', side: f.side });
      } else if (fwd || back) {
        if (f.state !== 'walk') f.stT = 0;
        f.state = 'walk';
        f.vx = (fwd ? 1 : -0.8) * f.face * f.def.speed;
      } else {
        if (f.state !== 'idle') f.stT = 0;
        f.state = 'idle'; f.vx = 0;
      }
    }
  },

  // ── 기술 시작 ──
  startMove(st, f, o, key, ev) {
    const base = M.MOVES[key];
    if (!base) return;
    f.mv = { key, kind: key === 'grab' ? 'grab' : 'normal', d: base, t: 0, hits: 0, done: false };
    if (!base.band || base.band !== 'air') { f.vx = 0; f.state = 'attack'; }
    else f.state = 'jump';
    f.stT = 0;
    ev.push({ type: 'swing', side: f.side, key, strong: key.endsWith('hp') });
  },

  startSpecial(st, f, o, slot, ev) {
    const d = slot === 'sup' ? M.superOf(f.def) : f.def[slot];
    if (!d) return;
    if (d.type === 'projectile' && d.count === 1 && f.projOut > 0) return;   // 기탄은 화면에 하나만
    if (slot === 'sup') {
      f.gauge = 0;
      st.stats.supers[f.side]++;
      st.hitstop = Math.max(st.hitstop, 0.18);
      ev.push({ type: 'super', side: f.side, name: d.name });
    } else {
      st.stats.specials[f.side]++;
      ev.push({ type: 'special', side: f.side, slot, name: d.name, kind: d.type });
    }
    f.mv = { key: slot, kind: d.type, d, t: 0, hits: 0, spawned: 0, done: false, phase: 0, superMul: d.superMul || (slot === 'sup' && f.def.sup ? 1 : 1), isSuper: slot === 'sup' };
    f.state = 'attack'; f.stT = 0; f.vx = 0;
    f.lastMoveName = d.name;
  },

  // ── 기술 진행 · 판정 ──
  updateMove(st, f, o, dt, ev) {
    const mv = f.mv;
    if (!mv) return;
    mv.t += dt;
    const d = mv.d;
    const mul = (mv.superMul || 1);

    switch (mv.kind) {
      case 'normal':
      case 'grab': {
        const air = d.band === 'air';
        if (mv.t >= d.startup && mv.t < d.startup + d.active && mv.hits === 0) {
          if (mv.kind === 'grab') {
            if (this.tryGrab(st, f, o, d.dmg * (f.def.grabMul || 1), d.reach, ev)) mv.hits = 1;
          } else if (this.meleeHit(st, f, o, d, air ? 'air' : d.band, d.dmg * mul, ev)) mv.hits = 1;
        }
        if (air) {
          if (f.y <= 0 && mv.t > 0.02) { f.mv = null; f.state = 'idle'; f.stT = 0; }
        } else if (mv.t >= d.startup + d.active + d.recovery) { this.endMove(f); }
        break;
      }
      case 'projectile': {
        while (mv.spawned < d.count && mv.t >= d.startup + mv.spawned * d.gap) {
          const dmg = d.dmg * mul;
          st.proj.push({ id: st.nextId++, owner: f.side, kind: f.id === 'ninja' ? 'shuriken' : 'fireball',
            x: f.x + f.face * 50, y: 92, vx: f.face * d.speed, dmg, band: d.band,
            hitstun: d.hitstun, blockstun: d.blockstun, kd: mv.isSuper ? 'always' : d.kd, age: 0, isSuper: mv.isSuper });
          f.projOut++;
          mv.spawned++;
          ev.push({ type: 'projectile', side: f.side, kind: f.id === 'ninja' ? 'shuriken' : 'fireball' });
        }
        if (mv.t >= d.startup + (d.count - 1) * d.gap + d.recovery) this.endMove(f);
        break;
      }
      case 'rising': {
        if (mv.phase === 0 && mv.t >= d.startup) { mv.phase = 1; f.vy = d.riseV; f.vx = f.face * 70; }
        f.invuln = Math.max(f.invuln, mv.t < (d.invuln || 0) ? 0.02 : 0);
        if (mv.phase === 1) {
          const k = Math.floor((mv.t - d.startup) / (d.active / d.hits.length));
          if (k >= mv.hits && mv.hits < d.hits.length && k < d.hits.length) {
            if (this.meleeHit(st, f, o, { reach: d.reach, hitstun: .30, blockstun: .16, push: 14, kd: mv.hits === d.hits.length - 1 ? d.kd : false }, 'rise', d.hits[mv.hits] * mul, ev, true)) mv.hits++;
            else if (mv.t - d.startup > (mv.hits + 1) * (d.active / d.hits.length)) mv.hits++;   // 빗나간 타는 넘김
          }
          if (f.y <= 0 && mv.t > d.startup + 0.1) { mv.phase = 2; mv.landT = mv.t; f.vx = 0; }
        }
        if (mv.phase === 2 && mv.t >= mv.landT + d.recovery) this.endMove(f);
        break;
      }
      case 'rush': case 'dash': case 'spin': case 'chain': case 'push': {
        const startup = d.startup;
        const active = d.type === 'chain' ? d.gap * d.hits.length : (d.active || 0.1);
        if (mv.t < startup) { f.invuln = Math.max(f.invuln, mv.t < (d.invuln || 0) ? 0.02 : 0); break; }
        // 초필살 연출 연타는 활성 시간과 무관하게 끝까지 넣는다
        if (d.type === 'rush' && mv.connected === 'hit') {
          f.vx = 0;
          const k = 1 + Math.floor((mv.t - mv.connT) / 0.07);
          while (mv.hits < Math.min(k, d.hits.length)) {
            const last = mv.hits === d.hits.length - 1;
            o.stun = Math.max(o.stun, 0.3);
            this.applyHit(st, f, o, d.hits[mv.hits] * mul, { band: 'mid', hitstun: .5, blockstun: .2, push: last ? 40 : 4, kd: last ? 'always' : false, unblockable: true, isSuper: true, hx: o.x, hy: 90 }, ev);
            o.invuln = 0;
            mv.hits++;
          }
          if (mv.hits >= d.hits.length && !mv.doneT) mv.doneT = mv.t;
          if (mv.doneT && mv.t >= mv.doneT + d.recovery) this.endMove(f);
          break;
        }
        if (mv.t < startup + active) {
          if (d.dashV) f.vx = f.face * d.dashV;
          if (d.type === 'rush' && mv.hits === 0 && !mv.connected) {
            const r = this.meleeHit(st, f, o, { reach: d.reach, hitstun: .9, blockstun: .3, push: 10, kd: false }, 'mid', d.hits[0] * mul, ev, false, { isSuper: true, returnKind: true });
            if (r === 'hit') { mv.connected = 'hit'; mv.hits = 1; mv.connT = mv.t; f.vx = 0; }
            else if (r === 'block') { mv.connected = 'block'; mv.hits = d.hits.length; f.vx = 0; }
          } else if (d.type !== 'rush') {
            const per = active / d.hits.length;
            const k = Math.floor((mv.t - startup) / per);
            if (k >= mv.hits && mv.hits < d.hits.length) {
              const band = d.bands ? d.bands[mv.hits] : d.band;
              const last = mv.hits === d.hits.length - 1;
              const r = this.meleeHit(st, f, o, { reach: d.reach, hitstun: .34, blockstun: .2, push: d.push && last ? d.push : 16, kd: last ? d.kd : false, wallBonus: d.wallBonus }, band, d.hits[mv.hits] * mul, ev, false, { returnKind: true });
              if (r || (mv.t - startup) > (mv.hits + 1) * per) mv.hits++;
            }
          }
        } else {
          f.vx = 0;
          if (mv.t >= startup + active + d.recovery) this.endMove(f);
        }
        break;
      }
      case 'dive': {
        if (mv.phase === 0 && mv.t >= d.startup) { mv.phase = 1; f.vy = d.riseV; f.vx = f.face * 60; mv.p1 = mv.t; }
        if (mv.phase === 1 && mv.t >= mv.p1 + 0.28) { mv.phase = 2; f.vx = f.face * d.diveVx; f.vy = d.diveVy; }
        if (mv.phase === 2) {
          if (mv.hits === 0 && this.meleeHit(st, f, o, { reach: d.reach, hitstun: .4, blockstun: .22, push: 30, kd: d.kd }, 'air', d.hits[0] * mul, ev)) mv.hits = 1;
          if (f.y <= 0) { mv.phase = 3; mv.landT = mv.t; f.vx = 0; }
        }
        if (mv.phase === 3 && mv.t >= mv.landT + d.recovery) this.endMove(f);
        break;
      }
      case 'teleport': {
        if (mv.phase === 0 && mv.t >= d.startup) {
          mv.phase = 1;
          const side = Math.sign(o.x - f.x) || 1;
          f.x = clamp(o.x + side * 70, M.WALL_L + M.BODY, M.WALL_R - M.BODY);
          if (Math.abs(f.x - o.x) < M.BODY * 2) f.x = clamp(o.x - side * 70, M.WALL_L + M.BODY, M.WALL_R - M.BODY);
          f.face = Math.sign(o.x - f.x) || f.face;
          ev.push({ type: 'teleport', side: f.side, x: f.x });
        }
        if (mv.t >= d.startup + d.recovery) this.endMove(f);
        break;
      }
      case 'cmdgrab': {
        if (mv.t >= d.startup && mv.t < d.startup + d.active && mv.hits === 0) {
          if (this.tryGrab(st, f, o, d.dmg * mul, d.reach, ev, true)) mv.hits = 1;
        }
        if (mv.t >= d.startup + d.active + d.recovery) this.endMove(f);
        break;
      }
      case 'trap': {
        if (mv.phase === 0 && mv.t >= d.startup) {
          mv.phase = 1;
          st.haz.push({ id: st.nextId++, kind: 'trap', owner: f.side, x: o.x, width: d.width, t: 0, arm: d.delay, life: d.delay + 0.35,
            dmg: d.dmg * mul, band: d.band, kd: d.kd, hit: false });
          ev.push({ type: 'hazard', side: f.side, kind: 'trap' });
        }
        if (mv.t >= d.startup + d.recovery) this.endMove(f);
        break;
      }
      case 'wall': {
        if (mv.phase === 0 && mv.t >= d.startup) {
          mv.phase = 1;
          st.haz = st.haz.filter((h) => !(h.kind === 'wall' && h.owner === f.side));
          st.haz.push({ id: st.nextId++, kind: 'wall', owner: f.side, x: clamp(f.x + f.face * d.offset, M.WALL_L + 40, M.WALL_R - 40), t: 0, life: d.life });
          ev.push({ type: 'hazard', side: f.side, kind: 'wall' });
        }
        if (mv.t >= d.startup + d.recovery) this.endMove(f);
        break;
      }
      case 'eraser': {
        if (mv.t >= d.startup && mv.t < d.startup + d.active) {
          const prog = (mv.t - d.startup) / d.active;
          mv.front = f.x + f.face * (40 + prog * d.width);
          if (mv.hits === 0) {
            const lo = Math.min(f.x, mv.front), hi = Math.max(f.x, mv.front);
            if (o.x + M.BODY >= lo && o.x - M.BODY <= hi && o.y < 140) {
              const r = this.applyHit(st, f, o, d.dmg * mul, { band: 'mid', hitstun: .5, blockstun: .3, push: 60, kd: d.kd, hx: o.x, hy: 90 }, ev);
              if (r !== 'whiff') mv.hits = 1;
            }
          }
        } else if (mv.t >= d.startup + d.active) { mv.front = null; }
        if (mv.t >= d.startup + d.active + d.recovery) this.endMove(f);
        break;
      }
      default: this.endMove(f);
    }
  },

  endMove(f) {
    f.mv = null;
    if (f.state === 'attack') { f.state = f.y > 0 ? 'jump' : 'idle'; f.stT = 0; }
  },

  // 공격 판정 영역 (세로) — 지상 기술은 바닥 기준, 공중 기술은 공격자 높이 기준
  attackBand(f, band) {
    if (band === 'air') return [f.y + 10, f.y + 112];
    if (band === 'rise') return [f.y + 40, f.y + 210];
    return M.BANDS[band] || M.BANDS.mid;
  },
  hurtBand(o) {
    if (o.y > 0 || o.state === 'airhit') return [o.y, o.y + M.HURT.air];
    if (o.state === 'down' || o.state === 'ko') return [0, 20];
    const crouching = o.state === 'crouch' || (o.inp.down && BLOCKABLE_STATE[o.state]) || (o.mv && (o.mv.key === 'clp' || o.mv.key === 'chp'));
    return [0, crouching ? M.HURT.crouch : M.HURT.stand];
  },

  meleeHit(st, f, o, d, band, dmg, ev, isRising, opt) {
    const reachR = M.BODY + d.reach * f.def.range;
    const dist = (o.x - f.x) * f.face;
    if (dist < -M.BODY || dist - M.BODY > reachR) return false;
    const [a0, a1] = this.attackBand(f, band);
    const [h0, h1] = this.hurtBand(o);
    if (a1 < h0 || a0 > h1) return false;
    const r = this.applyHit(st, f, o, dmg, {
      band: band === 'rise' ? 'mid' : band, hitstun: d.hitstun, blockstun: d.blockstun, push: d.push, kd: d.kd,
      wallBonus: d.wallBonus, isSuper: opt && opt.isSuper,
      hx: f.x + f.face * Math.min(reachR, Math.max(0, dist)), hy: (Math.max(a0, h0) + Math.min(a1, h1)) / 2,
    }, ev);
    if (r === 'whiff') return false;
    return opt && opt.returnKind ? r : true;
  },

  canBlock(o, att, band) {
    if (!BLOCKABLE_STATE[o.state] || o.y > 0 || o.mv || o.dead) return false;
    const back = Math.sign(att.x - o.x) >= 0 ? o.inp.left : o.inp.right;
    if (!back) return false;
    if (band === 'low') return !!o.inp.down;
    return !o.inp.down;                               // 상단·중단·공중 = 서서 가드
  },

  applyHit(st, att, def, dmgBase, opt, ev) {
    if (def.invuln > 0 || def.state === 'down' || def.state === 'ko' || def.dead) return 'whiff';
    const away = Math.sign(def.x - att.x) || att.face;
    const blocked = !opt.unblockable && this.canBlock(def, att, opt.band);
    if (blocked) {
      const chip = Math.max(1, Math.round(dmgBase * M.CHIP));
      def.hp = Math.max(0, def.hp - chip);
      def.state = 'blockstun'; def.stun = opt.blockstun || .18; def.stT = 0; def.pend = null;
      def.gauge = Math.min(M.GAUGE_MAX, def.gauge + M.GAUGE_BLOCK);
      this.knock(def, att, away, (opt.push || 20) * 0.8);
      st.hitstop = Math.max(st.hitstop, M.HITSTOP * 0.7);
      st.stats.blocks[def.side]++;
      ev.push({ type: 'block', side: att.side, dmg: chip, x: opt.hx != null ? opt.hx : def.x, y: opt.hy != null ? opt.hy : 90 });
      return 'block';
    }
    // 콤보 보정 — 초필살 연출 연타는 설계 대미지(320)를 그대로 준다
    const scale = opt.isSuper ? 1 : Math.max(M.COMBO_FLOOR, 1 - M.COMBO_STEP * def.combo);
    let dmg = Math.round(dmgBase * scale);
    def.hp = Math.max(0, def.hp - dmg);
    def.combo++;
    st.stats.maxCombo[att.side] = Math.max(st.stats.maxCombo[att.side], def.combo);
    st.stats.hits[att.side]++;
    if (!opt.isSuper) att.gauge = Math.min(M.GAUGE_MAX, att.gauge + M.GAUGE_HIT);
    def.gauge = Math.min(M.GAUGE_MAX, def.gauge + M.GAUGE_HURT);
    if (def.mv && def.mv.kind === 'projectile') { /* 이미 나간 기탄은 유지 */ }
    def.mv = null; def.pend = null;
    const kd = opt.kd === 'always' || (opt.kd === 'combo' && def.combo >= 2) || def.y > 0 || def.hp <= 0;
    if (kd) {
      def.state = 'airhit'; def.stT = 0; def.stun = 0;
      def.vy = def.y > 0 ? 300 : 520;
      def.vx = away * 190;
    } else {
      def.state = 'hitstun'; def.stun = opt.hitstun || .3; def.stT = 0;
      const atWall = this.knock(def, att, away, opt.push || 20);
      if (atWall && opt.wallBonus) {
        def.hp = Math.max(0, def.hp - opt.wallBonus); dmg += opt.wallBonus;
        ev.push({ type: 'wallsplat', side: att.side, x: def.x });
      }
    }
    const strong = dmgBase >= 80 || kd;
    st.hitstop = Math.max(st.hitstop, strong ? M.HITSTOP_STRONG : M.HITSTOP);
    ev.push({ type: 'hit', side: att.side, dmg, combo: def.combo, strong, kd,
      x: opt.hx != null ? opt.hx : def.x, y: opt.hy != null ? opt.hy : 90, isSuper: !!opt.isSuper });
    return 'hit';
  },

  // 밀어내기 — 벽에 붙어 있으면 반동을 공격자에게 넘긴다. 벽 도달 여부 반환
  knock(def, att, away, push) {
    const edge = away > 0 ? M.WALL_R - M.BODY : M.WALL_L + M.BODY;
    const room = Math.abs(edge - def.x);
    if (room < push) {
      def.pushV = away * room * 12;
      att.pushV = -away * (push - room) * 12 * 0.7;
      return room < 8;
    }
    def.pushV = away * push * 12;
    return false;
  },

  tryGrab(st, f, o, dmg, reach, ev, command) {
    const dist = Math.abs(o.x - f.x) - M.BODY * 2;
    const facingOk = Math.sign(o.x - f.x) === f.face || Math.abs(o.x - f.x) < 4;
    if (!facingOk || dist > reach) return false;

      else this.press(ai, 'hp');

    }

      }
      if (def.sp3 && ai.cool.eraser <= 0 && dist < 460 && rng.next() < 0.07) {

      }

      if (ai.cool.jump <= 0 && rng.next() < (def.jumpRate || 0.05)) {
        ai.cool.jump = 1.2;
        this.press(ai, 'up', 0.06); this.press(ai, fwdKey, 0.5);

      ['sp1', sp && ai.cool.sp <= 0 && ['spin', 'dash', 'chain', 'push', 'cmdgrab', 'rising'].includes(sp.type) ? 0.10 : 0],
      ['walk', dist > M.MOVES.lp.reach * def.range ? 0.25 : 0.04],

      case 'walk': this.press(ai, fwdKey, 0.2); break;
      default: this.press(ai, choice);

  },

  output(ai) {
    const inp = {};
    for (const k of KEYS) if (ai.hold[k] > 0) inp[k] = true;

M.Render = {
  cv: null, ctx: null, res: 1, bg: [], fx: [], shake: 0, flash: 0,

  init(canvas) {

  },

  resize() {

    this.cv.style.height = H * s + 'px';

  reset() { this.fx = []; this.shake = 0; this.flash = 0; },

  // ── 배경: 떨림 프레임 3장을 미리 그려 순환 (설계 7절) ──
  buildBackground() {
    this.bg = [];

  paintArena(c, seed) {

    c.strokeStyle = GUIDE; c.globalAlpha = 0.35;
    line(c, W * 0.33, 0, W * 0.335, H, 1, 0.4, false);
    line(c, W * 0.66, 0, W * 0.665, H, 1, 0.4, false);
    line(c, 0, H * 0.47, W, H * 0.465, 1, 0.4, false);
    line(c, 0, H * 0.9, W, H * 0.905, 1, 0.4, false);
    c.globalAlpha = 1;

    const post = 480;

    c.globalAlpha = 0.55;
    for (const x of [30, 150, 300, 630, 780, 920]) line(c, x + nz() * 4, -10, x + nz() * 6, 300 + nz() * 20, 1.8, 2);

      case 'hit': {

      case 'block':

      case 'super': this.flash = 0.4; this.flashSide = e.side; this.fx.push({ kind: 'text', x: W / 2, y: 150, t: 0, life: 0.9, ink: inkOf(e.side), text: e.name, size: 40, rot: -0.04 }); break;
      case 'special': this.fx.push({ kind: 'text', x: st ? st.p[e.side].x : W / 2, y: 190, t: 0, life: 0.7, ink: inkOf(e.side), text: e.name, size: 24, rot: 0 }); break;
      case 'grab': this.fx.push({ kind: 'text', x: e.x, y: 250, t: 0, life: 0.6, ink: inkOf(e.side), text: e.command ? '파일 드라이버!' : '잡았다!', size: 30, rot: 0.05 }); break;

  // ── 캐릭터 ──

  drawFighter(c, f, pose, opt) {
    const o = opt || {};

        if (ok()) line(c, neck[0] - face * 1 * k, neck[1] + 4, neck[0] - face * 0 * k, neck[1] + 10 * k, w * 0.8, 0.3, false);

  headDeco(c, style, hx, hy, face, k, w, P, ok) {
    const f = face;
    const earTri = (bx) => { if (ok()) poly(c, [[hx + bx - 5 * k, hy - 9 * k], [hx + bx - 3 * k, hy - 24 * k], [hx + bx + 6 * k, hy - 12 * k]], w); };
    const ratEars = () => { if (ok()) ellipse(c, hx - 8 * k, hy - 14 * k, 5 * k, 5 * k, w, 6); if (ok()) ellipse(c, hx + 7 * k, hy - 15 * k, 5 * k, 5 * k, w, 6); };
    const snout = () => { if (ok()) line(c, hx + f * 11 * k, hy + 1 * k, hx + f * 20 * k, hy + 5 * k, w, 0.4, false); };
    const brow = () => { if (ok()) line(c, hx + f * 2 * k, hy - 4 * k, hx + f * 10 * k, hy - 1 * k, w, 0.3, false); };
    switch (style) {

        if (ok()) line(c, hx + f * 10 * k, hy + 7 * k, hx + f * 22 * k, hy + 9 * k, w * 0.7, 0.3, false);

        if (ok()) ellipse(c, hx - f * 4 * k, hy - 2 * k, 19 * k, 21 * k, w, 12);
        if (ok()) line(c, hx + f * 12 * k, hy - 12 * k, hx + f * 21 * k, hy - 4 * k, w, 0.5, false);
        snout();
        break;
      case 'kkokko':
        for (let i = 0; i < 3; i++) if (ok()) ellipse(c, hx - 6 * k + i * 6 * k, hy - 17 * k - (i === 1 ? 3 : 0) * k, 3.5 * k, 4.5 * k, w * 0.9, 6);

      case 'tkd':

        if (ok()) line(c, hx - f * 13 * k, hy - 7 * k, hx - f * 32 * k, hy - 2 * k + nz() * 3, w * 0.9, 1.2, false);
        break;
      case 'sumo':
        ratEars(); snout();
        if (ok()) ellipse(c, hx - f * 2 * k, hy - 19 * k, 5 * k, 4 * k, w, 6);                              // 상투
        break;
      case 'ninja':
        ratEars();
        if (ok()) line(c, hx - 12 * k, hy + 2 * k, hx + 13 * k, hy + 1 * k, w, 0.3, false);                  // 복면
        for (let i = 0; i < 3; i++) if (ok()) line(c, hx - 6 * k + i * 6 * k, hy + 5 * k, hx - 9 * k + i * 6 * k, hy + 12 * k, w * 0.7, 0.2, false);
        if (ok()) line(c, hx - f * 12 * k, hy - 6 * k, hx - f * 36 * k, hy - 10 * k + nz() * 4, w * 0.9, 1.5, false);
        break;
      case 'wrestler':
        if (ok()) ellipse(c, hx + f * 4 * k, hy - 3 * k, 3.5 * k, 2.5 * k, w * 0.8, 6);
        if (ok()) ellipse(c, hx + f * 9 * k, hy - 3 * k, 3.5 * k, 2.5 * k, w * 0.8, 6);
        if (ok()) line(c, hx - f * 2 * k, hy - 15 * k, hx + f * 2 * k, hy + 13 * k, w, 0.5, false);          // 마스크 줄무늬
        break;
      case 'sensei':
        if (ok()) ellipse(c, hx + f * 5 * k, hy - 2 * k, 4 * k, 4 * k, w * 0.8, 6);
        if (ok()) ellipse(c, hx + f * 13 * k, hy - 2 * k, 4 * k, 4 * k, w * 0.8, 6);
        for (let i = 0; i < 3; i++) if (ok()) line(c, hx + f * (2 + i * 4) * k, hy + 10 * k, hx + f * (0 + i * 5) * k, hy + 26 * k, w * 0.8, 0.8, false);
        if (ok()) ellipse(c, hx - f * 3 * k, hy - 18 * k, 5 * k, 4 * k, w, 6);
        break;
    }
  },

  pencil(c, P, face, k, ok) {
    const dx = P.hF[0] - P.eF[0], dy = P.hF[1] - P.eF[1], len = Math.hypot(dx, dy) || 1;
    const ux = dx / len, uy = dy / len, nx = -uy, ny = ux;
    const L = 58 * k, r = 4.5 * k;
    const bx = P.hF[0] - ux * 12 * k, by = P.hF[1] - uy * 12 * k;
    const tx = bx + ux * L, ty = by + uy * L;
    c.save();
    c.strokeStyle = GRAPHITE;
    if (ok()) line(c, bx + nx * r, by + ny * r, tx + nx * r, ty + ny * r, 2, 0.4, false);
    if (ok()) line(c, bx - nx * r, by - ny * r, tx - nx * r, ty - ny * r, 2, 0.4, false);
    if (ok()) poly(c, [[tx + nx * r, ty + ny * r], [tx + ux * 13 * k, ty + uy * 13 * k], [tx - nx * r, ty - ny * r]], 2);
    if (ok()) line(c, bx + nx * r, by + ny * r, bx - nx * r, by - ny * r, 2, 0.3, false);
    c.restore();
  },

  // ── 기탄 · 함정 · 지우개 ──
  drawProjectile(c, p, st, t) {
    const ink = st.p[p.owner].def.ink;
    const x = p.x, y = M.FLOOR - p.y * VIS;
    c.strokeStyle = ink;
    if (p.kind === 'shuriken') {
      const a = p.age * 18;
      for (let i = 0; i < 4; i++) {
        const ang = a + i * Math.PI / 2;
        line(c, x, y, x + Math.cos(ang) * 11, y + Math.sin(ang) * 11, 2, 0.4, false);
      }
      ellipse(c, x, y, 3, 3, 1.6, 6);
    } else {
      const r = p.isSuper ? 24 : 16;
      ellipse(c, x, y, r, r * 0.9, 2.4, 12);
      ellipse(c, x + nz() * 2, y, r * 0.62, r * 0.55, 2, 10);
      ellipse(c, x, y, r * 0.25, r * 0.25, 1.8, 6);
      const back = -Math.sign(p.vx);
      for (let i = 0; i < 4; i++) line(c, x + back * (r + 4), y - 12 + i * 8, x + back * (r + 26 + nz() * 8), y - 12 + i * 8, 1.8, 0.5, false);
    }
  },

  drawHazard(c, h, st, t) {
    const ink = st.p[h.owner].def.ink;
    c.strokeStyle = ink;
    if (h.kind === 'trap') {
      const y = M.FLOOR + 2;
      if (h.t < h.arm) {
        c.globalAlpha = 0.5 + 0.4 * Math.sin(h.t * 30);
        for (let i = 0; i < 5; i++) {
          const x0 = h.x - h.width / 2 + i * (h.width / 5);
          line(c, x0, y, x0 + h.width / 8, y, 2, 0.3, false);
        }
        c.globalAlpha = 1;
      } else {
        const pts = [];
        for (let i = 0; i <= 8; i++) pts.push([h.x - h.width / 2 + i * h.width / 8, y - (i % 2 ? 36 : 0)]);
        poly(c, pts, 2.4);
      }
    } else if (h.kind === 'wall') {
      const top = M.FLOOR - 170;
      c.globalAlpha = Math.min(1, (h.life - h.t) * 2);
      const pts = [];
      for (let i = 0; i <= 6; i++) pts.push([h.x + (i % 2 ? 5 : -5), M.FLOOR - (i / 6) * 170]);
      poly(c, pts, 3);
      line(c, h.x + 9, M.FLOOR, h.x + 7, top, 1.6, 2);
      for (let i = 0; i < 4; i++) line(c, h.x - 12, M.FLOOR - 30 - i * 36, h.x + 12, M.FLOOR - 42 - i * 36, 1.4, 0.3, false);
      c.globalAlpha = 1;
    }
  },

  drawEraser(c, f) {
    const mv = f.mv;
    if (!mv || mv.kind !== 'eraser' || mv.front == null) return;
    const x0 = Math.min(f.x, mv.front), x1 = Math.max(f.x, mv.front);
    const top = M.FLOOR - 160;
    c.fillStyle = PAPER;
    c.fillRect(x0, top, x1 - x0, 165);                          // 지운 자리 = 종이색
    c.strokeStyle = GRAPHITE;
    line(c, x0, top, x1, top, 1.6, 2);
    line(c, x0, M.FLOOR + 5, x1, M.FLOOR + 5, 1.6, 2);
    const fx = mv.front;
    ellipse(c, fx, M.FLOOR - 80, 22, 70, 2.4, 12);               // 지우개 덩어리
    for (let i = 0; i < 8; i++) {
      const ex = fx - f.face * (10 + Math.abs(nz()) * 60), ey = M.FLOOR - 150 + Math.abs(nz()) * 150;
      line(c, ex, ey, ex + 4, ey + 2, 2, 0.2, false);
    }
  },

  drawFx(c, dt) {
    const keep = [];
    for (const e of this.fx) {
      e.t += dt;
      if (e.t > e.life) continue;
      keep.push(e);
      const k = e.t / e.life;
      c.strokeStyle = e.ink;
      c.globalAlpha = 1 - k * 0.8;
      switch (e.kind) {
        case 'spark': {
          const n = e.strong ? 12 : 8;
          for (let i = 0; i < n; i++) {
            const ang = (i / n) * Math.PI * 2 + hash(e.seed + i) * 0.3;
            const r0 = 6 + k * 14, r1 = (e.strong ? 30 : 20) + hash(e.seed * 3 + i) * 10 + k * 18;
            line(c, e.x + Math.cos(ang) * r0, e.y + Math.sin(ang) * r0, e.x + Math.cos(ang) * r1, e.y + Math.sin(ang) * r1, 2.2, 0.3, false);
          }
          if (e.strong) ellipse(c, e.x, e.y, 18 + k * 16, 14 + k * 12, 1.8, 10);
          break;
        }
        case 'guard':
          for (let i = 0; i < 3; i++) {
            c.lineWidth = 2; c.beginPath();
            c.arc(e.x + e.dir * i * 7, e.y, 16 + i * 6, e.dir > 0 ? -1 : Math.PI - 1, e.dir > 0 ? 1 : Math.PI + 1);
            c.stroke(); SEGS += 3;
          }
          break;
        case 'text': sketchText(c, e.text, e.x, e.y - k * 20, e.size, e.ink, e.rot); break;
        case 'dust':
          for (let i = 0; i < 5; i++) line(c, e.x - 40 - k * 20 + i * 18, M.FLOOR - 2 - (i % 2) * 6, e.x - 30 - k * 20 + i * 18, M.FLOOR - 4 - (i % 2) * 6, 1.8, 0.2, false);
          break;
        case 'poof':
          for (let i = 0; i < 3; i++) ellipse(c, e.x + (i - 1) * 16, M.FLOOR - 70 - i * 12, 18 + k * 12, 14 + k * 10, 1.8, 10);
          break;
        case 'combo':
          sketchText(c, `${e.n} HIT`, e.side === 0 ? 170 : W - 170, 118, 30, e.ink, e.side === 0 ? -0.06 : 0.06);
          break;
      }
      c.globalAlpha = 1;
    }
    this.fx = keep;
  },

  // ── HUD (체력 바는 손으로 그린 사각형 안 사선 해칭) ──
  drawHUD(c, st, t) {
    const bw = 380, bx = [52, W - 52 - bw], by = 24, bh = 28;
    for (const side of [0, 1]) {
      const f = st.p[side];
      const ratio = Math.max(0, f.hp / f.maxHp);
      f.ghost = f.ghost == null ? ratio : Math.max(ratio, f.ghost - 0.35 * (1 / 60));
      const x0 = bx[side];
      c.strokeStyle = f.def.ink;
      line(c, x0, by, x0 + bw, by, 2.2, 0.8, false);
      line(c, x0, by + bh, x0 + bw, by + bh, 2.2, 0.8, false);
      line(c, x0, by, x0, by + bh, 2.2, 0.4, false);
      line(c, x0 + bw, by, x0 + bw, by + bh, 2.2, 0.4, false);
      const fill = (r0, r1, gap, alpha) => {
        const a = side === 0 ? x0 + bw * r0 : x0 + bw * (1 - r1);
        const b = side === 0 ? x0 + bw * r1 : x0 + bw * (1 - r0);
        if (b - a < 1) return;
        c.save();
        c.beginPath(); c.rect(a, by + 2, b - a, bh - 4); c.clip();
        c.globalAlpha = alpha;
        for (let x = a - bh; x < b + 4; x += gap) line(c, x, by + bh, x + bh, by, 1.6, 0.2, false);
        c.restore();
      };
      fill(0, ratio, 7, 0.95);
      if (f.ghost > ratio + 0.002) fill(ratio, f.ghost, 14, 0.4);
      sketchText(c, f.def.name, side === 0 ? x0 + 70 : x0 + bw - 70, by + bh + 20, 17, f.def.ink, 0, 1.4);
      // 라운드 승리 표시
      for (let i = 0; i < M.ROUNDS_TO_WIN; i++) {
        const cx = side === 0 ? x0 + bw - 12 - i * 22 : x0 + 12 + i * 22, cy = by + bh + 18;
        ellipse(c, cx, cy, 7, 7, 1.8, 8);
        if (st.wins[side] > i) { line(c, cx - 5, cy - 5, cx + 5, cy + 5, 2, 0.2, false); line(c, cx + 5, cy - 5, cx - 5, cy + 5, 2, 0.2, false); }
      }
      // 필살 게이지
      const gw = 220, gx = side === 0 ? 52 : W - 52 - gw, gy = 512, gh = 14;
      c.strokeStyle = f.def.ink;
      line(c, gx, gy, gx + gw, gy, 1.8, 0.5, false);
      line(c, gx, gy + gh, gx + gw, gy + gh, 1.8, 0.5, false);
      line(c, gx, gy, gx, gy + gh, 1.8, 0.2, false);
      line(c, gx + gw, gy, gx + gw, gy + gh, 1.8, 0.2, false);
      const gr = f.gauge / M.GAUGE_MAX;
      if (gr > 0) {
        c.save();
        const ga = side === 0 ? gx : gx + gw * (1 - gr);
        c.beginPath(); c.rect(ga, gy + 2, gw * gr, gh - 4); c.clip();
        for (let x = ga - gh; x < ga + gw * gr + 4; x += 6) { line(c, x, gy + gh, x + gh, gy, 1.4, 0.1, false); }
        if (gr >= 1) for (let x = ga; x < ga + gw; x += 6) line(c, x, gy, x + gh, gy + gh, 1.2, 0.1, false);
        c.restore();
      }
      const label = f.gauge >= M.GAUGE_MAX ? (Math.floor(t * 4) % 2 ? 'MAX!' : '') : '필살';
      if (label) sketchText(c, label, side === 0 ? gx + gw + 36 : gx - 36, gy + 8, 16, f.def.ink, 0, 1.3);
    }
    // 타이머
    c.strokeStyle = '#222';
    ellipse(c, W / 2, 44, 30, 26, 2.2, 12);
    sketchText(c, String(Math.ceil(st.timer)), W / 2, 45, 30, '#222', 0, 1.8);
    sketchText(c, `도전자 ${st.stage + 1}/8`, W / 2, 88, 14, GRAPHITE, 0, 1.1);
  },

  drawBanner(c, st, t) {
    const ph = st.phase;
    if (ph === 'intro') {
      const first = st.introLen >= M.INTRO_FIRST - 1e-6;
      const def = st.p[1].def;
      if (first && st.phaseT < 1.2) {
        const k = Math.min(1, st.phaseT / 0.25);
        c.save();
        c.globalAlpha = k;
        c.fillStyle = PAPER; c.fillRect(250, 120 - (1 - k) * 30, 460, 220);
        c.strokeStyle = '#333';
        line(c, 250, 120, 710, 118, 2.2, 2); line(c, 250, 340, 710, 342, 2.2, 2);
        line(c, 250, 120, 252, 340, 2.2, 1); line(c, 710, 118, 708, 342, 2.2, 1);
        line(c, 262, 132, 698, 130, 1.2, 2);
        sketchText(c, `도전자 ${st.stage + 1}`, 480, 170, 26, GRAPHITE, -0.02, 1.6);
        sketchText(c, def.name, 480, 228, 52, def.ink, -0.03, 2.4);
        sketchText(c, def.trait, 480, 290, 20, GRAPHITE, 0, 1.3);
        c.restore();
        return;
      }
      const remain = st.introLen - st.phaseT;
      if (remain > 0.45) sketchText(c, `ROUND ${st.round}`, W / 2, 220, 70, '#222', -0.04, 3);
      else sketchText(c, 'FIGHT!', W / 2, 220, 90, '#d6282e', -0.06, 3.4);
    } else if (ph === 'ko') {
      const text = st.p[0].hp > 0 && st.p[1].hp > 0 ? 'TIME UP' : 'K.O.';
      sketchText(c, text, W / 2, 210, 100, '#222', -0.05, 3.6);
      if (text === 'K.O.') { c.strokeStyle = '#222'; poly(c, [[300, 280], [360, 268], [420, 290], [490, 262], [560, 284], [650, 266]], 2.2); }
    } else if (ph === 'roundEnd' || ph === 'matchEnd') {
      const w = st.roundWinner;
      const text = w === 'draw' ? '무승부' : `${st.p[w].def.name} 승!`;
      sketchText(c, text, W / 2, 210, 54, w === 'draw' ? '#222' : st.p[w].def.ink, -0.03, 2.4);
    }
  },

  drawFlash(c, dt) {
    if (this.flash <= 0) return;
    this.flash -= dt;
    const k = 1 - this.flash / 0.4;
    const dir = this.flashSide === 0 ? 1 : -1;
    const x = dir > 0 ? k * W * 1.2 - 60 : W - k * W * 1.2 + 60;
    c.fillStyle = PAPER;
    if (dir > 0) c.fillRect(-10, 0, x + 10, H); else c.fillRect(x, 0, W - x + 10, H);
    c.strokeStyle = '#333';
    line(c, x, -10, x - dir * 20, H + 10, 2.6, 2);
    poly(c, [[x, H - 120], [x - dir * 70, H], [x, H]], 2.2);                      // 넘어가는 종이 모서리
    for (let i = 0; i < 6; i++) line(c, x - dir * (10 + i * 8), H - 90 + i * 14, x - dir * (30 + i * 8), H - 90 + i * 14, 1.2, 0.2, false);
  },

  // ── 한 프레임 ──
  draw(st, now, dt) {
    const c = this.ctx;
    SEGS = 0;
    const boil = Math.floor(now * BOIL_HZ);
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.drawImage(this.bg[boil % 3], 0, 0);
    c.setTransform(this.res, 0, 0, this.res, 0, 0);
    c.lineCap = 'round'; c.lineJoin = 'round';

    // 화면 흔들림
    let sx = 0, sy = 0;
    if (this.shake > 0) { this.shake -= dt; sx = Math.sin(now * 90) * 4; sy = Math.cos(now * 70) * 3; }
    c.translate(sx, sy);

    beginBoil(boil * 13 + 5);
    for (const h of st.haz) this.drawHazard(c, h, st, now);
    // 뒤에 있는 캐릭터(행동 중이 아닌 쪽)를 먼저
    const order = st.p.slice().sort((a, b) => (a.mv ? 1 : 0) - (b.mv ? 1 : 0));
    for (const f of order) {
      beginBoil(boil * 31 + f.side * 977 + 11);
      if (f.invuln > 0 && f.state === 'idle' && Math.floor(now * 20) % 2) c.globalAlpha = 0.45;
      this.drawFighter(c, f, M.poseOf(f, now), {});
      c.globalAlpha = 1;
      this.drawEraser(c, f);
    }
    beginBoil(boil * 17 + 3);
    for (const p of st.proj) this.drawProjectile(c, p, st, now);
    this.drawFx(c, dt);
    c.translate(-sx, -sy);
    this.drawFlash(c, dt);
    beginBoil(boil * 7 + 1);
    this.drawHUD(c, st, now);
    this.drawBanner(c, st, now);
    this.stats.segments = SEGS;
  },

  // ── 타이틀 미리보기 (작은 캔버스) ──
  drawPreview(cv, now) {
    const c = cv.getContext('2d');
    const cw = cv.width, ch = cv.height, s = cw / 420;
    SEGS = 0;
    c.setTransform(s, 0, 0, s, 0, 0);
    c.fillStyle = PAPER; c.fillRect(0, 0, 420, 220);
    const boil = Math.floor(now * BOIL_HZ);
    beginBoil(boil * 5 + 2);
    c.strokeStyle = BLUE; c.globalAlpha = 0.6;
    line(c, 210, 10, 211, 130, 1.8, 1);
    for (let k = 0; k < 2; k++) { line(c, 210, 60 + k * 26, -10, 110 + k * 40, 1.8, 3); line(c, 210, 60 + k * 26, 430, 110 + k * 40, 1.8, 3); }
    line(c, 210, 132, -10, 196, 2, 3); line(c, 210, 132, 430, 196, 2, 3);
    c.globalAlpha = 1;
    const mk = (id, x, face, side) => ({ id, def: M.FIGHTERS[id], x, y: 0, face, side, state: 'idle', stT: now, inp: {}, vy: 0, vx: 0, invuln: 0 });
    const a = mk('mogu', 130, 1, 0), b = mk('bboy', 290, -1, 1);
    beginBoil(boil * 11 + 1);
    this.drawFighter(c, a, M.poseOf(a, now), { floor: 196, scale: 0.9 });
    beginBoil(boil * 11 + 7);
    this.drawFighter(c, b, M.poseOf(b, now), { floor: 196, scale: 0.9 });
  },

  // ── 엔딩: 모구가 연필을 빼앗아 사범을 그린다 ──
  drawEnding(now, t) {
    const c = this.ctx;
    const boil = Math.floor(now * BOIL_HZ);
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.drawImage(this.bg[boil % 3], 0, 0);
    c.setTransform(this.res, 0, 0, this.res, 0, 0);
    c.fillStyle = PAPER; c.globalAlpha = 0.75; c.fillRect(0, 0, W, H); c.globalAlpha = 1;
    const mogu = { id: 'mogu', def: M.FIGHTERS.mogu, x: 310, y: 0, face: 1, side: 0, state: 'idle', stT: t, inp: {}, vy: 0, invuln: 0 };
    beginBoil(boil * 3 + 1);
    const drawingPose = M.lerpPose(M.POSES.draw, M.POSES.push, 0.5 + 0.5 * Math.sin(t * 9));
    this.drawFighter(c, mogu, t < 1.2 ? M.POSES.win : drawingPose, { pencil: true });
    const sensei = { id: 'sensei', def: M.FIGHTERS.sensei, x: 640, y: 0, face: -1, side: 1, state: 'idle', stT: t, inp: {}, vy: 0, invuln: 0 };
    beginBoil(boil * 3 + 9);
    const limit = t < 1.2 ? 0 : Math.floor((t - 1.2) * 16);
    this.drawFighter(c, sensei, M.POSES.hit, { limit, noShadow: true });
    beginBoil(boil * 7 + 4);
    if (t > 0.2) sketchText(c, '연필은 이제 모구의 것!', W / 2, 110, 44, '#18181c', -0.03, 2.2);
    if (t > 3.2) sketchText(c, '도전자 8명 격파 — 스케치 마스터 모구', W / 2, 160, 26, '#d6282e', 0, 1.6);
  },
};

}
/* ── audio.js ── */
{
// audio.js — WebAudio 합성 효과음 (외부 파일 없음, 시리즈 공통 방식)
// 연필 사각거림·종이 넘김 같은 스케치 질감을 노이즈 필터로 만든다
const M = window.MSK;

const A = {
  ctx: null, master: null, lastHit: 0,

  init() {
    if (this.ctx) return;
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    this.ctx = new Ctx();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.4;
    this.master.connect(this.ctx.destination);
  },
  resume() { this.init(); if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },

  tone(freq, dur, type = 'square', vol = 0.2, slideTo = null, when = 0) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + when;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.02);
  },

  noise(dur, vol = 0.25, freq = 900, q = 1, when = 0, sweepTo = null) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + when;
    const len = Math.ceil(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const f = this.ctx.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = q;
    f.frequency.setValueAtTime(freq, t0);
    if (sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo, t0 + dur);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t0); src.stop(t0 + dur + 0.02);
  },

  // ── 효과음 ──
  scratch() { this.noise(0.08, 0.10, 3200, 2.5); },                                 // 연필 획
  swing(strong) { this.noise(strong ? 0.16 : 0.1, 0.12, strong ? 900 : 1600, 1.2, 0, strong ? 400 : 900); },
  hit(strong) {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    if (now - this.lastHit < 0.03) return;
    this.lastHit = now;
    this.noise(strong ? 0.2 : 0.1, strong ? 0.42 : 0.3, strong ? 380 : 650, 0.9);
    this.tone(strong ? 120 : 190, strong ? 0.18 : 0.09, 'square', 0.2, strong ? 55 : 90);
  },
  block() { this.noise(0.06, 0.24, 2400, 3); this.tone(900, 0.04, 'triangle', 0.1); },
  grab() { this.noise(0.12, 0.2, 500, 1); this.tone(160, 0.25, 'sawtooth', 0.14, 70, 0.06); },
  fireball() { this.noise(0.3, 0.2, 700, 1.4, 0, 2400); this.tone(330, 0.2, 'triangle', 0.14, 660); },
  shuriken() { this.noise(0.08, 0.16, 4200, 3); },
  jump() { this.tone(300, 0.08, 'sine', 0.08, 480); },
  land() { this.noise(0.14, 0.3, 220, 0.8); },
  page() { this.noise(0.35, 0.28, 1800, 0.7, 0, 500); },                             // 종이 넘김
  super() { this.page(); [392, 494, 587, 784].forEach((f, i) => this.tone(f, 0.16, 'square', 0.15, null, 0.1 + i * 0.07)); },
  eraser() { this.noise(0.6, 0.22, 1400, 0.5, 0, 700); },
  bell() { this.tone(1320, 0.5, 'sine', 0.2); this.tone(1980, 0.35, 'sine', 0.08, null, 0.02); },
  fight() { this.bell(); this.tone(523, 0.1, 'square', 0.14, null, 0.25); this.tone(784, 0.18, 'square', 0.14, null, 0.36); },
  ko() { this.tone(220, 0.6, 'sawtooth', 0.2, 60); this.noise(0.5, 0.3, 300, 0.7); },
  win() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.2, 'square', 0.16, null, i * 0.12)); },
  lose() { [392, 330, 262, 196].forEach((f, i) => this.tone(f, 0.26, 'triangle', 0.18, null, i * 0.2)); },
  select() { this.tone(660, 0.06, 'square', 0.1, 880); },
  meow() { this.tone(700, 0.28, 'sawtooth', 0.1, 420); },
};

M.audio = A;

}
/* ── ui.js ── */
{
// ui.js — 저장(난이도별 도달 도전자·격파 기록) + 화면 전환
const M = window.MSK;
const $ = (id) => document.getElementById(id);

M.save = {
  KEY: 'mogusketch-save-v1',
  data: { diff: 'normal', stage: {}, cleared: {}, wins: 0, plays: 0 },
  load() {
    try { const raw = localStorage.getItem(this.KEY); if (raw) this.data = Object.assign(this.data, JSON.parse(raw)); } catch (e) {}
    if (M.DIFFS[this.data.diff]) M.diff = this.data.diff;
    return this.data;
  },
  store() { try { localStorage.setItem(this.KEY, JSON.stringify(this.data)); } catch (e) {} },
  setDiff(d) { if (!M.DIFFS[d]) return; M.diff = d; this.data.diff = d; this.store(); },
  stageOf(d) { return Math.min(M.LADDER.length - 1, this.data.stage[d] || 0); },
  beat(d, stage) {
    this.data.wins = (this.data.wins || 0) + 1;
    this.data.stage[d] = Math.max(this.data.stage[d] || 0, Math.min(M.LADDER.length - 1, stage + 1));
    if (stage === M.LADDER.length - 1) { this.data.cleared[d] = true; this.data.stage[d] = 0; }
    this.store();
  },
  resetStage(d) { this.data.stage[d] = 0; this.store(); },
};

M.ui = {
  screens: ['title-screen', 'pause-screen', 'win-screen', 'over-screen', 'ending-screen'],

  init() {
    document.querySelectorAll('.diff-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        M.audio.resume(); M.audio.select();
        M.save.setDiff(btn.dataset.diff);
        this.updateDiffBtns();
        this.refreshTitle();
      });
    });
    this.updateDiffBtns();
    this.refreshTitle();
  },

  updateDiffBtns() {
    document.querySelectorAll('.diff-btn').forEach((btn) => {
      btn.classList.toggle('selected', btn.dataset.diff === M.diff);
      const done = M.save.data.cleared[btn.dataset.diff];
      btn.textContent = M.DIFFS[btn.dataset.diff].name + (done ? ' ✎' : '');
    });
  },

  refreshTitle() {
    const s = M.save.stageOf(M.diff);
    const def = M.FIGHTERS[M.LADDER[s]];
    $('btn-start').textContent = s > 0 ? `도전자 ${s + 1} ${def.name}부터 (Enter)` : '도전 시작 (Enter)';
    $('btn-fresh').classList.toggle('hidden', s === 0);
    $('title-hi').textContent = M.save.data.cleared[M.diff]
      ? `${M.DIFFS[M.diff].name} 격파 완료 ✎ — 다시 처음부터 도전할 수 있어요`
      : `${M.DIFFS[M.diff].name} · 도전자 ${s + 1} / ${M.LADDER.length}`;
  },

  show(id) {
    for (const s of this.screens) $(s).classList.toggle('hidden', s !== id);
  },
  hideAll() { for (const s of this.screens) $(s).classList.add('hidden'); },

  showWin(st) {
    const def = st.p[1].def;
    $('win-title').textContent = `${def.name} 격파!`;
    const next = M.FIGHTERS[M.LADDER[st.stage + 1]];
    $('win-stats').innerHTML =
      `라운드 ${st.wins[0]} : ${st.wins[1]} · 최대 콤보 ${st.stats.maxCombo[0]}히트<br>` +
      (next ? `다음 도전자 — <b>${next.name}</b>` : '');
    this.show('win-screen');
  },

  showOver(st) {
    const def = st.p[1].def;
    $('over-title').textContent = `${def.name}에게 패배`;
    $('over-stats').innerHTML = `라운드 ${st.wins[0]} : ${st.wins[1]} · 난이도 ${M.DIFFS[st.diff].name}<br>같은 도전자에게 몇 번이든 다시 도전할 수 있어요`;
    this.show('over-screen');
  },
};

}
/* ── main.js ── */
{
// main.js — 게임 루프 + 모드 전환 + 입력 (키보드 / 터치 8방향 패드·버튼)
const M = window.MSK;
const $ = (id) => document.getElementById(id);

let mode = 'title';            // title | play | pause | result | ending
let st = null, ai = null;
let resultT = 0, endingT = 0;
let worst = false;
const held = { left: false, right: false, up: false, down: false, lp: false, hp: false, grab: false, sp1: false, sp2: false, sp3: false, su: false };
// 한 프레임 안에 눌렀다 뗀 짧은 입력도 놓치지 않도록 다음 스텝까지 붙잡아 둔다
const tapped = {};
const press = (k) => { held[k] = true; tapped[k] = true; };

M.save.load();
M.ui.init();
M.Render.init($('game'));
M.ui.show('title-screen');

function startMatch(stage) {
  const s = stage != null ? stage : M.save.stageOf(M.diff);
  st = M.Logic.create((Date.now() & 0x7fffffff) || 1, M.diff, s);
  ai = M.AI.create(M.diff, (Date.now() * 7) & 0x7fffffff);
  M.Render.reset();
  for (const k of Object.keys(held)) held[k] = false;
  for (const k of Object.keys(tapped)) delete tapped[k];
  mode = 'play';
  M.ui.hideAll();
  M.audio.resume(); M.audio.page();
}

function toTitle() {
  mode = 'title';
  M.ui.updateDiffBtns();
  M.ui.refreshTitle();
  M.ui.show('title-screen');
}

function handleEvents(evs) {
  for (const e of evs) {
    M.Render.addFx(e, st);
    switch (e.type) {
      case 'roundStart': M.audio.bell(); break;
      case 'fight': M.audio.fight(); break;
      case 'swing': M.audio.swing(e.strong); break;
      case 'hit': M.audio.hit(e.strong); break;
      case 'block': M.audio.block(); break;
      case 'grab': M.audio.grab(); break;
      case 'projectile': if (e.kind === 'shuriken') M.audio.shuriken(); else M.audio.fireball(); break;
      case 'special': M.audio.scratch(); if (e.kind === 'eraser') M.audio.eraser(); break;
      case 'hazard': M.audio.scratch(); break;
      case 'super': M.audio.super(); break;
      case 'jump': M.audio.jump(); break;
      case 'land': if (e.heavy) M.audio.land(); break;
      case 'ko': case 'timeup': M.audio.ko(); break;
      case 'matchEnd':
        resultT = 0;
        if (e.winner === 0) { M.save.beat(st.diff, st.stage); M.audio.win(); }
        else M.audio.lose();
        break;
    }
  }
}

function pause() { if (mode === 'play') { mode = 'pause'; M.ui.show('pause-screen'); } }
function resume() { if (mode === 'pause') { mode = 'play'; M.ui.hideAll(); } }

// ── 키보드 (설계 5-1절) ──
const KEYMAP = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down', z: 'lp', Z: 'lp', x: 'hp', X: 'hp', c: 'su', C: 'su' };
window.addEventListener('keydown', (e) => {
  M.audio.resume();
  const k = e.key;
  if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(k)) e.preventDefault();
  if (KEYMAP[k]) { if (e.repeat) held[KEYMAP[k]] = true; else press(KEYMAP[k]); }

  if (mode === 'title') {
    if (k === 'Enter' || k === ' ') startMatch();
    const n = ['1', '2', '3', '4'].indexOf(k);
    if (n >= 0) { M.save.setDiff(M.DIFF_ORDER[n]); M.ui.updateDiffBtns(); M.ui.refreshTitle(); }
  } else if (mode === 'play') {
    if (k === 'Escape') pause();
  } else if (mode === 'pause') {
    if (k === 'Escape' || k === 'Enter') resume();
    if (k === 'm' || k === 'M') toTitle();
  } else if (mode === 'result') {
    if (k === 'Enter' || k === ' ') resultPrimary();
    if (k === 'Escape') toTitle();
  } else if (mode === 'ending') {
    if ((k === 'Enter' || k === ' ') && endingT > 4.5) toTitle();
  }
});
window.addEventListener('keyup', (e) => { if (KEYMAP[e.key]) held[KEYMAP[e.key]] = false; });
window.addEventListener('blur', () => { for (const k of Object.keys(held)) held[k] = false; });

function resultPrimary() {
  if (!st) return;
  if (st.winner === 0) startMatch(Math.min(M.LADDER.length - 1, st.stage + 1));
  else startMatch(st.stage);
}

$('btn-start').onclick = () => startMatch();
$('btn-fresh').onclick = () => { M.save.resetStage(M.diff); M.ui.refreshTitle(); startMatch(0); };
$('btn-series').onclick = () => { location.href = location.pathname.includes('/mogusketch/') ? '../index.html' : 'index.html'; };
$('btn-resume').onclick = () => resume();
$('btn-restart').onclick = () => startMatch(st ? st.stage : undefined);
$('btn-title').onclick = () => toTitle();
$('btn-next').onclick = () => resultPrimary();
$('btn-win-title').onclick = () => toTitle();
$('btn-over-retry').onclick = () => resultPrimary();
$('btn-over-title').onclick = () => toTitle();
$('btn-end-title').onclick = () => toTitle();

// ── 터치 (설계 5-2절: 8방향 패드 + 약·강·잡기·필살·초필살) ──
const isTouch = window.matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
const vpad = $('vpad');
if (isTouch) {
  document.body.classList.add('touch');
  $('title-hint').innerHTML = '왼쪽 패드로 이동·점프·앉기 · 약·강·잡기·필살 버튼<br>필살 버튼 = 냥파동, 패드 위+필살 = 발톱 연무 · 게이지가 차면 초필살';
  const pad = $('vdpad'), knob = $('vdpad-knob');
  let padId = null;
  const setDir = (e) => {
    const r = pad.getBoundingClientRect();
    const dx = (e.clientX - (r.left + r.width / 2)) / (r.width / 2);
    const dy = (e.clientY - (r.top + r.height / 2)) / (r.height / 2);
    const mag = Math.hypot(dx, dy);
    held.left = held.right = held.up = held.down = false;
    if (mag > 0.22) {
      const ang = Math.atan2(dy, dx);
      const sec = Math.round(ang / (Math.PI / 4));                 // 8방향
      const dirs = { 0: ['right'], 1: ['right', 'down'], 2: ['down'], 3: ['left', 'down'], 4: ['left'], '-4': ['left'], '-3': ['left', 'up'], '-2': ['up'], '-1': ['right', 'up'] };
      for (const d of dirs[sec] || []) held[d] = true;
    }
    const kx = Math.max(-1, Math.min(1, dx)), ky = Math.max(-1, Math.min(1, dy));
    knob.style.transform = `translate(${kx * 28}px, ${ky * 28}px)`;
  };
  const clearDir = () => { padId = null; held.left = held.right = held.up = held.down = false; knob.style.transform = ''; };
  pad.addEventListener('pointerdown', (e) => { e.preventDefault(); M.audio.resume(); padId = e.pointerId; try { pad.setPointerCapture(e.pointerId); } catch (err) {} setDir(e); });
  pad.addEventListener('pointermove', (e) => { if (e.pointerId === padId) setDir(e); });
  pad.addEventListener('pointerup', clearDir);
  pad.addEventListener('pointercancel', clearDir);

  const bindHold = (id, on, off) => {
    const el = $(id);
    const down = (e) => { e.preventDefault(); e.stopPropagation(); M.audio.resume(); on(); el.classList.add('pressed'); };
    const up = () => { off(); el.classList.remove('pressed'); };
    el.addEventListener('pointerdown', down);
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
    el.addEventListener('pointerleave', up);
  };
  bindHold('vb-lp', () => { press('lp'); }, () => { held.lp = false; });
  bindHold('vb-hp', () => { press('hp'); }, () => { held.hp = false; });
  bindHold('vb-grab', () => { press('grab'); }, () => { held.grab = false; });
  bindHold('vb-sp', () => { if (held.up) press('sp2'); else press('sp1'); }, () => { held.sp1 = held.sp2 = false; });
  bindHold('vb-su', () => { press('su'); }, () => { held.su = false; });
  $('vb-pause').addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); pause(); });
  document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
  document.addEventListener('gesturestart', (e) => e.preventDefault());
  vpad.addEventListener('contextmenu', (e) => e.preventDefault());
}

// ── 디버그 훅 (테스트 자동화용) ──
M._dbg = () => ({
  mode, diff: st ? st.diff : M.diff, phase: st ? st.phase : null,
  stage: st ? st.stage : null, round: st ? st.round : 0, wins: st ? st.wins.slice() : [0, 0],
  timer: st ? +st.timer.toFixed(2) : 0, segments: M.Render.stats.segments,
  p: st ? st.p.map((f) => ({ id: f.id, hp: f.hp, state: f.state, x: +f.x.toFixed(1), y: +f.y.toFixed(1), gauge: f.gauge, face: f.face, mv: f.mv ? f.mv.key : null })) : [],
  proj: st ? st.proj.length : 0, fx: M.Render.fx.length,
});
M._st = () => st;
M._ai = (on) => { M._aiOff = !on; };
M._worst = (on) => { worst = !!on; };
M._startEnding = () => { mode = 'ending'; endingT = 0; M.ui.hideAll(); };

// 설계 7절 최악 장면: 두 캐릭터 동시 공격 + 기탄 3 + 타격 효과 3 + 의성어 2 + 링 보조선
function keepWorstScene() {
  if (!st) return;
  st.timer = 60;
  for (const f of st.p) { f.hp = f.maxHp; }
  st.p[0].x = 420; st.p[1].x = 540;
  for (const f of st.p) {
    if (!f.mv) M.Logic.startMove(st, f, st.p[1 - f.side], f.side ? 'hp' : 'lp', []);
  }
  while (st.proj.length < 3) {
    const side = st.proj.length % 2;
    st.proj.push({ id: st.nextId++, owner: side, kind: side ? 'shuriken' : 'fireball', x: 200 + st.proj.length * 260, y: 150 + st.proj.length * 20, vx: 0, dmg: 0, band: 'mid', age: 0 });
  }
  const sparks = M.Render.fx.filter((e) => e.kind === 'spark').length;
  const texts = M.Render.fx.filter((e) => e.kind === 'text').length;
  for (let i = sparks; i < 3; i++) M.Render.fx.push({ kind: 'spark', x: 300 + i * 150, y: 300, t: 0, life: 0.5, ink: '#18181c', strong: true, seed: i + 1 });
  for (let i = texts; i < 2; i++) M.Render.fx.push({ kind: 'text', x: 360 + i * 240, y: 200, t: 0, life: 0.5, ink: '#d6282e', text: '쾅!', size: 46, rot: 0.1 });
}

// ── 메인 루프 ──
let last = performance.now();
const previewCv = $('title-preview');
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  const tsec = now / 1000;
  if (isTouch) {
    vpad.classList.toggle('on', mode === 'play');
    if (st) $('vb-su').classList.toggle('ready', st.p[0].gauge >= M.GAUGE_MAX);
  }
  $('rotate-hint').classList.toggle('hidden', !(isTouch && window.innerHeight > window.innerWidth));

  if (mode === 'title') {
    if (previewCv && previewCv.offsetParent) M.Render.drawPreview(previewCv, tsec);
    return;
  }
  if (mode === 'ending') {
    endingT += dt;
    M.Render.drawEnding(tsec, endingT);
    if (endingT > 4.5 && $('ending-screen').classList.contains('hidden')) M.ui.show('ending-screen');
    return;
  }
  if (!st) return;

  if (mode === 'play') {
    if (worst) keepWorstScene();
    const inp1 = M._aiOff ? {} : M.AI.think(ai, st, 1, dt);
    const inp0 = Object.assign({}, held);
    for (const k of Object.keys(tapped)) { inp0[k] = true; delete tapped[k]; }
    handleEvents(M.Logic.step(st, dt, [inp0, inp1]));
    if (st.phase === 'matchEnd') {
      resultT += dt;
      if (resultT > 1.4) {
        const lastStage = st.stage === M.LADDER.length - 1;
        if (st.winner === 0 && lastStage) { mode = 'ending'; endingT = 0; M.ui.hideAll(); }
        else { mode = 'result'; if (st.winner === 0) M.ui.showWin(st); else M.ui.showOver(st); }
      }
    }
  }
  M.Render.draw(st, tsec, mode === 'play' ? dt : 0);
}
requestAnimationFrame(frame);

}
</script>
