<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>모구맨 머슬</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#0c0a12;
    font-family:'Malgun Gothic','맑은 고딕',sans-serif; user-select:none;
    touch-action:none; overscroll-behavior:none;
    -webkit-user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  #app { position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  #stage-wrap { position:relative; }
  canvas { display:block; background:#000; }

  .screen { position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; z-index:10; }
  .hidden { display:none !important; }

  #hud { position:absolute; inset:0; pointer-events:none; z-index:5; }
  #hud-toast { position:absolute; top:30%; left:50%; transform:translateX(-50%);
    color:#fff; font-size:19px; font-weight:900; text-shadow:0 3px 6px rgba(0,0,0,.6);
    opacity:0; transition:opacity .3s; white-space:nowrap; }

  /* ── 타이틀 ── */
  #title-screen { background:linear-gradient(#2a1020 0%, #58182e 45%, #1a0e1c 100%); }
  #title-screen .logo { font-size:min(58px, 11vw); font-weight:900; color:#ffd83d; white-space:nowrap;
    text-shadow:0 5px 0 #8a2020, 0 9px 18px rgba(0,0,0,.55); letter-spacing:min(6px, 1.3vw); }
  #title-screen .sub { margin-top:6px; font-size:17px; color:#f0b0b8; font-weight:700; }
  #title-icon { width:100px; height:auto; margin:16px 0 4px; animation:flex 1.2s ease-in-out infinite;
    filter:drop-shadow(0 8px 10px rgba(0,0,0,.5)); }
  @keyframes flex { 0%,100%{transform:rotate(-6deg) scale(1)} 50%{transform:rotate(6deg) scale(1.08)} }
  #title-hi { margin-top:4px; color:#ffd83d; font-size:14px; font-weight:800; min-height:19px;
    text-shadow:0 1px 3px rgba(0,0,0,.5); }
  #title-hint { margin-top:12px; color:rgba(255,255,255,.9); font-size:13px; text-align:center;
    padding:0 14px; text-shadow:0 1px 3px rgba(0,0,0,.5); line-height:1.7; }

  .menu-buttons { display:flex; gap:12px; margin-top:18px; flex-wrap:wrap; justify-content:center; padding:0 10px; }
  .btn { pointer-events:auto; padding:12px 24px; font-size:16px; font-weight:800; color:#fff;
    background:#a8383a; border:3px solid rgba(255,255,255,.8); border-radius:12px; cursor:pointer;
    box-shadow:0 4px 8px rgba(0,0,0,.4); font-family:inherit; }
  .btn.primary { background:#3aa84f; }
  .btn.series { padding:9px 18px; font-size:13px; background:#6a2e4a; }
  .diff-row { gap:8px; margin-top:12px; }
  .diff-btn { padding:8px 14px; font-size:13px; background:#3d2a34; border-color:rgba(255,255,255,.35); }
  .diff-btn.selected { background:#3aa84f; border-color:#ffd83d; outline:2px solid rgba(255,216,61,.5); }
  .diff-btn.crazy.selected { background:#c8385a; }

  /* ── 승리 / 일시정지 / 게임오버 / 엔딩 ── */
  #win-screen { background:rgba(30,10,16,.88); z-index:20; }
  #win-screen .big { font-size:min(44px, 10vw); font-weight:900; color:#ffd83d; }
  #win-stars { font-size:44px; color:#ffd83d; letter-spacing:8px; margin:8px 0 2px; }
  #win-stats { color:#f5dce2; font-size:17px; line-height:1.8; text-align:center; }
  #pause-screen { background:rgba(0,0,0,.6); z-index:20; }
  #pause-screen .big, #over-screen .big, #ending-screen .big {
    font-size:min(42px, 10vw); font-weight:900; color:#fff; white-space:nowrap; }
  #over-screen { background:rgba(0,0,0,.85); z-index:20; }
  #over-screen .big { color:#ff5252; letter-spacing:5px; }
  #over-count { font-size:70px; font-weight:900; color:#fff; margin-top:8px; text-shadow:0 4px 10px rgba(0,0,0,.8); }
  #over-screen .hint { margin-top:10px; font-size:16px; color:#ffd83d; font-weight:700; padding:0 14px; text-align:center; }
  #ending-screen { background:linear-gradient(#3a1024 0%, #6a2a1a 55%, #1a0c14 100%); z-index:20; }
  #ending-screen .big { color:#ffd83d; }
  #ending-screen .msg { margin-top:14px; color:#f5e0d2; font-size:16px; line-height:1.8; text-align:center; padding:0 16px; }

  /* ── 터치 가상 패드 ── */
  #vpad { position:fixed; inset:0; pointer-events:none; z-index:8; display:none; }
  body.touch #vpad.on { display:block; }
  .vbtn { position:absolute; pointer-events:auto; width:66px; height:66px; border-radius:50%;
    background:rgba(255,255,255,.15); border:2px solid rgba(255,255,255,.5);
    color:rgba(255,255,255,.92); font-size:22px; font-weight:800;
    display:flex; align-items:center; justify-content:center;
    touch-action:none; user-select:none; text-shadow:0 2px 3px rgba(0,0,0,.5); }
  .vbtn.pressed { background:rgba(255,255,255,.38); border-color:#ffd83d; }
  #vbtn-left  { left:calc(14px + env(safe-area-inset-left)); bottom:calc(58px + env(safe-area-inset-bottom)); }
  #vbtn-right { left:calc(148px + env(safe-area-inset-left)); bottom:calc(58px + env(safe-area-inset-bottom)); }
  #vbtn-up    { left:calc(81px + env(safe-area-inset-left)); bottom:calc(112px + env(safe-area-inset-bottom)); }
  #vbtn-down  { left:calc(81px + env(safe-area-inset-left)); bottom:calc(12px + env(safe-area-inset-bottom)); }
  #vbtn-atk   { right:calc(14px + env(safe-area-inset-right)); bottom:calc(48px + env(safe-area-inset-bottom)); width:84px; height:84px; font-size:30px; }
  #vbtn-tag   { right:calc(104px + env(safe-area-inset-right)); bottom:calc(22px + env(safe-area-inset-bottom)); }
  #vbtn-pause { right:calc(12px + env(safe-area-inset-right)); top:calc(10px + env(safe-area-inset-top));
    width:44px; height:44px; font-size:17px; border-radius:12px; }
</style>
</head>
<body>
<div id="app">
  <div id="stage-wrap">
    <canvas id="game" width="480" height="270"></canvas>
    <div id="hud" class="hidden"><div id="hud-toast"></div></div>
  </div>

  <div id="title-screen" class="screen">
    <div class="logo">모구맨 머슬</div>
    <div class="sub">~ 근육 고양이 태그매치 ~</div>
    <img id="title-icon" alt="모구">
    <div id="title-hi"></div>
    <div class="menu-buttons">
      <button class="btn primary" id="btn-continue">이어하기</button>
      <button class="btn" id="btn-new">처음부터</button>
    </div>
    <div class="menu-buttons diff-row">
      <button class="btn diff-btn" data-diff="easy">이지</button>
      <button class="btn diff-btn" data-diff="normal">노말</button>
      <button class="btn diff-btn" data-diff="hard">하드</button>
      <button class="btn diff-btn crazy" data-diff="crazy">크레이지</button>
    </div>
    <div class="menu-buttons"><button class="btn series" id="btn-series">🏠 모구 게임 시리즈</button></div>
    <div id="title-hint">←→↑↓ 이동 · 로프에 밀면 반동 대시 · Space/Z 공격 (근접 = 던지기, 대시 중 = 라리아트!)<br>X = 코너 태그 (꼬꼬와 교대, 쉬면 회복) · ✨파워볼 = 필살 머슬 드라이버! (D 난이도)</div>
  </div>

  <div id="win-screen" class="screen hidden">
    <div class="big">🏆 승리!!</div>
    <div id="win-stars">★★★</div>
    <div id="win-stats"></div>
    <div class="menu-buttons">
      <button class="btn" id="btn-retry">다시 도전</button>
      <button class="btn" id="btn-win-title">타이틀로</button>
      <button class="btn primary" id="btn-next">다음 경기 →</button>
    </div>
  </div>

  <div id="pause-screen" class="screen hidden">
    <div class="big">일시정지</div>
    <div class="menu-buttons">
      <button class="btn primary" id="btn-resume">계속</button>
      <button class="btn" id="btn-restage">재시작</button>
      <button class="btn" id="btn-title">타이틀로</button>
    </div>
  </div>

  <div id="over-screen" class="screen hidden">
    <div class="big">CONTINUE?</div>
    <div id="over-count">10</div>
    <div class="hint">Enter 또는 화면 터치 = 재도전</div>
    <div class="menu-buttons"><button class="btn" id="btn-over-title">타이틀로</button></div>
  </div>

  <div id="ending-screen" class="screen hidden">
    <div class="big">🏆 챔피언 벨트 획득!!</div>
    <div class="msg">쥐 레슬러 10개 팀을 모두 격파했습니다!<br>모구 &amp; 꼬꼬, 태그팀 챔피언 등극! 🐱🐔💪</div>
    <div class="menu-buttons"><button class="btn primary" id="btn-end-title">타이틀로</button></div>
  </div>

  <div id="vpad">
    <div class="vbtn" id="vbtn-left">◀</div>
    <div class="vbtn" id="vbtn-right">▶</div>
    <div class="vbtn" id="vbtn-up">▲</div>
    <div class="vbtn" id="vbtn-down">▼</div>
    <div class="vbtn" id="vbtn-atk">👊</div>
    <div class="vbtn" id="vbtn-tag">🔄</div>
    <div class="vbtn" id="vbtn-pause">⏸</div>
  </div>
</div>

<script>window.MMS = { ASSETS: { mogu: "../game/assets/mogu-icon.png" } };</script>
<script src="src/rng.js"></script>
<script src="src/levels.js"></script>
<script src="src/logic.js"></script>
<script src="src/render.js"></script>
<script src="src/audio.js"></script>
<script src="src/ui.js"></script>
<script src="src/main.js"></script>
</body>
</html>
