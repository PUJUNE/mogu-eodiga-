<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>모구 혼자 레벨업</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#0c1018;
    font-family:'Malgun Gothic','맑은 고딕',sans-serif; user-select:none;
    touch-action:none; overscroll-behavior:none;
    -webkit-user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  #app { position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  #stage-wrap { position:relative; }
  canvas { display:block; background:#000; }

  .screen { position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; z-index:10; }
  .hidden { display:none !important; }

  #hud { position:absolute; inset:0; pointer-events:none; z-index:5; }
  #hud-toast { position:absolute; top:30%; left:50%; transform:translateX(-50%);
    color:#fff; font-size:19px; font-weight:900; text-shadow:0 3px 6px rgba(0,0,0,.6);
    opacity:0; transition:opacity .3s; white-space:nowrap; }

  /* ── 타이틀 (그림자 군주 보라 무드) ── */
  #title-screen { background:linear-gradient(#0e0a1e 0%, #38205c 55%, #14101e 100%); }
  #title-screen .logo { font-size:min(52px, 10vw); font-weight:900; color:#fff; white-space:nowrap;
    text-shadow:0 0 18px #b07dff, 0 5px 0 #38205c, 0 9px 18px rgba(0,0,0,.5); letter-spacing:min(5px, 1.1vw); }
  #title-screen .sub { margin-top:6px; font-size:17px; color:#c8b0f0; font-weight:700; }
  #title-icon { width:105px; height:auto; margin:16px 0 4px; animation:bob 1.5s ease-in-out infinite;
    filter:drop-shadow(0 0 14px rgba(176,125,255,.7)) drop-shadow(0 8px 10px rgba(0,0,0,.4)); }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-14px)} }
  #title-hi { margin-top:4px; color:#ffd83d; font-size:14px; font-weight:800; min-height:19px;
    text-shadow:0 1px 3px rgba(0,0,0,.5); }
  #title-hint { margin-top:12px; color:rgba(255,255,255,.92); font-size:13px; text-align:center;
    padding:0 14px; text-shadow:0 1px 3px rgba(0,0,0,.5); line-height:1.7; }

  .menu-buttons { display:flex; gap:12px; margin-top:18px; flex-wrap:wrap; justify-content:center; padding:0 10px; }
  .btn { pointer-events:auto; padding:12px 24px; font-size:16px; font-weight:800; color:#fff;
    background:#6a48c8; border:3px solid rgba(255,255,255,.8); border-radius:12px; cursor:pointer;
    box-shadow:0 4px 8px rgba(0,0,0,.4); font-family:inherit; }
  .btn.primary { background:#3aa84f; }
  .btn.series { padding:9px 18px; font-size:13px; background:#2e6da3; }

  /* ── 승리 / 일시정지 / 게임오버 / 엔딩 ── */
  #win-screen { background:rgba(14,8,26,.88); z-index:20; }
  #win-screen .big { font-size:min(44px, 10vw); font-weight:900; color:#ffd83d; }
  #win-stars { font-size:44px; color:#ffd83d; letter-spacing:8px; margin:8px 0 2px; }
  #win-stats { color:#e2dcf5; font-size:17px; line-height:1.8; text-align:center; }
  #pause-screen { background:rgba(0,0,0,.6); z-index:20; }
  #pause-screen .big, #over-screen .big, #ending-screen .big {
    font-size:min(42px, 10vw); font-weight:900; color:#fff; white-space:nowrap; }
  #over-screen { background:rgba(0,0,0,.85); z-index:20; }
  #over-screen .big { color:#ff5252; letter-spacing:5px; }
  #over-count { font-size:70px; font-weight:900; color:#fff; margin-top:8px; text-shadow:0 4px 10px rgba(0,0,0,.8); }
  #over-screen .hint { margin-top:10px; font-size:16px; color:#ffd83d; font-weight:700; padding:0 14px; text-align:center; }
  #ending-screen { background:linear-gradient(#0e0a1e 0%, #38205c 50%, #101828 100%); z-index:20; }
  #ending-screen .big { color:#b07dff; text-shadow:0 0 16px rgba(176,125,255,.8); }
  #ending-screen .msg { margin-top:14px; color:#e2dcf5; font-size:16px; line-height:1.8; text-align:center; padding:0 16px; }

  /* ── 터치 가상 패드 ── */
  #vpad { position:fixed; inset:0; pointer-events:none; z-index:8; display:none; }
  body.touch #vpad.on { display:block; }
  .vbtn { position:absolute; pointer-events:auto; width:64px; height:64px; border-radius:50%;
    background:rgba(255,255,255,.15); border:2px solid rgba(255,255,255,.5);
    color:rgba(255,255,255,.92); font-size:22px; font-weight:800;
    display:flex; align-items:center; justify-content:center;
    touch-action:none; user-select:none; text-shadow:0 2px 3px rgba(0,0,0,.5); }
  .vbtn.pressed { background:rgba(176,125,255,.4); border-color:#b07dff; }
  #vbtn-left  { left:calc(12px + env(safe-area-inset-left)); bottom:calc(52px + env(safe-area-inset-bottom)); }
  #vbtn-right { left:calc(148px + env(safe-area-inset-left)); bottom:calc(52px + env(safe-area-inset-bottom)); }
  #vbtn-up    { left:calc(80px + env(safe-area-inset-left)); bottom:calc(108px + env(safe-area-inset-bottom)); }
  #vbtn-down  { left:calc(80px + env(safe-area-inset-left)); bottom:calc(12px + env(safe-area-inset-bottom)); }
  #vbtn-jump  { right:calc(14px + env(safe-area-inset-right)); bottom:calc(96px + env(safe-area-inset-bottom)); }
  #vbtn-atk   { right:calc(88px + env(safe-area-inset-right)); bottom:calc(24px + env(safe-area-inset-bottom)); width:76px; height:76px; font-size:26px; }
  .vbtn.skill { width:46px; height:46px; font-size:16px; border-radius:12px;
    background:rgba(106,72,200,.28); border-color:rgba(176,125,255,.65); }
  #vbtn-q { right:calc(178px + env(safe-area-inset-right)); bottom:calc(130px + env(safe-area-inset-bottom)); }
  #vbtn-w { right:calc(126px + env(safe-area-inset-right)); bottom:calc(154px + env(safe-area-inset-bottom)); }
  #vbtn-e { right:calc(74px + env(safe-area-inset-right)); bottom:calc(168px + env(safe-area-inset-bottom)); }
  #vbtn-r { right:calc(20px + env(safe-area-inset-right)); bottom:calc(172px + env(safe-area-inset-bottom)); }
  #vbtn-pause { right:calc(12px + env(safe-area-inset-right)); top:calc(10px + env(safe-area-inset-top));
    width:44px; height:44px; font-size:17px; border-radius:12px; }
</style>
</head>
<body>
<div id="app">
  <div id="stage-wrap">
    <canvas id="game" width="480" height="300"></canvas>
    <div id="hud" class="hidden"><div id="hud-toast"></div></div>
  </div>

  <div id="title-screen" class="screen">
    <div class="logo">모구 혼자 레벨업</div>
    <div class="sub">~ 되살아난 E급 헌터의 성장기 ~</div>
    <img id="title-icon" alt="모구">
    <div id="title-hi"></div>
    <div class="menu-buttons">
      <button class="btn primary" id="btn-continue">이어하기</button>
      <button class="btn" id="btn-new">처음부터</button>
    </div>
    <div class="menu-buttons"><button class="btn series" id="btn-series">🏠 모구 게임 시리즈</button></div>
    <div id="title-hint">←→↑↓ 이동 · Space/Z 베기 · X 점프 · Q절단 W은신 E그림자추출 R권능 (레벨업 해금!)<br>신전에서 되살아난 모구 — 레벨을 올려 악마왕 바란까지 토벌하라! 5개 미션</div>
  </div>

  <div id="win-screen" class="screen hidden">
    <div class="big">⚔️ 미션 클리어!!</div>
    <div id="win-stars">★★★</div>
    <div id="win-stats"></div>
    <div class="menu-buttons">
      <button class="btn" id="btn-retry">다시 도전</button>
      <button class="btn" id="btn-win-title">타이틀로</button>
      <button class="btn primary" id="btn-next">다음 미션 →</button>
    </div>
  </div>

  <div id="pause-screen" class="screen hidden">
    <div class="big">일시정지</div>
    <div class="menu-buttons">
      <button class="btn primary" id="btn-resume">계속</button>
      <button class="btn" id="btn-restage">재시작</button>
      <button class="btn" id="btn-title">타이틀로</button>
    </div>
  </div>

  <div id="over-screen" class="screen hidden">
    <div class="big">CONTINUE?</div>
    <div id="over-count">10</div>
    <div class="hint">Enter 또는 화면 터치 = 이 구간부터 계속 (레벨 유지!)</div>
    <div class="menu-buttons"><button class="btn" id="btn-over-title">타이틀로</button></div>
  </div>

  <div id="ending-screen" class="screen hidden">
    <div class="big">👑 악마왕 바란 격파!!</div>
    <div class="msg">악마성 최상층에 정적이 내려앉았다.<br>그러나 모구의 레벨업은 끝나지 않는다… 💜🐱</div>
    <div class="menu-buttons"><button class="btn primary" id="btn-end-title">타이틀로</button></div>
  </div>

  <div id="vpad">
    <div class="vbtn" id="vbtn-left">◀</div>
    <div class="vbtn" id="vbtn-right">▶</div>
    <div class="vbtn" id="vbtn-up">▲</div>
    <div class="vbtn" id="vbtn-down">▼</div>
    <div class="vbtn" id="vbtn-atk">🗡</div>
    <div class="vbtn" id="vbtn-jump">⬆</div>
    <div class="vbtn skill" id="vbtn-q">Q</div>
    <div class="vbtn skill" id="vbtn-w">W</div>
    <div class="vbtn skill" id="vbtn-e">E</div>
    <div class="vbtn skill" id="vbtn-r">R</div>
    <div class="vbtn" id="vbtn-pause">⏸</div>
  </div>
</div>

// rng.js — 시드 기반 결정적 난수 (시리즈 공통 계열)
const M = window.MSL;

M.mulberry32 = function (seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
};

M.makeRng = function (seed) {
  const f = M.mulberry32(seed);
  return {
    next: f,
    range: (a, b) => a + f() * (b - a),
    int: (a, b) => Math.floor(a + f() * (b - a + 1)),
    pick: (arr) => arr[Math.floor(f() * arr.length)],
    chance: (p) => f() < p,
  };
};

  iceknight:{ name: '빙갑 기사',   look: 'ice',   hp: 76, spd: 30, dmg: 14, atkCd: 1.7,  w: 21, body: '#4a6a9a', ear: '#7898c8', score: 350 },
  demon:    { name: '악마 병졸',   look: 'demon', hp: 42, spd: 52, dmg: 10, atkCd: 1.15, w: 16, body: '#8a3a48', ear: '#b86a78', score: 180 },
  imp:      { name: '화염 임프',   look: 'demon', hp: 28, spd: 56, dmg: 11, atkCd: 1.8,  w: 13, body: '#c85a30', ear: '#e89860', score: 280, ranged: true, shot: '#ff9a3d' },
  hdemon:   { name: '중갑 악마',   look: 'demon', hp: 84, spd: 32, dmg: 15, atkCd: 1.65, w: 22, body: '#5a2a3a', ear: '#8a5a6a', score: 380 },
  dblade:   { name: '악마 검병',   look: 'demon', hp: 50, spd: 56, dmg: 12, atkCd: 1.05, w: 16, body: '#6a2a5a', ear: '#9a5a8a', score: 220 },
  fmage:    { name: '화염 마귀',   look: 'demon', hp: 32, spd: 52, dmg: 12, atkCd: 1.7,  w: 14, body: '#a04028', ear: '#d07858', score: 320, ranged: true, shot: '#ff6a3d' },

M.BOSSES = {

  2: { name: '독왕 카사카',       look: 'snake', base: 'ranged', hp: 170, spd: 66, dmg: 12, atkCd: 1.15, w: 25, body: '#3a7a2a', ear: '#68a858', shot: '#7de08a' },
  3: { name: '얼음 군주 바루카',   look: 'ice',   base: 'melee',  hp: 210, spd: 68, dmg: 14, atkCd: 0.85, w: 27, body: '#3a5a9a', ear: '#6a90c8' },
  4: { name: '지옥 파수견 케르베로스', look: 'demon', base: 'melee', hp: 240, spd: 74, dmg: 15, atkCd: 0.8, w: 28, body: '#6a1a20', ear: '#a04a50' },
  5: { name: '악마왕 바란',       look: 'demon', base: 'baran',  hp: 320, spd: 62, dmg: 17, atkCd: 1.0,  w: 30, body: '#38104a', ear: '#6a3a8a', shot: '#b07dff' },
};

M.makeStage = function (mission) {
  const m = Math.max(1, Math.min(5, mission));
  const rng = M.makeRng(m * 7919 + 1201);
  const pool = m === 1 ? ['scorp', 'scorp', 'sting', 'rockscorp']
    : m === 2 ? ['snake', 'snake', 'naga', 'lizard']
    : m === 3 ? ['icesold', 'icesold', 'icicle', 'iceknight']
    : m === 4 ? ['demon', 'imp', 'hdemon', 'demon']
    : ['dblade', 'fmage', 'dknight', 'dblade'];
  const hpMul = 1 + (m - 1) * 0.15;

  const sections = [];
  for (let s = 0; s < 3; s++) {
    const waves = [];
    for (let w = 0; w < 2; w++) {
      const n = Math.min(5, 2 + Math.floor((m - 1) * 0.7) + w);
      const wave = [];
      for (let i = 0; i < n; i++) {
        wave.push({
          type: pool[rng.int(0, pool.length - 1)],
          side: rng.chance(0.6) ? 1 : -1,
          z: rng.range(M.Z_MIN + 8, M.Z_MAX - 8),
          hpMul,
        });
      }
      waves.push(wave);
    }
    sections.push({ x0: s * 420, x1: s * 420 + 420, waves });
  }
  sections.push({ x0: 3 * 420, x1: 3 * 420 + 420, waves: [[{ type: pool[0], side: 1, z: 30, hpMul }], []], boss: M.BOSSES[m] });

  return {
    mission: m, theme: M.THEMES[m],
    sections, length: 4 * 420,
    dropP: 0.24,                                    // 물약 드롭 확률 (HP/MP 반반)
  };
};

}
/* ── logic.js ── */
{
// logic.js — 벨트스크롤 전투 + 레벨업·MP·QWER 스킬·그림자 병사 (DOM 무의존)
const M = window.MSL;

const PSPD = 96, ZSPD = 64;
const JUMP_V = 250, GRAV = 900;
const HIT_X0 = 4, HIT_X1 = 44, HIT_Z = 16;
const SHOT_V = 175;
const COMBO_WIN = 0.9;

// 스킬 정의: 언락 레벨 / MP / 쿨다운
const SKILLS = {
  q: { name: '절단',          lv: 2, mp: 10, cd: 1.2 },
  w: { name: '은신',          lv: 4, mp: 12, cd: 6.0 },
  e: { name: '그림자 추출',   lv: 6, mp: 15, cd: 1.0 },
  r: { name: '지배자의 권능', lv: 9, mp: 25, cd: 3.0 },
};
const RULER_R = 90, RULER_DMG = 24;
const SHADOW_MAX = 3, EXTRACT_R = 80;

function mkFighter(kind, opt) {
  return Object.assign({
    kind, x: 0, z: 40, jy: 0, vy: 0, face: 1,
    hp: 100, maxHp: 100, spd: PSPD, dmg: 8, w: 16,
    state: 'idle', stT: 0, combo: 0, comboT: 99, atkCd: 0, hitDone: false,
    iv: 0, reviveT: 0,
  }, opt);
}

M.Logic = {
  LV_MAX: 12,
  SKILLS,
  SHADOW_MAX,
  expNeed(lv) { return 50 + (lv - 1) * 30; },
  atkMul(lv) { return 1 + 0.05 * (lv - 1); },
  maxMp(lv) { return 40 + 4 * (lv - 1); },

  _gainExp(st, n, ev) {
    st.exp += n;
    if (st.lv >= this.LV_MAX) return;
    st.expInto += n;
    while (st.lv < this.LV_MAX && st.expInto >= this.expNeed(st.lv)) {
      st.expInto -= this.expNeed(st.lv);
      st.lv++;
      st.p.maxHp = 100 + 6 * (st.lv - 1);
      st.p.hp = Math.min(st.p.maxHp, st.p.hp + 20);
      st.mp = Math.min(this.maxMp(st.lv), st.mp + 15);
      if (st.b) {
        st.b.maxHp = 80 + 5 * (st.lv - 1);
        if (st.b.hp > 0) st.b.hp = Math.min(st.b.maxHp, st.b.hp + 12);
      }
      const unlocked = Object.keys(SKILLS).find((k) => SKILLS[k].lv === st.lv);
      ev.push({ type: 'levelup', lv: st.lv, skill: unlocked ? SKILLS[unlocked].name : null, key: unlocked || null });
    }
  },

  // gear: { fang: 공격+2, armor: 받는 피해 -2 }
  create(mission, exp0, gear) {
    const stage = M.makeStage(mission);
    const st = {
      stage, mission, phase: 'play', t: 0, clearT: 0,
      rng: M.makeRng(mission * 733 + 91),
      gear: Object.assign({ fang: false, armor: false }, gear),
      p: mkFighter('p', { x: 60, z: 40, hp: 100, maxHp: 100, dmg: 8 }),
      b: mission >= 2 ? mkFighter('b', { x: 30, z: 55, hp: 80, maxHp: 80, dmg: 7, spd: 88 }) : null,
      shadows: [],
      enemies: [], items: [], shots: [], bolts: [],
      secIdx: 0, waveIdx: -1, go: false, bossSpawned: false,
      score: 0, deaths: 0, stars: 0,
      exp: 0, lv: 1, expInto: 0,
      mp: 40, stealth: 0,
      skillCd: { q: 0, w: 0, e: 0, r: 0 },
    };
    if (st.gear.fang) st.p.dmg += 2;
    if (exp0 > 0) {
      this._gainExp(st, exp0, []);
      st.p.hp = st.p.maxHp;
      if (st.b) st.b.hp = st.b.maxHp;
      st.mp = this.maxMp(st.lv);
    }
    this._startWave(st, 0, 0);
    return st;
  },

  sec(st) { return st.stage.sections[st.secIdx]; },
  allies(st) { return [st.p, ...(st.b ? [st.b] : []), ...st.shadows]; },
  skillReady(st, k) {
    return st.lv >= SKILLS[k].lv && st.skillCd[k] <= 0 && st.mp >= SKILLS[k].mp;
  },

  _startWave(st, secIdx, waveIdx) {
    const sec = st.stage.sections[secIdx];
    const wave = sec.waves[waveIdx];
    if (!wave || wave.length === 0) return false;
    for (const w of wave) {
      const E = M.ETYPES[w.type];
      st.enemies.push(mkFighter('e', {
        type: w.type, name: E.name, look: E.look, ranged: !!E.ranged, shot: E.shot,
        x: w.side > 0 ? sec.x1 + 30 : Math.max(10, sec.x0 - 30),
        z: w.z, hp: Math.round(E.hp * w.hpMul), maxHp: Math.round(E.hp * w.hpMul),
        spd: E.spd, dmg: E.dmg, w: E.w, baseAtkCd: E.atkCd, score: E.score,
      }));
    }
    st.waveIdx = waveIdx;
    return true;
  },

  _spawnBoss(st) {
    const B = this.sec(st).boss;
    st.enemies.push(mkFighter('e', {
      type: 'boss', name: B.name, look: B.look, boss: true, base: B.base, shot: B.shot,
      x: this.sec(st).x1 - 60, z: 40,
      hp: B.hp, maxHp: B.hp, spd: B.spd, dmg: B.dmg, w: B.w, baseAtkCd: B.atkCd, score: 1000,
      boltCd: 2.2, dashCd: 3,
    }));
    st.bossSpawned = true;
  },

  alive(f) { return !!f && f.state !== 'dead' && f.hp > 0; },

  _dmgTaken(st, f, dmg) {
    // 파수견의 갑주: 아군이 받는 피해 -2 (최소 1)
    if ((f.kind === 'p' || f.kind === 'b') && st.gear.armor) return Math.max(1, dmg - 2);
    return dmg;
  },

  _applyHit(st, att, targets, ev, opts) {
    let hit = false;
    for (const t of targets) {
      if (!this.alive(t) || t.state === 'down' || t.iv > 0) continue;
      if (t.kind === 'p' && st.stealth > 0) continue;          // 은신 중 피격 없음
      const dx = (t.x - att.x) * att.face;
      const reach = (opts.reach || HIT_X1) + (att.w - 16);
      if (dx < HIT_X0 || dx > reach) continue;
      if (Math.abs(t.z - att.z) > HIT_Z) continue;
      if (Math.abs(t.jy - att.jy) > 44) continue;
      t.hp -= this._dmgTaken(st, t, opts.dmg);
      hit = true;
      ev.push({ type: 'hit', x: t.x, z: t.z, kd: !!opts.kd });
      if (t.hp <= 0 || opts.kd) {
        t.state = 'down'; t.stT = 0; t.iv = 0.9;
        t.x += att.face * 22;
        if (opts.kd) ev.push({ type: 'kd' });
      } else {
        t.state = 'hurt'; t.stT = 0;
        t.x += att.face * 7;
      }
    }
    return hit;
  },

  _updateFighter(st, f, dt) {
    f.stT += dt;
    if (f.atkCd > 0) f.atkCd -= dt;
    if (f.iv > 0) f.iv -= dt;
    f.comboT += dt;
    if (f.jy > 0 || f.vy > 0) {
      f.jy += f.vy * dt;
      f.vy -= GRAV * dt;
      if (f.jy <= 0) { f.jy = 0; f.vy = 0; }
    }
    if (f.state === 'atk' && f.stT > 0.28) f.state = 'idle';
    if (f.state === 'hurt' && f.stT > 0.32) f.state = 'idle';
    if (f.state === 'down' && f.stT > 1.0) {
      if (f.hp <= 0) f.state = 'dead';
      else { f.state = 'idle'; f.iv = 0.8; }
    }
  },

  _attack(st, f) {
    if (f.state === 'atk' || f.state === 'hurt' || f.state === 'down' || f.state === 'dead') return false;
    if (f.atkCd > 0) return false;
    if (f.comboT > COMBO_WIN) f.combo = 0;
    f.state = 'atk'; f.stT = 0; f.hitDone = false;
    f.combo = f.jy > 0 ? 0 : (f.combo % 3) + 1;
    f.comboT = 0;
    f.atkCd = f.jy > 0 ? 0.5 : 0.3;
    return true;
  },

  _atkFrame(st, f, targets, ev) {
    if (f.state !== 'atk' || f.hitDone || f.stT < 0.1) return;
    f.hitDone = true;
    const jump = f.jy > 0;
    const third = f.combo === 3;
    const isAlly = f.kind === 'p' || f.kind === 'b' || f.kind === 's';
    const lvMul = isAlly ? this.atkMul(st.lv) : 1;
    let dmg = Math.round((jump ? 12 : third ? 13 : f.dmg) * lvMul);
    let kd = jump || third;
    // 은신 기습: 은신 중 첫 공격 2배 + 다운
    if (f.kind === 'p' && st.stealth > 0) {
      dmg *= 2; kd = true;
      st.stealth = 0;
      ev.push({ type: 'ambush' });
    }
    this._applyHit(st, f, targets, ev, { dmg, kd });
  },

  // 동료·그림자 공용 AI (가장 가까운 적 추적·공격, 없으면 anchor 곁으로)
  _allyAI(st, f, dt, anchorX, anchorZ, ev) {
    const foes = st.enemies.filter((e) => this.alive(e));
    let tgt = null, bd = 1e9;
    for (const e of foes) {
      const d = Math.abs(e.x - f.x) + Math.abs(e.z - f.z) * 2;
      if (d < bd) { bd = d; tgt = e; }
    }
    if (tgt) {
      const dx = tgt.x - f.x, dz = tgt.z - f.z;
      f.face = dx >= 0 ? 1 : -1;
      if (Math.abs(dx) > 30 || Math.abs(dz) > 8) {
        if (f.state !== 'atk') {
          f.state = 'walk';
          f.x += Math.sign(dx) * Math.min(f.spd * dt, Math.max(0, Math.abs(dx) - 28));
          f.z = Math.max(M.Z_MIN, Math.min(M.Z_MAX, f.z + Math.sign(dz) * Math.min(ZSPD * dt, Math.abs(dz))));
        }
      } else if (this._attack(st, f)) ev.push({ type: 'swing', ally: f.kind });
    } else {
      if (Math.abs(f.x - anchorX) > 8) { f.state = 'walk'; f.x += Math.sign(anchorX - f.x) * f.spd * 0.8 * dt; }
      else f.state = 'idle';
      f.z += Math.sign(anchorZ - f.z) * Math.min(ZSPD * dt, Math.abs(anchorZ - f.z));
    }
    f.x = Math.max(14, Math.min(st.stage.length - 14, f.x));
  },

  step(st, dt, input) {
    const ev = [];
    if (st.phase !== 'play') { st.clearT += dt; return ev; }
    st.t += dt;
    const sec = this.sec(st);
    const p = st.p, b = st.b;

    // MP 자연 회복 + 쿨다운·은신 타이머
    st.mp = Math.min(this.maxMp(st.lv), st.mp + 2 * dt);
    for (const k of ['q', 'w', 'e', 'r']) if (st.skillCd[k] > 0) st.skillCd[k] -= dt;
    if (st.stealth > 0) st.stealth -= dt;

    // ── 플레이어 ──
    this._updateFighter(st, p, dt);
    if (this.alive(p) && p.state !== 'hurt' && p.state !== 'down') {
      let mx = 0, mz = 0;
      if (input.left) { mx = -1; p.face = -1; }
      if (input.right) { mx = 1; p.face = 1; }
      if (input.up) mz = -1;
      if (input.down) mz = 1;
      if (p.state !== 'atk' && (mx || mz)) {
        p.state = p.jy > 0 ? p.state : 'walk';
        p.x += mx * PSPD * dt;
        p.z = Math.max(M.Z_MIN, Math.min(M.Z_MAX, p.z + mz * ZSPD * dt));
      } else if (p.state === 'walk') p.state = 'idle';
      const maxX = st.go || st.secIdx >= 3 ? st.stage.length - 14 : sec.x1 - 20;
      p.x = Math.max(14, Math.min(maxX, p.x));
      if (input.jump && p.jy === 0) { p.vy = JUMP_V; ev.push({ type: 'jump' }); }
      if (input.atk && this._attack(st, p)) ev.push({ type: 'swing', combo: p.combo, air: p.jy > 0 });

      // ── QWER 스킬 ──
      if (input.q && this.skillReady(st, 'q') && p.jy === 0 && p.state !== 'atk') {
        st.mp -= SKILLS.q.mp; st.skillCd.q = SKILLS.q.cd;
        p.state = 'atk'; p.stT = 0; p.hitDone = true; p.comboT = 99;
        const dmg = Math.round(p.dmg * 2.5 * this.atkMul(st.lv) * (st.stealth > 0 ? 2 : 1));
        if (st.stealth > 0) { st.stealth = 0; ev.push({ type: 'ambush' }); }
        this._applyHit(st, p, st.enemies, ev, { dmg, kd: true, reach: HIT_X1 + 12 });
        ev.push({ type: 'slash', x: p.x, z: p.z, face: p.face });
      }
      if (input.w && this.skillReady(st, 'w') && st.stealth <= 0) {
        st.mp -= SKILLS.w.mp; st.skillCd.w = SKILLS.w.cd;
        st.stealth = 3.0;
        ev.push({ type: 'stealth' });
      }
      if (input.e && this.skillReady(st, 'e')) {
        // 근처 시체(비보스)를 그림자 병사로
        let corpse = null, bd = 1e9;
        for (const e2 of st.enemies) {
          if (e2.state !== 'dead' || e2.boss || e2.extracted) continue;
          const d = Math.abs(e2.x - p.x) + Math.abs(e2.z - p.z) * 2;
          if (d < EXTRACT_R && d < bd) { bd = d; corpse = e2; }
        }
        if (!corpse) {
          ev.push({ type: 'extractfail', reason: 'nocorpse' });
        } else if (st.shadows.length >= SHADOW_MAX) {
          ev.push({ type: 'extractfail', reason: 'full' });
        } else {
          st.mp -= SKILLS.e.mp; st.skillCd.e = SKILLS.e.cd;
          corpse.extracted = true; corpse.stT = 99;      // 시체 소멸
          const E = M.ETYPES[corpse.type];
          st.shadows.push(mkFighter('s', {
            type: corpse.type, look: corpse.look, name: '그림자 ' + corpse.name,
            x: corpse.x, z: corpse.z,
            hp: Math.round(corpse.maxHp * 0.7), maxHp: Math.round(corpse.maxHp * 0.7),
            spd: E.spd + 10, dmg: Math.max(5, Math.round(E.dmg * 0.7)), w: E.w,
            iv: 0.8,
          }));
          ev.push({ type: 'extract', x: corpse.x, z: corpse.z, n: st.shadows.length });
        }
      }
      if (input.r && this.skillReady(st, 'r') && p.jy === 0 && p.state !== 'atk') {
        st.mp -= SKILLS.r.mp; st.skillCd.r = SKILLS.r.cd;
        p.iv = Math.max(p.iv, 0.8);
        p.state = 'atk'; p.stT = 0; p.hitDone = true; p.comboT = 99;
        let hitN = 0;
        for (const e2 of st.enemies) {
          if (!this.alive(e2) || e2.state === 'down' || e2.state === 'dead') continue;
          if (Math.abs(e2.x - p.x) < RULER_R && Math.abs(e2.z - p.z) < 30) {
            e2.hp -= Math.round(RULER_DMG * this.atkMul(st.lv));
            e2.state = 'down'; e2.stT = 0; e2.iv = 0.9;
            e2.x += Math.sign(e2.x - p.x || 1) * 30;
            hitN++;
          }
        }
        ev.push({ type: 'ruler', n: hitN, x: p.x, z: p.z });
      }
    }
    this._atkFrame(st, p, st.enemies, ev);

    // ── 동료 꼬꼬 (M2+) ──
    if (b) {
      this._updateFighter(st, b, dt);
      if (b.state === 'dead' || (b.state === 'down' && b.hp <= 0)) {
        b.reviveT += dt;
        if (b.reviveT > 6) {
          b.hp = Math.round(b.maxHp * 0.6); b.state = 'idle'; b.iv = 1.5; b.reviveT = 0;
          b.x = p.x - 26; b.z = Math.min(M.Z_MAX, p.z + 12);
          ev.push({ type: 'buddyup' });
        }
      } else if (this.alive(b) && b.state !== 'hurt' && b.state !== 'down') {
        this._allyAI(st, b, dt, p.x - 30, Math.min(M.Z_MAX, p.z + 10), ev);
      }
      this._atkFrame(st, b, st.enemies, ev);
    }

    // ── 그림자 병사 ──
    for (const s of st.shadows) {
      this._updateFighter(st, s, dt);
      if (this.alive(s) && s.state !== 'hurt' && s.state !== 'down') {
        this._allyAI(st, s, dt, p.x + 26, Math.max(M.Z_MIN, p.z - 10), ev);
      }
      this._atkFrame(st, s, st.enemies, ev);
    }
    const nShadow = st.shadows.length;
    st.shadows = st.shadows.filter((s) => !(s.state === 'dead' && s.stT > 1.2));
    if (st.shadows.length < nShadow) ev.push({ type: 'shadowdown' });

    // ── 악당 ──
    for (const e of st.enemies) {
      this._updateFighter(st, e, dt);
      if (!this.alive(e) || e.state === 'hurt' || e.state === 'down') continue;
      // 은신 중 플레이어는 타겟 제외
      const tgts = this.allies(st).filter((f) => this.alive(f) && f.state !== 'down' && !(f.kind === 'p' && st.stealth > 0));
      if (tgts.length === 0) { e.state = 'idle'; continue; }

      for (const f of tgts) {
        const d = Math.abs(f.x - e.x) + Math.abs(f.z - e.z) * 2;
        if (d < bd) { bd = d; tgt = f; }
      }
      const dx = tgt.x - e.x, dz = tgt.z - e.z;
      e.face = dx >= 0 ? 1 : -1;

        const ph2 = e.hp < e.maxHp * 0.5;
        const spd = e.spd * (ph2 ? 1.3 : 1);
        e.boltCd -= dt * (ph2 ? 1.5 : 1);
        e.dashCd -= dt;
        const adx = Math.abs(dx);
        if (e.dashing) {
          e.x += e.face * spd * 2.6 * dt;
          e.z = Math.max(M.Z_MIN, Math.min(M.Z_MAX, e.z + Math.sign(dz) * ZSPD * dt));
          if (adx < 34) {
            e.dashing = false;
            if (e.atkCd <= 0 && e.state !== 'atk') { e.state = 'atk'; e.stT = 0; e.hitDone = false; e.atkCd = e.baseAtkCd * (ph2 ? 0.6 : 1); ev.push({ type: 'eswing' }); }
          }
        } else if (e.boltCd <= 0 && adx > 60) {
          e.boltCd = ph2 ? 2.2 : 3.4;
          st.bolts.push({ x: tgt.x, z: tgt.z, t: 0.6 });
          ev.push({ type: 'boltwarn', x: tgt.x, z: tgt.z });
        } else if (e.dashCd <= 0 && adx > 90) {
          e.dashCd = ph2 ? 2.6 : 4;
          e.dashing = true;
          ev.push({ type: 'bossdash' });
        } else if (adx > 120) {
          if (e.state !== 'atk') { e.state = 'walk'; e.x += Math.sign(dx) * spd * dt; }
        } else if (adx < 40 && Math.abs(dz) < 10) {
          if (e.atkCd <= 0 && e.state !== 'atk') { e.state = 'atk'; e.stT = 0; e.hitDone = false; e.atkCd = e.baseAtkCd * (ph2 ? 0.6 : 1); ev.push({ type: 'eswing' }); }
        } else if (e.state !== 'atk') {
          e.state = 'walk';
          e.z = Math.max(M.Z_MIN, Math.min(M.Z_MAX, e.z + Math.sign(dz) * spd * 0.7 * dt));
          e.x += Math.sign(dx) * spd * 0.4 * dt;
        }
      } else if (e.ranged || (e.boss && e.base === 'ranged')) {
        // 원거리: 거리 유지 + 투사체
        const adx = Math.abs(dx);
        if (e.state !== 'atk') {
          if (adx < 100) { e.state = 'walk'; e.x -= Math.sign(dx) * e.spd * dt; }
          else if (adx > 180) { e.state = 'walk'; e.x += Math.sign(dx) * e.spd * dt; }
          else if (Math.abs(dz) > 5) { e.state = 'walk'; e.z = Math.max(M.Z_MIN, Math.min(M.Z_MAX, e.z + Math.sign(dz) * e.spd * 0.7 * dt)); }
          else e.state = 'idle';
        }
        if (e.atkCd <= 0 && Math.abs(dz) < 10 && adx >= 60) {
          e.atkCd = e.baseAtkCd;
          e.state = 'atk'; e.stT = 0; e.hitDone = true;
          st.shots.push({ x: e.x + e.face * 14, z: e.z, vx: e.face * SHOT_V, dmg: e.dmg, ttl: 3, color: e.shot || '#b8e04a' });
          ev.push({ type: 'shot' });
        }
      } else if (Math.abs(dx) > 32 || Math.abs(dz) > 9) {
        if (e.state !== 'atk') {
          e.state = 'walk';
          e.x += Math.sign(dx) * Math.min(e.spd * dt, Math.max(0, Math.abs(dx) - 30));
          e.z = Math.max(M.Z_MIN, Math.min(M.Z_MAX, e.z + Math.sign(dz) * Math.min(e.spd * 0.7 * dt, Math.abs(dz))));
        }
      } else if (e.atkCd <= 0 && e.state !== 'atk') {

        e.atkCd = e.baseAtkCd;

    // 사망 정리 + 경험치·드롭
    for (const e of st.enemies) {
      if (e.state === 'dead' && !e.counted) {

        st.score += e.score || 100;
        ev.push({ type: 'edown', name: e.name, score: e.score || 100 });
        this._gainExp(st, Math.round((e.score || 100) / 10), ev);
        if (st.rng.chance(st.stage.dropP)) {
          st.items.push({ x: e.x, z: e.z, ttl: 10, kind: st.rng.chance(0.5) ? 'hp' : 'mp' });
          ev.push({ type: 'drop' });
        }
      }
    }
    st.enemies = st.enemies.filter((e) => !(e.state === 'dead' && e.stT > 1.6));

    // 플레이어 사망 → 컨티뉴
    if (p.hp <= 0 && (p.state === 'dead' || (p.state === 'down' && p.stT > 1.0)) && st.phase === 'play') {
      st.deaths++;
      st.phase = 'over'; st.clearT = 0;
      ev.push({ type: 'over' });
      return ev;
    }
    if (b) {
      if (b.hp <= 0 && !b.downCounted) { b.downCounted = true; ev.push({ type: 'buddydown' }); }
      if (b.hp > 0) b.downCounted = false;
    }

    // ── 투사체 (독침·고드름·화염구) ──
    for (const sh of st.shots) {
      sh.ttl -= dt;
      sh.x += sh.vx * dt;
      for (const f of this.allies(st)) {
        if (!this.alive(f) || f.iv > 0 || f.state === 'down' || f.jy > 24) continue;
        if (f.kind === 'p' && st.stealth > 0) continue;
        if (Math.abs(f.x - sh.x) < 12 && Math.abs(f.z - sh.z) < 9) {
          sh.ttl = 0;
          f.hp -= this._dmgTaken(st, f, sh.dmg);
          f.state = 'hurt'; f.stT = 0; f.iv = 0.5;
          ev.push({ type: 'shothit', who: f.kind });
          if (f.hp <= 0) { f.state = 'down'; f.stT = 0; }
          break;
        }
      }
    }
    st.shots = st.shots.filter((a) => a.ttl > 0 && a.x > -60 && a.x < st.stage.length + 60);

    // ── 벼락 (바란) ──
    for (const bo of st.bolts) {
      bo.t -= dt;
      if (bo.t <= 0 && !bo.struck) {
        bo.struck = true;
        ev.push({ type: 'bolt', x: bo.x, z: bo.z });
        for (const f of this.allies(st)) {
          if (!this.alive(f) || f.iv > 0 || f.state === 'down') continue;
          if (f.kind === 'p' && st.stealth > 0) continue;
          if (Math.abs(f.x - bo.x) < 18 && Math.abs(f.z - bo.z) < 12 && f.jy < 30) {
            f.hp -= this._dmgTaken(st, f, 20);
            f.state = 'down'; f.stT = 0; f.iv = 0.8;
            ev.push({ type: 'bolthit', who: f.kind });
          }
        }
      }
    }
    st.bolts = st.bolts.filter((bo) => bo.t > -0.3);

    // ── 물약 ──
    for (const it of st.items) {
      it.ttl -= dt;
      if (Math.abs(p.x - it.x) < 20 && Math.abs(p.z - it.z) < 14 && p.jy === 0) {
        it.ttl = 0;
        if (it.kind === 'hp') p.hp = Math.min(p.maxHp, p.hp + 30);
        else st.mp = Math.min(this.maxMp(st.lv), st.mp + 30);
        ev.push({ type: 'pickup', kind: it.kind });
      }
    }
    st.items = st.items.filter((i) => i.ttl > 0);

    // ── 웨이브·구간 진행 ──
    const liveEnemies = st.enemies.some((e) => this.alive(e));
    if (!liveEnemies && st.phase === 'play') {
      const sec2 = this.sec(st);
      if (sec2.boss && !st.bossSpawned && st.waveIdx >= 0) {
        this._spawnBoss(st);
        ev.push({ type: 'bossintro', name: sec2.boss.name });
      } else if (sec2.boss && st.bossSpawned) {
        st.stars = st.deaths === 0 ? (st.shadows.length >= M.Logic.SHADOW_MAX ? 3 : 2) : 1;
        st.score += 2000;
        st.phase = 'clear'; st.clearT = 0;
        ev.push({ type: 'clear', stars: st.stars, mission: st.mission });
      } else if (st.waveIdx + 1 < sec2.waves.length && sec2.waves[st.waveIdx + 1].length > 0) {
        this._startWave(st, st.secIdx, st.waveIdx + 1);
        ev.push({ type: 'wave' });
      } else if (!st.go) {
        st.go = true;
        ev.push({ type: 'go' });
      }
    }
    if (st.go && p.x > sec.x1 - 24 && st.secIdx < 3) {
      st.secIdx++;
      st.go = false;
      this._startWave(st, st.secIdx, 0);
      ev.push({ type: 'section', idx: st.secIdx });
    }
    return ev;
  },

  // 컨티뉴: 현재 구간 재시작 (경험치 유지, 그림자 해산)
  respawn(st) {
    st.enemies = [];
    st.items = []; st.shots = []; st.bolts = [];
    st.shadows = [];
    st.stealth = 0;
    st.mp = this.maxMp(st.lv);
    st.skillCd = { q: 0, w: 0, e: 0, r: 0 };
    st.p.hp = st.p.maxHp; st.p.state = 'idle'; st.p.iv = 1.5;
    st.p.x = this.sec(st).x0 + 40; st.p.z = 40; st.p.jy = 0; st.p.vy = 0;
    if (st.b) {
      st.b.hp = st.b.maxHp; st.b.state = 'idle'; st.b.iv = 1.5; st.b.reviveT = 0;
      st.b.x = st.p.x - 26; st.b.z = 52;
    }
    st.go = false; st.bossSpawned = false;
    this._startWave(st, st.secIdx, 0);
    st.phase = 'play';
  },

}
/* ── render.js ── */
{
// render.js — 벨트스크롤 렌더: 그림자 군주 무드 + 미션별 배경 + QWER HUD (모구삼국지 계보)
const M = window.MSL;
const W = 480, H = 270;
const ZS = 0.62;

M.Render = {
  cv: null, ctx: null, mogu: null, fx: [], camX: 0,

  init(canvas) {
    this.cv = canvas;
    this.ctx = canvas.getContext('2d');
    const img = new Image();
    img.onload = () => { this.mogu = img; };
    img.src = M.ASSETS.mogu;
    this.resize();
    window.addEventListener('resize', () => this.resize());
  },

  resize() {
    let s = Math.min(window.innerWidth / W, window.innerHeight / H);
    s = s >= 2 ? Math.floor(s) : Math.max(0.6, s * 0.97);
    this.cv.style.width = W * s + 'px';
    this.cv.style.height = H * s + 'px';
    const res = Math.min(4, Math.max(1, s * (window.devicePixelRatio || 1)));
    this.cv.width = Math.round(W * res);
    this.cv.height = Math.round(H * res);
    this.ctx.setTransform(res, 0, 0, res, 0, 0);
    this.ctx.imageSmoothingQuality = 'high';
  },

  addSpark(x, y, kd) { this.fx.push({ kind: kd ? 'kd' : 'spark', x, y, t: 0 }); },
  addRuler(x, y) { this.fx.push({ kind: 'ruler', x, y, t: 0 }); },
  addSlash(x, y, face) { this.fx.push({ kind: 'slash', x, y, face, t: 0 }); },
  addExtract(x, y) { this.fx.push({ kind: 'extract', x, y, t: 0 }); },
  addBolt(x, y) { this.fx.push({ kind: 'bolt', x, y, t: 0 }); },

  sy(z, jy) { return M.FLOOR_Y + z * ZS - (jy || 0); },

  shade(hex, f) {
    const n = parseInt(hex.slice(1), 16);
    const r = Math.min(255, Math.round(((n >> 16) & 255) * f));
    const g = Math.min(255, Math.round(((n >> 8) & 255) * f));
    const b = Math.min(255, Math.round((n & 255) * f));
    return `rgb(${r},${g},${b})`;
  },

  limb(x1, y1, x2, y2, w2, color, outline = true) {
    const c = this.ctx;
    c.lineCap = 'round';
    if (outline) {
      c.strokeStyle = 'rgba(20,16,28,.9)';
      c.lineWidth = w2 + 2.6;
      c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke();
    }
    c.strokeStyle = color;
    c.lineWidth = w2;
    c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke();
  },

  draw(st, t, dt) {
    const c = this.ctx, th = st.stage.theme;
    const target = Math.max(0, Math.min(st.stage.length - W, st.p.x - 210));
    this.camX += (target - this.camX) * Math.min(1, dt * 6);
    const cam = this.camX;

    this.drawBackground(st, t, cam);

    if (st.go && Math.floor(t * 2.5) % 2 === 0) {
      c.font = 'bold 22px sans-serif'; c.textAlign = 'right';
      c.fillStyle = th.accent;
      c.strokeStyle = 'rgba(0,0,0,.6)'; c.lineWidth = 4;
      c.strokeText('GO ▶▶', W - 14, M.FLOOR_Y - 12);

    }

    for (const bo of st.bolts) {

      c.beginPath(); c.ellipse(x, y, 20, 7, 0, 0, Math.PI * 2); c.stroke();
      c.strokeStyle = `rgba(255,220,120,${blink})`; c.lineWidth = 1.4;
      c.beginPath(); c.ellipse(x, y, 20 * (bo.t / 0.6), 7 * (bo.t / 0.6), 0, 0, Math.PI * 2); c.stroke();
    }

    // 물약 (HP 빨강 / MP 파랑)
    for (const it of st.items) {
      const x = it.x - cam, y = this.sy(it.z, 0);
      const bob = Math.sin(t * 5 + it.x) * 2;
      c.strokeStyle = 'rgba(20,16,28,.85)'; c.lineWidth = 1.6;
      c.fillStyle = it.kind === 'hp' ? '#e04848' : '#3a86e0';
      c.beginPath();
      c.moveTo(x - 4, y - 3 + bob);
      c.quadraticCurveTo(x - 6, y - 10 + bob, x - 2, y - 11 + bob);
      c.lineTo(x - 2, y - 14 + bob); c.lineTo(x + 2, y - 14 + bob); c.lineTo(x + 2, y - 11 + bob);
      c.quadraticCurveTo(x + 6, y - 10 + bob, x + 4, y - 3 + bob);
      c.closePath(); c.fill(); c.stroke();
      c.fillStyle = 'rgba(255,255,255,.5)';
      c.fillRect(x - 2.5, y - 9 + bob, 2, 4);
      c.fillStyle = '#c8a050';
      c.fillRect(x - 2.5, y - 16 + bob, 5, 2.5);
    }

    // 투사체 (독침·고드름·화염구)
    for (const sh of st.shots) {
      const x = sh.x - cam, y = this.sy(sh.z, 14);
      c.fillStyle = sh.color;
      c.strokeStyle = 'rgba(20,16,28,.7)'; c.lineWidth = 1.2;
      c.beginPath(); c.ellipse(x, y, 6, 3, 0, 0, Math.PI * 2); c.fill(); c.stroke();
      c.fillStyle = 'rgba(255,255,255,.6)';
      c.beginPath(); c.arc(x - Math.sign(sh.vx) * 2, y - 1, 1.2, 0, Math.PI * 2); c.fill();
    }

    // 엔티티 (깊이 정렬)
    const ents = [st.p, ...(st.b ? [st.b] : []), ...st.shadows, ...st.enemies]
      .filter((f) => f.state !== 'dead' || f.stT < 1.6);
    ents.sort((a, b2) => a.z - b2.z);
    for (const f of ents) this.drawFighter(st, f, t);

    // FX
    this.fx = this.fx.filter((f) => f.t < (f.kind === 'ruler' ? 0.5 : f.kind === 'bolt' ? 0.35 : f.kind === 'extract' ? 0.6 : 0.3));
    for (const f of this.fx) {
      f.t += dt;
      const x = f.x - cam;
      if (f.kind === 'ruler') {

        c.globalAlpha = 1 - p2;
        c.strokeStyle = '#b07dff'; c.lineWidth = 4;
        c.beginPath(); c.ellipse(x, f.y, 22 + p2 * 78, 9 + p2 * 26, 0, 0, Math.PI * 2); c.stroke();
        c.strokeStyle = '#e8d8ff'; c.lineWidth = 2;
        for (let i = 0; i < 3; i++) {
          const a2 = p2 * 5 + i * 2.1;
          c.beginPath(); c.arc(x, f.y - 14, 28 + p2 * 44, a2, a2 + 1.2); c.stroke();
        }
        c.globalAlpha = 1;
        continue;
      }
      if (f.kind === 'slash') {
        const p2 = f.t / 0.3;
        c.globalAlpha = 1 - p2;
        c.strokeStyle = '#7dc8ff'; c.lineWidth = 3.5; c.lineCap = 'round';
        c.beginPath(); c.arc(x + f.face * 20, f.y - 16, 22 + p2 * 10, f.face > 0 ? -1.1 : Math.PI - 0.5, f.face > 0 ? 0.5 : Math.PI + 1.1); c.stroke();
        c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = 1.6;
        c.beginPath(); c.arc(x + f.face * 20, f.y - 16, 17 + p2 * 10, f.face > 0 ? -1.0 : Math.PI - 0.4, f.face > 0 ? 0.4 : Math.PI + 1.0); c.stroke();
        c.globalAlpha = 1;
        continue;
      }
      if (f.kind === 'extract') {
        const p2 = Math.min(1, f.t / 0.6);
        c.globalAlpha = 1 - p2;
        c.fillStyle = '#6a4a9a';
        for (let i = 0; i < 5; i++) {
          const wx = x + Math.sin(i * 2.2 + p2 * 6) * (7 + i * 2);
          c.beginPath(); c.ellipse(wx, f.y - p2 * 44 - i * 5, 3.2, 6.5, 0, 0, Math.PI * 2); c.fill();
        }
        c.strokeStyle = '#b07dff'; c.lineWidth = 1.6;
        c.beginPath(); c.ellipse(x, f.y, 15 * (1 - p2), 5 * (1 - p2), 0, 0, Math.PI * 2); c.stroke();
        c.globalAlpha = 1;
        continue;
      }
      if (f.kind === 'bolt') {
        const p2 = Math.min(1, f.t / 0.35);
        c.globalAlpha = 1 - p2;
        c.strokeStyle = '#e8e0ff'; c.lineWidth = 4.5; c.lineCap = 'round';
        c.beginPath();
        c.moveTo(x + 6, f.y - 150);
        c.lineTo(x - 5, f.y - 90); c.lineTo(x + 4, f.y - 84);
        c.lineTo(x - 6, f.y - 30); c.lineTo(x + 2, f.y - 26);
        c.lineTo(x, f.y);
        c.stroke();
        c.strokeStyle = '#b07dff'; c.lineWidth = 9;
        c.globalAlpha = (1 - p2) * 0.4;
        c.stroke();
        c.globalAlpha = 1 - p2;
        c.fillStyle = '#fff';
        c.beginPath(); c.ellipse(x, f.y, 16 * (1 - p2), 6 * (1 - p2), 0, 0, Math.PI * 2); c.fill();

        c.lineTo(x + Math.cos(a) * (9 + p * 15), f.y + Math.sin(a) * (9 + p * 15));
        c.stroke();
      }
      if (f.kind === 'kd') {
        c.font = 'bold 13px sans-serif'; c.textAlign = 'center';
        c.fillStyle = '#ffd83d';
        c.fillText('POW!', x, f.y - 16 - p * 10);
      }
      c.globalAlpha = 1;
    }

    this.drawHud(st, t);
  },

  // ── 미션별 배경 ──
  drawBackground(st, t, cam) {
    const c = this.ctx, th = st.stage.theme, m = st.mission;
    const g = c.createLinearGradient(0, 0, 0, M.FLOOR_Y);
    g.addColorStop(0, th.sky0); g.addColorStop(1, th.sky1);
    c.fillStyle = g; c.fillRect(0, 0, W, M.FLOOR_Y);

    const wallTop = 62, wallH = M.FLOOR_Y - wallTop;
    if (m === 1) {
      // 페널티 존: 모래 언덕 + 백골 + 이글거리는 해
      c.fillStyle = 'rgba(255,240,200,.9)';
      c.beginPath(); c.arc(W - 70, 34, 17 + Math.sin(t * 2) * 1.5, 0, Math.PI * 2); c.fill();
      c.fillStyle = 'rgba(0,0,0,.14)';
      c.beginPath();
      c.moveTo(0, wallTop + 40);
      for (let x = 0; x <= W; x += 24) c.lineTo(x, wallTop + 28 + Math.sin((x + cam * 0.25) * 0.02) * 14);
      c.lineTo(W, M.FLOOR_Y); c.lineTo(0, M.FLOOR_Y); c.fill();
      c.fillStyle = th.wall;
      c.beginPath();
      c.moveTo(0, M.FLOOR_Y);
      for (let x = 0; x <= W; x += 20) c.lineTo(x, wallTop + 62 + Math.sin((x + cam * 0.6) * 0.03 + 2) * 18);
      c.lineTo(W, M.FLOOR_Y); c.fill();
      for (let i = -1; i < 5; i++) {
        const x = i * 160 - ((cam * 0.6) % 160) + 60;
        c.strokeStyle = '#e8e0d0'; c.lineWidth = 3; c.lineCap = 'round';
        c.beginPath(); c.arc(x, M.FLOOR_Y - 16, 12, Math.PI, Math.PI * 1.9); c.stroke();
        c.beginPath(); c.moveTo(x - 12, M.FLOOR_Y - 16); c.lineTo(x - 12, M.FLOOR_Y - 4); c.stroke();
        c.lineWidth = 2;
        c.beginPath(); c.moveTo(x - 12, M.FLOOR_Y - 12); c.lineTo(x - 20, M.FLOOR_Y - 14); c.stroke();
      }
    } else if (m === 2) {
      // 독사의 굴: 동굴 벽 + 독 웅덩이 + 종유석
      c.fillStyle = th.wall; c.fillRect(0, wallTop, W, wallH);
      c.fillStyle = this.shade(th.wall, 0.7);
      for (let i = -1; i < 12; i++) {
        const x = i * 48 - ((cam * 0.6) % 48);
        const len = 20 + ((i * 37) % 26);
        c.beginPath(); c.moveTo(x, wallTop - 2); c.lineTo(x + 9, wallTop - 2); c.lineTo(x + 4.5, wallTop + len); c.closePath(); c.fill();
      }
      for (let i = -1; i < 6; i++) {
        const x = i * 130 - ((cam * 0.6) % 130) + 40;
        const puls = 0.5 + 0.3 * Math.sin(t * 3 + i * 2);
        c.fillStyle = `rgba(125,224,74,${puls * 0.5})`;
        c.beginPath(); c.ellipse(x, M.FLOOR_Y - 8, 26, 7, 0, 0, Math.PI * 2); c.fill();
        c.fillStyle = `rgba(184,224,74,${puls * 0.7})`;
        for (let b2 = 0; b2 < 3; b2++) {
          const bx = x - 12 + b2 * 11, bt = (t * 1.4 + b2 * 0.8 + i) % 1;
          c.beginPath(); c.arc(bx, M.FLOOR_Y - 8 - bt * 16, 2.4 * (1 - bt), 0, Math.PI * 2); c.fill();
        }
      }
    } else if (m === 3) {
      // 붉은 문: 설원 + 침엽수 + 지평선의 붉은 게이트
      const gx = W - 90 - cam * 0.12;
      const glow = 0.5 + 0.25 * Math.sin(t * 2.4);
      c.fillStyle = `rgba(255,60,60,${glow * 0.35})`;
      c.beginPath(); c.ellipse(gx, wallTop + 24, 46, 58, 0, 0, Math.PI * 2); c.fill();
      c.strokeStyle = `rgba(255,90,90,${glow})`; c.lineWidth = 5;
      c.beginPath(); c.arc(gx, wallTop + 40, 26, Math.PI, 0); c.lineTo(gx + 26, wallTop + 72); c.lineTo(gx - 26, wallTop + 72); c.closePath(); c.stroke();
      c.fillStyle = 'rgba(255,120,120,.35)';
      c.fill();
      // 눈 언덕
      c.fillStyle = 'rgba(255,255,255,.7)';
      c.beginPath();
      c.moveTo(0, M.FLOOR_Y);
      for (let x = 0; x <= W; x += 22) c.lineTo(x, wallTop + 58 + Math.sin((x + cam * 0.45) * 0.025) * 12);
      c.lineTo(W, M.FLOOR_Y); c.fill();
      // 침엽수
      for (let i = -1; i < 7; i++) {
        const x = i * 110 - ((cam * 0.6) % 110) + 30;
        c.fillStyle = '#3a5a4a';
        for (let k = 0; k < 3; k++) {
          const wY = wallTop + 36 + k * 22, ww = 16 - k * 3.5;
          c.beginPath(); c.moveTo(x, wY - 18); c.lineTo(x + ww, wY + 12); c.lineTo(x - ww, wY + 12); c.closePath(); c.fill();
        }
        c.fillStyle = 'rgba(255,255,255,.75)';
        c.beginPath(); c.moveTo(x, wallTop + 18); c.lineTo(x + 9, wallTop + 34); c.lineTo(x - 9, wallTop + 34); c.closePath(); c.fill();
      }
      // 내리는 눈
      c.fillStyle = 'rgba(255,255,255,.8)';
      for (let i = 0; i < 26; i++) {
        const sx = ((i * 97 + t * 26 * ((i % 3) + 1)) % (W + 20)) - 10;
        const sYY = (i * 61 + t * 44 * ((i % 2) + 1)) % M.FLOOR_Y;
        c.fillRect(sx, sYY, 2, 2);
      }
    } else if (m === 4) {
      // 악마성 하층: 검붉은 석벽 + 사슬 + 횃불
      c.fillStyle = th.wall; c.fillRect(0, wallTop, W, wallH);
      c.strokeStyle = 'rgba(0,0,0,.3)'; c.lineWidth = 1.5;
      for (let ry = 8; ry < wallH; ry += 17) {
        c.beginPath(); c.moveTo(0, wallTop + ry); c.lineTo(W, wallTop + ry); c.stroke();
        const off = (ry / 17) % 2 ? 21 : 0;
        for (let bx = -42; bx < W + 42; bx += 42) {
          const x = bx + off - ((cam * 0.6) % 42);
          c.beginPath(); c.moveTo(x, wallTop + ry); c.lineTo(x, wallTop + ry + 17); c.stroke();
        }
      }
      for (let i = -1; i < 5; i++) {
        const x = i * 140 - ((cam * 0.6) % 140) + 46;
        // 사슬
        c.strokeStyle = '#4a4050'; c.lineWidth = 2.4;
        for (let k = 0; k < 5; k++) {
          c.beginPath(); c.ellipse(x + 44, wallTop + 10 + k * 9 + Math.sin(t * 1.8 + i) * 2, 2.6, 4.6, 0, 0, Math.PI * 2); c.stroke();
        }
        // 횃불
        c.fillStyle = '#5a4030';
        c.fillRect(x - 2, wallTop + 38, 5, 16);
        const fl = Math.sin(t * 9 + i * 2.4) * 2.4;
        c.fillStyle = '#ff9a3d';
        c.beginPath(); c.ellipse(x + fl * 0.4, wallTop + 30, 5, 9 + fl, 0, 0, Math.PI * 2); c.fill();
        c.fillStyle = '#ffd83d';
        c.beginPath(); c.ellipse(x + fl * 0.4, wallTop + 33, 2.6, 4.5, 0, 0, Math.PI * 2); c.fill();
        c.fillStyle = 'rgba(255,150,60,.12)';
        c.beginPath(); c.arc(x, wallTop + 34, 26, 0, Math.PI * 2); c.fill();
      }
    } else {
      // 악마성 최상층: 보라 하늘 번개 + 첨탑 기둥 + 균열 마법진
      if (Math.sin(t * 0.7) > 0.94 || Math.sin(t * 1.13 + 4) > 0.965) {
        c.fillStyle = 'rgba(200,180,255,.28)';
        c.fillRect(0, 0, W, M.FLOOR_Y);
        c.strokeStyle = '#e8e0ff'; c.lineWidth = 2.5; c.lineCap = 'round';
        const lx = ((t * 731) % W);
        c.beginPath(); c.moveTo(lx, 0); c.lineTo(lx - 12, 26); c.lineTo(lx + 4, 32); c.lineTo(lx - 10, 58); c.stroke();
      }
      c.fillStyle = 'rgba(255,255,240,.5)';
      for (let i = 0; i < 18; i++) c.fillRect((i * 151 + 23) % W, (i * 67 + 9) % 52, 1.5, 1.5);
      for (let i = -1; i < 5; i++) {
        const x = i * 130 - ((cam * 0.6) % 130) + 24;
        c.fillStyle = '#241436';
        c.fillRect(x, wallTop - 6, 24, wallH + 6);
        c.fillStyle = 'rgba(176,125,255,.5)';
        c.fillRect(x + 3, wallTop - 6, 4, wallH + 6);
        c.fillStyle = '#38205c';
        c.beginPath(); c.moveTo(x - 4, wallTop - 6); c.lineTo(x + 12, wallTop - 26); c.lineTo(x + 28, wallTop - 6); c.closePath(); c.fill();
        const gl = 0.4 + 0.3 * Math.sin(t * 3 + i * 1.7);
        c.fillStyle = `rgba(176,125,255,${gl})`;
        c.beginPath(); c.arc(x + 12, wallTop + 30, 3.4, 0, Math.PI * 2); c.fill();
      }
    }

    // ── 바닥 ──
    const fg = c.createLinearGradient(0, M.FLOOR_Y, 0, H);
    fg.addColorStop(0, th.floor);
    fg.addColorStop(1, this.shade(th.floor, 0.72));
    c.fillStyle = fg;
    c.fillRect(0, M.FLOOR_Y, W, H - M.FLOOR_Y);
    c.fillStyle = this.shade(th.floor, 1.25);
    c.fillRect(0, M.FLOOR_Y, W, 3);
    c.fillStyle = 'rgba(0,0,0,.25)';
    c.fillRect(0, M.FLOOR_Y + 3, W, 1.5);
    c.strokeStyle = 'rgba(255,255,255,.05)'; c.lineWidth = 1;
    for (const zz of [20, 40, 60]) {
      const y = M.FLOOR_Y + zz * ZS;
      c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke();
    }
    for (let i = -1; i < 5; i++) {
      const seg = Math.floor(cam / 150) + i;
      const x = seg * 150 - cam + 40;
      const h2 = (seg * 40503 + 7) >>> 3;
      const zz = 14 + (h2 % 50);
      const y = M.FLOOR_Y + zz * ZS;
      if (h2 % 2 === 0) {
        c.strokeStyle = 'rgba(0,0,0,.22)'; c.lineWidth = 1.5; c.lineCap = 'round';
        c.beginPath(); c.moveTo(x, y); c.lineTo(x + 12, y + 4); c.lineTo(x + 20, y + 2); c.stroke();
      } else {
        c.strokeStyle = m === 5 ? 'rgba(176,125,255,.3)' : 'rgba(0,0,0,.25)'; c.lineWidth = 2;
        c.beginPath(); c.ellipse(x + 14, y, 11, 4.5, 0, 0, Math.PI * 2); c.stroke();
      }
    }
  },

  // ── HUD ──
  drawHud(st, t) {
    const c = this.ctx;
    const L = M.Logic;
    this.portraitBar(10, 8, 120, st.p.hp / st.p.maxHp, '#58c85c', 'mogu');
    // MP 바
    c.fillStyle = 'rgba(0,0,0,.5)';
    c.fillRect(33, 21, 97, 6);
    c.fillStyle = '#4a9ae8';
    c.fillRect(34, 22, 95 * Math.min(1, st.mp / L.maxMp(st.lv)), 4);
    c.strokeStyle = 'rgba(255,255,255,.5)'; c.lineWidth = 1;
    c.strokeRect(33, 21, 97, 6);
    if (st.b) this.portraitBar(10, 32, 92, Math.max(0, st.b.hp) / st.b.maxHp, '#ffd83d', 'chick');
    // 레벨 + 경험치
    const lvY = st.b ? 61 : 43;
    c.font = 'bold 9px sans-serif'; c.textAlign = 'left';
    c.strokeStyle = 'rgba(0,0,0,.6)'; c.lineWidth = 3;
    c.strokeText(`Lv.${st.lv}`, 10, lvY);
    c.fillStyle = '#ffd83d';
    c.fillText(`Lv.${st.lv}`, 10, lvY);
    if (st.lv < L.LV_MAX) {
      c.fillStyle = 'rgba(0,0,0,.5)';
      c.fillRect(38, lvY - 6, 52, 5);
      c.fillStyle = '#b07dff';
      c.fillRect(39, lvY - 5, 50 * Math.min(1, st.expInto / L.expNeed(st.lv)), 3);
    } else {
      c.fillStyle = '#b07dff';
      c.fillText('MAX', 38, lvY);
    }
    // 영구 장비 아이콘
    let gx = 96;
    if (st.gear.fang) {
      c.font = 'bold 8px sans-serif';
      c.fillStyle = '#9fe06a'; c.fillText('🗡독니', gx, lvY); gx += 30;
    }
    if (st.gear.armor) { c.fillStyle = '#8ab8e8'; c.fillText('🛡갑주', gx, lvY); }

    // QWER 스킬 슬롯 (좌하)
    const sx0 = 10, syy = H - 30;
    const keys = ['q', 'w', 'e', 'r'];
    for (let i = 0; i < 4; i++) {
      const k = keys[i], S = L.SKILLS[k];
      const x = sx0 + i * 24;
      const locked = st.lv < S.lv;
      const noMp = st.mp < S.mp;
      const cd = Math.max(0, st.skillCd[k]);
      c.fillStyle = locked ? 'rgba(20,20,28,.75)' : 'rgba(10,14,30,.68)';
      c.beginPath(); c.roundRect(x, syy, 20, 20, 4); c.fill();
      c.strokeStyle = locked ? 'rgba(120,120,140,.5)' : noMp ? 'rgba(90,130,220,.45)' : k === 'e' && st.shadows.length >= L.SHADOW_MAX ? 'rgba(176,125,255,.9)' : 'rgba(255,255,255,.75)';
      c.lineWidth = 1.3;
      c.beginPath(); c.roundRect(x, syy, 20, 20, 4); c.stroke();
      c.font = 'bold 10px sans-serif'; c.textAlign = 'center';
      c.fillStyle = locked ? 'rgba(200,200,210,.4)' : noMp ? 'rgba(160,190,240,.6)' : '#fff';
      c.fillText(k.toUpperCase(), x + 10, syy + 14);
      if (locked) {
        c.font = 'bold 7px sans-serif';
        c.fillStyle = 'rgba(255,216,61,.85)';
        c.fillText(`Lv${S.lv}`, x + 10, syy + 26);
      } else if (cd > 0) {
        c.fillStyle = 'rgba(0,0,0,.62)';
        const hgt = 20 * Math.min(1, cd / S.cd);
        c.beginPath(); c.roundRect(x, syy + 20 - hgt, 20, hgt, 3); c.fill();
      }
    }
    // 그림자 병사 표시 (E 슬롯 위 점)
    for (let i = 0; i < st.shadows.length; i++) {
      c.fillStyle = '#b07dff';
      c.beginPath(); c.arc(sx0 + 2 * 24 + 4 + i * 6, syy - 5, 2.4, 0, Math.PI * 2); c.fill();
    }
    // 은신 남은 시간
    if (st.stealth > 0) {
      c.font = 'bold 9px sans-serif'; c.textAlign = 'left';
      c.fillStyle = 'rgba(180,220,255,.9)';
      c.fillText(`은신 ${st.stealth.toFixed(1)}s`, sx0 + 100, syy + 14);
    }

    // 보스 바
    const boss = st.enemies.find((e) => e.boss && M.Logic.alive(e));
    if (boss) {
      c.fillStyle = 'rgba(0,0,0,.5)';
      c.fillRect(W - 166, 10, 156, 12);
      c.fillStyle = boss.hp < boss.maxHp * 0.5 && boss.base === 'baran' ? '#b07dff' : '#ff5a5a';
      c.fillRect(W - 165, 11, 154 * Math.max(0, boss.hp / boss.maxHp), 10);
      c.strokeStyle = 'rgba(255,255,255,.7)'; c.lineWidth = 1;
      c.strokeRect(W - 166, 10, 156, 12);
      c.font = 'bold 9px sans-serif'; c.textAlign = 'right'; c.fillStyle = '#fff';
      c.fillText('👑 ' + boss.name, W - 12, 32);
    }
    c.font = 'bold 11px sans-serif'; c.textAlign = 'center';
    c.strokeStyle = 'rgba(0,0,0,.6)'; c.lineWidth = 3;
    c.fillStyle = 'rgba(255,255,255,.92)';
    const label = `MISSION ${st.mission} · ${st.stage.theme.name}`;
    c.strokeText(label, W / 2, 18);
    c.fillText(label, W / 2, 18);
  },

  portraitBar(x, y, w2, ratio, color, face) {
    const c = this.ctx;
    c.fillStyle = 'rgba(0,0,0,.55)';
    c.beginPath(); c.roundRect(x, y, 19, 19, 3); c.fill();
    c.strokeStyle = 'rgba(255,255,255,.7)'; c.lineWidth = 1.2;
    c.strokeRect(x, y, 19, 19);
    if (face === 'mogu' && this.mogu) {
      const a = this.mogu.width / this.mogu.height;
      c.save();
      c.beginPath(); c.rect(x + 1, y + 1, 17, 17); c.clip();
      c.drawImage(this.mogu, x + 9.5 - (17 * a) / 2, y + 1, 17 * a, 17);
      c.restore();
    } else if (face === 'chick') {
      c.fillStyle = '#f4f4f0';
      c.beginPath(); c.arc(x + 9.5, y + 11, 6.5, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#d83a3a';
      c.beginPath(); c.arc(x + 7, y + 4.5, 2, 0, Math.PI * 2); c.arc(x + 10.5, y + 3.8, 2, 0, Math.PI * 2); c.arc(x + 13, y + 4.5, 2, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#f0a030';
      c.beginPath(); c.moveTo(x + 14, y + 10); c.lineTo(x + 18, y + 11.5); c.lineTo(x + 14, y + 13); c.fill();
      c.fillStyle = '#22262e'; c.fillRect(x + 10.5, y + 8.5, 2, 2);
    }
    c.fillStyle = 'rgba(0,0,0,.5)';
    c.fillRect(x + 23, y + 5, w2, 9);
    c.fillStyle = color;
    c.fillRect(x + 24, y + 6, Math.max(0, (w2 - 2) * Math.min(1, ratio)), 7);
    c.strokeStyle = 'rgba(255,255,255,.6)'; c.lineWidth = 1;
    c.strokeRect(x + 23, y + 5, w2, 9);
  },

  // ── 캐릭터 ──
  drawFighter(st, f, t) {
    const c = this.ctx;
    const x = f.x - this.camX;
    if (x < -70 || x > W + 70) return;
    const y = this.sy(f.z, f.jy);
    const down = f.state === 'down' || f.state === 'dead';
    const hurt = f.state === 'hurt';
    const atk = f.state === 'atk';
    const walk = f.state === 'walk';
    const dead = f.state === 'dead';
    const airkick = atk && f.jy > 0;
    const isP = f.kind === 'p', isB = f.kind === 'b', isS = f.kind === 's';

    // 그림자
    c.fillStyle = 'rgba(0,0,0,.28)';
    c.beginPath(); c.ellipse(x, this.sy(f.z, 0) + 3, 15, 4.5, 0, 0, Math.PI * 2); c.fill();

    c.save();
    c.translate(x, y);
    if (f.face < 0) c.scale(-1, 1);
    if (dead) c.globalAlpha = Math.max(0, 1 - (f.stT - 0.8) / 0.8);
    if (isP && st.stealth > 0) c.globalAlpha = 0.35;
    if (down) { c.rotate(-Math.PI / 2); c.translate(4, 12); }
    if (hurt) { c.translate(Math.sin(t * 40) * 1.5, 0); c.rotate(-0.12); }

    const E = M.ETYPES[f.type];
    const tanky = (E && E.tanky) || (E && E.hp >= 60);
    const big = f.boss ? 1.35 : (!isP && !isB && !isS && tanky) ? 1.12 : 1;
    c.scale(big, big);

    // 팔레트 — 모구: 검은 롱코트 / 그림자: 검보라 단색
    const baseBody = f.body || (E && E.body) || '#9aa2ad';
    const shirtC = isP ? '#26222e' : isB ? '#3a7ec8' : isS ? '#2a2038' : this.shade(baseBody, 0.9);
    const skinC = isP ? '#3a3444' : isB ? '#f0e8d8' : isS ? '#3a2c4c' : this.shade(baseBody, 1.18);
    const pantC = isP ? '#1c1826' : isB ? '#4a3a2a' : isS ? '#241a30' : '#3a3644';
    const shoeC = isP ? '#3a3444' : '#2a2430';

    const step = walk ? Math.sin(t * 11) : 0;

    // ── 다리 ──
    if (airkick) {
      this.limb(0, -22, 16, -20, 7, pantC);
      this.limb(16, -20, 26, -18, 6, pantC);
      c.fillStyle = shoeC;
      c.beginPath(); c.ellipse(29, -18, 5, 3.5, 0.2, 0, Math.PI * 2); c.fill();
      this.limb(-2, -22, -7, -12, 7, pantC);
      this.limb(-7, -12, -2, -8, 6, pantC);
      c.fillStyle = shoeC;
      c.beginPath(); c.ellipse(-1, -7, 4.5, 3, 0, 0, Math.PI * 2); c.fill();
    } else if (f.jy > 0) {
      this.limb(1, -22, 4, -12, 7, pantC);
      this.limb(4, -12, 7, -8, 6, pantC);
      this.limb(-3, -22, -7, -13, 7, pantC);
      this.limb(-7, -13, -10, -9, 6, pantC);
      c.fillStyle = shoeC;
      c.beginPath(); c.ellipse(8, -7, 4.5, 3, 0, 0, Math.PI * 2); c.fill();
      c.beginPath(); c.ellipse(-11, -8, 4.5, 3, 0, 0, Math.PI * 2); c.fill();
    } else {
      const k1 = step * 5, k2 = -step * 5;
      this.limb(2, -22, 4 + k1, -11, 7, pantC);
      this.limb(4 + k1, -11, 5 + k1 * 1.2, -1, 6, pantC);
      this.limb(-3, -22, -4 + k2, -11, 7, pantC);
      this.limb(-4 + k2, -11, -5 + k2 * 1.2, -1, 6, pantC);
      c.fillStyle = shoeC;
      c.strokeStyle = 'rgba(20,16,28,.9)'; c.lineWidth = 1.5;
      c.beginPath(); c.ellipse(7 + k1 * 1.2, -1, 5.5, 3, 0, 0, Math.PI * 2); c.fill(); c.stroke();
      c.beginPath(); c.ellipse(-3 + k2 * 1.2, -1, 5.5, 3, 0, 0, Math.PI * 2); c.fill(); c.stroke();
    }

    // ── 몸통 ──
    c.strokeStyle = 'rgba(20,16,28,.9)'; c.lineWidth = 2.4; c.lineJoin = 'round';
    c.fillStyle = shirtC;
    c.beginPath();
    c.moveTo(-11, -42); c.quadraticCurveTo(0, -45, 11, -42);
    c.lineTo(7, -21); c.quadraticCurveTo(0, -19, -7, -21);
    c.closePath(); c.fill(); c.stroke();
    c.fillStyle = this.shade(shirtC === '#26222e' ? '#4a4458' : shirtC, 0.75);
    c.beginPath();
    c.moveTo(6, -41); c.lineTo(11, -42); c.lineTo(7, -21); c.lineTo(4, -21);
    c.closePath(); c.fill();
    if (isP) {
      // 롱코트 자락 (다리 뒤로 펄럭)
      const flap = walk ? Math.sin(t * 11) * 3 : Math.sin(t * 2.4) * 1.4;
      c.fillStyle = '#201c2a';
      c.strokeStyle = 'rgba(20,16,28,.9)'; c.lineWidth = 1.8;
      c.beginPath();
      c.moveTo(-8, -24);
      c.quadraticCurveTo(-14 - flap, -14, -12 - flap, -3);
      c.lineTo(-6, -8); c.lineTo(-6, -21);
      c.closePath(); c.fill(); c.stroke();
      // 코트 앞선 + 보라 안감 포인트

  buddyup() { [660, 880, 1100].forEach((f, i) => this.tone(f, 0.09, 'square', 0.14, null, i * 0.06)); },
  clear(n)  { const seq = n >= 3 ? [523, 659, 784, 1047, 1319] : [523, 659, 784, 1047];
              seq.forEach((f, i) => this.tone(f, 0.16, 'square', 0.18, null, i * 0.1)); },
  over()    { [392, 330, 262, 196].forEach((f, i) => this.tone(f, 0.26, 'triangle', 0.2, null, i * 0.2)); },
  levelup() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.1, 'square', 0.16, null, i * 0.07)); },
  meow()    { this.tone(700, 0.28, 'sawtooth', 0.1, 420); },
  cluck()   { [620, 780, 620].forEach((f, i) => this.tone(f, 0.07, 'square', 0.12, null, i * 0.07)); },
};

M.audio = A;

}
/* ── ui.js ── */
{
// ui.js — 저장 + 화면 전환
const M = window.MSL;
const $ = (id) => document.getElementById(id);

M.save = {
  KEY: 'mogusolo-save-v1',
  data: { best: 1, stars: {}, exp: 0, gear: { fang: false, armor: false } },
  load() {
    try { const raw = localStorage.getItem(this.KEY); if (raw) this.data = Object.assign(this.data, JSON.parse(raw)); } catch (e) {}
    if (!this.data.gear) this.data.gear = { fang: false, armor: false };
    return this.data;
  },
  store() { try { localStorage.setItem(this.KEY, JSON.stringify(this.data)); } catch (e) {} },
  setExp(exp) { this.data.exp = Math.max(this.data.exp || 0, exp); this.store(); },
  setGear(key) { this.data.gear[key] = true; this.store(); },
  record(no, stars) {
    this.data.stars[no] = Math.max(this.data.stars[no] || 0, stars);
    if (no + 1 > this.data.best) this.data.best = Math.min(5, no + 1);
    this.store();
  },
};

M.ui = {
  screens: ['title-screen', 'pause-screen', 'win-screen', 'over-screen', 'ending-screen'],
  toastTimer: null,

  init() {
    $('title-icon').src = M.ASSETS.mogu;
    this.refreshTitle();
  },

  refreshTitle() {
    const best = M.save.data.best;
    $('btn-continue').style.display = best > 1 ? '' : 'none';
    $('btn-continue').textContent = `이어하기 — MISSION ${best}`;
    const total = Object.values(M.save.data.stars).reduce((a, b) => a + b, 0);
    $('title-hi').textContent = total > 0 ? `★ 합계 ${total}` : '';
  },

  show(id) {
    for (const s of this.screens) $(s).classList.toggle('hidden', s !== id);
    $('hud').classList.toggle('hidden', id === 'title-screen' || id === 'ending-screen');
  },
  hideAll() {
    for (const s of this.screens) $(s).classList.add('hidden');
    $('hud').classList.remove('hidden');
  },

  toast(text, dur = 1.8) {
    const el = $('hud-toast');
    el.textContent = text;
    el.style.opacity = 1;
    clearTimeout(this.toastTimer);
    this.toastTimer = setTimeout(() => { el.style.opacity = 0; }, dur * 1000);
  },

  showWin(st, gearMsg) {
    $('win-stars').textContent = '★'.repeat(st.stars) + '☆'.repeat(3 - st.stars);
    $('win-stats').innerHTML = `${st.stage.sections[3].boss.name} 격파! · 점수 ${st.score} · Lv.${st.lv}` +
      (st.deaths === 0 ? '<br><b style="color:#7de08a">노 컨티뉴!</b>' : `<br>컨티뉴 ${st.deaths}회`) +
      (gearMsg ? `<br><b style="color:#b07dff">${gearMsg}</b>` : '');
    $('btn-next').style.display = st.mission < 5 ? '' : 'none';
    this.show('win-screen');
  },

  setCountdown(n) { $('over-count').textContent = n; },
};

}
/* ── main.js ── */
{
// main.js — 게임 루프 + 상태 머신 + 입력 (QWER 스킬 키)
const M = window.MSL;
const $ = (id) => document.getElementById(id);

let mode = 'title';            // title | play | pause | win | over | ending
let st = null;
const held = { left: false, right: false, up: false, down: false };
let atkQueued = false, jumpQueued = false;
const skillQueued = { q: false, w: false, e: false, r: false };
let overCount = 10, overAcc = 0;

M.save.load();
M.ui.init();
M.Render.init(document.getElementById('game'));
M.ui.show('title-screen');

function startMission(no) {
  st = M.Logic.create(no, M.save.data.exp || 0, M.save.data.gear);
  M.Render.fx = [];
  M.Render.camX = 0;
  mode = 'play';
  M.ui.hideAll();
  M.ui.toast(`MISSION ${no} — ${M.STORY[no]}`, 3.0);
  M.audio.resume(); M.audio.meow();
  if (no >= 2) setTimeout(() => M.audio.cluck(), 500);
}

function toTitle() {
  mode = 'title';
  M.ui.refreshTitle();
  M.ui.show('title-screen');
}

function handleEvents(evs) {
  for (const e of evs) {
    switch (e.type) {
      case 'swing': case 'eswing': M.audio.swing(); break;
      case 'slash': M.audio.slash(); M.Render.addSlash(e.x, M.Render.sy(e.z, 0), e.face); break;
      case 'stealth': M.audio.stealth(); M.ui.toast('🌫 은신 — 3초!', 1.2); break;
      case 'ambush': M.ui.toast('🗡 기습! ×2', 1.2); break;
      case 'extract':
        M.audio.extract();
        M.Render.addExtract(e.x, M.Render.sy(e.z, 0));
        M.ui.toast(`💜 그림자 병사 일어나라! (${e.n}/${M.Logic.SHADOW_MAX})`, 1.6);
        break;
      case 'extractfail':
        M.ui.toast(e.reason === 'full' ? '그림자 자리가 없다 (최대 3기)' : '주변에 추출할 시체가 없다', 1.3);
        break;
      case 'shadowdown': M.ui.toast('그림자 병사가 스러졌다…', 1.3); break;
      case 'ruler': M.audio.ruler(); M.Render.addRuler(e.x, M.Render.sy(e.z, 24)); M.ui.toast('👑 지배자의 권능!!', 1.2); break;
      case 'boltwarn': M.audio.boltwarn(); break;
      case 'bolt': M.audio.bolt(); M.Render.addBolt(e.x, M.Render.sy(e.z, 0)); break;
      case 'bolthit': M.audio.hurt(); break;
      case 'bossdash': M.audio.wave(); break;
      case 'shot': M.audio.shot(); break;
      case 'shothit': M.audio.hurt(); break;
      case 'jump': M.audio.jump(); break;
      case 'hit':
        M.audio.hit();
        M.Render.addSpark(e.x, M.Render.sy(e.z, 20), e.kd);
        break;
      case 'kd': M.audio.kd(); break;
      case 'levelup':
        M.audio.levelup();
        M.ui.toast(e.skill ? `⬆ Lv.${e.lv} — 스킬 해금! [${e.key.toUpperCase()}] ${e.skill}` : `⬆ LEVEL UP! Lv.${e.lv}`, 2.2);
        M.save.setExp(st.exp);
        break;
      case 'edown': M.audio.edown(); break;
      case 'drop': break;
      case 'pickup': M.audio.pickup(); M.ui.toast(e.kind === 'hp' ? '🧪 회복 물약 +30' : '🧪 마나 물약 +30', 1.1); break;
      case 'wave': M.audio.wave(); M.ui.toast('마수 증원…!', 1.2); break;
      case 'go': M.audio.go(); M.ui.toast('GO ▶▶', 1.4); break;
      case 'section': break;
      case 'bossintro': M.audio.bossintro(); M.ui.toast(`👑 ${e.name} 등장!!`, 2.2); break;
      case 'buddydown': M.ui.toast('꼬꼬가 쓰러졌다…!', 1.6); break;
      case 'buddyup': M.audio.buddyup(); M.audio.cluck(); M.ui.toast('🐔 꼬꼬 부활!', 1.4); break;
      case 'clear': {
        M.save.setExp(st.exp);
        M.audio.clear(e.stars);
        M.save.record(st.mission, e.stars);
        let gearMsg = null;
        if (e.mission === 2 && !M.save.data.gear.fang) { M.save.setGear('fang'); gearMsg = '🗡 카사카의 독니 획득! 공격력 +2'; M.audio.gear(); }
        if (e.mission === 4 && !M.save.data.gear.armor) { M.save.setGear('armor'); gearMsg = '🛡 파수견의 갑주 획득! 받는 피해 -2'; M.audio.gear(); }
        setTimeout(() => { if (mode === 'play') { mode = 'win'; M.ui.showWin(st, gearMsg); } }, 1400);
        break;
      }
      case 'over':
        M.audio.over();
        setTimeout(() => {
          if (mode === 'play') {
            mode = 'over'; overCount = 10; overAcc = 0;
            M.ui.setCountdown(10);
            M.ui.show('over-screen');
          }
        }, 900);
        break;
    }
  }
}

// ── 키보드 ──
window.addEventListener('keydown', (e) => {
  M.audio.resume();
  const k = e.key;
  if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(k)) e.preventDefault();
  if (k === 'ArrowLeft') held.left = true;
  if (k === 'ArrowRight') held.right = true;
  if (k === 'ArrowUp') held.up = true;
  if (k === 'ArrowDown') held.down = true;
  if ((k === ' ' || k === 'z' || k === 'Z') && !e.repeat && mode === 'play') atkQueued = true;
  if ((k === 'x' || k === 'X') && !e.repeat && mode === 'play') jumpQueued = true;
  if (mode === 'play' && !e.repeat) {
    const lk = k.toLowerCase();
    if (lk === 'q' || lk === 'w' || lk === 'e' || lk === 'r') skillQueued[lk] = true;
  }

  if (mode === 'title') {
    if (k === 'Enter') startMission(M.save.data.best);
  } else if (mode === 'play') {
    if (k === 'Escape') { mode = 'pause'; M.ui.show('pause-screen'); }
  } else if (mode === 'pause') {
    if (k === 'Enter' || k === 'Escape') { mode = 'play'; M.ui.hideAll(); }
    if (k === 'm' || k === 'M') toTitle();
  } else if (mode === 'win') {
    if (k === 'Enter') { if (st.mission < 5) startMission(st.mission + 1); else { mode = 'ending'; M.ui.show('ending-screen'); } }
  } else if (mode === 'over') {
    if (k === 'Enter' || k === ' ') { M.Logic.respawn(st); mode = 'play'; M.ui.hideAll(); }
    if (k === 'Escape') toTitle();
  } else if (mode === 'ending') {
    if (k === 'Enter') toTitle();
  }
});
window.addEventListener('keyup', (e) => {
  if (e.key === 'ArrowLeft') held.left = false;
  if (e.key === 'ArrowRight') held.right = false;
  if (e.key === 'ArrowUp') held.up = false;
  if (e.key === 'ArrowDown') held.down = false;
});

$('btn-continue').onclick = () => startMission(M.save.data.best);
$('btn-new').onclick = () => {
  M.save.data.exp = 0;
  M.save.data.gear = { fang: false, armor: false };
  M.save.store();
  startMission(1);
};
$('btn-series').onclick = () => {
  location.href = location.pathname.includes('/mogusolo/') ? '../index.html' : 'index.html';
};
$('btn-resume').onclick = () => { mode = 'play'; M.ui.hideAll(); };
$('btn-restage').onclick = () => startMission(st.mission);
$('btn-title').onclick = () => toTitle();
$('btn-next').onclick = () => { if (st.mission < 5) startMission(st.mission + 1); else { mode = 'ending'; M.ui.show('ending-screen'); } };
$('btn-retry').onclick = () => startMission(st.mission);
$('btn-win-title').onclick = () => toTitle();
$('btn-end-title').onclick = () => toTitle();
$('btn-over-title').onclick = () => { if (mode === 'over') toTitle(); };

// ── 터치 (가상 패드 + 스킬 버튼) ──
const isTouch = window.matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
const vpad = document.getElementById('vpad');
if (isTouch) {
  document.body.classList.add('touch');
  $('title-hint').textContent = '패드 이동 · 🗡 공격 · ⬆ 점프 · Q W E R 스킬 버튼 — 레벨업으로 해금!';
  const bindHold = (id, on, off) => {
    const el = document.getElementById(id);
    const setOn = (e) => { e.preventDefault(); M.audio.resume(); on(); el.classList.add('pressed'); };
    const setOff = () => { if (off) off(); el.classList.remove('pressed'); };
    el.addEventListener('pointerdown', setOn);
    el.addEventListener('pointerup', setOff);
    el.addEventListener('pointercancel', setOff);
    el.addEventListener('pointerleave', setOff);
  };
  bindHold('vbtn-left', () => { held.left = true; }, () => { held.left = false; });
  bindHold('vbtn-right', () => { held.right = true; }, () => { held.right = false; });
  bindHold('vbtn-up', () => { held.up = true; }, () => { held.up = false; });
  bindHold('vbtn-down', () => { held.down = true; }, () => { held.down = false; });
  bindHold('vbtn-atk', () => { if (mode === 'play') atkQueued = true; });
  bindHold('vbtn-jump', () => { if (mode === 'play') jumpQueued = true; });
  for (const k of ['q', 'w', 'e', 'r']) {
    bindHold('vbtn-' + k, () => { if (mode === 'play') skillQueued[k] = true; });
  }
  document.getElementById('vbtn-pause').addEventListener('pointerdown', (e) => {
    e.preventDefault(); e.stopPropagation();
    if (mode === 'play') { mode = 'pause'; M.ui.show('pause-screen'); }
  });
  $('over-screen').addEventListener('pointerdown', (e) => {
    if (e.target.closest('#btn-over-title')) return;
    M.audio.resume();
    if (mode === 'over') { M.Logic.respawn(st); mode = 'play'; M.ui.hideAll(); }
  });
  document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
  document.addEventListener('gesturestart', (e) => e.preventDefault());
  vpad.addEventListener('contextmenu', (e) => e.preventDefault());
}

// ── 디버그 훅 (테스트 자동화용) ──
M._dbg = () => ({
  mode, mission: st ? st.mission : 0, phase: st ? st.phase : null,
  sec: st ? st.secIdx : 0, go: st ? st.go : false,
  p: st ? { x: +st.p.x.toFixed(1), z: +st.p.z.toFixed(1), hp: st.p.hp, state: st.p.state } : null,
  b: st && st.b ? { hp: st.b.hp, state: st.b.state } : null,
  shadows: st ? st.shadows.length : 0, mp: st ? +st.mp.toFixed(1) : 0, stealth: st ? +st.stealth.toFixed(2) : 0,
  enemies: st ? st.enemies.filter((e) => M.Logic.alive(e)).length : 0,
  score: st ? st.score : 0, lv: st ? st.lv : 1, exp: st ? st.exp : 0, stars: st ? st.stars : 0, deaths: st ? st.deaths : 0,
});
M._st = () => st;

// ── 메인 루프 ──
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  if (isTouch) vpad.classList.toggle('on', mode === 'play');

  if (mode === 'play' && st) {
    handleEvents(M.Logic.step(st, dt, {
      left: held.left, right: held.right, up: held.up, down: held.down,
      atk: atkQueued, jump: jumpQueued,
      q: skillQueued.q, w: skillQueued.w, e: skillQueued.e, r: skillQueued.r,
    }));
  } else if (mode === 'over') {
    overAcc += dt;
    if (overAcc >= 1) {
      overAcc = 0; overCount--;
      M.ui.setCountdown(Math.max(0, overCount));
      if (overCount <= 0) toTitle();
    }
  }
  atkQueued = false; jumpQueued = false;
  skillQueued.q = skillQueued.w = skillQueued.e = skillQueued.r = false;
  if (st) M.Render.draw(st, now / 1000, dt);
}
requestAnimationFrame(frame);

}
</script>
